<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸面 · 其余页面</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,72,560;1,72,560&display=block" rel="stylesheet">
<style>
:root { --page: #e8e5dd; --page-text: #2a2722; --page-dim: #7a756b; --page-line: #d5d0c5; }
:root[data-theme="dark"] { --page: #0f0e0c; --page-text: #ece8df; --page-dim: #8c867b; --page-line: #2b2925; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--page); color: var(--page-text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; padding: 28px 16px 64px; }
header.page { max-width: 2060px; margin: 0 auto 26px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
header.page h1 { font-size: 22px; font-weight: 650; }
header.page p { color: var(--page-dim); font-size: 13.5px; max-width: 86ch; margin-top: 4px; }
.seg { display: inline-flex; background: var(--page-line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--page-text); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--page); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.grid { max-width: 2060px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(390px, 1fr)); gap: 36px 24px; justify-items: center; }
figure { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 390px; max-width: 100%; }
figcaption { width: 100%; }
figcaption h2 { font-size: 16px; font-weight: 650; }
figcaption p { font-size: 13px; color: var(--page-dim); margin-top: 3px; }

/* ---------- paper tokens (same as the home) ---------- */
.phone {
  --bg: #f6f2e9; --note: #fffcf5; --surf: #efe9dc;
  --text: #26221c; --text2: #4d473d; --l2: #8b8477; --l3: #d3cbbb;
  --rule: rgba(70,55,30,.11); --rail: rgba(60,50,30,.14); --node: #cbc3b4;
  --tint: #8a7352; --tint-soft: rgba(138,115,82,.14);
  --attn: #c0651c; --attn-soft: #f7dfb8; --danger: #c13f35; --danger-soft: #f4cdc4; --ok: #3d7a4a;
  --add-bg: rgba(61,122,74,.12); --del-bg: rgba(193,63,53,.11);
  --edge: rgba(246,242,233,.88); --glass: rgba(255,252,245,.72); --ink: #26221c; --on-ink: #f6f2e9;
  --mono: "SF Mono", ui-monospace, Menlo, monospace; --cat-o: rgba(120,95,55,.32);
}
:root[data-theme="dark"] .phone {
  --bg: #1c1a16; --note: #25221d; --surf: #2b2822;
  --text: #eee9df; --text2: #cec7b9; --l2: #8f887b; --l3: #4a453c;
  --rule: rgba(238,233,223,.09); --rail: rgba(255,240,220,.13); --node: #5f5951;
  --tint: #c9b28c; --tint-soft: rgba(201,178,140,.16);
  --attn: #e6944a; --attn-soft: #c4a77c; --danger: #ec6a5e; --danger-soft: #c2948a; --ok: #7bbf8a;
  --add-bg: rgba(123,191,138,.13); --del-bg: rgba(236,106,94,.13);
  --edge: rgba(28,26,22,.88); --glass: rgba(37,34,29,.66); --ink: #eee9df; --on-ink: #1c1a16; --cat-o: transparent;
}
.phone { width: 390px; height: 844px; border-radius: 54px; position: relative; overflow: hidden; flex: none; isolation: isolate;
  box-shadow: 0 0 0 10px #1c1b19, 0 0 0 11px #3b3934, 0 30px 60px -20px rgba(0,0,0,.45); background: var(--bg); color: var(--text); }
.island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 60; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0 46px; font: 600 16px/1 -apple-system; z-index: 55; pointer-events: none; }
.status .icons { display: flex; gap: 6px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 136px; height: 5px; border-radius: 3px; z-index: 60; background: var(--text); }
.scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.inner { padding: 112px 22px 200px; }
.edge { position: absolute; left: 0; right: 0; z-index: 20; pointer-events: none; }
.edge i { position: absolute; inset: 0; display: block; }
.edge.top { top: 0; height: 124px; } .edge.bot { bottom: 0; height: 170px; }
.edge.top i:nth-child(1) { backdrop-filter: blur(2px); mask: linear-gradient(#000 64%, transparent); }
.edge.top i:nth-child(2) { backdrop-filter: blur(6px); mask: linear-gradient(#000 48%, transparent 82%); }
.edge.top i:nth-child(3) { backdrop-filter: blur(14px); mask: linear-gradient(#000 32%, transparent 64%); }
.edge.bot i:nth-child(1) { backdrop-filter: blur(2px); mask: linear-gradient(transparent, #000 40%); }
.edge.bot i:nth-child(2) { backdrop-filter: blur(6px); mask: linear-gradient(transparent 22%, #000 58%); }
.edge.bot i:nth-child(3) { backdrop-filter: blur(14px); mask: linear-gradient(transparent 42%, #000 74%); }
.edge::after { content: ""; position: absolute; inset: 0; }
.edge.top::after { background: linear-gradient(var(--edge) 62%, transparent); }
.edge.bot::after { background: linear-gradient(transparent, var(--edge) 70%); }

/* paper glass: round buttons, pills, the input, the bars */
.glass { background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: inset 0 0 0 .5px var(--rule), inset 0 1px 0 rgba(255,255,255,.5), 0 6px 16px -10px rgba(50,35,10,.35); }
:root[data-theme="dark"] .glass { box-shadow: inset 0 0 0 .5px rgba(238,233,223,.14), inset 0 1px 0 rgba(255,255,255,.07), 0 8px 18px -10px rgba(0,0,0,.7); }
.btn { position: absolute; top: 58px; width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; z-index: 40; color: var(--text); }
.btn.l { left: 18px; } .btn.r { right: 18px; } .btn.r2 { right: 70px; }

@keyframes spin { to { rotate: 360deg } }
@keyframes ring { from { scale: .6; opacity: 1 } to { scale: 1.6; opacity: 0 } }
.spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1.8px solid var(--tint-soft); border-top-color: var(--tint); animation: spin .95s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.mono { font-family: var(--mono); }
.brand { font: italic 560 38px/0.9 Fraunces, Georgia, serif; letter-spacing: -0.015em; }
.num { font: italic 560 44px/1 Fraunces, Georgia, serif; letter-spacing: -0.02em; font-variant-numeric: lining-nums; }

/* ---------- conversation ---------- */
.ttl { font-size: 21px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
.sub { margin-top: 4px; font-size: 12.5px; color: var(--l2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sub .live { color: var(--tint); font-weight: 600; display: inline-flex; gap: 5px; align-items: center; }
.me { margin: 22px 0 6px auto; max-width: 82%; width: fit-content; background: var(--note); border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 15.5px; line-height: 1.5;
  box-shadow: inset 0 0 0 .5px var(--rule), 0 4px 10px -8px rgba(60,40,10,.3); }
.me small { display: block; text-align: right; font-size: 11.5px; color: var(--l2); margin-top: 2px; }
.reply { font-size: 16px; line-height: 1.65; color: var(--text); }
.reply p { margin: 8px 0 12px; }
.reply code { font: 14px var(--mono); padding: 1px 5px; border-radius: 5px; background: var(--surf); }
.steps { position: relative; margin: 14px 0 8px; font-size: 13px; }
.steps::before { content: ""; position: absolute; left: 10px; top: 15px; bottom: 15px; width: 1px; background: var(--rail); }
.st { position: relative; display: flex; gap: 5px; min-height: 30px; padding: 5px 0 5px 30px; line-height: 20px; color: var(--text2); white-space: nowrap; }
.st::before { content: ""; position: absolute; left: 7.5px; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--node); box-shadow: 0 0 0 4px var(--bg); }
.st em { font-style: normal; color: var(--l2); overflow: hidden; text-overflow: ellipsis; min-width: 0; font: 12px/20px var(--mono); }
.st em::before { content: "· "; color: var(--l3); font-family: -apple-system, sans-serif; }
.st .r { margin-left: auto; padding-left: 8px; font: 12px/20px var(--mono); color: var(--l2); }
.st .r .a { color: var(--ok); } .st .r .d { color: var(--danger); }
.st.cur::before { background: var(--tint); box-shadow: 0 0 0 6px var(--bg); }
.st.cur::after { content: ""; position: absolute; left: 2.5px; top: 7px; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--tint); border-right-color: transparent; animation: spin .9s linear infinite; }
.st.cur > span { color: var(--text); font-weight: 600; }
.st.ask::before { background: var(--attn); }
.st.ask::after { content: ""; position: absolute; left: 5.5px; top: 10px; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--attn); animation: ring 1.6s ease-out infinite; }
.st.ask > span { color: var(--attn); font-weight: 600; }
.foldline { font-size: 12.5px; color: var(--l2); padding-left: 30px; height: 26px; display: flex; align-items: center; gap: 4px; }

/* dock: pills, then the input */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 14px 30px; z-index: 30; }
.pills { display: flex; gap: 8px; padding: 0 4px 10px; }
.pill { height: 32px; border-radius: 16px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; }
.pill b { font-weight: 650; color: var(--tint); font-variant-numeric: tabular-nums; }
.pill.model { margin-left: auto; }
.pill .pv { width: 14px; height: 14px; border-radius: 4px; background: #d97757; display: inline-block; }
.input { min-height: 50px; border-radius: 25px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; }
.input .ph { flex: 1; font-size: 15px; color: var(--l2); }
.input .ph.typed { color: var(--text); }
.input .att { width: 30px; height: 30px; display: grid; place-items: center; color: var(--l2); }
.send { width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); flex: none; }
.send.off { background: var(--l3); color: var(--bg); }
.send.stop { background: var(--ink); }

/* strip under the top buttons when the link drops */
.netbar { position: absolute; top: 64px; left: 50%; translate: -50% 0; z-index: 35; height: 32px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.netbar b { color: var(--tint); font-weight: 600; }
/* a run that failed: a flat red slip, the same paper as the error note */
.slip { margin: 14px 0; border-radius: 3px 3px 12px 3px; padding: 12px 14px; background: var(--danger-soft); color: #3d1913; position: relative; box-shadow: 0 10px 16px -14px rgba(60,40,0,.5); }
:root[data-theme="dark"] .slip { color: #2a110d; }
.slip .k { font-size: 12px; font-weight: 700; opacity: .85; display: flex; justify-content: space-between; }
.slip p { margin-top: 5px; font: 12px/1.5 var(--mono); opacity: .85; }
.slip .acts { margin-top: 10px; display: flex; gap: 16px; font-size: 13.5px; font-weight: 650; }
.banner { margin: 0 4px 10px; height: 40px; border-radius: 20px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 13px; }
.banner span { flex: 1; color: var(--text2); }
.banner b { height: 28px; border-radius: 14px; padding: 0 12px; display: inline-flex; align-items: center; background: var(--ink); color: var(--on-ink); font-size: 12.5px; font-weight: 600; }

/* question sheet: an apricot note laid over a dimmed page */
.dim { position: absolute; inset: 0; background: rgba(30,22,10,.28); z-index: 45; }
:root[data-theme="dark"] .dim { background: rgba(0,0,0,.5); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--note); border-radius: 30px 30px 0 0; padding: 10px 22px 34px; box-shadow: 0 -12px 30px -16px rgba(40,25,5,.4); }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--l3); margin: 0 auto 14px; }
.qhead { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--l2); }
.qhead .who { display: inline-flex; gap: 5px; align-items: center; color: var(--attn); font-weight: 650; }
.qtabs { display: flex; gap: 6px; }
.qtabs i { width: 22px; height: 4px; border-radius: 2px; background: var(--l3); } .qtabs i.on { background: var(--attn); }
.q { margin-top: 12px; font-size: 19px; font-weight: 650; line-height: 1.35; }
.qd { margin-top: 6px; font-size: 14px; line-height: 1.55; color: var(--text2); }
.opts { margin-top: 14px; display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 12px 14px; border-radius: 14px; background: var(--bg); box-shadow: inset 0 0 0 .5px var(--rule); }
.opt .rd { width: 20px; height: 20px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--l3); margin-top: 1px; display: grid; place-items: center; }
.opt.on { box-shadow: inset 0 0 0 1.5px var(--attn); background: color-mix(in srgb, var(--attn-soft) 45%, var(--bg)); }
:root[data-theme="dark"] .opt.on { background: color-mix(in srgb, var(--attn) 14%, var(--bg)); }
.opt.on .rd { box-shadow: none; background: var(--attn); color: #fff; }
.opt b { font-size: 15px; font-weight: 600; display: block; }
.opt small { display: block; font-size: 12.5px; color: var(--l2); margin-top: 2px; }
.opt.other b { color: var(--l2); font-weight: 500; }
.cta { margin-top: 16px; height: 50px; border-radius: 25px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font-size: 16px; font-weight: 650; }
.cta.ghost { background: transparent; color: var(--text2); height: 36px; margin-top: 6px; font-size: 14px; font-weight: 500; }

/* ---------- workspace page ---------- */
.proj-l { font: 600 16px/1 "New York", "Iowan Old Style", Georgia, serif; color: var(--l2); }
.branch { margin-top: 6px; font: 600 24px/1.2 var(--mono); letter-spacing: -0.02em; }
.tags { margin-top: 8px; display: flex; gap: 10px; font: 500 11.5px var(--mono); color: var(--attn); }
.tags .ok { color: var(--ok); }
.chg { margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: var(--note); box-shadow: inset 0 0 0 .5px var(--rule), 0 6px 14px -12px rgba(60,40,10,.35); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.chg .t { font-size: 15px; font-weight: 600; }
.chg .t .num { font-size: 28px; margin-right: 4px; }
.chg .ar { color: var(--l2); grid-row: span 2; }
.chg .m { font: 12px var(--mono); color: var(--l2); }
.chg .m .a { color: var(--ok); } .chg .m .d { color: var(--danger); }
.ratio { grid-column: 1 / -1; height: 4px; border-radius: 2px; display: flex; overflow: hidden; gap: 2px; margin-top: 6px; }
.ratio i { display: block; height: 100%; border-radius: 2px; }
.sec { margin-top: 24px; display: flex; justify-content: space-between; align-items: baseline; }
.sec b { font-size: 15px; font-weight: 700; }
.sec span { font-size: 12.5px; color: var(--l2); }
.srow { display: grid; grid-template-columns: 16px 1fr auto; column-gap: 8px; align-items: center; height: 52px; }
.srow + .srow { border-top: .5px solid var(--rule); }
.srow .t { font-size: 15px; font-weight: 500; }
.srow .m { font-size: 12.5px; color: var(--l2); margin-top: 2px; }
.srow .tm { font-size: 12px; color: var(--l2); font-variant-numeric: tabular-nums; }
.srow .tm.live { color: var(--tint); font-weight: 600; }
.mk { width: 16px; height: 16px; display: grid; place-items: center; }
.mk .u { width: 7px; height: 7px; border-radius: 4px; background: var(--tint); }
.mk .ask { width: 9px; height: 9px; border-radius: 5px; border: 2px solid var(--attn); }
.mk .err { width: 8px; height: 8px; border-radius: 4px; background: var(--danger); }
.mk .idle { width: 5px; height: 5px; border-radius: 3px; background: var(--l3); }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ---------- changes ---------- */
.crumb { font-size: 13px; color: var(--l2); }
.crumb .mono { font-size: 12.5px; }
.bigline { margin-top: 4px; display: flex; align-items: baseline; gap: 8px; }
.bigline span { font-size: 17px; font-weight: 600; }
.bigline small { margin-left: auto; font: 12.5px var(--mono); color: var(--l2); }
.filters { margin-top: 14px; display: flex; gap: 8px; }
.fpill { height: 30px; border-radius: 15px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: var(--note); box-shadow: inset 0 0 0 .5px var(--rule); }
.fpill.on { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.fpill i { width: 7px; height: 7px; border-radius: 4px; display: inline-block; }
.dir { margin-top: 14px; font: 12px var(--mono); color: var(--l2); height: 24px; display: flex; align-items: center; }
.frow { display: grid; grid-template-columns: 18px 1fr auto; gap: 9px; align-items: center; height: 32px; }
.frow .fn { font-size: 14.5px; }
.frow .fn s { text-decoration-color: var(--danger); color: var(--l2); }
.frow .n { font: 12px var(--mono); }
.frow .n .a { color: var(--ok); } .frow .n .d { color: var(--danger); margin-left: 6px; }
.fi { width: 16px; height: 18px; border-radius: 2px 6px 2px 2px; position: relative; display: block; }
.fi::after { content: attr(data-x); position: absolute; inset: auto 0 1px; font: 700 6.5px/1 -apple-system; color: #fff; text-align: center; letter-spacing: -.02em; }
.fstat { display: inline-block; width: 6px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

/* ---------- diff ---------- */
.fhead { position: absolute; top: 108px; left: 0; right: 0; z-index: 25; padding: 0 22px; display: flex; align-items: center; gap: 9px; height: 40px; }
.fhead b { font-size: 15px; font-weight: 600; }
.fhead small { margin-left: auto; font: 12px var(--mono); }
.code { font: 11.5px/19px var(--mono); margin: 0 -22px; }
.hunk { padding: 4px 22px; color: var(--tint); background: var(--tint-soft); font-size: 11px; position: sticky; top: 148px; }
.ln { display: grid; grid-template-columns: 30px 14px 1fr; padding-right: 22px; white-space: pre; }
.ln i { font-style: normal; color: var(--l3); text-align: right; padding-right: 8px; }
.ln u { text-decoration: none; color: var(--l2); }
.ln.a { background: var(--add-bg); } .ln.a u { color: var(--ok); }
.ln.d { background: var(--del-bg); } .ln.d u { color: var(--danger); }
.ln .w { overflow: hidden; }
.expand { margin: 4px 22px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; font: 12px -apple-system, sans-serif; color: var(--tint); background: var(--surf); }
.tools { position: absolute; left: 50%; bottom: 34px; translate: -50% 0; z-index: 30; height: 50px; border-radius: 25px; display: flex; align-items: center; gap: 2px; padding: 0 6px; }
.tools span { height: 38px; min-width: 42px; padding: 0 10px; border-radius: 19px; display: grid; place-items: center; font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; }
.tools span.sep { min-width: 0; width: .5px; height: 22px; background: var(--rule); padding: 0; }

/* ---------- drawer ---------- */
.shrunk { position: absolute; inset: 0; transform: translateX(250px) scale(.86); transform-origin: left center; border-radius: 40px; overflow: hidden; filter: brightness(.9); box-shadow: -10px 0 30px -12px rgba(0,0,0,.35); }
.drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 300px; z-index: 46; padding: 70px 20px 40px; overflow: hidden; }
.drawer-bg { position: absolute; inset: 0; background: var(--bg); z-index: 0; }
.dr { position: relative; z-index: 47; }
.dr .host { display: flex; align-items: center; gap: 12px; }
.dr .host .mac { width: 44px; height: 44px; border-radius: 12px; background: var(--note); box-shadow: inset 0 0 0 .5px var(--rule); display: grid; place-items: center; color: var(--text2); }
.dr .host b { display: block; font-size: 19px; font-weight: 650; }
.dr .host small { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--tint); font-weight: 600; }
.dr .host small i { width: 6px; height: 6px; border-radius: 3px; background: var(--tint); }
.kv { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 0 12px; font-size: 13.5px; }
.kv span { color: var(--l2); height: 34px; display: flex; align-items: center; }
.kv b { font-weight: 500; text-align: right; height: 34px; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; overflow: hidden; }
.kv span, .kv b { border-top: .5px solid var(--rule); }
.kv b.warn { color: var(--attn); }

<!--

OWN-WORLD: 纸 #f6f2e9 / 便签纸 #fffcf5 / 墨 #26221c / 深米 #8a7352；杏 #f7dfb8、浅红 #f4cdc4；深色是暗下来的同一张纸。
STORY: 从首页的一行进对话或工作区；要回答的问题像一张便签从下面推上来；出错是一张浅红纸条；改动和 diff 是紧凑的账本。
FORM: 用户定了首页（D 便签、一 worktree 一行 A、Fraunces 斜体、D2 深色便签、I1 新对话）后，其余页面按同一语言设计。

  </div>
  <div class="seg" role="group" aria-label="外观">
    <button type="button" data-theme-set="light" aria-pressed="true">浅色</button>

</header>

/* a 16×16 dot-matrix cat, sitting; c = cream, k = ink, p = pink, . = empty */
const CAT = [
  "..c..........c..",
  ".ccc........ccc.",
  ".cpcc......ccpc.",
  ".cccccccccccccc.",
  "cccccccccccccccc",
  "cccckccccccckccc",
  "cccckccccccckccc",
  "ccpcccckkccccpcc",
  "cccccccckcccccc.",
  ".cccccccccccccc.",
  "..cccccccccccc..",
  "..cccccccccccc..",
  ".cccccccccccccc.",
  ".cccccccccccccc.",
  ".cc.cc....cc.cc.",
  "................",
];
function cat(size, ground) {
  const cell = size / 16, r = cell * .33, col = { c: "var(--cat-c)", k: "#1f2537", p: "#f0aea6" };
  const on = (x, y) => CAT[y] && CAT[y][x] && CAT[y][x] !== ".";
  let dots = "";
  CAT.forEach((row, y) => [...row].forEach((ch, x) => {
    /* off the ground, empty cells next to the cat form a soft outline so it reads on paper */
    const edge = !ground && ch === "." && [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => on(x + dx, y + dy));
    const fill = ch === "." ? (ground ? "rgba(255,255,255,.14)" : edge ? "var(--cat-o)" : "transparent") : col[ch];
    if (fill !== "transparent") dots += `<rect x="${x * cell + cell * .17}" y="${y * cell + cell * .17}" width="${cell * .66}" height="${cell * .66}" rx="${r}" fill="${fill}"/>`;
  }));
  const bg = ground ? `<rect width="${size}" height="${size}" rx="${size * .18}" fill="#6c86cc"/>` : "";
  return `<svg class="cat" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="--cat-c:#f3e6c9">${bg}${dots}</svg>`;
}
