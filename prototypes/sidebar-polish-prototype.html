<!doctype html>
<!--
  PROTOTYPE — throwaway. 侧栏样式与排版优化（2026-10-15 自用时提）。
  问题：参考 Claude 桌面端的侧栏（树线、图标代替文字标签、子项变淡），Atrium 的侧栏能怎么改得更清爽。
  A 是现在的样子（照自用截图的数据），B、C 是两种改法。打开即看，无需构建。
  颜色、字号、圆角取自 packages/ui/src/design/tokens.css；侧栏宽 270、行高 34、14px 不变。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 · 侧栏样式优化</title>
<style>
:root {
  --main: #fff; --surface-1: #fff;
  --text: #1d1d1f; --text-2: #2c2c30; --text-3: #48484e; --text-muted: #6e6e74; --text-dim: #a1a1a7;
  --line: rgba(0,0,0,.08); --line-soft: rgba(0,0,0,.05); --line-strong: rgba(0,0,0,.14);
  --hover: rgba(0,0,0,.035); --selected: rgba(0,0,0,.06);
  --tint: #2f6fed; --attn: #dd8629; --attn-text: #c96509; --attn-soft: rgba(221,134,41,.12);
  --danger: #e5484d; --ok-text: #1e8e3e;
  --card-shadow: 0 0 0 .5px var(--line), 0 9px 27px rgba(41,70,122,.12);
  --font-sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  --fs: 14px; --fs-meta: 13px; --fs-sm: 12px; --fs-xs: 11px;
  --r: 8px; --r-md: 10px; --r-pill: 999px;
  --guide: rgba(0,0,0,.13);
}
* { box-sizing: border-box; }
body { margin: 0; background: #e9ecf1; font: var(--fs)/1.4 var(--font-sans); color: var(--text); -webkit-font-smoothing: antialiased; }
header.page { padding: 28px 40px 4px; }
header.page h1 { font-size: 20px; margin: 0 0 6px; }
header.page p { margin: 0 0 4px; color: var(--text-muted); font-size: var(--fs-meta); max-width: 1100px; line-height: 1.6; }
.board { display: flex; gap: 40px; padding: 20px 40px 40px; flex-wrap: wrap; align-items: flex-start; }
.frame { display: flex; flex-direction: column; gap: 10px; width: 300px; }
.frame > h2 { margin: 0; font-size: 15px; }
.frame > ul.note { margin: 0; padding-left: 18px; font-size: var(--fs-sm); color: var(--text-muted); min-height: 190px; line-height: 1.6; }
.frame > ul.note b { color: var(--text-2); font-weight: 600; }

/* 侧栏，宽 270，同 sidebar.tsx；底色取自 --sidebar-bg 的浅色渐变（桌面端是系统材质） */
.sidebar { width: 270px; height: 820px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; position: relative;
  background: linear-gradient(#d5dbe9 0%, #dae0e9 10%, #e1e4ea 25%, #e3e7e9 35%, #e3e7e9 65%, #e2e4e6 75%, #dee1e7 85%, #d8dbe3 100%);
  box-shadow: 0 0 0 .5px var(--line-strong), 0 10px 30px rgba(0,0,0,.08); }
.sidebar.neutral { background: #ececee; }
.lights { height: 50px; flex: none; display: flex; align-items: center; gap: 8px; padding-left: 18px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.lights .grow { flex: 1; }
.lights .icon-btn { margin-right: 14px; }
.scroll { flex: 1; min-height: 0; overflow: hidden; padding: 0 12px 12px; }
.title { margin-top: 6px; height: 34px; display: flex; align-items: center; padding: 0 4px 0 8px; color: var(--text-muted); font-size: var(--fs); }
.title > span:first-child { flex: 1; }
.v-c .title { font-size: var(--fs-meta); color: var(--text-dim); margin-top: 10px; height: 30px; }
.icon-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r); color: var(--text-muted); }
.row { position: relative; margin: 2px 0; height: 34px; display: flex; align-items: center; gap: 8px; border-radius: var(--r); padding: 0 8px; color: var(--text-2); }
.row:hover { background: var(--hover); }
.row.sel { background: var(--selected); }
.row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: var(--fs-sm); color: var(--text-dim); flex: none; }
.row.faded .name { color: var(--text-dim); }
.ws { padding-left: 34px; }
.badge { font-size: var(--fs-sm); font-weight: 600; color: var(--attn-text); display: inline-flex; align-items: center; gap: 1px; flex: none; }
.dot-label { font-size: var(--fs-sm); color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; flex: none; }
.dot-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--attn); }
.merged { font-size: var(--fs-sm); color: var(--ok-text); display: inline-flex; align-items: center; gap: 3px; flex: none; }
.unknown { font-size: var(--fs-sm); color: var(--text-dim); flex: none; opacity: .75; }
.more { padding: 4px 8px; font-size: var(--fs-meta); color: var(--text-dim); border-radius: var(--r); }
.s-attn { color: var(--attn); display: inline-flex; } .s-tint { color: var(--tint); display: inline-flex; }

/* B、C：项目行更重，工作区行更轻 */
.v-b .proj .name, .v-c .proj .name { color: var(--text); font-weight: 500; }
.v-b .ws .name, .v-c .ws .name { color: var(--text-3); }
.v-b .ws.sel .name, .v-c .ws.sel .name { color: var(--text); }
.v-b .ws.faded .name, .v-c .ws.faded .name { color: var(--text-dim); }
.pre { color: var(--text-dim); }
/* 只有图标的状态：一个固定宽的尾列 */
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--attn); flex: none; }
.tail { display: inline-flex; align-items: center; gap: 7px; flex: none; color: var(--text-dim); font-size: var(--fs-sm); }
.tail .num { font-variant-numeric: tabular-nums; }
.tail .ok { color: var(--ok-text); display: inline-flex; }

/* 树线：竖线在项目图标的中线（离行左边 16px），最后一个工作区拐一个圆角弯 */
.tree .ws::before { content: ""; position: absolute; left: 16px; top: -2px; bottom: -2px; width: 0; border-left: 1px solid var(--guide); }
.tree .ws.last::before { bottom: 50%; width: 9px; border-bottom: 1px solid var(--guide); border-bottom-left-radius: 7px; }
.tree .ws { padding-left: 34px; }

/* 顶部搜索框（C） */
.searchbox { position: relative; margin: 0 0 6px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: var(--r-md);
  background: rgba(255,255,255,.55); box-shadow: 0 0 0 .5px var(--line); color: var(--text-dim); font-size: var(--fs-meta); }
.searchbox .grow { flex: 1; }
.searchbox kbd { font: 11px var(--font-sans); color: var(--text-dim); }
.navrow { position: relative; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: var(--r); color: var(--text-2); }
.navrow:hover { background: var(--hover); }
.navrow svg { color: var(--text-muted); }
.navrow .k { margin-left: auto; font-size: var(--fs-xs); color: var(--text-dim); }

/* 底部 */
.tray { flex: none; margin: 0 12px; background: var(--surface-1); border-radius: 14px; box-shadow: var(--card-shadow); padding: 2px 4px; }
.tray .head { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; color: var(--text-muted); font-size: var(--fs-meta); }
.tray .n { font-size: var(--fs-sm); color: var(--attn-text); font-weight: 600; background: var(--attn-soft); border-radius: var(--r-pill); padding: 0 7px; line-height: 18px; }
.tray .grow { flex: 1; }
.foot { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 12px 12px; }
.gear { display: inline-flex; height: 28px; align-items: center; gap: 8px; border-radius: var(--r); padding: 0 8px; color: var(--text-2); }
.gear svg { color: var(--text-muted); }
.foot .sp { flex: 1; }

.callout { position: absolute; z-index: 2; font-size: var(--fs-xs); line-height: 16px; color: #fff; background: var(--tint); border-radius: var(--r-pill); padding: 0 7px; white-space: nowrap; pointer-events: none; }
.toggles { display: flex; gap: 14px; padding: 0 40px; font-size: var(--fs-meta); color: var(--text-muted); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; }
body.no-callouts .callout { display: none; }
svg { flex: none; }
</style>
</head>
<body>
<header class="page">
  <h1>侧栏样式优化 · 设计稿（原型，审完即弃）</h1>
  <p>参考 Claude 桌面端的侧栏，借鉴其中四点：<b>树线</b>把子项连到父项、<b>子项比父项淡</b>一级、<b>状态用图标和数字</b>不用文字、<b>收尾的收起来</b>。尺寸（宽 270、行高 34、14px）不变，"项目 → 工作区"的结构不变。A 是现在（数据照你的截图），B 是只动样式的小改，C 在 B 上再动排版。蓝色小标签标出改动处。</p>
</header>
<div class="toggles">

</div>
<div class="board" id="board"></div>

  return `<section class="frame"><h2>${title}</h2><ul class="note">${notes.map((n) => `<li>${n}</li>`).join('')}</ul>
    <div class="sidebar ${cls}">${lights()}<div class="scroll">${body}</div>${tray}${foot}</div></section>`;
}
