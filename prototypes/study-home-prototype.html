<!doctype html>
<!--
  PROTOTYPE — 设计稿，不接入生产构建。ML4 首页与演示接进学习（SPEC-0008"ML4 定的细节"）里还没定样子的 6 处，每处 2～3 种做法，按编号挑（比如"1A 2A 3A 4A 5A 6A"）。

  已定的前提：
  · 入口丁；步骤条 2D；方向主页 1A/3A/4A/5A；ML3 的 1A 2A 3B 4A 5B 6A 7C（study-progress-states-prototype.html、study-loop-prototype.html）。
  · 用户 2026-11-10 对第一阶段 12 个问题"都按建议"；标"推荐"的是和那些回答对应的一种。
  · 继续卡的主按钮同步骤条；上次打开的方向不跳过。卡片点阵画当前一级的步骤。档案分"演示""文件"两组，不列点文件。
    从档案打开的演示在查看标签里渲染、没有回传、没有"在浏览器打开"。方向里的查看标签排在会话标签后面。

  每种做法左边浅色、右边深色。数据是一个 Rust 方向：当前第 2 级"所有权和借用"第 4 步"生命周期标注"，共 5 级；visuals/ 里 4 个演示。
  图标：界面图标是 Hugeicons 免费版 stroke-rounded（4.3.5，@hugeicons/core-free-icons 里的原路径），
  文件类型图标是 material-icon-theme 5.39.0 的原图（同 packages/ui/public/file-icons）。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原型 · 学习首页与档案</title>
    <style>
      :root,
      .th-light {
        --window: #e8ecf2;
        --main: #ffffff;
        --surface-1: #ffffff;
        --surface-2: #f2f2f4;
        --surface-3: #e9e9ec;
        --code: #f6f6f8;
        --text: #1d1d1f;
        --text-2: #2c2c30;
        --text-3: #48484e;
        --text-muted: #6e6e74;
        --text-dim: #a1a1a7;
        --line: rgba(0, 0, 0, 0.08);
        --line-strong: rgba(0, 0, 0, 0.14);
        --hover: rgba(0, 0, 0, 0.035);
        --selected: rgba(0, 0, 0, 0.06);
        --rail: rgba(0, 0, 0, 0.15);
        --node: #c4c4c9;
        --tint: #2f6fed;
        --on-tint: #ffffff;
        --linked: rgba(47, 111, 237, 0.1);
        --attn: #dd8629;
        --attn-text: #c96509;
        --attn-soft: rgba(221, 134, 41, 0.12);
        --danger: #e5484d;
        --ok: #16a34a;
        --ok-text: #1e8e3e;
        --chip-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.09), 0 1px 2px rgba(0, 0, 0, 0.05);
        --card-shadow: 0 0 0 0.5px var(--line), 0 9px 27px rgba(41, 70, 122, 0.08);
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, 0.14);
        --font-sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
        --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
        --fs: 14px;
        --fs-meta: 13px;
        --fs-sm: 12px;
        --fs-xs: 11px;
        --fs-mono: 12.5px;
        --r-sm: 6px;
        --r: 8px;
        --r-md: 10px;
        --r-btn: 12px;
        --r-card: 16px;
        color-scheme: light;
      }
      .th-dark {
        --window: #0d1016;
        --main: #151517;
        --surface-1: #212123;
        --surface-2: #2c2c2e;
        --surface-3: #353638;
        --code: #19191b;
        --text: #f9fafb;
        --text-2: #e7e9ec;
        --text-3: #cfd3d6;
        --text-muted: #adb2b8;
        --text-dim: #81858c;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.16);
        --hover: rgba(255, 255, 255, 0.05);
        --selected: rgba(255, 255, 255, 0.08);
        --rail: rgba(255, 255, 255, 0.15);
        --node: #5d6067;
        --tint: #7aaaff;
        --on-tint: #0d1016;
        --linked: rgba(122, 170, 255, 0.14);
        --attn: #dd8629;
        --attn-text: #f0a24e;
        --attn-soft: rgba(221, 134, 41, 0.16);
        --danger: #f25a5a;
        --ok: #22c55e;
        --ok-text: #4ade80;
        --chip-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.1), 0 1px 2px rgba(0, 0, 0, 0.3);
        --card-shadow: 0 0 0 0.5px var(--line), 0 9px 27px rgba(41, 70, 122, 0.2);
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 22px 28px 64px;
        background: #e8ecf2;
        color: #2c2c30;
        font:
          14px / 1.5 -apple-system,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        color: inherit;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      svg.i.s12 {
        width: 12px;
        height: 12px;
      }
      svg.i.s13 {
        width: 13px;
        height: 13px;
      }
      svg.i.s14 {
        width: 14px;
        height: 14px;
      }
      .ft {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
      }

      /* ---------- 页面框架 ---------- */
      .doc-head h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #1d1d1f;
      }
      .doc-head p {
        margin: 6px 0 0;
        max-width: 900px;
        color: #6e6e74;
        font-size: 13px;
      }
      .toc {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 14px 0 0;
      }
      .toc a {
        padding: 4px 10px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.1);
        color: #2c2c30;
        text-decoration: none;
        font-size: 12px;
      }
      .part {
        margin-top: 44px;
      }
      .part > h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        color: #1d1d1f;
      }
      .part > .why {
        margin: 4px 0 0;
        max-width: 900px;
        font-size: 13px;
        color: #6e6e74;
      }
      .opt {
        margin-top: 22px;
      }
      .opt > .oh {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 14px;
        color: #1d1d1f;
      }
      .opt > .oh .letter {
        display: inline-grid;
        place-items: center;
        min-width: 30px;
        height: 22px;
        padding: 0 6px;
        border-radius: 6px;
        background: #1d1d1f;
        color: #fff;
        font-weight: 700;
        font-size: 12px;
      }
      .opt > .oh b {
        font-weight: 600;
      }
      .opt > .od {
        margin: 4px 0 0 40px;
        max-width: 900px;
        font-size: 12.5px;
        color: #6e6e74;
      }
      .pair {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 10px;
      }
      .frame {
        padding: 16px;
        border-radius: 14px;
        background: var(--window);
        color: var(--text-2);
        font: var(--fs) / 1.5 var(--font-sans);
      }
      .frame > .fl {
        margin: 0 0 8px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .win {
        position: relative;
        border-radius: 12px;
        background: var(--main);
        box-shadow: var(--card-shadow);
        overflow: hidden;
      }
      .win.open {
        overflow: visible;
      }
      .pad {
        padding: 16px 18px 18px;
      }
      .cap {
        margin: 12px 0 6px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .cap:first-child {
        margin-top: 0;
      }

      /* ---------- 共用部件（同 study-mode-flow-prototype C） ---------- */
      .muted {
        color: var(--text-muted);
      }
      .dim {
        color: var(--text-dim);
      }
      .tabbar {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 12px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        overflow: hidden;
      }
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 8px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
        white-space: nowrap;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 10px;
        border-radius: var(--r);
        font-size: var(--fs-meta);
        color: var(--text-muted);
        white-space: nowrap;
      }
      .tab.on {
        background: var(--selected);
        color: var(--text);
      }
      .tab.home .i {
        color: var(--tint);
      }
      .ibtn {
        all: unset;
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: var(--r);
        color: var(--text-muted);
      }
      .ibtn.on {
        background: var(--selected);
        color: var(--text);
      }
      .run {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid var(--tint);
        border-right-color: transparent;
        animation: spin 0.9s linear infinite;
        flex: 0 0 auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .run {
          animation: none;
        }
      }
      .btn {
        all: unset;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px;
        border-radius: var(--r-btn);
        font-size: var(--fs-meta);
        white-space: nowrap;
        cursor: default;
      }
      .btn.primary {
        background: var(--tint);
        color: var(--on-tint);
        font-weight: 600;
      }
      .btn.ghost {
        box-shadow: inset 0 0 0 0.5px var(--line-strong);
        color: var(--text-2);
      }
      .btn.outline {
        box-shadow: inset 0 0 0 1px var(--tint);
        color: var(--tint);
        font-weight: 500;
      }
      .btn.textbtn {
        color: var(--text-muted);
        padding: 0 8px;
      }
      .btn.sm {
        height: 26px;
        padding: 0 10px;
        border-radius: 9px;
      }
      .btn.xs {
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: var(--fs-sm);
      }
      .btn[disabled],
      .btn.off {
        opacity: 0.42;
      }
      .btn.locked {
        background: var(--surface-2);
        color: var(--text-dim);
        font-weight: 500;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 7px;
        border-radius: var(--r-sm);
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: var(--fs-sm);
        font-weight: 500;
        white-space: nowrap;
      }
      .tag.attn {
        background: var(--attn-soft);
        color: var(--attn-text);
      }
      .tag.tint {
        background: var(--linked);
        color: var(--tint);
      }
      .tag.ok {
        background: color-mix(in srgb, var(--ok) 12%, transparent);
        color: var(--ok-text);
      }
      .tag.xs {
        height: 17px;
        padding: 0 5px;
        font-size: var(--fs-xs);
        border-radius: 5px;
      }
      .card {
        border-radius: var(--r-card);
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
      }

      /* 步骤条 */
      .strip {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 16px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        font-size: var(--fs-sm);
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .strip .lvl {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--text-2);
        font-weight: 500;
      }
      .strip .trk {
        display: inline-flex;
        gap: 3px;
      }
      .strip .trk i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--line-strong);
      }
      .strip .trk i.done {
        background: var(--text-muted);
      }
      .strip .trk i.cur {
        background: var(--tint);
      }
      .strip .trk i.x {
        border-radius: 50%;
      }
      .strip .trk.faded {
        opacity: 0.45;
      }
      .strip .trk.grey i.cur {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--text-muted);
      }
      .strip .trk.hatch i {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .strip .trk.all i {
        background: var(--tint);
      }
      .strip .now {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .strip .now b {
        color: var(--text);
        font-weight: 500;
      }
      .strip .sp {
        flex: 1;
      }
      .strip .warn {
        color: var(--attn-text);
      }
      .strip .okc {
        color: var(--ok-text);
      }
      .strip-label {
        padding: 8px 16px 0;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .live {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
      }

      /* 步骤列表 */
      .lessons {
        padding: 4px;
        border-radius: 12px;
        background: var(--code);
      }
      .lesson {
        position: relative;
        border-radius: var(--r);
      }
      .lesson .lh {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 32px;
        padding: 0 6px 0 10px;
        font-size: var(--fs-meta);
        color: var(--text-3);
      }
      .lesson .no {
        width: 18px;
        color: var(--text-dim);
        font-size: var(--fs-sm);
        flex: 0 0 auto;
      }
      .lesson .no.kd {
        display: inline-flex;
      }
      .lesson .ok {
        color: var(--ok-text);
        display: inline-flex;
      }
      .lesson .okm {
        color: var(--text-muted);
        display: inline-flex;
      }
      .lesson .t {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lesson .m {
        color: var(--text-dim);
        font-size: var(--fs-sm);
        white-space: nowrap;
      }
      .lesson .m.attn {
        color: var(--attn-text);
      }
      .lesson.next {
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
      }
      .lesson.next .lh {
        color: var(--text);
      }
      .lesson.next .no {
        color: var(--tint);
        font-weight: 600;
      }
      .lesson.todo .lh {
        color: var(--text-dim);
      }
      .lesson.hover {
        background: var(--hover);
      }
      .lesson .more {
        width: 24px;
        height: 24px;
      }
      .sess {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 0 10px 8px 38px;
      }
      .schip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        font-size: var(--fs-sm);
        color: var(--text-2);
        white-space: nowrap;
      }
      .schip .i {
        color: var(--text-muted);
      }
      .schip .s {
        color: var(--text-dim);
      }
      .schip.manual {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-strong);
        border: 0;
        color: var(--text-muted);
        background-image: none;
        outline: 1px dashed var(--line-strong);
        outline-offset: -1px;
        box-shadow: none;
      }
      .inline-link {
        font-size: var(--fs-sm);
        color: var(--tint);
      }
      .subd {
        display: inline-flex;
        gap: 2px;
        flex: 0 0 auto;
      }
      .subd i {
        width: 5px;
        height: 5px;
        border-radius: 1.4px;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .subd i.d {
        background: var(--text-muted);
        box-shadow: none;
      }
      .subd i.g {
        background: var(--attn);
        box-shadow: none;
      }
      .subd i.m {
        background: transparent;
        box-shadow: inset 0 0 0 1.25px var(--text-muted);
      }
      .subd i.n {
        background: transparent;
        box-shadow: none;
        outline: 1px dashed var(--text-dim);
        outline-offset: -1px;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: 8px;
        background: var(--surface-2);
      }
      .seg span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 7px;
        border-radius: 6px;
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .seg span.on {
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        color: var(--text);
      }
      .seg span.mine {
        background: var(--surface-1);
        color: var(--text-2);
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .roundchk {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px var(--line-strong);
        color: var(--text-muted);
        background: var(--surface-1);
      }

      /* 菜单 */
      .menu {
        position: absolute;
        z-index: 5;
        min-width: 188px;
        padding: 4px;
        border-radius: var(--r-md);
        background: var(--surface-1);
        box-shadow: var(--float-shadow);
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .menu.flow {
        position: relative;
        margin: 2px 4px 8px auto;
        width: max-content;
      }
      .menu .mi {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 8px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .menu .mi.hl {
        background: var(--selected);
      }
      .menu .mi .k {
        margin-left: auto;
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }
      .menu .mi.dis {
        color: var(--text-dim);
      }
      .menu .mi .ck {
        width: 14px;
        display: inline-flex;
        color: var(--text-muted);
      }
      .menu .sep {
        height: 0.5px;
        margin: 4px 6px;
        background: var(--line);
      }
      .menu .mh {
        padding: 4px 8px 2px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .menu .note {
        padding: 2px 8px 6px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
        white-space: normal;
        max-width: 220px;
      }
      .menu .row-btns {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        padding: 6px 4px 2px;
      }
      .box {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px var(--line-strong);
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .box.on {
        background: var(--tint);
        color: var(--on-tint);
        box-shadow: none;
      }
      .box.agent {
        background: var(--surface-3);
        color: var(--text-muted);
        box-shadow: none;
      }
      .box.ok {
        background: var(--ok);
        color: #fff;
        box-shadow: none;
      }
      .tip {
        position: absolute;
        z-index: 6;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--text);
        color: var(--main);
        font-size: var(--fs-xs);
        white-space: nowrap;
      }

      /* 主页 */
      .ptitle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
      }
      .psub {
        margin: 4px 0 0;
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }
      .hero {
        padding: 16px 18px 14px;
      }
      .hero .eyebrow {
        font-size: var(--fs-sm);
        color: var(--tint);
        font-weight: 600;
      }
      .hero .big {

        font-weight: 600;

      .lvc {

        gap: 8px;
        min-height: 30px;

        color: var(--text-2);
      }

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lvc .m {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .lvc.lock {
        color: var(--text-dim);
      }
      .lvc.open {
        background: var(--hover);
      }
      .lvx {
        margin: 2px 0 6px 30px;
        font-size: var(--fs-sm);
        color: var(--text-muted);
        line-height: 1.6;
      }
      .lvx dt {
        color: var(--text-dim);
        font-size: var(--fs-xs);
      }
      .lvx dd {
        margin: 0 0 4px;
        color: var(--text-2);
      }
      .lvcard {
        margin: 4px 0 6px 26px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--code);
        font-size: var(--fs-sm);
        color: var(--text-2);
        line-height: 1.6;
      }
      .lvcard .k {
        color: var(--text-dim);
        font-size: var(--fs-xs);
      }
      .pop {
        position: absolute;
        z-index: 5;
        width: 250px;
        padding: 10px 12px;
        border-radius: var(--r-md);
        background: var(--surface-1);
        box-shadow: var(--float-shadow);
        font-size: var(--fs-sm);
        color: var(--text-2);
        line-height: 1.6;
      }
      .pop .k {
        color: var(--text-dim);
        font-size: var(--fs-xs);
      }
      .pop .t {
        font-weight: 600;
        color: var(--text);
        font-size: var(--fs-meta);
      }
      .gap-row {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 9px 10px 9px 12px;
        font-size: var(--fs-meta);
        color: var(--text-2);
        line-height: 1.5;
      }
      .gap-row + .gap-row {
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .gap-row .body {
        flex: 1;
        min-width: 0;
      }
      .gap-row .src {
        display: block;
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }
      .gap-row .mk {
        margin-top: 6px;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: 0 0 auto;
        background: var(--attn);
      }
      .gap-row.fixed .mk {
        background: var(--ok);
      }
      .gap-row.fixed .tx {
        color: var(--text-dim);
        text-decoration: line-through;
        text-decoration-color: var(--line-strong);
      }
      .gap-row.hover {
        background: var(--hover);
      }
      .gap-row .act {
        display: inline-flex;
        gap: 4px;
        margin-top: 1px;
      }
      .gap-row .cb {
        margin-top: 3px;
      }
      .mini-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .frow {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 8px;
        border-radius: var(--r);
        font: var(--fs-mono) var(--font-mono);
        color: var(--text-2);
      }
      .frow .m {
        margin-left: auto;
        color: var(--text-dim);
        font: var(--fs-sm) var(--font-sans);
        white-space: nowrap;
      }
      .twocol {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 200px;
        gap: 22px;
        align-items: start;
      }
      .tabs-seg {
        display: flex;
        gap: 2px;
        margin-top: 18px;
        padding: 2px;
        border-radius: 10px;
        background: var(--surface-2);
        width: max-content;
      }
      .tabs-seg span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }
      .tabs-seg span.on {
        background: var(--surface-1);
        color: var(--text);
        box-shadow: var(--chip-shadow);
        font-weight: 500;
      }
      .tabs-seg span .n {
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }
      .sumcards {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        overflow: hidden;
      }
      .sumcard {
        flex: 0 0 auto;
        min-width: 128px;
        padding: 9px 12px;
        border-radius: 12px;
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .sumcard b {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text);
        font-weight: 500;
        font-size: var(--fs-meta);
      }
      .sumcard.on {
        box-shadow:
          inset 0 0 0 1px var(--tint),
          var(--card-shadow);
      }
      .disc {
        margin-top: 4px;
        border-radius: 12px;
      }
      .disc + .disc {
        margin-top: 2px;
      }
      .disc .dh {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 8px;
        border-radius: var(--r);
        font-size: var(--fs-meta);
        color: var(--text-2);
        font-weight: 500;
      }
      .disc .dh .m {
        margin-left: auto;
        color: var(--text-dim);
        font-weight: 400;
        font-size: var(--fs-sm);
      }
      .disc .dh .chev {
        color: var(--text-dim);
        display: inline-flex;
        transition: transform 0.2s;
      }
      .disc.open .dh .chev {
        transform: rotate(90deg);
      }
      .disc .db {
        padding: 0 4px 8px 10px;
      }
      .sheet-scrim {
        position: absolute;
        inset: 88px 0 0;
        background: rgba(20, 24, 32, 0.16);
      }
      .th-dark .sheet-scrim {
        background: rgba(0, 0, 0, 0.4);
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;

        padding: 14px 16px 16px;
        border-radius: 16px 16px 0 0;
        background: var(--surface-1);
        box-shadow: var(--float-shadow);
      }
      .sheet .sh {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font-size: var(--fs-meta);
        font-weight: 600;
        color: var(--text);
      }
      .sheet .sh .ibtn {
        margin-left: auto;
      }
      .reco {
        display: inline-block;
        margin-left: 6px;
        padding: 0 6px;
        border-radius: 5px;
        background: #2f6fed;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        vertical-align: 1px;
      }

      /* ---------- ML3 加的部件 ---------- */
      .twocol {
        grid-template-columns: minmax(0, 1fr) 240px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .small {
        font-size: var(--fs-sm);
      }

      .srcrow b {
        color: var(--text-2);

      .srcrow .lk {
        margin-left: auto;

      .childhead {

        gap: 8px;

        border-radius: 12px;

        color: var(--text-muted);
        white-space: nowrap;

        color: var(--text-2);

      }
      .childhead .lk {
        margin-left: auto;

      .fadetop {

      .composer .bar {
        margin-top: auto;

        align-items: center;
        gap: 10px;
        font-size: var(--fs-sm);
        color: var(--text-muted);

        margin-left: auto;
        width: 26px;

      .rolock {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 14px;
        border-radius: 14px;
        background: var(--code);

        color: var(--text-muted);

        margin-left: auto;

      /* 提问卡片（SPEC-0003） */

        background: var(--surface-2);

        display: flex;

        font-size: var(--fs-meta);

        color: var(--attn-text);
      }
      .qcard .qh .who {
        font-weight: 500;
        color: var(--text);
      }
      .qcard .qt {
        margin: 8px 0 6px;
        font-size: var(--fs);
        font-weight: 500;
        color: var(--text);

        color: var(--text-muted);
        font-size: var(--fs-xs);
        font-weight: 400;
        vertical-align: 1px;

        border-radius: var(--r-md);

        color: var(--text);

        width: 20px;
        height: 20px;

        color: var(--text-muted);
        font-size: var(--fs-xs);
        font-weight: 600;
      }
      .th-dark .qo .k {
        background: var(--surface-3);
      }
      .qo code {
        white-space: nowrap;
      }

      /* 过程轨道 */
      .phead {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }

        padding-left: 30px;

        content: "";
        position: absolute;
        left: 10.5px;
        top: 15px;
        bottom: 15px;
        width: 1px;
        background: var(--rail);
      }
      .rs {
        position: relative;
        min-height: 30px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
        white-space: nowrap;
      }
      .rs::before {
        content: "";
        position: absolute;
        left: -22.5px;
        top: 12px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--node);
        box-shadow: 0 0 0 4px var(--main);

      .rs.sq-ok::before {
        left: -23px;
        top: 11.5px;
        width: 7px;
        height: 7px;

        background: var(--attn);

      .rs.sq-ok::before {
        background: var(--ok);

        color: var(--text-2);

      .rs .o {

        overflow: hidden;
        text-overflow: ellipsis;

      .rs .dot {

      .rs .tool {
        font: 12px var(--font-mono);
        color: var(--text-2);
      }
      .rs .r {
        margin-left: auto;
        padding-left: 8px;
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .rs .chev {
        display: inline-flex;
        color: var(--text-dim);
      }
      .detail {
        margin: 0 0 6px;
        padding: 8px 10px;
        border-radius: var(--r);
        background: var(--code);
        font: 12px / 1.55 var(--font-mono);
        color: var(--text-3);
        white-space: pre-wrap;
      }
      .detail .k {
        color: var(--text-dim);
      }

      /* 对话框 */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(20, 24, 32, 0.18);
        backdrop-filter: blur(6px);
        display: grid;
        place-items: center;
        z-index: 7;
      }
      .th-dark .scrim {
        background: rgba(0, 0, 0, 0.42);
      }
      .dialog {

        padding: 20px;
        border-radius: var(--r-card);
        background: var(--main);
        box-shadow: var(--float-shadow);
      }

        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);

        font-size: var(--fs-meta);
        color: var(--text-muted);
        line-height: 1.55;
      }

        justify-content: flex-end;

        margin-top: 16px;

      .dialog .opt-line {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: var(--fs-meta);
        color: var(--text-2);
        padding: 4px 0;
      }
      .dialog .cb {
        width: 16px;
        height: 16px;
        border-radius: 5px;
        background: var(--tint);
        color: var(--on-tint);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .dialog .hint {
        padding-left: 24px;
        font-size: var(--fs-sm);
        color: var(--text-dim);

      .dialog .line {

        margin-top: 10px;
        font-size: var(--fs-meta);
        color: var(--text-2);

      .dialog .line .mk {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--attn);
        flex: 0 0 auto;
      }
      .dialog .danger {
        margin-top: 8px;
        font-size: var(--fs-meta);
        color: var(--danger);
      }
      .dlist {
        margin: 6px 0 0 24px;

        background: var(--code);
        font-size: var(--fs-sm);
        color: var(--text-muted);

        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        white-space: nowrap;
      }
      .dlist .dr .t {
        color: var(--text-2);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dlist .dr .m {
        margin-left: auto;
        color: var(--text-dim);
      }
      .dlist .dh {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
        padding: 2px 0;
      }
      .dlist .dh .lk {
        margin-left: auto;
        color: var(--tint);
      }
      .scores {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--code);
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .scores .sh {
        font-size: var(--fs-xs);
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .scores .sr {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 22px;

      .scores .sr .t {

      .scores .sr .v {

        box-shadow: inset 0 0.5px 0 var(--line);

      /* 漏洞分组、会话行 */

        margin-left: auto;
      }
      .collrow {
        display: flex;

        color: var(--text-muted);
        box-shadow: inset 0 0.5px 0 var(--line);

        margin-left: auto;
        color: var(--text-dim);
      }

        display: inline-grid;

        width: 22px;
