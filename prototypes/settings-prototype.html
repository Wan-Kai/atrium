<!doctype html>
<!--
  PROTOTYPE · 用完即弃，不要当成正式代码。
  回答的问题：Atrium 的"设置页"长什么样。
  同一份设置内容放进三种布局，用 ?v=a|b|c 切换（页面底部的切换条也能切，不刷新）：
    A  独立设置面板：Raycast 式，盖在工作台上的居中窗口，左栏分类、右侧内容；Esc 关闭。
    B  占据对话区：侧栏保留，右侧整块变成设置页（像 Codex / VS Code），顶部"返回"和分类标签。
    C  单页长列表：macOS 系统设置式的分组圆角列表，从上往下排，顶部搜索框过滤设置项；Esc 关闭。
  打开方式：侧栏底部"设置"或 ⌘,。外观记在 localStorage 的 atrium-theme（与主界面原型共用）。
  设计变量、图标写法照搬 app-prototype.html；订阅登录行照搬 onboarding-prototype.html 第 2 步。
  依据：docs/architecture/design-language.md、docs/specs/0001-mvp1-single-session-chat.md（首次启动、侧栏的自动标题、worktree 合并状态的主干）。
  数据全是假的，状态只在内存里（外观除外）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Atrium 设置 · 原型</title>
<script>
  (function () {
    const pref = localStorage.getItem('atrium-theme') || 'system';
    const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
/* ══ 1. 设计变量 · 深色（照搬 app-prototype.html）═══════════════════════════ */

  --danger: #f25a5a; --danger-soft: rgba(242, 90, 90, .14);
  --ok: #22c55e; --ok-soft: rgba(34, 197, 94, .14); --ok-text: #4ade80;
  --card-shadow: 0 0 0 .5px var(--line), 0 9px 27px rgba(41, 70, 122, .20);
  --composer-shadow: 0 0 0 .5px rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .25);

/* ══ 2. 设计变量 · 浅色 ═════════════════════════════════════════════════════ */

  --card-shadow: 0 0 0 .5px var(--line), 0 8px 24px rgba(41, 70, 122, .08);
  --composer-shadow: 0 0 0 .5px rgba(0, 0, 0, .10), 0 6px 20px rgba(41, 70, 122, .08);
  --float-shadow: 0 0 0 .5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, .14);

/* ══ 3. 基础 ══════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; display: flex; overflow: hidden; background: var(--window); color: var(--text); font: var(--fs)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, textarea, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--font-mono); font-size: var(--fs-mono); }
.tnum { font-variant-numeric: tabular-nums; }
svg { flex: none; display: block; }
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(50% 45% at 0% 0%, var(--blob-1), transparent 70%), radial-gradient(45% 50% at 5% 100%, var(--blob-2), transparent 70%),
    radial-gradient(40% 40% at 30% 55%, var(--blob-3), transparent 70%), var(--window); }
.press { transition: transform var(--dur-snappy) var(--ease-snappy), background-color .14s ease, color .14s ease, box-shadow .2s ease, opacity .2s ease; }
.press:active { transform: scale(var(--press, .95)); transition: transform 80ms cubic-bezier(.2, 0, .2, 1), background-color 60ms; }
.ibtn { --press: .9; width: 28px; height: 28px; border: 0; background: none; border-radius: var(--r); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.ibtn:hover { background: var(--hover); color: var(--text-2); }
.ibtn.sm { width: 24px; height: 24px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ══ 4. 工作台（简化：只为让人看出设置页处在哪里）══════════════════════════ */
.sidebar { position: relative; z-index: 1; width: var(--sidebar-w); flex: none; display: flex; flex-direction: column;
  background: var(--sidebar-bg); backdrop-filter: var(--sidebar-blur); -webkit-backdrop-filter: var(--sidebar-blur); box-shadow: inset -.5px 0 0 var(--sidebar-edge); }
.titlebar { height: 50px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 18px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .08); }
.lights i:nth-child(1) { background: #ff6058; } .lights i:nth-child(2) { background: #ffbd2e; } .lights i:nth-child(3) { background: #28c840; }
.titlebar .sp { flex: 1; }
.new-btn { --press: .97; margin: 2px 12px 8px; height: 36px; border: 0; border-radius: var(--r-btn); background: var(--btn); box-shadow: inset 0 0 0 .5px var(--line);
  display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); font-size: var(--fs); }
.new-btn:hover { background: var(--selected); }
.side-scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.side-footer { flex: none; padding: 8px 12px 12px; display: flex; align-items: center; gap: 4px; }
.sec { display: flex; align-items: center; height: 34px; padding: 0 4px 0 8px; margin-top: 6px; color: var(--muted); font-size: var(--fs); }
.sec .lbl { flex: 1; }
.row { --press: .985; position: relative; display: flex; align-items: center; gap: 8px; height: var(--row-h); padding: 0 8px; border-radius: var(--r); color: var(--text-2); user-select: none; cursor: default; }
.side-scroll .row { margin-block: 2px; }
.row:hover { background: var(--hover); }
.row.selected { background: var(--selected); color: var(--text); }
.row .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .time { color: var(--dim); font-size: var(--fs-sm); flex: none; }
.row.ws { padding-left: 36px; }
.icon { display: inline-flex; color: var(--muted); }
.project .icon.open { color: var(--accent); }
.badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex: none; font-size: var(--fs-sm); color: var(--muted); }
.pend::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--attn); flex: none; }
.b-ahead { color: var(--attn-text); font-weight: 600; }
.b-ok { color: var(--ok-text); }
#settingsBtn { background: none; }
#settingsBtn:hover { background: var(--hover); }
#settingsBtn.selected { background: var(--selected); }
#settingsBtn .upd-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

.main { position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--main); }
.header { height: var(--header-h); flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px; box-shadow: inset 0 -.5px 0 var(--line); }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r); color: var(--muted); font-size: var(--fs-meta); }
.tab.on { background: var(--selected); color: var(--text); }
.header .sp { flex: 1; }
.chip { --press: .95; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 0; border-radius: var(--r); background: none; color: var(--text-3); font-size: var(--fs-meta); }
.chip:hover { background: var(--hover); color: var(--text); }
.stream { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: var(--fs-meta); }
.stream .big { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.stream kbd { font: 11px var(--font); padding: 1px 6px; border-radius: 5px; box-shadow: inset 0 0 0 .5px var(--line-strong); color: var(--text-3); }
.bottom { flex: none; padding: 0 32px 40px; }
.composer { max-width: calc(var(--content-w) - 64px); margin: 0 auto; padding: 14px 14px 12px; border-radius: var(--r-bubble); background: var(--surface-2); box-shadow: var(--composer-shadow); }
[data-theme="light"] .composer { background: var(--surface-1); box-shadow: 0 0 0 .5px var(--line), 0 1px 2px rgba(0,0,0,.04), 0 14px 34px -16px rgba(30,40,90,.24); }
.composer .ph { color: var(--dim); padding: 2px 4px 18px; }
.composer .crow { display: flex; align-items: center; gap: 8px; }
.composer .crow .sp { flex: 1; }
.round { width: 30px; height: 30px; border-radius: 50%; background: var(--hover); color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; }
.send { width: 34px; height: 34px; border-radius: 50%; background: var(--selected); color: var(--dim); display: inline-flex; align-items: center; justify-content: center; }
.mtag { font-size: var(--fs-sm); color: var(--muted); padding: 0 6px; }

/* ══ 5. 设置页的通用件（三个方案共用）══════════════════════════════════════ */
.grp { margin: 0 0 30px; }
.grp > h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; font-size: var(--fs-meta); font-weight: 600; color: var(--text); }
.grp > h4 .sp { flex: 1; }
.grp > .gd { margin: 0 0 10px; color: var(--muted); font-size: var(--fs-sm); line-height: 1.55; }
.grp > .gf { margin: 10px 0 0; color: var(--dim); font-size: var(--fs-sm); line-height: 1.55; }
.gd code, .gf code, .it small code { font-size: 11.5px; padding: 0 4px; border-radius: 4px; background: var(--selected); color: var(--text-3); }
.gl { margin: 0 -12px; }
.it { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 12px; border-radius: var(--r-md); transition: background .15s, box-shadow .2s; }
.it + .it::before { content: ''; position: absolute; left: 12px; right: 12px; top: 0; height: .5px; background: var(--line); transition: opacity .15s; }
.it.prov + .it.prov::before, .it.proj + .it.proj::before { left: 56px; }
.it.busy::before, .it.busy + .it::before { opacity: 0; }
.it.busy { background: var(--linked); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); }
.it .lab { flex: 1; min-width: 0; }
.it .lab b { display: block; font-weight: 500; color: var(--text); font-size: var(--fs); }
.it .lab small { display: block; margin-top: 1px; color: var(--muted); font-size: var(--fs-sm); line-height: 1.5; }
.it .lab small.path { font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .ctl { display: flex; align-items: center; gap: 8px; flex: none; font-size: var(--fs-sm); color: var(--muted); }
.it .val { color: var(--text-2); font-size: var(--fs-meta); }
.it .val.mono { font-size: var(--fs-sm); }
.it.busy .ctl { color: var(--accent); }
.it.kv { min-height: 40px; padding-top: 8px; padding-bottom: 8px; }
.it.kv .lab b { font-weight: 400; color: var(--text-2); font-size: var(--fs-meta); }
.it .lead-ic { width: 32px; display: inline-flex; justify-content: center; color: var(--muted); flex: none; }

.blogo { width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center; overflow: hidden; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06); }
.blogo img { width: 20px; height: 20px; display: block; }
.blogo img.full { width: 32px; height: 32px; }
.blogo.meta { color: #0866ff; }
.blogo.pi svg { width: 22px; height: 22px; }
.blogo.lg { width: 44px; height: 44px; border-radius: 12px; }
.blogo.lg svg { width: 30px; height: 30px; }

.btn { --press: .95; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: var(--r-pill); background: var(--btn); box-shadow: inset 0 0 0 .5px var(--line-strong);
  color: var(--text-2); font-size: var(--fs-meta); white-space: nowrap; }
.btn:hover { background: var(--selected); color: var(--text); }
.btn.primary { background: var(--text); color: var(--main); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 500; }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: none; box-shadow: none; color: var(--muted); padding: 0 8px; }
.btn.ghost:hover { background: var(--hover); color: var(--text-2); }
.btn.sm { height: 24px; padding: 0 10px; font-size: var(--fs-sm); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn[disabled]:active { transform: none; }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); font-size: var(--fs-sm); }
.lnk { text-decoration: none; }
.lnk:hover { text-decoration: underline; }
.ok-t { display: inline-flex; align-items: center; gap: 4px; color: var(--ok-text); font-size: var(--fs-sm); }
.warn-t { color: var(--attn-text); }
.err-t { color: var(--danger); }
.spin { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }

/* 分段控件：滑块按 --i 平移，弹簧过渡 */
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 9px; background: var(--selected); }
.seg .th { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); transform: translateX(calc(var(--i) * 100%)); border-radius: 7px;
  background: var(--surface-1); box-shadow: 0 0 0 .5px var(--line), 0 1px 3px rgba(0,0,0,.10); transition: transform var(--dur-snappy) var(--ease-snappy); }
[data-theme="dark"] .seg .th { background: var(--surface-3); }
.seg button { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 26px; padding: 0 12px; border: 0; background: none; color: var(--muted); font-size: var(--fs-meta); transition: color .2s; }
.seg button.on { color: var(--text); }

/* 下拉按钮 */
.dd { --press: .97; display: inline-flex; align-items: center; gap: 6px; max-width: 300px; height: 28px; padding: 0 8px 0 10px; border: 0; border-radius: var(--r); background: var(--btn); box-shadow: inset 0 0 0 .5px var(--line-strong); color: var(--text-2); font-size: var(--fs-meta); white-space: nowrap; }
.dd:hover { background: var(--selected); color: var(--text); }
.dd.on { box-shadow: inset 0 0 0 .5px var(--line-strong), var(--focus); }
.dd .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dd .dim { color: var(--dim); }
.dd .car { color: var(--dim); }
.ovr { font-size: var(--fs-sm); color: var(--muted); }

/* 输入 */
.field { height: 30px; min-width: 0; border: 0; border-radius: var(--r); padding: 0 10px; background: var(--hover); box-shadow: inset 0 0 0 .5px var(--line-strong); color: var(--text); font-size: var(--fs-meta); outline: none; transition: box-shadow .2s; }
.field:focus { box-shadow: inset 0 0 0 .5px var(--line-strong), var(--focus); }
.field::placeholder { color: var(--dim); }
.field.bad { box-shadow: inset 0 0 0 1px var(--danger); }
.selwrap { position: relative; display: inline-flex; }
.selwrap select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer; }
.selwrap .car { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
.keyform { display: block; }
.keyform .kf { display: flex; gap: 8px; align-items: center; }
.keyform .kf input { flex: 1; font-family: var(--font-mono); font-size: var(--fs-sm); }
.keyform .kfoot { display: flex; justify-content: space-between; margin-top: 8px; font-size: var(--fs-sm); color: var(--dim); }

/* 浮层（照搬 app-prototype 的 .pop）*/
.pop { position: fixed; z-index: 150; min-width: 220px; max-height: 360px; overflow-y: auto; padding: 6px; border-radius: var(--r-btn); background: var(--surface-1); box-shadow: var(--float-shadow); font-size: var(--fs-meta); }
[data-theme="dark"] .pop { background: var(--surface-2); }
.pop .head { padding: 6px 8px 4px; color: var(--dim); font-size: var(--fs-xs); display: flex; align-items: center; gap: 6px; }
.pop .head img { width: 12px; height: 12px; border-radius: 3px; }
.pop .item { --press: .98; display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--r); background: none; color: var(--text-2); text-align: left; }
.pop .item:hover { background: var(--hover); color: var(--text); }
.pop .item .grow { flex: 1; min-width: 0; }
.pop .item .grow small { display: block; color: var(--dim); font-size: var(--fs-xs); }
.pop .item .k { margin-left: auto; color: var(--dim); font-size: var(--fs-xs); }
.pop .item .cheap { margin-left: auto; color: var(--ok-text); font-size: var(--fs-xs); }
.pop .tick { width: 14px; color: var(--accent); display: inline-flex; flex: none; }
.pop .sepr { height: .5px; margin: 4px 6px; background: var(--line); }

/* 终端（照搬 onboarding：最多约 7 行，底边进度线）*/

// ══ 1. 弹簧（照搬 app-prototype）══════════════════════════════════════════
function spring(duration, bounce) {
  const w = 2 * Math.PI / duration, z = bounce >= 0 ? 1 - bounce : 1 / (1 + bounce);
  const x = t => {
    if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
    if (z === 1) return 1 - Math.exp(-w * t) * (1 + w * t);
    const s = Math.sqrt(z * z - 1), r1 = -w * (z - s), r2 = -w * (z + s);
    return 1 + (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r1 - r2);
  };
  let T = duration * 3;
  for (let t = duration * 3; t > 0; t -= 0.005) { if (Math.abs(1 - x(t)) > 0.001) { T = t + 0.005; break; } }
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++) pts.push(+x(T * i / n).toFixed(4));
  pts[n] = 1;
  return { easing: `linear(${pts.join(', ')})`, ms: Math.round(T * 1000) };
}
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const linearOK = typeof CSS !== 'undefined' && CSS.supports('transition-timing-function', 'linear(0, 1)');
const SPR = { smooth: spring(0.42, 0), snappy: spring(0.30, 0.15), bouncy: spring(0.40, 0.26) };
if (!linearOK) for (const k in SPR) SPR[k] = { easing: 'cubic-bezier(.2,.9,.3,1.04)', ms: 450 };
else for (const [k, v] of Object.entries(SPR)) {
  document.documentElement.style.setProperty(`--ease-${k}`, v.easing);
  document.documentElement.style.setProperty(`--dur-${k}`, v.ms + 'ms');
}
const anim = (el, frames, spr, extra = {}) => (REDUCE || !el?.animate) ? null : el.animate(frames, { duration: spr.ms, easing: spr.easing, ...extra });
function enterUp(el, delay = 0) {
  if (REDUCE || !el.animate) return;
  el.animate([{ transform: 'translateY(8px)' }, { transform: 'none' }], { duration: SPR.snappy.ms, easing: SPR.snappy.easing, delay, fill: 'backwards' });
  el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'cubic-bezier(.2,0,.2,1)', delay, fill: 'backwards' });

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  anim(t, [{ transform: 'translate(-50%, 12px) scale(.92)', opacity: 0 }, { transform: 'translate(-50%, 0) scale(1)', opacity: 1 }], SPR.bouncy, { fill: 'both' });
  setTimeout(() => {
    if (!t.isConnected) return; if (REDUCE) return t.remove();
    t.animate([{ opacity: 1 }, { opacity: 0, transform: 'translate(-50%, 6px)' }], { duration: 180, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).onfinish = () => t.remove();
  }, 1700);
}

// ══ 4. 外观：跟随系统 / 浅色 / 深色（与主界面原型共用 localStorage 的 atrium-theme）══
const THEMES = [['system', '跟随系统', 'monitor'], ['light', '浅色', 'sun'], ['dark', '深色', 'moon']];
let themePref = localStorage.getItem('atrium-theme') || 'system';
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const resolved = () => themePref === 'system' ? (sysDark.matches ? 'dark' : 'light') : themePref;
function applyTheme(animate) {
  const next = resolved();
  const go = () => { document.documentElement.dataset.theme = next; };
  if (animate && document.documentElement.dataset.theme !== next && document.startViewTransition && !REDUCE) document.startViewTransition(go); else go();
  syncTheme();
}
function setThemePref(p) { themePref = p; localStorage.setItem('atrium-theme', p); applyTheme(true); }
sysDark.addEventListener('change', () => { if (themePref === 'system') applyTheme(true); });
// 只改已有元素，不整块重画，分段控件的滑块才能用弹簧滑过去
function syncTheme() {
  const t = THEMES.find(x => x[0] === themePref);
  const b = $('#themeBtn'); b.innerHTML = ph(t[2], 16); b.title = `外观：${t[1]}（点按切换）`;
  document.querySelectorAll('.seg[data-seg="theme"]').forEach(s => {
    const i = THEMES.findIndex(x => x[0] === themePref); s.style.setProperty('--i', i);
    s.querySelectorAll('button').forEach((x, k) => x.classList.toggle('on', k === i));
  });
  renderBar();
}

  const keyRows = keys.map(k => { const nm = KEY_PROV.find(p => p[0] === k)[1];
    return it(`${nm} api key 密钥 已保存`, 'k-' + k, nm, '', `<span class="ok-t">${ph('checkB', 12)}已保存</span><button class="btn ghost sm press" data-act="keyDel" data-arg="${k}" title="从 auth.json 删除这个 Key">删除</button>`, 'kv', `<span class="lead-ic">${ph('key', 16)}</span>`); }).join('');

  if (keyForm) {

        <input class="field${keyForm.bad ? ' bad' : ''}" id="kfVal" type="password" placeholder="粘贴 API Key" value="${esc(keyForm.val)}" autocomplete="off" spellcheck="false">
        <button class="btn primary sm press" data-act="keySave">保存</button><button class="btn ghost sm press" data-act="keyCancel">取消</button></div>

  } else {

  }
  const keyGrp = grp('api key 密钥 auth.json', 'API Key', '没有订阅也可以用服务商的 API Key。这里只显示保存过 Key 的服务商，不显示 Key 本身。',
    `<div class="gl">${keyRows || ''}${add}</div>`, 'Key 只写在本机的 <code>~/.pi/agent/auth.json</code>，终端里的 pi 也能用。');

  // 标题模型

function termHTML(lines, mode) {
  const run = mode === 'run';
  const body = lines.map((l, i) => `<div class="${/^✓/.test(l) ? 'ok' : /error|^✗/.test(l) ? 'err' : /^\$/.test(l) ? 'p' : ''}${run && i === lines.length - 1 ? ' cur' : ''}">${esc(l)}</div>`).join('');
  const pct = run ? Math.round(lines.length / UPD_LOG.length * 100) : 100;
  return `<div class="term${mode === 'fail' ? ' full' : ''}"><div class="tb"><i></i><i></i><i></i><span>更新 pi</span></div><div class="body" id="termBody">${body}</div>
    <div class="prog${mode === 'ok' ? ' ok' : mode === 'fail' ? ' bad' : ''}"><i style="width:${pct}%"></i></div></div>`;
}

function secPi() {
  const s = pi.state, busy = s === 'waiting' || s === 'updating';
  const latestTxt = s === 'latest' || s === 'done' ? `${pi.cur}<span class="ok-t" style="margin-left:8px">${ph('checkB', 12)}已是最新</span>` : `${pi.latest}`;
  const head = `<div class="gl">
    ${it('pi 位置 路径 path', 'pi-loc', 'pi', 'Atrium 和终端用的是同一个 pi', `<a class="lnk" href="https://pi.dev" target="_blank" rel="noopener">pi.dev ↗</a>`, 'prov', `<span class="blogo pi">${PI_SVG}</span>`)}
    ${it('位置 路径 path', 'pi-path', '位置', '', `<span class="val mono">${PI_PATH}</span><button class="btn ghost sm press" data-act="noop" data-arg="在访达中显示 pi">在访达中显示</button>`, 'kv')}
    ${it('当前版本 版本 version', 'pi-cur', '当前版本', '', `<span class="val tnum">${pi.cur}</span>`, 'kv')}
    ${it('最新版本 版本 npm', 'pi-latest', '最新版本', '', `<span class="val tnum">${latestTxt}</span>`, 'kv')}
    ${it('上次检查 检查更新', 'pi-chk', '上次检查', '', `<span class="val">${pi.checked}</span><button class="btn sm press" data-act="check"${busy || pi.checking ? ' disabled' : ''}>${pi.checking ? '<span class="spin"></span>正在检查' : ph('arrowsClockwise', 12) + '检查更新'}</button>`, 'kv')}
  </div>`;

  let u = '';
  if (s === 'latest') u = `<div class="upd"><div class="uh"><span class="ui ok-t">${ph('checkCircle', 18)}</span><div class="lab"><b>pi 已是最新版本</b><small>有新版本时这里会出现"更新 pi"</small></div></div></div>`;
  else if (s === 'available') u = `<div class="upd available"><div class="uh"><span class="ui" style="color:var(--accent)">${ph('downloadSimple', 18)}</span><div class="lab"><b>有新版本 ${pi.latest}</b><small>当前 ${pi.cur}。更新的是你装的这个 pi，终端里的 pi 也会一起更新</small></div>
      <div class="ctl"><button class="btn primary press" data-act="update">更新 pi</button></div></div></div>`;
  else if (s === 'waiting') u = `<div class="upd available"><div class="uh"><span class="ui" style="color:var(--accent)"><span class="spin"></span></span><div class="lab"><b>等待 <span class="tnum">${pi.wait.length}</span> 个会话运行结束</b><small>${pi.wait.map(esc).join('、')}；结束后自动开始更新</small></div>
      <div class="ctl"><button class="btn ghost sm press" data-act="cancelWait">取消</button><button class="btn primary press" disabled>更新 pi</button></div></div></div>`;
  else if (s === 'updating') u = `<div class="upd"><div class="uh"><span class="ui" style="color:var(--accent)"><span class="spin"></span></span><div class="lab"><b>正在更新到 ${pi.latest}</b><small>新开的会话会等更新完成再启动 pi</small></div>
      <div class="ctl"><button class="btn ghost sm press" data-act="cancelUpd">取消</button></div></div>${termHTML(pi.lines, 'run')}</div>`;
  else if (s === 'failed') u = `<div class="upd failed"><div class="uh"><span class="ui err-t">${ph('warnCircle', 18)}</span><div class="lab"><b class="err-t">没有装好</b><small>npm 报了权限错误（EACCES），完整日志在下面</small></div>
      <div class="ctl"><button class="btn primary press" data-act="retry">重试</button></div></div>${termHTML(FAIL_LOG, 'fail')}</div>`;
  else if (s === 'done') u = `<div class="upd"><div class="uh"><span class="ui ok-t">${ph('checkCircle', 18)}</span><div class="lab"><b>已更新到 ${pi.cur}</b><small>空闲会话的 pi 在下次使用时用新版本重启</small></div>
      <div class="ctl"><button class="btn ghost sm press" data-act="showLog">查看日志</button></div></div>${pi.showLog ? termHTML(UPD_LOG, 'ok') : ''}</div>`;

  const manual = s === 'updating' ? '' : `<div class="manual${pi.manual ? ' open' : ''}"><button class="disc" data-act="manual"><span class="chev">${ph('chev', 11)}</span>手动更新</button>
    ${pi.manual ? `<div class="mbody">在终端里运行：<div class="cmd"><code>pi update</code><button class="btn ghost sm press" data-act="copy">${pi.copied ? ph('checkB', 12) + '已复制' : ph('copy', 12) + '复制'}</button></div>

  return grp('pi 位置 路径 版本', '', '', head) +
    grp('更新 pi 检查更新 版本 npm 升级 update', '更新', '', u + manual, '宿主每天查一次 npm 上的最新版本，有新版本时在这里显示"更新 pi"，不打断使用。有会话在运行时，更新等它们结束再开始。', dbg);
}

const SEC_RENDER = { appearance: secAppearance, models: secModels, projects: secProjects, pi: secPi, about: secAbout };

// ══ 8. 三个方案的外壳 ════════════════════════════════════════════════════════
const navDot = id => id === 'pi' && hasUpdate() ? '<span class="ndot" title="有新版本"></span>' : '';
function chromeA() {
  return `<div class="wa" role="dialog" aria-label="设置">

      <div class="tabsB" id="snav">${navB()}</div></div><div class="sbody" id="sbody"></div>`;
}
const navB = () => SECTIONS.map(([id, l, ic]) => `<button class="tabB press${ui.sec === id ? ' on' : ''}" data-act="sec" data-arg="${id}">${ph(ic, 14)}${l}${navDot(id)}</button>`).join('');
function chromeC() {
  return `<div class="wc" role="dialog" aria-label="设置"><div class="ch"><div class="top"><button class="ibtn press" data-act="close" title="关闭（Esc）">${ph('x', 15)}</button><b>设置</b><span class="esc">Esc 关闭</span></div>
    <div class="csearch">${ph('search', 14)}<input id="cq" placeholder="搜索设置，例如&quot;主干&quot;&quot;深色&quot;&quot;API Key&quot;" value="${esc(ui.q)}" autocomplete="off" spellcheck="false"><span class="cnt" id="ccnt"></span>

function bodyHTML() {
  if (ui.v === 'c') return SECTIONS.map(([id, l, ic]) => `<div class="ss" data-k="${l} ${id}" id="ss-${id}"><h3><span class="icon">${ph(ic, 17)}</span>${l}</h3>${SEC_RENDER[id]()}</div>`).join('')

// 重画内容区：保住滚动位置和输入焦点；新出现的行从下方淡入
function renderBody(opts = {}) {
  const b = $('#sbody'); if (!b) return;
  const st = b.scrollTop, before = new Set([...b.querySelectorAll('[data-key]')].map(e => e.dataset.key));
  const ae = document.activeElement, fid = ae && b.contains(ae) ? ae.id : null, sel = fid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;
  b.innerHTML = bodyHTML();
  if (!opts.resetScroll) b.scrollTop = st;
  if (fid) { const f = document.getElementById(fid); if (f) { f.focus(); if (sel && f.setSelectionRange) try { f.setSelectionRange(...sel); } catch {} } }
  if (!opts.quiet) { let k = 0; b.querySelectorAll('[data-key]').forEach(e => { if (!before.has(e.dataset.key)) enterUp(e, Math.min(k++ * 18, 90)); }); }
  const t = $('#termBody'); if (t && pi.state === 'failed') t.scrollTop = 0;
  if (ui.v === 'c') applyFilter();
  const ttl = $('#stitle'); if (ttl) ttl.textContent = SECTIONS.find(x => x[0] === ui.sec)[1];
  const nav = $('#snav'); if (nav) nav.innerHTML = ui.v === 'a' ? navA() : ui.v === 'b' ? navB() : '';
  renderSide();
}

// C：按关键词过滤。命中分组名则整组显示，命中某行只显示这一行
function applyFilter() {
  const q = ui.q.trim().toLowerCase(); let rowsShown = 0;
  const hit = el => !q || (el.dataset.k || '').toLowerCase().includes(q) || el.textContent.toLowerCase().includes(q);
  let any = false;
  document.querySelectorAll('#sbody .ss').forEach(ss => {
    const sm = q && (ss.dataset.k || '').toLowerCase().includes(q);
    let sAny = false;
    ss.querySelectorAll('.grp').forEach(g => {
      const h = g.querySelector(':scope > h4'), gm = sm || (q && ((g.dataset.k || '').toLowerCase().includes(q) || (h && h.textContent.toLowerCase().includes(q))));
      let gAny = false;
      g.querySelectorAll('.it').forEach(r => { const show = !q || gm || hit(r); r.hidden = !show; if (show) { gAny = true; if (q) rowsShown++; } });
      if (!g.querySelector('.it') && (gm || !q)) gAny = true;
      g.hidden = !(gAny || gm || !q); if (!g.hidden) sAny = true;
    });
    ss.hidden = !sAny; if (sAny) any = true;
  });
  const e = $('#cempty'); if (e) e.hidden = any;
  const c = $('#ccnt'); if (c) c.textContent = q ? (any ? `${rowsShown} 项` : '') : '';
  const clr = document.querySelector('.csearch .clr'); if (clr) clr.hidden = !ui.q;
}

// ══ 9. 打开 / 关闭 / 切换方案 ═════════════════════════════════════════════════
function openSettings(instant) {
  closePop();
  const wasOpen = ui.open; ui.open = true;
  if (ui.v === 'b') {
    const pb = $('#pageB'); pb.innerHTML = chromeB(); pb.hidden = false; renderBody({ quiet: true, resetScroll: true });
    if (!wasOpen && !instant) { anim(pb, [{ opacity: 0, transform: 'translateX(14px)' }, { opacity: 1, transform: 'none' }], SPR.smooth); }
  } else {
    const ov = $('#ov'), win = $('#win'); ov.className = 'ov ' + ui.v; win.innerHTML = ui.v === 'a' ? chromeA() : chromeC(); ov.hidden = false; renderBody({ quiet: true, resetScroll: true });
    if (!wasOpen && !instant) {
      anim(ov.querySelector('.ov-bg'), [{ opacity: 0 }, { opacity: 1 }], { ms: 220, easing: 'ease-out' });
      const w = win.firstElementChild;
      if (ui.v === 'a') { anim(w, [{ transform: 'scale(.94)' }, { transform: 'none' }], SPR.snappy); anim(w, [{ opacity: 0 }, { opacity: 1 }], { ms: 180, easing: 'ease-out' }); }
      else { anim(w, [{ transform: 'translateY(-36px)' }, { transform: 'none' }], SPR.smooth); anim(w, [{ opacity: 0 }, { opacity: 1 }], { ms: 200, easing: 'ease-out' }); }
    }
    if (ui.v === 'c') setTimeout(() => $('#cq')?.focus(), 40);
  }
  renderSide(); renderBar();
}
function closeSettings(instant) {
  closePop(); if (!ui.open) return;
  ui.open = false;
  const done = () => { $('#ov').hidden = true; $('#win').innerHTML = ''; $('#pageB').hidden = true; $('#pageB').innerHTML = ''; };
  const el = ui.v === 'b' ? $('#pageB') : $('#win').firstElementChild;
  if (instant || REDUCE || !el) done();
  else {
    if (ui.v !== 'b') $('#ov .ov-bg').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: 'forwards' });
    const to = ui.v === 'a' ? 'scale(.97)' : ui.v === 'c' ? 'translateY(-20px)' : 'translateX(14px)';
    el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: to }], { duration: 170, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).onfinish = done;
  }
  renderSide(); renderBar();
}
function setVariant(v) {
  if (v === ui.v) return;
  const was = ui.open; if (was) closeSettings(true);
  ui.v = v;
  try { history.replaceState(null, '', location.pathname + '?v=' + v); } catch { try { location.hash = 'v=' + v; } catch {} }
  if (was) openSettings();
  renderBar();
}

// ══ 10. 浮层菜单（标题模型、主干分支）══════════════════════════════════════
let popEl = null, popAnchor = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } popAnchor?.classList.remove('on'); popAnchor = null; }
function openPop(anchor, html, onPick) {
  if (popAnchor === anchor) return closePop();
  closePop();
  const p = document.createElement('div'); p.className = 'pop'; p.innerHTML = html; document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), w = Math.max(p.offsetWidth, r.width), h = p.offsetHeight;
  const left = Math.min(Math.max(8, r.right - w), innerWidth - w - 8);
  const below = r.bottom + 6 + h < innerHeight - 8;
  p.style.left = left + 'px'; p.style.top = (below ? r.bottom + 6 : r.top - 6 - h) + 'px'; p.style.minWidth = r.width + 'px';
  p.style.transformOrigin = below ? 'top right' : 'bottom right';
  anim(p, [{ transform: 'scale(.95)', opacity: 0 }, { transform: 'none', opacity: 1 }], SPR.snappy);
  p.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (!b) return; closePop(); onPick(b.dataset.pick); });
  popEl = p; popAnchor = anchor; anchor.classList.add('on');
}
const tick = on => `<span class="tick">${on ? ph('checkB', 12) : ''}</span>`;
function titlePop(anchor) {
  let h = `<div class="head">生成标题用的模型</div><button class="item press" data-pick="">${tick(!titleModel)}<span class="grow">跟随会话的模型<small>和这个会话用同一个模型</small></span></button>`;
  for (const src of sources()) {
    const prov = src.startsWith('key:') ? null : PROV.find(p => p[0] === src);
    h += `<div class="sepr"></div><div class="head">${prov?.[3] ? `<img src="${prov[3]}" alt="">` : ''}${esc(srcName(src))}</div>`;
    h += MODELS[src].map(([id, cheap]) => `<button class="item press" data-pick="${src}|${id}">${tick(titleModel && titleModel.src === src && titleModel.id === id)}<span class="mono" style="font-size:var(--fs-sm)">${id}</span>${cheap ? '<span class="cheap">更便宜</span>' : ''}</button>`).join('');
  }
  openPop(anchor, h, v => { titleModel = v ? { src: v.split('|')[0], id: v.split('|')[1] } : null; renderBody(); toast(v ? `标题改用 ${titleModel.id} 生成` : '标题跟随会话的模型'); });
}
function branchPop(anchor, pid) {
  const p = PROJ.find(x => x.id === pid), ov = mainOverride[pid];
  let h = `<div class="head">${esc(p.name)} 的主干分支</div><button class="item press" data-pick="">${tick(!ov)}<span class="grow">自动<small>${p.head ? `跟随 origin/HEAD，现在是 ${p.head}` : '这个仓库没有 origin/HEAD'}</small></span></button><div class="sepr"></div><div class="head">分支</div>`;
  h += p.branches.map(b => `<button class="item press" data-pick="${b}">${tick(ov === b)}<span class="mono" style="font-size:var(--fs-sm)">${b}</span>${b === p.head ? '<span class="k">origin/HEAD</span>' : ''}</button>`).join('');
  openPop(anchor, h, v => { if (v) mainOverride[pid] = v; else delete mainOverride[pid]; renderBody(); toast(v ? `${p.name} 的主干改为 ${v}，正在重新计算合并状态` : `${p.name} 的主干恢复为自动`); });
}

// ══ 11. pi 更新的假流程 ═════════════════════════════════════════════════════
function stopPi() { clearInterval(piTimer); clearTimeout(piTimer); piTimer = null; }
function setPi(state, from) {
  stopPi(); pi.state = state; pi.showLog = false;
  if (state === 'latest' || state === 'done') pi.cur = pi.latest;
  else pi.cur = '1.1.4';
  if (state === 'failed') pi.manual = true;
  if (state === 'waiting') { pi.wait = [...RUNNING]; piTimer = setInterval(() => { pi.wait.shift(); if (!pi.wait.length) setPi('updating'); else renderAll(); }, 2600); }
  if (state === 'updating') { pi.lines = [UPD_LOG[0]]; piTimer = setInterval(() => {
    pi.lines.push(UPD_LOG[pi.lines.length]);
    if (pi.lines.length >= UPD_LOG.length) { stopPi(); setTimeout(() => { if (pi.state !== 'updating') return; setPi('done'); toast(`pi 已更新到 ${pi.latest}`); }, 700); }
    renderAll();
  }, 650); }
  renderAll();
}
function renderAll() { if (ui.open) renderBody(); else renderSide(); renderBar(); const d = $('#piDbg'); if (d) d.value = pi.state; }

// ══ 12. 工作台 ═══════════════════════════════════════════════════════════════
function renderSide() {
  const sb = $('#settingsBtn');
  sb.innerHTML = `<span class="icon">${ph('gearSix', 15)}</span><span class="title" style="text-align:left">设置</span>${hasUpdate() ? '<span class="upd-dot" title="pi 有新版本"></span>' : ''}`;
  sb.classList.toggle('selected', ui.open && ui.v === 'b');
}
function renderWorkbench() {
  $('#sideToggle').innerHTML = ph('sidebar', 16);
  $('#newBtn').innerHTML = `${ph('newChat', 16)}新对话`;
  $('#side').innerHTML = `
    <div class="sec"><span class="lbl">项目</span><button class="ibtn sm">${ph('plus', 13)}</button></div>
    <div class="row project"><span class="icon open">${ph('folderOpen', 16)}</span><span class="title">atrium</span></div>
    <div class="row ws selected"><span class="title">main</span><span class="badge pend">未提交</span></div>
    <div class="row ws"><span class="title">feat/sidebar</span><span class="badge b-ahead">↑3</span></div>
    <div class="row ws"><span class="title">fix/typo</span><span class="badge b-ok">✓ 已合并</span></div>
    <div class="row project"><span class="icon">${ph('folder', 16)}</span><span class="title">my-blog</span></div>
    <div class="row project"><span class="icon">${ph('folder', 16)}</span><span class="title">dotfiles</span></div>
    <div class="sec"><span class="lbl">对话</span></div>
    <div class="row"><span class="title">解释 git merge-tree 的原理</span><span class="time">30 分钟前</span></div>
    <div class="row"><span class="title">写一封请假邮件</span><span class="time">昨天</span></div>`;
  $('#header').innerHTML = `<span class="tab on">设计侧栏交互</span><span class="tab">重构宿主进程管理</span><span class="sp"></span><button class="chip">${ph('history', 14)}历史</button>`;
  $('#composer').innerHTML = `<div class="ph">发消息或描述任务，@ 引用文件，/ 使用命令</div><div class="crow"><span class="round">${ph('plus', 15)}</span><span class="sp"></span><span class="mtag">gpt-6-sol · 中</span><span class="send">${ph('up', 15)}</span></div>`;
  renderSide();
}
function renderBar() {
  const t = THEMES.find(x => x[0] === themePref);
  $('#vbar').innerHTML = `<span class="tg">原型</span>${Object.keys(VARIANTS).map(k => `<button class="${k === ui.v ? 'on' : ''}" data-act="v" data-arg="${k}">${k.toUpperCase()}</button>`).join('')}
    <span class="nm">${VARIANTS[ui.v]}</span><span class="sep"></span>
    <button data-act="cycleTheme" title="外观：${t[1]}（点按切换）">${ph(t[2], 13)}${t[1]}</button><span class="sep"></span>
    ${ui.open ? `<button data-act="close">关闭设置</button>` : `<button data-act="open">打开设置 ⌘,</button>`}`;
}

// ══ 13. 事件 ═════════════════════════════════════════════════════════════════
const ACT = {
  open: () => openSettings(), close: () => closeSettings(),
  v: a => setVariant(a),
  sec: a => { if (ui.sec === a) return; ui.sec = a; keyForm = null; renderBody({ quiet: true, resetScroll: true }); anim($('#sbody'), [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], SPR.smooth); },
  theme: a => setThemePref(a),
  cycleTheme: () => setThemePref(THEMES[(THEMES.findIndex(x => x[0] === themePref) + 1) % 3][0]),
  login: a => { login[a] = 'busy'; renderBody(); loginTimers[a] = setTimeout(() => { login[a] = 'ok'; renderBody(); toast(`已登录 ${PROV.find(p => p[0] === a)[1]}`); }, 2000); },
  cancelLogin: a => { clearTimeout(loginTimers[a]); delete login[a]; renderBody(); },
  logout: a => { delete login[a]; renderBody(); toast(`已退出 ${PROV.find(p => p[0] === a)[1]}`); },
  keyAdd: () => { const free = KEY_PROV.filter(p => !keys.includes(p[0])); keyForm = { prov: free[0][0], val: '', bad: false }; renderBody(); setTimeout(() => $('#kfVal')?.focus(), 30); },
  keyCancel: () => { keyForm = null; renderBody(); },
  keySave: () => {
    if (!keyForm.val.trim()) { keyForm.bad = true; renderBody({ quiet: true }); const f = $('#kfVal'); f?.focus(); anim(f, [{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(-3px)' }, { transform: 'none' }], { ms: 320, easing: 'ease-out' }); return; }
    keys.push(keyForm.prov); const nm = KEY_PROV.find(p => p[0] === keyForm.prov)[1]; keyForm = null; renderBody(); toast(`已保存 ${nm} 的 API Key`);
  },
  keyDel: a => { keys = keys.filter(k => k !== a); renderBody(); toast(`已删除 ${KEY_PROV.find(p => p[0] === a)[1]} 的 API Key`); },
  titleDD: (a, el) => titlePop(el),
  branchDD: (a, el) => branchPop(el, a),
  restore: a => { delete mainOverride[a]; renderBody(); toast(`${PROJ.find(p => p.id === a).name} 的主干恢复为自动`); },
  check: () => { pi.checking = true; renderBody(); setTimeout(() => { pi.checking = false; pi.checked = '刚刚'; renderBody(); toast(pi.state === 'available' ? `有新版本 ${pi.latest}` : 'pi 已是最新版本'); }, 1200); },
  update: () => setPi('waiting'),
  cancelWait: () => { setPi('available'); toast('已取消，不会自动更新'); },
  cancelUpd: () => { setPi('available'); toast('已取消更新，pi 保持 1.1.4'); },
  retry: () => { pi.manual = false; setPi('updating'); },
  manual: () => { pi.manual = !pi.manual; renderBody(); },
  showLog: () => { pi.showLog = !pi.showLog; renderBody(); },
  copy: () => { navigator.clipboard?.writeText('pi update').catch(() => {}); pi.copied = true; renderBody({ quiet: true }); setTimeout(() => { pi.copied = false; if (ui.open) renderBody({ quiet: true }); }, 1500); },
  recheck: () => { pi.checking = true; renderBody(); setTimeout(() => { pi.checking = false; pi.checked = '刚刚'; pi.manual = false; setPi('latest'); toast(`检测到 pi ${pi.latest}，已是最新`); }, 1200); },
  clearQ: () => { ui.q = ''; const i = $('#cq'); i.value = ''; i.focus(); applyFilter(); },
  noop: a => toast('原型：' + (a || '没有实现')),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (popEl && !e.target.closest('.pop')) closePop(); return; }
  if (el.disabled) return;
  if (popEl && !el.closest('.pop') && !['titleDD', 'branchDD'].includes(el.dataset.act)) closePop();
  ACT[el.dataset.act]?.(el.dataset.arg, el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'cq') { ui.q = e.target.value; applyFilter(); $('#sbody').scrollTop = 0; }
  if (e.target.id === 'kfVal') { keyForm.val = e.target.value; if (keyForm.bad && keyForm.val) { keyForm.bad = false; e.target.classList.remove('bad'); const s = document.querySelector('.kfoot span'); s.className = ''; s.textContent = '粘贴后按回车或点"保存"'; } }
});
document.addEventListener('change', e => {
  if (e.target.id === 'kfProv') keyForm.prov = e.target.value;
  if (e.target.id === 'piDbg') setPi(e.target.value);
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); if (!ui.open) openSettings(); else if (ui.v === 'c') $('#cq')?.focus(); return; }
  if (e.key === 'Escape') {
    if (popEl) { closePop(); return; }
    if (!ui.open) return;
    if (ui.v === 'c' && ui.q && document.activeElement?.id === 'cq') { ACT.clearQ(); return; }
    if (keyForm && document.activeElement?.id === 'kfVal') { ACT.keyCancel(); return; }
    if (ui.v === 'a' || ui.v === 'c') closeSettings();
  }
  if (e.key === 'Enter' && document.activeElement?.id === 'kfVal') ACT.keySave();
});
document.addEventListener('scroll', e => { if (popEl && e.target.id === 'sbody') closePop(); }, true);
addEventListener('resize', closePop);

// ══ 14. 启动：默认直接打开设置，方便挑方案 ═══════════════════════════════════
renderWorkbench();
applyTheme(false);
openSettings(true);
</script>
