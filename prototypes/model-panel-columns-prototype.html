<!doctype html>
<!--
  PROTOTYPE — throwaway. 输入框里的模型面板：从"所有服务商的模型平铺成一长列"改成两列，
  左边一列很窄、只列服务商，右边列这个服务商的全部模型。
  现状：340px 宽的面板，服务商小标题 + 模型一行行往下排，服务商多、模型多时要滚很久才找到。
  三版只在左列的样子上不同，右列和下面的推理强度相同：
  A 图标栏：左列 44px，只有服务商的官方图标，悬停说名字。最窄。
  B 名字栏：左列 120px，图标 + 名字。一眼能读，最宽。
  C 竖排：左列 60px，图标下面一行小字名字，像程序坞。折中。
  共同规则：打开时左列选中当前模型的服务商；当前模型所在的服务商图标右上有一个 --tint 小点；
  右列顶上写服务商名和模型数，高度固定，换服务商时面板不跳；点模型即选中、面板关闭。
  顶部浮条切版本（也可 ?variant=A|B|C、键盘 ← →）、浅色 / 深色、左列点选还是悬停就切。
  颜色、字号取自 packages/ui/src/design/tokens.css；服务商图标是 design/brand 里的官方图标，
  其他图标是 Hugeicons 免费版，从 @hugeicons/core-free-icons 直接生成。
-->
<html lang="zh-CN">

    <style>

        --text: #1d1d1f;
        --text-2: #2c2c30;
        --text-3: #48484e;
        --text-muted: #6e6e74;
        --text-dim: #a1a1a7;
        --line: rgba(0, 0, 0, 0.08);

        --hover: rgba(0, 0, 0, 0.035);

        --tint: #2f6fed;
        --linked: rgba(47, 111, 237, 0.1);
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, 0.14);

        --chip-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.09), 0 1px 2px rgba(0, 0, 0, 0.05);
        --page: #eef1f6;
        --bar: rgba(255, 255, 255, 0.92);

        --font-sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
        --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
        --fs: 14px;
        --fs-meta: 13px;
        --fs-sm: 12px;
        --fs-xs: 11px;
        --r-sm: 6px;
        --r: 8px;
        --r-md: 10px;
        --r-btn: 12px;
        --r-card: 16px;
        --r-bubble: 22px;
        --r-pill: 999px;
      }
      :root[data-theme="dark"] {
        --main: #151517;
        --surface-1: #212123;
        --surface-2: #2c2c2e;
        --surface-3: #353638;
        --text: #f9fafb;
        --text-2: #e7e9ec;
        --text-3: #cfd3d6;
        --text-muted: #adb2b8;
        --text-dim: #81858c;
        --line: rgba(255, 255, 255, 0.1);
        --line-soft: rgba(255, 255, 255, 0.06);

        --linked: rgba(122, 170, 255, 0.14);
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 16px 40px rgba(0, 0, 0, 0.45);
        --card-shadow: 0 0 0 0.5px var(--line), 0 9px 27px rgba(41, 70, 122, 0.2);
        --chip-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.1), 0 1px 2px rgba(0, 0, 0, 0.3);

      * {

      }
      body {

        background: var(--page);
        font: var(--fs)/1.5 var(--font-sans);
        color: var(--text);

        padding-bottom: 40px;
      }
      header.page {
        padding: 24px 40px 4px;
        max-width: 1100px;
      }
      header.page h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      header.page p {
        margin: 0 0 4px;
        color: var(--text-muted);
        font-size: var(--fs-meta);
      }
      .stage {

      }
      .win {

        height: 720px;

        background: var(--surface-2);

        border-right: 0.5px solid var(--line);
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .tabs {
        height: 44px;
        border-bottom: 0.5px solid var(--line);
        flex: none;
      }

        padding: 28px 0;
        display: flex;
        flex-direction: column;

      .talk .u {

        padding: 8px 14px;

      }
      .talk .a {

        border-radius: 6px;
        background: var(--surface-3);
      }
      .composer {

        margin: 0 auto 52px;
        width: calc(100% - 48px);
        max-width: 672px;
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
        border-radius: var(--r-bubble);
        padding: 20px 14px 14px 20px;
        flex: none;
      }
      .composer .ph {
        color: var(--text-dim);
        font-size: var(--fs-meta);
        height: 44px;
      }
      .composer .foot {

        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }
      .chipbtn {
        all: unset;
        cursor: pointer;
        height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px 0 6px;
        border-radius: var(--r-pill);
        font-size: var(--fs-meta);
        color: var(--text-2);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .chipbtn:hover,

      }
      .chipbtn b {
        font-weight: 500;
      }
      .chipbtn small {
        color: var(--text-muted);
        font-size: var(--fs-sm);
      }
      .send {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--text);
        opacity: 0.2;
      }
      svg {
        display: block;
        flex: none;
      }
      .logo {
        border-radius: 6px;
        box-shadow: 0 0 0 0.5px var(--line);
        flex: none;
        display: block;
      }
      .letter {
        border-radius: 6px;
        background: var(--surface-3);
        color: var(--text-2);
        font-size: 10px;
        font-weight: 600;
        display: grid;
        place-items: center;
        flex: none;
      }

      /* 面板 */
      .panel {
        position: absolute;
        right: 52px;
        bottom: calc(100% - 46px + 8px);
        z-index: 5;
        background: var(--popover);
        border-radius: var(--r-card);
        box-shadow: var(--float-shadow);
        padding: 8px;
        color: var(--text-2);
        animation: pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.15);
        transform-origin: bottom right;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.97) translateY(4px);

      .ph-row {

      .prov {

        color: var(--text);

        gap: 8px;
        padding: 0 8px;
        font-size: var(--fs-meta);

      .vB .pv .cur {

        flex: none;
        box-shadow: none;

      /* C 竖排 */

      .vC .prov {

      }
      .vC .pv {
        width: 60px;
        height: 52px;

        justify-content: center;
        gap: 4px;
      }

        line-height: 12px;
        max-width: 54px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .vC .pv .cur {
        top: 6px;
        right: 12px;

        position: fixed;
        z-index: 30;
        pointer-events: none;
        background: var(--popover);
        box-shadow: var(--float-shadow);
        border-radius: var(--r-sm);
        padding: 3px 8px;
        font-size: var(--fs-xs);
        color: var(--text-2);
        white-space: nowrap;

        top: 12px;
        margin: 10px 40px 0;
        width: max-content;
        display: flex;
        gap: 14px;

      .seg button {

        padding: 3px 12px;

        color: var(--text-muted);

        background: var(--surface-1);
        color: var(--text);

      .state {
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--text-muted);
        padding: 0 40px;
      }
    </style>
  </head>

            ["GLM-5.2 Air", "128K", "96K", false, false],
          ],
        },
      ];
      const state = {
        variant: new URLSearchParams(location.search).get("variant") || "A",
        theme: "light",
        sw: "click",
        open: true,
        cur: ["anthropic", "Claude Opus 5.5"],
        prov: null,
        level: 2,
      };
      const DESC = {
        A: "A 图标栏：左列 44px，只放服务商的官方图标，悬停说名字；面板 372px，只比现在宽 32px。最窄，但要认图标（同一图标的 OpenAI 和 ChatGPT 订阅、Kimi 和 Kimi Coding 只能靠悬停分）。",
        B: "B 名字栏：左列 150px，图标 + 名字（“GitHub Copilot”“ChatGPT 订阅”都放得下），一眼能读；面板 480px。最清楚，最宽。",
        C: "C 竖排：左列 60px，图标下面一行 10px 小字名字，像程序坞；面板 392px。折中，长名字会被截断（GitHub Copilot → GitHub Co…）。",
      };
      const logo = (p, s) =>
        p.logo
          ? `<img class="logo" src="${p.logo}" width="${s}" height="${s}" alt="">`
          : `<span class="letter" style="width:${s}px;height:${s}px">${p.id[0].toUpperCase()}</span>`;
      const LEVELS = ["低", "中", "高", "最高"];
      function render() {
        document.documentElement.dataset.theme = state.theme;
        document.body.className = "v" + state.variant;
        document.getElementById("desc").textContent = DESC[state.variant];
        const curP = P.find((p) => p.id === state.cur[0]);
        const chip = document.getElementById("chip");
        chip.className = "chipbtn" + (state.open ? " open" : "");
        chip.innerHTML = `${logo(curP, 20)}<b>${state.cur[1]}</b><small>${LEVELS[state.level]}</small>${ic("ArrowDown01Icon", 10, 'style="color:var(--text-dim)"')}`;
        document.querySelector(".panel")?.remove();
        if (state.open) {
          const shownId = state.prov ?? state.cur[0];
          const shown = P.find((p) => p.id === shownId);
          const big = state.variant === "C" ? 22 : state.variant === "A" ? 22 : 18;
          const prov = P.map(
            (p) =>
              `<button class="pv${p.id === shownId ? " on" : ""}" data-p="${p.id}" data-name="${p.name}" aria-label="${p.name}">${logo(p, big)}<span class="nm">${p.name}</span>${p.id === state.cur[0] ? '<span class="cur" title="当前模型在这里"></span>' : ""}</button>`,
          ).join("");
          const models = shown.models
            .map(([name, ctx, out, img, fast]) => {
              const on = state.cur[0] === shown.id && state.cur[1] === name;
              return `<button class="md${on ? " on" : ""}" data-m="${name}"><span class="tx"><b>${name}${fast ? ic("FlashIcon", 11, 'class="bolt" fill="currentColor"') : ""}</b><small>上下文 ${ctx} · 输出 ${out}${img ? " · 支持图片" : ""}</small></span><span class="ck">${on ? ic("Tick02Icon", 13) : ""}</span></button>`;
            })
            .join("");
          const el = document.createElement("div");
          el.className = "panel";
          el.innerHTML = `
      <div class="ph-row"><span>模型</span><span class="r">⌘⇧I<button class="iconbtn" title="让 pi 重新读取模型列表">${ic("ReloadIcon", 12)}</button></span></div>
      <div class="cols"><div class="prov">${prov}</div><div class="models"><div class="mh"><b>${shown.name}</b>${shown.models.length} 个模型</div>${models}</div></div>
      <div class="hr"></div>
      <div class="ph-row"><span>推理强度 · 按住左右拖动</span><span>⌘⇧E · ←→</span></div>
      <div class="effort">${LEVELS.map((l, i) => `<span class="${i === state.level ? "on" : ""}" data-l="${i}">${l}</span>`).join("")}</div>`;
          document.getElementById("composer").appendChild(el);
        }
        document.getElementById("state").textContent = JSON.stringify({
          variant: state.variant,
          theme: state.theme,
          左列切换: state.sw === "click" ? "点选" : "悬停",
          面板: state.open ? "开" : "关",
          左列选中: state.prov ?? state.cur[0],
          当前模型: state.cur.join("/"),
          推理强度: LEVELS[state.level],
        });
        seg(
          "variants",
          [
            ["A", "A 图标栏"],
            ["B", "B 名字栏"],
            ["C", "C 竖排"],
          ],
          state.variant,
          "variant",
        );
        seg(
          "themes",
          [
            ["light", "浅色"],
            ["dark", "深色"],
          ],
          state.theme,
          "theme",
        );
        seg(
          "switch",
          [
            ["click", "点选切换"],
            ["hover", "悬停切换"],
          ],
          state.sw,
          "sw",
        );
      }
      function seg(id, items, on, key) {
        document.getElementById(id).innerHTML = items
          .map(([v, l]) => `<button class="${v === on ? "on" : ""}" data-${key}="${v}">${l}</button>`)
          .join("");
      }
      let tip = null;
      function hideTip() {
        tip?.remove();
        tip = null;
      }
      document.addEventListener("click", (e) => {
        const t = e.target.closest("button, [data-l]");
        if (!t) return;
        const d = t.dataset;
        if (t.id === "chip") {
          state.open = !state.open;
          state.prov = null;
        } else if (d.p) state.prov = d.p;
        else if (d.m) {
          state.cur = [state.prov ?? state.cur[0], d.m];
          state.open = false;
          state.prov = null;
          hideTip();
        } else if (d.l) state.level = +d.l;
        else if (d.variant) state.variant = d.variant;
        else if (d.theme) state.theme = d.theme;
        else if (d.sw) state.sw = d.sw;
        else return;
        render();
      });
      document.addEventListener("mouseover", (e) => {
        const pv = e.target.closest(".pv");
        hideTip();
        if (!pv) return;
        if (state.sw === "hover" && state.prov !== pv.dataset.p && (state.prov ?? state.cur[0]) !== pv.dataset.p) {
          state.prov = pv.dataset.p;
          render();
        }
        if (state.variant === "A") {
          const box = document.querySelector(`.pv[data-p="${pv.dataset.p}"]`).getBoundingClientRect();
          tip = document.createElement("div");
          tip.className = "tip";
          tip.textContent = pv.dataset.name;
          tip.style.left = box.left - 8 + "px";
          tip.style.top = box.top + box.height / 2 - 11 + "px";
          tip.style.transform = "translateX(-100%)";
          document.body.appendChild(tip);
        }
      });
      document.addEventListener("keydown", (e) => {
        const order = ["A", "B", "C"];
        const i = order.indexOf(state.variant);
        if (e.key === "ArrowRight") {
          state.variant = order[(i + 1) % 3];
          render();
        }
        if (e.key === "ArrowLeft") {
          state.variant = order[(i + 2) % 3];
          render();
        }
      });
      render();
    </script>
  </body>
</html>
