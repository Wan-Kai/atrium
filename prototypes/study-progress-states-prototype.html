<!doctype html>
<!--
  PROTOTYPE — 设计稿，不接入生产构建。ML2（SPEC-0008）里设计稿还没画到的五处，每处 4 种做法，按字母选。

  已定的前提（2026-11-05 / 09 用户）：
  · 步骤条选 C：标签栏下面常驻一条，高 40px，8px 的点（课方点，后面几步圆点），右端下一步按钮。
  · 方向主页按 study-mode-flow-prototype.html 的 C：标题 + 当前步骤卡 + 这一级的全部步骤 | 右栏阶梯、漏洞、其他会话、档案。
  · 手动标完成：只能标没完成的；只有手动标的能撤回；之后 agent 报告同一步，以 agent 的为准。
  · 能手动标的小步只有"上课""测验"；补漏看漏洞，手动是在漏洞上"标为已补"。标测验时上课一起标上。
  · "以后再测"：这一步算完成、测验记为没测，之后可以从这一步补测。
  · 有会话正对着当前这一步时，按钮是"回到这个会话"（不论在不在跑）。
  · 测验、费曼、升级的会话在 ML3 才做：ML2 里这些按钮显示出来但不能点。
  · 归档的方向：步骤条只显示，没有按钮；已学完：没有主按钮；档案读不出来：没有按钮。
  · 窄窗口时两栏变一栏。

  这里只比较还没定的样子；每种做法左边浅色、右边深色。
  图标：Hugeicons 免费版 stroke-rounded（4.3.5，路径照抄），文件类型图标是 material-icon-theme 5.39.0 的原图。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原型 · 学习进度的几种状态</title>
    <style>
      :root,
      .th-light {
        --window: #e8ecf2;
        --main: #ffffff;
        --surface-1: #ffffff;
        --surface-2: #f2f2f4;
        --surface-3: #e9e9ec;
        --code: #f6f6f8;
        --text: #1d1d1f;
        --text-2: #2c2c30;
        --text-3: #48484e;
        --text-muted: #6e6e74;
        --text-dim: #a1a1a7;
        --line: rgba(0, 0, 0, 0.08);
        --line-strong: rgba(0, 0, 0, 0.14);
        --hover: rgba(0, 0, 0, 0.035);
        --selected: rgba(0, 0, 0, 0.06);
        --rail: rgba(0, 0, 0, 0.15);
        --node: #c4c4c9;
        --tint: #2f6fed;
        --on-tint: #ffffff;
        --linked: rgba(47, 111, 237, 0.1);
        --attn: #dd8629;
        --attn-text: #c96509;
        --attn-soft: rgba(221, 134, 41, 0.12);
        --danger: #e5484d;
        --ok: #16a34a;
        --ok-text: #1e8e3e;
        --chip-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.09), 0 1px 2px rgba(0, 0, 0, 0.05);
        --card-shadow: 0 0 0 0.5px var(--line), 0 9px 27px rgba(41, 70, 122, 0.08);
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, 0.14);
        --font-sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
        --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
        --fs: 14px;
        --fs-meta: 13px;
        --fs-sm: 12px;
        --fs-xs: 11px;
        --fs-mono: 12.5px;
        --r-sm: 6px;
        --r: 8px;
        --r-md: 10px;
        --r-btn: 12px;
        --r-card: 16px;
        color-scheme: light;
      }
      .th-dark {
        --window: #0d1016;
        --main: #151517;
        --surface-1: #212123;
        --surface-2: #2c2c2e;
        --surface-3: #353638;
        --code: #19191b;
        --text: #f9fafb;
        --text-2: #e7e9ec;
        --text-3: #cfd3d6;
        --text-muted: #adb2b8;
        --text-dim: #81858c;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.16);
        --hover: rgba(255, 255, 255, 0.05);
        --selected: rgba(255, 255, 255, 0.08);
        --rail: rgba(255, 255, 255, 0.15);
        --node: #5d6067;
        --tint: #7aaaff;
        --on-tint: #0d1016;
        --linked: rgba(122, 170, 255, 0.14);
        --attn: #dd8629;
        --attn-text: #f0a24e;
        --attn-soft: rgba(221, 134, 41, 0.16);
        --danger: #f25a5a;
        --ok: #22c55e;
        --ok-text: #4ade80;
        --chip-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.1), 0 1px 2px rgba(0, 0, 0, 0.3);
        --card-shadow: 0 0 0 0.5px var(--line), 0 9px 27px rgba(41, 70, 122, 0.2);
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 22px 28px 64px;
        background: #e8ecf2;
        color: #2c2c30;
        font:
          14px / 1.5 -apple-system,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        color: inherit;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      svg.i.s12 {
        width: 12px;
        height: 12px;
      }
      svg.i.s13 {
        width: 13px;
        height: 13px;
      }
      svg.i.s14 {
        width: 14px;
        height: 14px;
      }
      .ft {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
      }

      /* ---------- 页面框架 ---------- */
      .doc-head h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #1d1d1f;
      }
      .doc-head p {
        margin: 6px 0 0;
        max-width: 900px;
        color: #6e6e74;
        font-size: 13px;
      }
      .toc {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 14px 0 0;
      }
      .toc a {
        padding: 4px 10px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.1);
        color: #2c2c30;
        text-decoration: none;
        font-size: 12px;
      }
      .part {
        margin-top: 44px;
      }
      .part > h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        color: #1d1d1f;
      }
      .part > .why {
        margin: 4px 0 0;
        max-width: 900px;
        font-size: 13px;
        color: #6e6e74;
      }
      .opt {
        margin-top: 22px;
      }
      .opt > .oh {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 14px;
        color: #1d1d1f;
      }
      .opt > .oh .letter {
        display: inline-grid;
        place-items: center;
        min-width: 30px;
        height: 22px;
        padding: 0 6px;
        border-radius: 6px;
        background: #1d1d1f;
        color: #fff;
        font-weight: 700;
        font-size: 12px;
      }
      .opt > .oh b {
        font-weight: 600;
      }
      .opt > .od {
        margin: 4px 0 0 40px;
        max-width: 900px;
        font-size: 12.5px;
        color: #6e6e74;
      }
      .pair {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 10px;
      }
      .frame {
        padding: 16px;
        border-radius: 14px;
        background: var(--window);
        color: var(--text-2);
        font: var(--fs) / 1.5 var(--font-sans);
      }
      .frame > .fl {
        margin: 0 0 8px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .win {
        position: relative;
        border-radius: 12px;
        background: var(--main);
        box-shadow: var(--card-shadow);
        overflow: hidden;
      }
      .win.open {
        overflow: visible;
      }
      .pad {
        padding: 16px 18px 18px;
      }
      .cap {
        margin: 12px 0 6px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .cap:first-child {
        margin-top: 0;
      }

      /* ---------- 共用部件（同 study-mode-flow-prototype C） ---------- */
      .muted {
        color: var(--text-muted);
      }
      .dim {
        color: var(--text-dim);
      }
      .tabbar {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 12px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        overflow: hidden;
      }
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 8px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
        white-space: nowrap;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 10px;
        border-radius: var(--r);
        font-size: var(--fs-meta);
        color: var(--text-muted);
        white-space: nowrap;
      }
      .tab.on {
        background: var(--selected);
        color: var(--text);
      }
      .tab.home .i {
        color: var(--tint);
      }
      .ibtn {
        all: unset;
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: var(--r);
        color: var(--text-muted);
      }
      .ibtn.on {
        background: var(--selected);
        color: var(--text);
      }
      .run {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid var(--tint);
        border-right-color: transparent;
        animation: spin 0.9s linear infinite;
        flex: 0 0 auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .run {
          animation: none;
        }
      }
      .btn {
        all: unset;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px;
        border-radius: var(--r-btn);
        font-size: var(--fs-meta);
        white-space: nowrap;
        cursor: default;
      }
      .btn.primary {
        background: var(--tint);
        color: var(--on-tint);
        font-weight: 600;
      }
      .btn.ghost {
        box-shadow: inset 0 0 0 0.5px var(--line-strong);
        color: var(--text-2);
      }
      .btn.outline {
        box-shadow: inset 0 0 0 1px var(--tint);
        color: var(--tint);
        font-weight: 500;
      }
      .btn.textbtn {
        color: var(--text-muted);
        padding: 0 8px;
      }
      .btn.sm {
        height: 26px;
        padding: 0 10px;
        border-radius: 9px;
      }
      .btn.xs {
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: var(--fs-sm);
      }
      .btn[disabled],
      .btn.off {
        opacity: 0.42;
      }
      .btn.locked {
        background: var(--surface-2);
        color: var(--text-dim);
        font-weight: 500;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 7px;
        border-radius: var(--r-sm);
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: var(--fs-sm);
        font-weight: 500;
        white-space: nowrap;
      }
      .tag.attn {
        background: var(--attn-soft);
        color: var(--attn-text);
      }
      .tag.tint {
        background: var(--linked);
        color: var(--tint);
      }
      .tag.ok {
        background: color-mix(in srgb, var(--ok) 12%, transparent);
        color: var(--ok-text);
      }
      .tag.xs {
        height: 17px;
        padding: 0 5px;
        font-size: var(--fs-xs);
        border-radius: 5px;
      }
      .card {
        border-radius: var(--r-card);
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
      }

      /* 步骤条 */
      .strip {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 16px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        font-size: var(--fs-sm);
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .strip .lvl {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--text-2);
        font-weight: 500;
      }
      .strip .trk {
        display: inline-flex;
        gap: 3px;
      }
      .strip .trk i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--line-strong);
      }
      .strip .trk i.done {
        background: var(--text-muted);
      }
      .strip .trk i.cur {
        background: var(--tint);
      }
      .strip .trk i.x {
        border-radius: 50%;
      }
      .strip .trk.faded {
        opacity: 0.45;
      }
      .strip .trk.grey i.cur {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--text-muted);
      }
      .strip .trk.hatch i {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .strip .trk.all i {
        background: var(--tint);
      }
      .strip .now {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .strip .now b {
        color: var(--text);
        font-weight: 500;
      }
      .strip .sp {
        flex: 1;
      }
      .strip .warn {
        color: var(--attn-text);
      }
      .strip .okc {
        color: var(--ok-text);
      }
      .strip-label {
        padding: 8px 16px 0;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .live {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
      }

      /* 步骤列表 */
      .lessons {
        padding: 4px;
        border-radius: 12px;
        background: var(--code);
      }
      .lesson {
        position: relative;

      }
      .lesson .lh {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 32px;
        padding: 0 6px 0 10px;
        font-size: var(--fs-meta);
        color: var(--text-3);
      }
      .lesson .no {
        width: 18px;
        color: var(--text-dim);
        font-size: var(--fs-sm);
        flex: 0 0 auto;
      }
      .lesson .no.kd {
        display: inline-flex;
      }
      .lesson .ok {
        color: var(--ok-text);
        display: inline-flex;
      }
      .lesson .okm {
        color: var(--text-muted);
        display: inline-flex;
      }
      .lesson .t {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lesson .m {
        color: var(--text-dim);
        font-size: var(--fs-sm);
        white-space: nowrap;
      }
      .lesson .m.attn {
        color: var(--attn-text);
      }
      .lesson.next {
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);

      .lesson.next .lh {
        color: var(--text);
      }
      .lesson.next .no {

      }
      .lesson.todo .lh {
        color: var(--text-dim);
      }
      .lesson.hover {
        background: var(--hover);
      }
      .lesson .more {
        width: 24px;
        height: 24px;
      }
      .sess {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 0 10px 8px 38px;
      }
      .schip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;

        box-shadow: var(--chip-shadow);

        white-space: nowrap;

      .schip .i {
        color: var(--text-muted);
      }
      .schip .s {

      .schip.manual {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-strong);
        border: 0;
        color: var(--text-muted);
        background-image: none;
        outline: 1px dashed var(--line-strong);
        outline-offset: -1px;
        box-shadow: none;
      }
      .inline-link {
        font-size: var(--fs-sm);
        color: var(--tint);
      }
      .subd {
        display: inline-flex;
        gap: 2px;
        flex: 0 0 auto;
      }
      .subd i {
        width: 5px;
        height: 5px;
        border-radius: 1.4px;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .subd i.d {
        background: var(--text-muted);
        box-shadow: none;
      }
      .subd i.g {
        background: var(--attn);
        box-shadow: none;
      }
      .subd i.m {
        background: transparent;
        box-shadow: inset 0 0 0 1.25px var(--text-muted);
      }
      .subd i.n {
        background: transparent;
        box-shadow: none;
        outline: 1px dashed var(--text-dim);
        outline-offset: -1px;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: 8px;
        background: var(--surface-2);
      }
      .seg span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 7px;
        border-radius: 6px;
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .seg span.on {
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        color: var(--text);
      }
      .seg span.mine {
        background: var(--surface-1);
        color: var(--text-2);

      .roundchk {
        display: inline-grid;
        place-items: center;

        border-radius: 50%;
        box-shadow: inset 0 0 0 1px var(--line-strong);

      /* 菜单 */
      .menu {
        position: absolute;
        z-index: 5;
        min-width: 188px;
        padding: 4px;
        border-radius: var(--r-md);
        background: var(--surface-1);
        box-shadow: var(--float-shadow);
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .menu.flow {
        position: relative;
        margin: 2px 4px 8px auto;

      }
      .menu .mi {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 8px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .menu .mi.hl {
        background: var(--selected);
      }
      .menu .mi .k {
        margin-left: auto;
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }
      .menu .mi.dis {
        color: var(--text-dim);
      }
      .menu .mi .ck {
        width: 14px;
        display: inline-flex;
        color: var(--text-muted);
      }
      .menu .sep {
        height: 0.5px;
        margin: 4px 6px;
        background: var(--line);
      }
      .menu .mh {
        padding: 4px 8px 2px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .menu .note {
        padding: 2px 8px 6px;
        font-size: var(--fs-xs);
        color: var(--text-dim);

        display: flex;
        justify-content: flex-end;

        padding: 6px 4px 2px;

        width: 14px;
        height: 14px;
        border-radius: 4px;

        place-items: center;
        flex: 0 0 auto;
      }
      .box.on {
        background: var(--tint);
        color: var(--on-tint);
        box-shadow: none;
      }
      .box.agent {
        background: var(--surface-3);
        color: var(--text-muted);
        box-shadow: none;
      }
      .box.ok {
        background: var(--ok);
        color: #fff;
        box-shadow: none;
      }
      .tip {
        position: absolute;
        z-index: 6;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--text);
        color: var(--main);
        font-size: var(--fs-xs);
        white-space: nowrap;
      }

      /* 主页 */
      .ptitle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
      }

                  { i: "Idea01", t: "跑费曼", dis: true, k: "下一版" },
                  { i: "CheckmarkCircle02", t: "标为已补", hl: true },
                ])}${gapRow(GAPS[1])}${gapRow(GAPS[2], { fixed: true, act: `<span class="tag xs">你标的</span>` })}</div>`,
              ),
          },
          {
            L: "3D",
            name: "整理模式：一次标几条",
            desc: "漏洞标题右边一个“标已补”文字按钮，点了每条前面出勾选框，勾好点“完成”；撤回也在这个模式里取消勾。平时卡片和现在一样干净。",
            w: 300,
            build: () =>
              `<div class="win" style="width:300px"><div class="pad"><div class="sect" style="margin-top:0"><div class="h"><span>漏洞 · 勾上已经弄懂的</span><span class="btn textbtn xs">取消</span><span class="btn primary xs">完成</span></div><div class="card">${gapRow(GAPS[0], { lead: `<span class="box on cb">${ic("Tick02", "s12")}</span>` })}${gapRow(GAPS[1], { lead: `<span class="box cb"></span>` })}${gapRow(GAPS[2], { fixed: true, lead: `<span class="box on cb">${ic("Tick02", "s12")}</span>`, src: "认证 · 测验第 5 题 · 你标的" })}</div></div><p class="cap" style="margin-top:10px">平时：</p><div class="sect" style="margin-top:0"><div class="h"><span>漏洞</span><span class="btn textbtn xs">标已补</span></div></div></div></div>`,
          },
        ],
      };

      /* =====================================================================
         4 · "以后再测"的一步，和之后补测
         ===================================================================== */
      const P4 = {
        title: "4 · “以后再测”的一步，和之后从哪补测",
        why: "上完课点了“以后再测”：这一步算完成，往下走；测验记为没测。之后要能从这一步补测（补测的会话在 ML3 才能开）。这里第 3 步“事务”是以后再测的。",
        opts: [
          {
            L: "4A",
            name: "照常打勾，第二个小点是虚线，行尾“没测”",
            reco: true,
            desc: "步骤照常打勾；三个小点里测验那个是虚线空心；行尾灰字“没测”，悬停时换成一个小按钮“补测”。",
            w: 520,
            build: () =>
              `<div class="win"><div class="pad"><div class="lessons">${row(1, { state: "done", tick: "ok", sub: "ddd", below: `<div class="sess">${chip("lesson", "上课")}${chip("quiz", "测验", "36/50")}</div>` })}${row(
                2,
                {
                  state: "done",
                  tick: "ok",
                  sub: "dn-",
                  cls: "hover",
                  right: `<button class="btn ghost xs">${ic("Quiz01", "s12")}补测</button>`,
                  below: `<div class="sess">${chip("lesson", "上课")}</div>`,
                },
              )}${nextRow()}</div><p class="cap" style="margin-top:8px">不悬停时行尾是灰字：</p><div class="lessons">${row(2, { state: "done", tick: "ok", sub: "dn-", right: `<span class="m">没测</span>`, below: `<div class="sess">${chip("lesson", "上课")}</div>` })}</div></div></div>`,
          },
          {
            L: "4B",
            name: "不打勾，挂一枚“待测”",
            desc: "这一步不画绿勾，换成钟表图标和一枚橙色“待测”小签；当前步骤卡下面多一行“第 3 步还没测 · 补测验”。",
            w: 520,
            build: () =>
              `<div class="win"><div class="pad">${hero(`<span style="display:inline-flex;color:var(--attn-text)">${ic("Clock01", "s14")}</span>第 3 步“事务”还没测<span style="flex:1"></span><button class="btn ghost xs">补测验</button>`)}<div class="lessons" style="margin-top:14px">${row(1, { state: "done", tick: "ok", sub: "ddd" })}${row(
                2,
                {
                  state: "done",
                  right: `<span class="tag xs attn">待测</span>`,
                  t: "事务",
                  sub: "dn-",
                },
              ).replace(
                '<span class="t">',
                `<span class="okm" style="color:var(--attn-text)">${ic("Clock01", "s14")}</span><span class="t">`,
              )}${nextRow()}</div></div></div>`,
          },
          {
            L: "4C",
            name: "右栏单列“还没测的课”",
            desc: "步骤照常打勾、行尾“没测”；右栏漏洞上面多一小块“还没测的课”，每条一个“测验”按钮。几步都没测时一眼看全。",
            w: 560,
            build: () =>
              `<div class="win"><div class="pad"><div class="twocol" style="grid-template-columns:minmax(0,1fr) 190px"><div><div class="lessons">${row(1, { state: "done", tick: "ok", sub: "ddd" })}${row(2, { state: "done", tick: "ok", sub: "dn-", right: `<span class="m">没测</span>` })}${nextRow()}</div></div><div>${sect(
                "还没测的课",
                `<div class="card">${`<div class="gap-row"><span class="body"><span class="tx">第 3 步 · 事务</span><span class="src">11月7日上完</span></span><button class="btn ghost xs">测验</button></div>`}</div>`,
              ).replace(
                'class="sect"',
                'class="sect" style="margin-top:0"',
              )}${sect("漏洞", `<div class="card">${gapRow(GAPS[0])}</div>`)}</div></div></div></div>`,
          },
          {
            L: "4D",
            name: "只在“···”里",
            desc: "步骤照常打勾，行尾一行很淡的“没测”；补测放在这一步的“···”菜单里（开始测验），平时不占地方。",
            w: 520,
            build: () =>
              `<div class="win open"><div class="pad"><div class="lessons">${row(1, { state: "done", tick: "ok", sub: "ddd" })}${row(
                2,
                {
                  state: "done",
                  tick: "ok",
                  sub: "dn-",
                  right: `<span class="m" style="opacity:.7">没测</span>${more(true)}`,
                  below: `<div class="sess">${chip("lesson", "上课")}</div>`,
                },
              )}${menu("flow", [{ i: "Quiz01", t: "开始测验", hl: true, k: "下一版" }, "-", { i: "Tick02", t: "标测验完成" }])}${nextRow()}</div></div></div>`,
          },
        ],
      };

      /* =====================================================================
         5 · 窄窗口的主页，和展开的阶梯一行
         ===================================================================== */
      const narrowWin = (body, overlay = "") =>
        `<div class="win" style="height:760px;display:flex;flex-direction:column"><div style="flex:0 0 auto">${tabbar([["lesson", "上课 · 第 3 步"]])}${normalStrip()}</div><div style="flex:1;overflow:hidden;position:relative"><div style="padding:20px 18px">${body}</div></div>${overlay}</div>`;
      const stepsShort = () => `<div class="lessons">${doneRows()}${nextRow()}${row(4)}${row(5)}</div>`;
      const P5 = {
        title: "5 · 窄窗口的主页，和展开的阶梯一行",
        why: "窗口窄到放不下右栏时（这里 480px 宽的主区）两栏变一栏；阶梯每一级点开能看到“学什么、怎样算过关、状态”。宽窗口的阶梯展开和这里同一种做法。",
        opts: [
          {
            L: "5A",
            name: "一栏顺着排，阶梯在行内展开",
            desc: "顺序：标题 → 当前步骤卡 → 阶梯 → 这一级的步骤 → 漏洞 → 其他会话 → 档案。阶梯一行点开，在它下面展开三小段文字。",
            w: 480,
            build: () =>
              narrowWin(
                `${head()}<div style="margin-top:16px">${hero()}</div>${sect("阶梯 · 4 级", ladderList(1, "inline"))}${sect("第 2 级的步骤", stepsShort())}`,
              ),
          },
          {
            L: "5B",
            name: "当前步骤卡下面分页签",
            desc: "当前步骤卡下面一组分段页签：步骤 / 阶梯 / 漏洞 / 档案（加其他会话），一次只看一样；阶梯一行悬停弹出小卡片说明。",
            w: 480,
            build: () =>
              `<div style="position:relative">${narrowWin(
                `${head()}<div style="margin-top:16px">${hero()}</div><div class="tabs-seg"><span>步骤<span class="n">13</span></span><span class="on">阶梯<span class="n">4</span></span><span>漏洞<span class="n">3</span></span><span>档案</span></div><div style="margin-top:12px">${ladderList(1, "none").replace('class="lvc  "', 'class="lvc"')}</div>`,
                `<div class="pop" style="left:170px;top:478px"><div class="t">第 2 级 · 数据和登录</div><div class="k" style="margin-top:4px">学什么</div>${LADDER[1].m}<div class="k" style="margin-top:4px">怎样算过关</div>${LADDER[1].pass}<div style="margin-top:6px"><span class="tag xs tint">第 4 / 13 步</span></div></div>`,
              )}</div>`,
          },
          {
            L: "5C",
            name: "右栏变成一排小卡，点开从下面升起",
            desc: "右栏收成标题下面一排横向的小卡（阶梯 4 级 · 当前第 2 级 / 漏洞 3 / 档案 5 个）；点一张，从窗口下面升起一张面板，阶梯在面板里，当前一级默认展开。",
            w: 480,
            build: () =>
              narrowWin(
                `${head()}<div class="sumcards"><div class="sumcard on"><b>${ic("Mortarboard02", "s14")}阶梯</b>4 级 · 当前第 2 级</div><div class="sumcard"><b>${ic("Alert02", "s14")}漏洞</b>3 个没补</div><div class="sumcard"><b>${FT.folder}档案</b>5 项</div></div><div style="margin-top:16px">${hero()}</div>${sect("第 2 级的步骤", stepsShort())}`,
                `<div class="sheet-scrim"></div><div class="sheet"><div class="sh">${ic("Mortarboard02", "s14")}阶梯 · 4 级<span class="ibtn">${ic("Cancel01", "s14")}</span></div>${ladderList(1, "card")}</div>`,
              ),
          },
          {
            L: "5D",
            name: "右栏折成几段可展开的标题",
            reco: true,
            desc: "步骤列表下面是几段可折叠的标题：阶梯 · 4 级 / 漏洞 · 3 / 其他会话 · 2 / 档案 · 5，默认只展开漏洞；阶梯一行点开，下面一张浅底小卡写学什么、过关、状态。宽窗口右栏的阶梯也用这张小卡。",
            w: 480,
            build: () => {
              const disc = (title, m, open, body = "") =>
                `<div class="disc ${open ? "open" : ""}"><div class="dh"><span class="chev">${ic("ArrowRight01", "s12")}</span>${title}<span class="m">${m}</span></div>${open ? `<div class="db">${body}</div>` : ""}</div>`;
              return narrowWin(
                `${head()}<div style="margin-top:16px">${hero()}</div>${sect("第 2 级的步骤", `<div class="lessons">${row(2, { state: "done", tick: "ok", sub: "ddg" })}${nextRow()}${row(4)}</div>`)}<div style="margin-top:14px">${disc("阶梯", "4 级 · 当前第 2 级", true, ladderList(1, "card"))}${disc("漏洞", "3 个没补", false)}${disc("其他会话", "2", false)}${disc("档案", "5 项", false)}</div>`,
              );
            },
          },
        ],
      };

      /* ---------- 渲染 ---------- */
      const PARTS = [P1, P2, P3, P4, P5];
      document.getElementById("toc").innerHTML = PARTS.map((p, k) => `<a href="#part-${k + 1}">${p.title}</a>`).join(
        "",
      );
      document.getElementById("parts").innerHTML = PARTS.map(
        (p, k) =>
          `<section class="part" id="part-${k + 1}"><h2>${p.title}</h2><p class="why">${p.why}</p>${p.opts
            .map(
              (o) =>
                `<div class="opt"><div class="oh"><span class="letter">${o.L}</span><b>${o.name}</b>${o.reco ? `<span class="reco">推荐</span>` : ""}</div><p class="od">${o.desc}</p>${pair(o.build, o.w)}</div>`,
            )
            .join("")}</section>`,
      ).join("");
    </script>
  </body>
</html>
