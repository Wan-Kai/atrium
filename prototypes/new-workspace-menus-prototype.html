<!doctype html>
<!--
  PROTOTYPE — throwaway. 新建工作区页的三个下拉（项目、工作区、起点）怎么做得不单薄。
  现状：每行一段纯文字，没有图标、没有选中标记、没有任何辅助信息。
  三版都只用现在已有的数据（不改协议）：项目的名字和路径；工作区的种类（本地 / worktree）、分支、
  合并状态（有没有未提交的改动、领先几个提交）、创建时间、会话数；起点的本地 / 远程分支、主分支、当前分支。
  A 两行：每行一个图标方块 + 名字 + 一行说明，像 macOS 的"打开最近"。
  B 单行：紧凑，一行一个，左边上色的图标，右边灰色的补充信息，选中打勾。
  C 面板：顶上搜索框，分组带数量，选中行有底色，底部键盘提示，像模型菜单。
  底部浮条切换版本（也可 ?variant=A|B|C、键盘 ← →）、浅色 / 深色、打开哪个菜单。
  颜色、字号取自 packages/ui/src/design/tokens.css；图标是 Hugeicons 免费版，从 @hugeicons/core-free-icons 直接生成。
-->

<title>原型 · 新建工作区页的下拉菜单</title>
<style>

  --tint: #2f6fed; --linked: rgba(47,111,237,.1); --attn: #dd8629; --attn-text: #c96509; --attn-soft: rgba(221,134,41,.12); --ok: #16a34a; --ok-text: #1e8e3e;
  --float-shadow: 0 0 0 .5px var(--line-strong), 0 12px 32px rgba(0,0,0,.14);

}
:root[data-theme=dark] {
  --main: #151517; --surface-1: #212123; --surface-2: #2c2c2e; --surface-3: #353638;

  --line: rgba(255,255,255,.1); --line-soft: rgba(255,255,255,.06); --line-strong: rgba(255,255,255,.16); --hover: rgba(255,255,255,.05); --selected: rgba(255,255,255,.08);
  --tint: #7aaaff; --linked: rgba(122,170,255,.14); --attn: #dd8629; --attn-text: #f0a24e; --attn-soft: rgba(221,134,41,.16); --ok: #22c55e; --ok-text: #4ade80;
  --float-shadow: 0 0 0 .5px var(--line-strong), 0 16px 40px rgba(0,0,0,.45);
  --card-shadow: 0 0 0 .5px var(--line), 0 9px 27px rgba(41,70,122,.2);

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); font: var(--fs)/1.5 var(--font-sans); color: var(--text); -webkit-font-smoothing: antialiased; padding-bottom: 110px; }
header.page { padding: 24px 40px 4px; max-width: 1040px; }
header.page h1 { font-size: 20px; margin: 0 0 6px; }
header.page p { margin: 0 0 4px; color: var(--text-muted); font-size: var(--fs-meta); }
.stage { padding: 14px 40px; }
.win { width: 1040px; height: 680px; background: var(--main); border-radius: var(--r-card); box-shadow: var(--card-shadow); overflow: hidden; display: flex; }

.row { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 24px 6px; display: flex; gap: 6px; align-items: center; }
.chip { all: unset; cursor: pointer; position: relative; height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--r-btn); font-size: var(--fs-meta); color: var(--text-2); white-space: nowrap; }

.chip .ic { color: var(--text-muted); }
.chip .car { color: var(--text-dim); }
.composer { margin: 0 auto 52px; width: calc(100% - 48px); max-width: 672px; background: var(--surface-1); box-shadow: var(--card-shadow); border-radius: var(--r-bubble); padding: 20px; color: var(--text-dim); font-size: var(--fs-meta); height: 100px; flex: none; }
svg { display: block; flex: none; }
.anchor { position: relative; }
.menu { position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 5; background: var(--float); border-radius: var(--r-btn); box-shadow: var(--float-shadow); padding: 4px; max-height: 420px; overflow-y: auto; animation: pop .22s cubic-bezier(.2,.9,.3,1.15); transform-origin: bottom left; }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(4px); } }
.mono { font-family: var(--font-mono); font-size: 12px; }
.tick { color: var(--tint); margin-left: auto; }
.sep { height: .5px; background: var(--line); margin: 4px 6px; }
.badge { font-size: var(--fs-xs); line-height: 16px; padding: 0 5px; border-radius: 4px; white-space: nowrap; }
.b-main { color: var(--tint); background: var(--linked); }
.b-cur { color: var(--text-muted); background: var(--surface-2); }
:root[data-theme=dark] .b-cur { background: var(--surface-3); }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.dirty { background: var(--attn); }
.dot.clean { background: var(--ok); }
.item { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; width: 100%; }
.item[aria-disabled=true] { cursor: not-allowed; color: var(--text-dim) !important; }
.head { font-size: var(--fs-sm); color: var(--text-dim); padding: 6px 10px 4px; display: flex; gap: 6px; }

/* ---------- A 两行 ---------- */
.vA .menu { width: 320px; }
.vA .item { gap: 10px; padding: 6px 8px; border-radius: var(--r-md); }
.vA .item:hover { background: var(--hover); }
.vA .tile { width: 30px; height: 30px; border-radius: var(--r); background: var(--surface-2); display: grid; place-items: center; color: var(--text-muted); flex: none; }
:root[data-theme=dark] .vA .tile { background: var(--surface-3); }
.vA .tile.new { background: var(--linked); color: var(--tint); }
.vA .tx { min-width: 0; display: flex; flex-direction: column; }
.vA .t1 { font-size: var(--fs-meta); color: var(--text-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.vA .t2 { font-size: var(--fs-sm); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vA .t2 .dot { display: inline-block; margin-right: 5px; vertical-align: 1px; }
.vA .item.on .t1 { color: var(--text); font-weight: 500; }
.vA .base .item { padding: 5px 8px; }
.vA .search { display: flex; align-items: center; gap: 8px; margin: 2px 2px 4px; padding: 0 10px; height: 32px; border-radius: var(--r); background: var(--surface-2); color: var(--text-dim); font-size: var(--fs-meta); }
:root[data-theme=dark] .vA .search { background: var(--surface-3); }

/* ---------- B 单行 ---------- */
.vB .menu { width: 290px; }
.vB .item { gap: 8px; height: 32px; padding: 0 10px; border-radius: var(--r); font-size: var(--fs-meta); color: var(--text-2); }
.vB .item:hover { background: var(--hover); }
.vB .item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.vB .item .meta { margin-left: auto; font-size: var(--fs-sm); color: var(--text-dim); white-space: nowrap; display: flex; align-items: center; gap: 6px; padding-left: 12px; }
.vB .item.on { color: var(--text); }
.vB .item .ic { color: var(--text-muted); }
.vB .item .ic.new { color: var(--tint); }
.vB .item .ic.wt { color: var(--tint); }
.vB .item .ck { width: 14px; display: grid; place-items: center; color: var(--tint); flex: none; margin-left: 6px; }
.vB .filter { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 34px; border-bottom: .5px solid var(--line); margin: -4px -4px 4px; color: var(--text-dim); font-size: var(--fs-meta); }

.vC .search .kbd { margin-left: auto; }
.vC .body { overflow-y: auto; padding: 4px 6px 6px; }
.vC .head { justify-content: space-between; padding: 8px 8px 4px; }
.vC .item { gap: 10px; height: 36px; padding: 0 8px; border-radius: var(--r-md); font-size: var(--fs-meta); color: var(--text-2); }
.vC .item:hover { background: var(--hover); }
.vC .item.on { background: var(--selected); color: var(--text); }
.vC .item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.vC .item .meta { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-dim); white-space: nowrap; padding-left: 12px; }
.vC .ava { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; flex: none; }
.vC .ic { color: var(--text-muted); }
.vC .new .ic { color: var(--tint); }
.vC .new { color: var(--tint); }
.vC .foot { flex: none; display: flex; gap: 14px; padding: 0 14px; height: 32px; align-items: center; border-top: .5px solid var(--line); font-size: var(--fs-xs); color: var(--text-dim); }
.kbd { font: 11px/16px var(--font-sans); padding: 0 5px; border-radius: 4px; background: var(--surface-2); color: var(--text-muted); box-shadow: inset 0 0 0 .5px var(--line); }
:root[data-theme=dark] .kbd { background: var(--surface-3); }

/* 浮条 */
.bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; background: var(--bar); backdrop-filter: blur(20px); padding: 8px 12px; border-radius: var(--r-pill); box-shadow: var(--float-shadow); font-size: var(--fs-meta); z-index: 20; }
.seg { display: flex; gap: 2px; background: var(--surface-2); border-radius: var(--r-pill); padding: 2px; }
.seg button { all: unset; cursor: pointer; white-space: nowrap; padding: 3px 12px; border-radius: var(--r-pill); color: var(--text-muted); }
.seg button.on { background: var(--surface-1); color: var(--text); box-shadow: var(--chip-shadow, 0 0 0 .5px var(--line)); }
.note { color: var(--text-muted); font-size: var(--fs-sm); max-width: 1040px; padding: 6px 40px; }
</style>
</head>

<header class="page">

  <p id="desc"></p>
  <p>点选择排上的按钮打开菜单；用底部浮条切版本、浅色 / 深色。示例项目里有 5 个工作区、6 个本地分支、9 个远程分支。</p>

const ic = (n, s = 14, cls = "") => `<svg class="${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke-width="1.75">${I[n]}</svg>`;

const state = { variant: new URLSearchParams(location.search).get("variant") || "A", theme: "light", open: "ws", project: 0, ws: -1, base: "origin/main" };
const DESC = {

const baseBadges = (b) => (b === DATA.main || b === "main" ? '<span class="badge b-main">主分支</span>' : "") + (b === DATA.current ? '<span class="badge b-cur">当前</span>' : "");

function menuA(kind) {

  return `<div class="base"><div class="search">${ic("Search01Icon", 14)}搜索分支</div>${group("本地分支", DATA.local)}${group("远程分支", DATA.remote)}</div>`;
}
function menuB(kind) {
  const ck = (on) => `<span class="ck">${on ? ic("Tick02Icon", 14) : ""}</span>`;
  if (kind === "project") return DATA.projects.map((p, i) => `<button class="item ${i === state.project ? "on" : ""}" data-p="${i}">${ic("Folder01Icon", 16, "ic")}<span class="nm">${p.name}</span><span class="meta">${p.path.replace(/^(.*)\/[^/]+$/, "$1")}</span>${ck(i === state.project)}</button>`).join("");
  if (kind === "ws") return `<button class="item ${state.ws === -1 ? "on" : ""}" data-w="-1">${ic("Add01Icon", 16, "ic new")}<span class="nm">新建 worktree</span><span class="meta"></span>${ck(state.ws === -1)}</button><div class="sep"></div>` +
    DATA.workspaces.map((w, i) => `<button class="item ${i === state.ws ? "on" : ""}" data-w="${i}">${ic(w.kind === "local" ? "ComputerIcon" : "GitBranchIcon", 16, "ic" + (w.kind === "local" ? "" : " wt"))}<span class="nm">${w.name}</span><span class="meta">${w.dirty ? '<span class="dot dirty" title="有未提交的改动"></span>' : ""}${w.ahead ? `↑${w.ahead}` : ""}<span>${w.sessions} 会话</span></span>${ck(i === state.ws)}</button>`).join("");
  const group = (h, list) => `<div class="head">${h}</div>` + list.map((b) => `<button class="item ${b === state.base ? "on" : ""}" data-b="${b}">${ic("GitBranchIcon", 14, "ic")}<span class="nm mono">${b}</span><span class="meta">${baseBadges(b)}</span>${ck(b === state.base)}</button>`).join("");
  return `<div class="filter">${ic("Search01Icon", 14)}过滤分支…</div>${group("本地", DATA.local)}${group("远程", DATA.remote)}`;
}
function menuC(kind) {
  const foot = `<div class="foot"><span><span class="kbd">↑↓</span> 选择</span><span><span class="kbd">⏎</span> 确定</span><span><span class="kbd">esc</span> 关闭</span></div>`;
  if (kind === "project") return `<div class="search">${ic("Search01Icon", 14)}搜索项目<span class="kbd">${DATA.projects.length}</span></div><div class="body"><div class="head"><span>项目</span><span>${DATA.projects.length}</span></div>` +
    DATA.projects.map((p, i) => `<button class="item ${i === state.project ? "on" : ""}" data-p="${i}"><span class="ava" style="background:${p.color}">${p.name[0].toUpperCase()}</span><span class="nm">${p.name}</span><span class="meta">${p.notGit ? "不是 git 仓库" : `${p.ws} 个工作区`}${i === state.project ? ic("Tick02Icon", 14, "tick") : ""}</span></button>`).join("") + `</div>${foot}`;
  if (kind === "ws") return `<div class="search">${ic("Search01Icon", 14)}搜索工作区</div><div class="body"><button class="item new ${state.ws === -1 ? "on" : ""}" data-w="-1">${ic("Add01Icon", 16, "ic")}<span class="nm">新建 worktree</span><span class="meta">${state.ws === -1 ? ic("Tick02Icon", 14, "tick") : ""}</span></button><div class="head"><span>已有的工作区</span><span>${DATA.workspaces.length}</span></div>` +
    DATA.workspaces.map((w, i) => `<button class="item ${i === state.ws ? "on" : ""}" data-w="${i}">${ic(w.kind === "local" ? "ComputerIcon" : "GitBranchIcon", 16, "ic")}<span class="nm">${w.name}</span><span class="meta"><span class="mono" style="font-size:11px">${w.branch}</span><span class="dot ${w.dirty ? "dirty" : "clean"}" title="${w.dirty ? "有未提交的改动" : "干净"}"></span>${i === state.ws ? ic("Tick02Icon", 14, "tick") : ""}</span></button>`).join("") + `</div>${foot}`;
  const group = (h, list) => `<div class="head"><span>${h}</span><span>${list.length}</span></div>` + list.map((b) => `<button class="item ${b === state.base ? "on" : ""}" data-b="${b}">${ic("GitBranchIcon", 14, "ic")}<span class="nm mono">${b}</span><span class="meta">${baseBadges(b)}${b === state.base ? ic("Tick02Icon", 14, "tick") : ""}</span></button>`).join("");

function render() {
  document.documentElement.dataset.theme = state.theme;

  const seg = (id, items, cur, key) => document.getElementById(id).innerHTML = items.map(([v, l]) => `<button class="${cur === v ? "on" : ""}" data-${key}="${v}">${l}</button>`).join("");
  seg("variants", [["A", "A 两行"], ["B", "B 单行"], ["C", "C 面板"]], state.variant, "variant");
  seg("themes", [["light", "浅色"], ["dark", "深色"]], state.theme, "theme");
  seg("menus", [["project", "项目"], ["ws", "工作区"], ["base", "起点"], ["", "收起"]], state.open, "menu");
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) { if (!e.target.closest(".menu")) { state.open = ""; render(); } return; }
  const d = t.dataset;
  if (d.variant) state.variant = d.variant;
  else if (d.theme) state.theme = d.theme;
  else if (d.menu !== undefined) state.open = d.menu;
  else if (d.open) state.open = state.open === d.open ? "" : d.open;
  else if (d.p) { state.project = +d.p; state.open = ""; }
  else if (d.w) { state.ws = +d.w; state.open = ""; }
  else if (d.b) { state.base = d.b; state.open = ""; }
  render();
});
document.addEventListener("keydown", (e) => {
  const order = ["A", "B", "C"]; const i = order.indexOf(state.variant);
  if (e.key === "ArrowRight") { state.variant = order[(i + 1) % 3]; render(); }
  if (e.key === "ArrowLeft") { state.variant = order[(i + 2) % 3]; render(); }
});
render();
