<!doctype html>
<!--
  PROTOTYPE — throwaway. 失败的一轮：错误行和下方信息行的信息密度。
  问题：失败的一轮下面两行（"🔑 登录已失效 [去登录] [重试] 展开看原始报错" + "分叉 · 用量 0 tok · 12:54"）太密，怎么减。
  三版：A 现在；B 失败且没有回复时去掉信息行；C 在 B 的基础上错误行分主次（一个主按钮、另一个文字按钮、"详情 ›"靠右）。
  底部浮条切换版本（也可用 ?variant=A|B|C、键盘 ← →）、情况（登录失效 / 一般出错、有没有部分回复、是不是最后一轮）和浅色 / 深色。
  颜色、字号取自 packages/ui/src/design/tokens.css，图标是 Hugeicons 免费版（key-01、alert-02、arrow-right-01 等）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 · 失败的一轮</title>
<style>
:root {
  --main: #fff; --surface-1: #fff; --surface-2: #f2f2f4; --code: #f6f6f8; --sidebar-bg: rgba(246,247,250,.9);
  --text: #1d1d1f; --text-2: #2c2c30; --text-3: #48484e; --text-muted: #6e6e74; --text-dim: #a1a1a7;
  --line: rgba(0,0,0,.08); --line-strong: rgba(0,0,0,.14); --hover: rgba(0,0,0,.035); --selected: rgba(0,0,0,.06);
  --tint: #2f6fed; --attn: #dd8629; --attn-text: #c96509; --attn-soft: rgba(221,134,41,.12);
  --danger: #e5484d; --danger-soft: rgba(229,72,77,.1);
  --card-shadow: 0 0 0 .5px var(--line), 0 8px 24px rgba(41,70,122,.08);
  --page: #eef1f6; --bar: rgba(255,255,255,.92);
  --font-sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; --font-mono: "SF Mono", Menlo, monospace;
  --fs: 14px; --fs-meta: 13px; --fs-sm: 12px; --fs-xs: 11px;
  --r: 8px; --r-card: 16px; --r-bubble: 22px; --r-pill: 999px;
}
:root[data-theme=dark] {
  --main: #151517; --surface-1: #212123; --surface-2: #2c2c2e; --code: #19191b; --sidebar-bg: rgba(30,30,32,.9);
  --text: #f9fafb; --text-2: #e7e9ec; --text-3: #cfd3d6; --text-muted: #adb2b8; --text-dim: #81858c;
  --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.16); --hover: rgba(255,255,255,.05); --selected: rgba(255,255,255,.08);
  --tint: #7aaaff; --attn-text: #f0a24e; --attn-soft: rgba(221,134,41,.16); --danger: #f25a5a; --danger-soft: rgba(242,90,90,.14);
  --card-shadow: 0 0 0 .5px var(--line), 0 9px 27px rgba(41,70,122,.2);
  --page: #0c0c0e; --bar: rgba(40,40,42,.92);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); font: var(--fs)/1.5 var(--font-sans); color: var(--text); -webkit-font-smoothing: antialiased; padding-bottom: 120px; }
header.page { padding: 28px 40px 4px; max-width: 980px; }
header.page h1 { font-size: 20px; margin: 0 0 6px; }
header.page p { margin: 0 0 4px; color: var(--text-muted); font-size: var(--fs-meta); }
.stage { padding: 16px 40px; }
.win { width: 900px; height: 500px; background: var(--main); border-radius: var(--r-card); box-shadow: var(--card-shadow); overflow: hidden; display: flex; }
.sb { width: 170px; background: var(--sidebar-bg); border-right: .5px solid var(--line); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabs { height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: .5px solid var(--line); }
.tab { height: 28px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: var(--r); font-size: var(--fs-meta); color: var(--text); background: var(--selected); }
.thread { flex: 1; overflow-y: auto; padding: 24px 0; }
.col { max-width: 640px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; }
.bubble { align-self: flex-end; max-width: 80%; background: var(--surface-2); border-radius: var(--r-bubble); padding: 8px 16px; }
.umeta { align-self: flex-end; display: flex; align-items: center; gap: 4px; font-size: var(--fs-sm); color: var(--text-dim); margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
.reply { color: var(--text-2); margin-bottom: 4px; }
.foot { margin-left: -4px; display: flex; align-items: center; gap: 2px; font-size: var(--fs-sm); color: var(--text-dim); font-variant-numeric: tabular-nums; margin-bottom: 18px; }
.ib { all: unset; display: inline-grid; place-items: center; padding: 4px; border-radius: var(--r); color: var(--text-dim); cursor: pointer; }
.ib:hover { background: var(--hover); color: var(--text-muted); }
.foot .use { margin-left: 10px; display: inline-flex; align-items: center; gap: 4px; }
.foot .time { margin-left: 12px; }
.composer { margin: 0 auto 16px; width: calc(100% - 40px); max-width: 680px; background: var(--surface-2); border-radius: var(--r-bubble); padding: 14px 20px; color: var(--text-dim); font-size: var(--fs-meta); height: 76px; }

/* 错误行 */
.err { margin: 4px 0; font-size: var(--fs-meta); }
.err.auth { color: var(--attn); } .err.fail { color: var(--danger); }
.err .line { display: flex; align-items: center; gap: 6px; min-height: 26px; }
:where(.err button) { all: unset; cursor: pointer; }
.pill { border-radius: var(--r-pill); padding: 0 10px; color: var(--text-2); box-shadow: inset 0 0 0 .5px var(--line-strong); line-height: 22px; }
.pill:hover { background: var(--hover); }
.raw-link { color: var(--text-dim); } .raw-link:hover { color: var(--text-muted); }
pre.raw { margin: 6px 0 0; border-radius: var(--r); background: var(--code); padding: 10px 12px; font: var(--fs-sm)/1.5 var(--font-mono); white-space: pre-wrap; color: var(--text-3); }
/* C：主按钮是同色的浅底，次按钮是文字，详情靠右 */
.primary { border-radius: var(--r-pill); padding: 0 10px; line-height: 22px; font-weight: 500; }
.auth .primary { background: var(--attn-soft); color: var(--attn-text); }
.fail .primary { background: var(--danger-soft); color: var(--danger); }
.primary:hover { filter: brightness(.96); }
.textbtn { color: var(--text-muted); padding: 0 6px; border-radius: var(--r); line-height: 22px; }
.textbtn:hover { background: var(--hover); color: var(--text-2); }
.details { margin-left: auto; color: var(--text-dim); display: inline-flex; align-items: center; gap: 2px; padding: 0 4px; border-radius: var(--r); line-height: 22px; }
.details:hover { color: var(--text-muted); background: var(--hover); }
.details svg { transition: rotate .3s cubic-bezier(.2,.9,.3,1.05); }
.details.open svg { rotate: 90deg; }

/* 浮条 */
.bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--bar); backdrop-filter: blur(12px); box-shadow: 0 0 0 .5px var(--line-strong), 0 12px 32px rgba(0,0,0,.18); border-radius: 14px; padding: 8px 10px; display: flex; gap: 14px; align-items: center; font-size: var(--fs-sm); color: var(--text-muted); white-space: nowrap; }
.seg { display: inline-flex; background: var(--hover); border-radius: 9px; padding: 2px; }
.seg button { all: unset; cursor: pointer; padding: 3px 10px; border-radius: 7px; color: var(--text-muted); }
.seg button[aria-pressed=true] { background: var(--surface-1); color: var(--text); box-shadow: 0 0 0 .5px var(--line-strong); }
.bar label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.state { font: var(--fs-xs)/1.4 var(--font-mono); color: var(--text-dim); margin: 10px 40px 0; }
.desc { margin: 10px 0 0; font-size: var(--fs-meta); color: var(--text-muted); max-width: 900px; }
</style>
</head>
<body>
<header class="page">
  <h1>失败的一轮（原型，审完即弃）</h1>
  <p>问题：失败的一轮下面有两行——错误行"登录已失效 [去登录] [重试] 展开看原始报错"，和信息行"分叉 · 用量 0 tok · 时间"——信息太密。</p>
  <p>用底部浮条切换三版（键盘 ← → 也行），以及登录失效 / 一般出错、有没有部分回复、是不是最后一轮、浅色 / 深色。点"展开看原始报错"/"详情"看展开的样子。</p>
</header>
<div class="stage">
  <div class="win">
    <div class="sb"></div>
    <div class="main">
      <div class="tabs"><span class="tab">你好</span></div>
      <div class="thread"><div class="col" id="col"></div></div>
      <div class="composer">发消息或描述任务，@ 引用文件，/ 使用命令</div>
    </div>
  </div>
  <p class="desc" id="desc"></p>
</div>
<div class="state" id="state"></div>
<div class="bar">
  <span class="seg" id="variants"></span>
  <span class="seg" id="cases"></span>
  <label><input type="checkbox" id="partial">部分回复后才失败</label>
  <label><input type="checkbox" id="last" checked>最后一轮（有重试）</label>
  <span class="seg" id="themes"></span>
</div>
<script>
const SVG = {"Key01Icon": "<path d=\"M15.5 14.5C18.8137 14.5 21.5 11.8137 21.5 8.5C21.5 5.18629 18.8137 2.5 15.5 2.5C12.1863 2.5 9.5 5.18629 9.5 8.5C9.5 9.38041 9.68962 10.2165 10.0303 10.9697L2.5 18.5V21.5H5.5V19.5H7.5V17.5H9.5L13.0303 13.9697C13.7835 14.3104 14.6196 14.5 15.5 14.5Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M17.5 6.5L16.5 7.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "Alert02Icon": "<path d=\"M13.9248 21H10.0752C5.44476 21 3.12955 21 2.27636 19.4939C1.42317 17.9879 2.60736 15.9914 4.97574 11.9985L6.90057 8.75333C9.17559 4.91778 10.3131 3 12 3C13.6869 3 14.8244 4.91777 17.0994 8.75332L19.0243 11.9985C21.3926 15.9914 22.5768 17.9879 21.7236 19.4939C20.8704 21 18.5552 21 13.9248 21Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M12 9V13\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M12.125 16.75H12M12.25 16.75C12.25 16.8881 12.1381 17 12 17C11.8619 17 11.75 16.8881 11.75 16.75C11.75 16.6119 11.8619 16.5 12 16.5C12.1381 16.5 12.25 16.6119 12.25 16.75Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "ArrowRight01Icon": "<path d=\"M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "ArrowDown01Icon": "<path d=\"M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "Copy01Icon": "<path d=\"M7.5 14.5C7.5 11.2002 7.5 9.55025 8.52513 8.52513C9.55025 7.5 11.2002 7.5 14.5 7.5C17.7998 7.5 19.4497 7.5 20.4749 8.52513C21.5 9.55025 21.5 11.2002 21.5 14.5C21.5 17.7998 21.5 19.4497 20.4749 20.4749C19.4497 21.5 17.7998 21.5 14.5 21.5C11.2002 21.5 9.55025 21.5 8.52513 20.4749C7.5 19.4497 7.5 17.7998 7.5 14.5Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M7.5 16.5C6.10355 16.5 5.40533 16.5 4.84402 16.3036C3.83866 15.9518 3.0482 15.1613 2.69641 14.156C2.5 13.5947 2.5 12.8964 2.5 11.5V9.5C2.5 6.20017 2.5 4.55025 3.52513 3.52513C4.55025 2.5 6.20017 2.5 9.5 2.5H11.5C12.8964 2.5 13.5947 2.5 14.156 2.69641C15.1613 3.0482 15.9518 3.83866 16.3036 4.84402C16.5 5.40533 16.5 6.10355 16.5 7.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "GitForkIcon": "<path d=\"M6 8C7.10457 8 8 7.10457 8 6C8 4.89543 7.10457 4 6 4C4.89543 4 4 4.89543 4 6C4 7.10457 4.89543 8 6 8Z\" stroke=\"currentColor\" stroke-width=\"1.75\"/><path d=\"M12 20C13.1046 20 14 19.1046 14 18C14 16.8954 13.1046 16 12 16C10.8954 16 10 16.8954 10 18C10 19.1046 10.8954 20 12 20Z\" stroke=\"currentColor\" stroke-width=\"1.75\"/><path d=\"M18 8C19.1046 8 20 7.10457 20 6C20 4.89543 19.1046 4 18 4C16.8954 4 16 4.89543 16 6C16 7.10457 16.8954 8 18 8Z\" stroke=\"currentColor\" stroke-width=\"1.75\"/><path d=\"M6.01734 8.74067C6.01734 10.4142 5.77537 12.1995 9.22051 11.9855H12.0053M17.9929 8.57617C18.1259 11.9855 16.9199 11.7648 15.7861 11.9855H12.0053M12.0053 15.7001V11.9855\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "DatabaseIcon": "<ellipse cx=\"12\" cy=\"5\" rx=\"8\" ry=\"3\" stroke=\"currentColor\" stroke-width=\"1.75\"/><path d=\"M7 10.842C7.60158 11.0229 8.27434 11.1718 9 11.282\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.75\"/><path d=\"M20 12C20 13.6569 16.4183 15 12 15C7.58172 15 4 13.6569 4 12\" stroke=\"currentColor\" stroke-width=\"1.75\"/><path d=\"M7 17.842C7.60158 18.0229 8.27434 18.1718 9 18.282\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.75\"/><path d=\"M20 5V19C20 20.6569 16.4183 22 12 22C7.58172 22 4 20.6569 4 19V5\" stroke=\"currentColor\" stroke-width=\"1.75\"/>", "Add01Icon": "<path d=\"M12.001 5.00003V19.002\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M19.002 12.002L4.99998 12.002\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>"};
const svg = (k, s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none">${SVG[k]}</svg>`;
const VARIANTS = {
  A: ["A · 现在", "现在的样子：错误行四样东西一样重；没有回复也照常显示信息行（分叉、用量 0 tok、时间）。"],
  B: ["B · 去掉信息行", "失败且没有回复时不显示信息行，错误行就是这一轮的结尾。有部分回复时信息行照常（复制、分叉、用量、时间）。错误行不变。"],
  C: ["C · 再分主次", "在 B 的基础上：错误行只有一个主按钮（登录失效是\"去登录\"，一般出错是\"重试\"），同色浅底；另一个降为文字按钮；\"展开看原始报错\"缩成\"详情 ›\"靠右，展开时箭头转向下。"],
};
const CASES = { auth: "登录失效", fail: "一般出错" };
const RAW = { auth: '401 Unauthorized: {"type":"error","error":{"type":"authentication_error","message":"OAuth token has expired. Please run /login."}}', fail: '529 Overloaded: {"type":"error","error":{"type":"overloaded_error","message":"Overloaded"}}' };
const q = new URLSearchParams(location.search);
const s = { variant: VARIANTS[q.get("variant")] ? q.get("variant") : "A", kind: "auth", partial: false, last: true, theme: "light", open: false };

function errorLine() {
  const auth = s.kind === "auth";
  const icon = auth ? svg("Key01Icon", 14) : svg("Alert02Icon", 14);
  const title = auth ? "登录已失效" : "回复出错";
  const login = auth && s.last, retry = s.last;
  let line;
  if (s.variant === "C") {
    const primary = auth && login ? "去登录" : retry ? "重试" : null;
    const second = auth && login && retry ? "重试" : null;
    line = `${icon}<span>${title}</span>${primary ? `<button class="primary">${primary}</button>` : ""}${second ? `<button class="textbtn">${second}</button>` : ""}<button class="details${s.open ? " open" : ""}" data-raw>详情${svg("ArrowRight01Icon", 12)}</button>`;
  } else {
    line = `${icon}<span>${title}</span>${login ? `<button class="pill">去登录</button>` : ""}${retry ? `<button class="pill">重试</button>` : ""}<button class="raw-link" data-raw>${s.open ? "收起" : "展开看原始报错"}</button>`;
  }
  return `<div class="err ${auth ? "auth" : "fail"}"><div class="line">${line}</div>${s.open ? `<pre class="raw">${RAW[s.kind]}</pre>` : ""}</div>`;
}
function foot(reply, use, time) {
  return `<div class="foot">${reply ? `<button class="ib" title="复制">${svg("Copy01Icon", 14)}</button>` : ""}<button class="ib" title="从这里分叉">${svg("GitForkIcon", 14)}</button><span class="use">${svg("DatabaseIcon", 13)}用量 ${use} tok</span><span class="time">${time}</span></div>`;
}
function paint() {
  document.documentElement.dataset.theme = s.theme;
  let html = `<div class="bubble">帮我看看 sidebar.tsx 里收件箱的展开逻辑</div><div class="umeta">12:41 ${svg("Copy01Icon", 14)}</div>
    <div class="reply">展开状态记在 localStorage 的 atrium.inboxOpen，标题行的按钮切换它；列表最多 3 条，其余收成"还有 N 条"。</div>${foot(true, "6.2K", "12:42")}`;
  html += `<div class="bubble">你好</div><div class="umeta">12:54 ${svg("Copy01Icon", 14)}</div>`;
  if (s.partial) html += `<div class="reply">你好！我先看一下项目结构，然后</div>`;
  html += errorLine();
  const showFoot = s.variant === "A" || s.partial;
  if (showFoot) html += foot(s.partial, s.partial ? "1.3K" : "0", "12:54");
  else html += `<div style="height:18px"></div>`;
  if (!s.last) html += `<div class="bubble">再试一次</div><div class="umeta">12:56 ${svg("Copy01Icon", 14)}</div><div class="reply">你好，有什么可以帮你的？</div>${foot(true, "2.0K", "12:56")}`;
  document.getElementById("col").innerHTML = html;
  document.querySelectorAll("[data-raw]").forEach((b) => b.onclick = () => { s.open = !s.open; paint(); });
  seg("variants", Object.fromEntries(Object.entries(VARIANTS).map(([k, [l]]) => [k, l])), "variant");
  seg("cases", CASES, "kind");
  seg("themes", { light: "浅色", dark: "深色" }, "theme");
  document.getElementById("partial").checked = s.partial;
  document.getElementById("last").checked = s.last;
  document.getElementById("desc").textContent = VARIANTS[s.variant][1];
  document.getElementById("state").textContent = JSON.stringify({ variant: s.variant, case: s.kind, partialReply: s.partial, lastTurn: s.last, theme: s.theme, rawOpen: s.open, footer: showFoot });
  history.replaceState(null, "", `?variant=${s.variant}`);
}
function seg(id, options, key) {
  const el = document.getElementById(id);
  el.innerHTML = Object.entries(options).map(([k, l]) => `<button data-k="${k}" aria-pressed="${s[key] === k}">${l}</button>`).join("");
  el.querySelectorAll("button").forEach((b) => b.onclick = () => { s[key] = b.dataset.k; paint(); });
}
document.getElementById("partial").onchange = (e) => { s.partial = e.target.checked; paint(); };
document.getElementById("last").onchange = (e) => { s.last = e.target.checked; paint(); };
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const keys = Object.keys(VARIANTS), i = keys.indexOf(s.variant);
  if (e.key === "ArrowRight") { s.variant = keys[(i + 1) % keys.length]; paint(); }
  if (e.key === "ArrowLeft") { s.variant = keys[(i + keys.length - 1) % keys.length]; paint(); }
});
paint();
</script>
</body>
</html>
