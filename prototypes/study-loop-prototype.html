<!doctype html>
<!--
  PROTOTYPE — 设计稿，不接入生产构建。ML3 学习循环（SPEC-0008"ML3 定的细节"）里还没定样子的 7 处，每处 3 种做法，按编号挑（比如"1A 2B 3B 4A 5B 6A 7C"）。

  已定的前提：
  · 步骤条 2D（study-progress-states-prototype.html）：高 40px，8px 的点（课方点，后面几步圆点），右端主次按钮；不能点的按钮不透明度 0.42。
  · 方向主页 1A/3A/4A/5A：标题 + 当前步骤卡 + 这一级的全部步骤 | 右栏 240px 阶梯、漏洞、其他会话；漏洞悬停出圆勾（3A）。
  · 测验是上课会话的子对话（宿主 --fork 上课的文件）；费曼是新会话；升级先写档案、再归档这一级的会话、再开排计划。
  · 用户 2026-11-09 对第一阶段 13 个问题"都按建议"；标"推荐"的是和那些回答对应的一种。

  每种做法左边浅色、右边深色。数据是一个 Rust 方向：第 2 级"所有权和借用"，10 步。
  图标：Hugeicons 免费版 stroke-rounded（4.3.5，路径照抄自仓库里的其他原型）。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原型 · 学习循环</title>
    <style>
      :root,
      .th-light {
        --window: #e8ecf2;
        --main: #ffffff;
        --surface-1: #ffffff;
        --surface-2: #f2f2f4;
        --surface-3: #e9e9ec;
        --code: #f6f6f8;
        --text: #1d1d1f;
        --text-2: #2c2c30;
        --text-3: #48484e;
        --text-muted: #6e6e74;
        --text-dim: #a1a1a7;
        --line: rgba(0, 0, 0, 0.08);
        --line-strong: rgba(0, 0, 0, 0.14);
        --hover: rgba(0, 0, 0, 0.035);
        --selected: rgba(0, 0, 0, 0.06);
        --rail: rgba(0, 0, 0, 0.15);
        --node: #c4c4c9;
        --tint: #2f6fed;
        --on-tint: #ffffff;
        --linked: rgba(47, 111, 237, 0.1);
        --attn: #dd8629;
        --attn-text: #c96509;
        --attn-soft: rgba(221, 134, 41, 0.12);
        --danger: #e5484d;
        --ok: #16a34a;
        --ok-text: #1e8e3e;
        --chip-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.09), 0 1px 2px rgba(0, 0, 0, 0.05);
        --card-shadow: 0 0 0 0.5px var(--line), 0 9px 27px rgba(41, 70, 122, 0.08);
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, 0.14);
        --font-sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
        --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
        --fs: 14px;
        --fs-meta: 13px;
        --fs-sm: 12px;
        --fs-xs: 11px;
        --fs-mono: 12.5px;
        --r-sm: 6px;
        --r: 8px;
        --r-md: 10px;
        --r-btn: 12px;
        --r-card: 16px;
        color-scheme: light;
      }
      .th-dark {
        --window: #0d1016;
        --main: #151517;
        --surface-1: #212123;
        --surface-2: #2c2c2e;
        --surface-3: #353638;
        --code: #19191b;
        --text: #f9fafb;
        --text-2: #e7e9ec;
        --text-3: #cfd3d6;
        --text-muted: #adb2b8;
        --text-dim: #81858c;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.16);
        --hover: rgba(255, 255, 255, 0.05);
        --selected: rgba(255, 255, 255, 0.08);
        --rail: rgba(255, 255, 255, 0.15);
        --node: #5d6067;
        --tint: #7aaaff;
        --on-tint: #0d1016;
        --linked: rgba(122, 170, 255, 0.14);
        --attn: #dd8629;
        --attn-text: #f0a24e;
        --attn-soft: rgba(221, 134, 41, 0.16);
        --danger: #f25a5a;
        --ok: #22c55e;
        --ok-text: #4ade80;
        --chip-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.1), 0 1px 2px rgba(0, 0, 0, 0.3);
        --card-shadow: 0 0 0 0.5px var(--line), 0 9px 27px rgba(41, 70, 122, 0.2);
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 22px 28px 64px;
        background: #e8ecf2;
        color: #2c2c30;
        font:
          14px / 1.5 -apple-system,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        color: inherit;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      svg.i.s12 {
        width: 12px;
        height: 12px;
      }
      svg.i.s13 {
        width: 13px;
        height: 13px;
      }
      svg.i.s14 {
        width: 14px;
        height: 14px;
      }
      .ft {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
      }

      /* ---------- 页面框架 ---------- */
      .doc-head h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #1d1d1f;
      }
      .doc-head p {
        margin: 6px 0 0;
        max-width: 900px;
        color: #6e6e74;
        font-size: 13px;
      }
      .toc {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 14px 0 0;
      }
      .toc a {
        padding: 4px 10px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.1);
        color: #2c2c30;
        text-decoration: none;
        font-size: 12px;
      }
      .part {
        margin-top: 44px;
      }
      .part > h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        color: #1d1d1f;
      }
      .part > .why {
        margin: 4px 0 0;
        max-width: 900px;
        font-size: 13px;
        color: #6e6e74;
      }
      .opt {
        margin-top: 22px;
      }
      .opt > .oh {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 14px;
        color: #1d1d1f;
      }
      .opt > .oh .letter {
        display: inline-grid;
        place-items: center;
        min-width: 30px;
        height: 22px;
        padding: 0 6px;
        border-radius: 6px;
        background: #1d1d1f;
        color: #fff;
        font-weight: 700;
        font-size: 12px;
      }
      .opt > .oh b {
        font-weight: 600;
      }
      .opt > .od {
        margin: 4px 0 0 40px;
        max-width: 900px;
        font-size: 12.5px;
        color: #6e6e74;
      }
      .pair {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 10px;
      }
      .frame {
        padding: 16px;
        border-radius: 14px;
        background: var(--window);
        color: var(--text-2);
        font: var(--fs) / 1.5 var(--font-sans);
      }
      .frame > .fl {
        margin: 0 0 8px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .win {
        position: relative;
        border-radius: 12px;
        background: var(--main);
        box-shadow: var(--card-shadow);
        overflow: hidden;
      }
      .win.open {
        overflow: visible;
      }
      .pad {
        padding: 16px 18px 18px;
      }
      .cap {
        margin: 12px 0 6px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .cap:first-child {
        margin-top: 0;
      }

      /* ---------- 共用部件（同 study-mode-flow-prototype C） ---------- */
      .muted {
        color: var(--text-muted);
      }
      .dim {
        color: var(--text-dim);
      }
      .tabbar {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 12px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        overflow: hidden;
      }
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 8px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
        white-space: nowrap;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 10px;
        border-radius: var(--r);
        font-size: var(--fs-meta);
        color: var(--text-muted);
        white-space: nowrap;
      }
      .tab.on {
        background: var(--selected);
        color: var(--text);
      }
      .tab.home .i {
        color: var(--tint);
      }
      .ibtn {
        all: unset;
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: var(--r);
        color: var(--text-muted);
      }
      .ibtn.on {
        background: var(--selected);
        color: var(--text);
      }
      .run {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid var(--tint);
        border-right-color: transparent;
        animation: spin 0.9s linear infinite;
        flex: 0 0 auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .run {
          animation: none;
        }
      }
      .btn {
        all: unset;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px;
        border-radius: var(--r-btn);
        font-size: var(--fs-meta);
        white-space: nowrap;
        cursor: default;
      }
      .btn.primary {
        background: var(--tint);
        color: var(--on-tint);
        font-weight: 600;
      }
      .btn.ghost {
        box-shadow: inset 0 0 0 0.5px var(--line-strong);
        color: var(--text-2);
      }
      .btn.outline {
        box-shadow: inset 0 0 0 1px var(--tint);
        color: var(--tint);
        font-weight: 500;
      }
      .btn.textbtn {
        color: var(--text-muted);
        padding: 0 8px;
      }
      .btn.sm {
        height: 26px;
        padding: 0 10px;
        border-radius: 9px;
      }
      .btn.xs {
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: var(--fs-sm);
      }
      .btn[disabled],
      .btn.off {
        opacity: 0.42;
      }
      .btn.locked {
        background: var(--surface-2);
        color: var(--text-dim);
        font-weight: 500;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 7px;
        border-radius: var(--r-sm);
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: var(--fs-sm);
        font-weight: 500;
        white-space: nowrap;
      }
      .tag.attn {
        background: var(--attn-soft);
        color: var(--attn-text);
      }
      .tag.tint {
        background: var(--linked);
        color: var(--tint);
      }
      .tag.ok {
        background: color-mix(in srgb, var(--ok) 12%, transparent);
        color: var(--ok-text);
      }
      .tag.xs {
        height: 17px;
        padding: 0 5px;
        font-size: var(--fs-xs);
        border-radius: 5px;
      }
      .card {
        border-radius: var(--r-card);
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
      }

      /* 步骤条 */
      .strip {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 16px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        font-size: var(--fs-sm);
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .strip .lvl {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--text-2);
        font-weight: 500;
      }
      .strip .trk {
        display: inline-flex;
        gap: 3px;
      }
      .strip .trk i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--line-strong);
      }
      .strip .trk i.done {
        background: var(--text-muted);
      }
      .strip .trk i.cur {
        background: var(--tint);
      }
      .strip .trk i.x {
        border-radius: 50%;
      }
      .strip .trk.faded {
        opacity: 0.45;
      }
      .strip .trk.grey i.cur {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--text-muted);
      }
      .strip .trk.hatch i {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .strip .trk.all i {
        background: var(--tint);
      }
      .strip .now {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .strip .now b {
        color: var(--text);
        font-weight: 500;
      }
      .strip .sp {
        flex: 1;
      }
      .strip .warn {
        color: var(--attn-text);
      }
      .strip .okc {
        color: var(--ok-text);
      }
      .strip-label {
        padding: 8px 16px 0;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .live {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
      }

      /* 步骤列表 */
      .lessons {
        padding: 4px;
        border-radius: 12px;
        background: var(--code);
      }
      .lesson {
        position: relative;
        border-radius: var(--r);
      }
      .lesson .lh {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 32px;
        padding: 0 6px 0 10px;
        font-size: var(--fs-meta);
        color: var(--text-3);
      }
      .lesson .no {
        width: 18px;
        color: var(--text-dim);
        font-size: var(--fs-sm);
        flex: 0 0 auto;
      }
      .lesson .no.kd {
        display: inline-flex;
      }
      .lesson .ok {
        color: var(--ok-text);
        display: inline-flex;
      }
      .lesson .okm {
        color: var(--text-muted);
        display: inline-flex;
      }
      .lesson .t {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lesson .m {
        color: var(--text-dim);
        font-size: var(--fs-sm);
        white-space: nowrap;
      }
      .lesson .m.attn {
        color: var(--attn-text);
      }
      .lesson.next {
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
      }
      .lesson.next .lh {
        color: var(--text);
      }
      .lesson.next .no {
        color: var(--tint);
        font-weight: 600;
      }
      .lesson.todo .lh {
        color: var(--text-dim);
      }
      .lesson.hover {
        background: var(--hover);
      }
      .lesson .more {
        width: 24px;
        height: 24px;
      }
      .sess {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 0 10px 8px 38px;
      }
      .schip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        font-size: var(--fs-sm);
        color: var(--text-2);
        white-space: nowrap;
      }
      .schip .i {
        color: var(--text-muted);
      }
      .schip .s {
        color: var(--text-dim);
      }
      .schip.manual {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-strong);
        border: 0;
        color: var(--text-muted);
        background-image: none;
        outline: 1px dashed var(--line-strong);
        outline-offset: -1px;
        box-shadow: none;
      }
      .inline-link {
        font-size: var(--fs-sm);
        color: var(--tint);
      }
      .subd {
        display: inline-flex;
        gap: 2px;
        flex: 0 0 auto;
      }
      .subd i {
        width: 5px;
        height: 5px;
        border-radius: 1.4px;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .subd i.d {
        background: var(--text-muted);
        box-shadow: none;
      }
      .subd i.g {
        background: var(--attn);
        box-shadow: none;
      }
      .subd i.m {
        background: transparent;
        box-shadow: inset 0 0 0 1.25px var(--text-muted);
      }
      .subd i.n {
        background: transparent;
        box-shadow: none;
        outline: 1px dashed var(--text-dim);
        outline-offset: -1px;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: 8px;
        background: var(--surface-2);
      }
      .seg span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 7px;
        border-radius: 6px;
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .seg span.on {
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        color: var(--text);
      }
      .seg span.mine {
        background: var(--surface-1);
        color: var(--text-2);
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .roundchk {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px var(--line-strong);
        color: var(--text-muted);
        background: var(--surface-1);
      }

      /* 菜单 */
      .menu {
        position: absolute;
        z-index: 5;
        min-width: 188px;
        padding: 4px;
        border-radius: var(--r-md);
        background: var(--surface-1);
        box-shadow: var(--float-shadow);
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .menu.flow {
        position: relative;
        margin: 2px 4px 8px auto;
        width: max-content;
      }
      .menu .mi {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 8px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .menu .mi.hl {
        background: var(--selected);
      }
      .menu .mi .k {
        margin-left: auto;
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }
      .menu .mi.dis {
        color: var(--text-dim);
      }
      .menu .mi .ck {
        width: 14px;
        display: inline-flex;
        color: var(--text-muted);
      }
      .menu .sep {
        height: 0.5px;
        margin: 4px 6px;
        background: var(--line);
      }
      .menu .mh {
        padding: 4px 8px 2px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .menu .note {
        padding: 2px 8px 6px;
        font-size: var(--fs-xs);
        color: var(--text-dim);
        white-space: normal;
        max-width: 220px;
      }
      .menu .row-btns {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        padding: 6px 4px 2px;
      }
      .box {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px var(--line-strong);
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .box.on {
        background: var(--tint);
        color: var(--on-tint);
        box-shadow: none;
      }
      .box.agent {
        background: var(--surface-3);
        color: var(--text-muted);
        box-shadow: none;
      }
      .box.ok {
        background: var(--ok);
        color: #fff;
        box-shadow: none;
      }
      .tip {
        position: absolute;
        z-index: 6;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--text);
        color: var(--main);
        font-size: var(--fs-xs);
        white-space: nowrap;
      }

      /* 主页 */
      .ptitle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
      }
      .psub {
        margin: 4px 0 0;
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }
      .hero {
        padding: 16px 18px 14px;
      }
      .hero .eyebrow {
        font-size: var(--fs-sm);
        color: var(--tint);
        font-weight: 600;
      }
      .hero .big {
        margin: 4px 0 2px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }
      .hero .desc {

      .lvcard {

        color: var(--text-2);
        line-height: 1.6;

        font-size: var(--fs-xs);

      .gap-row {

        color: var(--text-muted);

        background: var(--surface-1);

        color: var(--text-dim);
        font-size: var(--fs-sm);

        gap: 8px;
        height: 34px;
        padding: 0 8px;

            w: 720,
            build: () =>
              homeWin3(
                `${head3()}<div style="margin-top:16px">${hero3()}</div>${sect("第 3 级的步骤", steps3())}`,
                `${sect("阶梯 · 5 级", ladder3())}${sect(
                  "其他会话",
                  others(
                    `<div class="srow open" style="color:var(--text-muted)">${ic("Archive02", "s14")}<span class="t">已归档</span><span class="m">41</span><span class="dim" style="display:inline-flex;transform:rotate(90deg)">${ic("ArrowRight01", "s12")}</span></div><div class="sgh" style="display:flex">第 2 级 · 23 个<span style="margin-left:auto;color:var(--tint)">恢复这一级</span></div>${archRows()}<div class="sgh">第 1 级 · 18 个 ›</div>`,
                  ),
                )}`,
                700,
              ),
          },
          {
            L: "5B",
            reco: true,
            name: "阶梯里展开那一级，多一段“会话 N 个 · 已归档”",
            desc: "阶梯点开第 2 级，在“学什么 / 怎样算过关 / 状态”下面多一段“会话 23 个 · 已归档 ›”，点开按步骤列出，悬停一行出“恢复”。会话本来就按级来，放在那一级下面最好找。",
            w: 720,
            build: () =>
              homeWin3(
                `${head3()}<div style="margin-top:16px">${hero3()}</div>${sect("第 3 级的步骤", steps3())}`,
                `${sect(
                  "阶梯 · 5 级",
                  ladder3(
                    `<dl class="lvx"><dt>学什么</dt><dd>${LADDER[1].m}</dd><dt>状态</dt><dd>11月8日学完 · 综合测验 72/100</dd><dt style="display:flex;align-items:center;gap:4px">会话 23 个 · 已归档 <span style="display:inline-flex;transform:rotate(90deg)">${ic("ArrowRight01", "s12")}</span></dt></dl><div style="margin:-2px 0 6px 22px">${archRows()}</div>`,
                    1,
                  ),
                )}${sect("其他会话", others())}`,
                760,
              ),
          },
          {
            L: "5C",
            name: "主页最底下一个可收起的“已归档的会话”区",
            desc: "左栏这一级的步骤下面，一段默认收起的“已归档的会话 · 41”，点开按级、按步骤列出，悬停出“恢复”。和侧栏“已归档的对话”一个意思。",
            w: 720,
            build: () =>
              homeWin3(
                `${head3()}<div style="margin-top:16px">${hero3()}</div>${sect("第 3 级的步骤", steps3())}${sect(
                  `<span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-flex;transform:rotate(90deg)">${ic("ArrowRight01", "s12")}</span>已归档的会话 · 41</span>`,
                  `<div class="lessons" style="padding:6px"><div class="sgh" style="display:flex">第 2 级 · ${LADDER[1].n} · 23 个<span style="margin-left:auto;color:var(--tint)">恢复这一级</span></div>${archRows()}<div class="sgh">第 1 级 · ${LADDER[0].n} · 18 个 ›</div></div>`,
                )}`,
                `${sect("阶梯 · 5 级", ladder3())}${sect("其他会话", others())}`,
                820,
              ),
          },
        ],
        shared: {
          title: "共用：打开一个归档了的会话",
          desc: "对话记录照常显示；输入框的位置换成一行说明和“恢复”（同工作区里归档的会话）。点开看不会把它放回列表。",
          w: 560,
          build: () =>
            sessionWin(
              [["lesson", "上课 · 借用规则", true]],
              strip(
                `${lvl3()}${trk(0, "", [...STEPS3, ...STEPS3, ...FIXED4])}<span class="now"><b>第 1 步 · trait 是什么</b> · 还没开始</span><span class="sp"></span>${btnP("开始上课")}`,
              ),
              lessonTail(),
              `<div class="composer-wrap"><div class="rolock">${ic("Archive02", "s14")}这个会话已归档，恢复以后才能接着发<span class="lk"><button class="btn outline sm">恢复</button></span></div></div>`,
              300,
            ),
        },
      };

      /* =====================================================================
         6 · 升级后、课还没排出来时的主页
         ===================================================================== */
      const planStrip = () =>
        strip(
          `${lvl3()}<span class="now"><b>排计划中</b></span><span class="sp"></span><span class="live"></span><button class="btn outline sm">回到会话</button>`,
        );
      const side6 = () =>
        `${sect("阶梯 · 5 级", ladder3())}${sect("漏洞", `<div class="ghead">这一级<span class="n">还没有</span></div><div class="ghead">之前带来的<span class="n">2 个</span></div>${gapsSide3()}`)}${sect("其他会话", others())}`;
      const P6 = {
        title: "6 · 升级后、这一级的课还没排出来时的主页",
        why: "刚升到第 3 级，排计划会话开着、还在跟你确认课表（agent 先问再写）。也可能排计划没开成、或者你关掉了：那时按钮是“排计划”。步骤条按 2 选的样子（这里画 2A）。",
        opts: [
          {
            L: "6A",
            reco: true,
            name: "当前步骤卡换成“排计划”卡，步骤列表是空的占位",
            desc: "卡片：排计划图标、“第 3 级还没排课”、一句说明、按钮（开着时“回到会话”，没开时“开始排计划”）。下面“第 3 级的步骤”是一块虚线占位。",
            w: 720,
            build: () =>
              homeWin3(
                `${head3()}<div style="margin-top:16px"><div class="card hero"><div class="eyebrow" style="display:flex;align-items:center;gap:5px">${ic("Target02", "s14")}第 3 级 · 排计划</div><div class="big">第 3 级还没排课</div><div class="desc">排计划会话按阶梯和带来的 2 个漏洞排出这一级的课，问过你才写进去。</div><div class="row2"><span class="live"></span><button class="btn outline">回到会话</button></div></div></div>${sect("第 3 级的步骤", `<div class="emptyph">课排出来以后列在这里，后面接速查表、过关项目、综合测验、升级。</div>`)}`,
                side6(),
                560,
                planStrip(),
              ),
          },
          {
            L: "6B",
            name: "步骤列表画出固定的 4 步，课的位置一行虚线",
            desc: "当前步骤卡同 A。步骤列表第一行是虚线框“等排计划会话排出课”（行尾“回到会话”），下面照常是速查表、过关项目、综合测验、升到第 4 级 4 行（灰的）。一眼看到这一级的形状。",
            w: 720,
            build: () => {
              const S = [
                { t: "速查表", k: "sheet" },
                { t: "过关项目：可插拔的输出格式", k: "project" },
                { t: "综合测验", k: "exam" },
                { t: "升到第 4 级", k: "up" },
              ];
              return homeWin3(
                `${head3()}<div style="margin-top:16px"><div class="card hero"><div class="eyebrow" style="display:flex;align-items:center;gap:5px">${ic("Target02", "s14")}第 3 级 · 排计划</div><div class="big">第 3 级还没排课</div><div class="row2"><span class="live"></span><button class="btn outline">回到会话</button></div></div></div>${sect(
                  "第 3 级的步骤",
                  `<div class="lessons"><div class="dashrow">${ic("Target02", "s14")}<span>等排计划会话排出课</span><span class="sp"></span><span class="inline-link">回到会话</span></div>${S.map((s, i) => row(i, { steps: S })).join("")}</div>`,
                )}`,
                side6(),
                560,
                planStrip(),
              );
            },
          },
          {
            L: "6C",
            name: "主页照常，只有步骤条上有按钮",
            desc: "不加卡片：没有当前步骤卡，步骤列表只有一行灰字“还没排课”。要做的事只在步骤条上（回到会话 / 排计划）。最省，但主页上看不出该干什么。",
            w: 720,
            build: () =>
              homeWin3(
                `${head3()}${sect("第 3 级的步骤", `<div class="lessons" style="padding:12px 14px;color:var(--text-dim);font-size:var(--fs-meta)">还没排课</div>`)}`,
                side6(),
                560,
                planStrip(),
              ),
          },
        ],
      };

      /* =====================================================================
         7 · 学习工具在过程轨道上的样子
         ===================================================================== */
      const turnCard = (label, inner) =>
        `<div class="win"><div class="strip-label">${label}</div><div class="conv" style="padding-top:8px">${inner}</div></div>`;
      const phead = (t) =>
        `<div class="phead"><span class="dim" style="display:inline-flex;transform:rotate(90deg)">${ic("ArrowRight01", "s12")}</span>${t}</div>`;
      const P7_A = () =>
        `<div class="stack">${turnCard(
          "测验 · 答完第 5 题以后",
          `${phead("已完成，用时 18 秒")}<div class="rail"><div class="rs"><span class="v">调用</span><span class="tool">study_add_gap</span><span class="o dim">{ text: "Rc 和 Arc 的区别…" }</span></div><div class="rs"><span class="v">调用</span><span class="tool">study_report</span><span class="o dim">{ score: 32, of: 50 }</span></div></div><div class="reply"><p><b>测验结束 · 32 / 50</b>。记下了 1 个漏洞。</p></div>`,
        )}${turnCard(
          "费曼 · 讲清楚以后",
          `${phead("已完成，用时 9 秒")}<div class="rail"><div class="rs"><span class="v">写入</span><span class="o">notes/费曼-Rc-与-Arc.md</span></div><div class="rs"><span class="v">调用</span><span class="tool">study_fix_gap</span><span class="o dim">{}</span></div></div>`,
        )}${turnCard(
          "排计划 · 你确认以后",
          `${phead("已完成，用时 6 秒")}<div class="rail"><div class="rs"><span class="v">调用</span><span class="tool">study_set_steps</span><span class="o dim">{ lessons: ["trait 是什么", …] }</span></div></div>`,
        )}</div>`;
      const P7_B = (sq) => {
        const c = (k) => (sq ? `sq-${k}` : "");
        return `<div class="stack">${turnCard(
          "测验 · 答完第 5 题以后（第二行点开了）",
          `${phead("已完成，用时 18 秒")}<div class="rail"><div class="rs ${c("attn")}"><span class="v">记下漏洞</span><span class="dot">·</span><span class="o">Rc 和 Arc 的区别，什么时候要配 RefCell</span><span class="chev">${ic("ArrowRight01", "s12")}</span></div><div class="rs"><span class="v">报告</span><span class="dot">·</span><span class="o">测验 32 / 50</span><span class="chev" style="transform:rotate(90deg)">${ic("ArrowRight01", "s12")}</span></div><div class="detail"><span class="k">study_report</span>  { "score": 32, "of": 50 }\n<span class="k">写到</span>  第 2 级第 5 步 · 测验</div></div><div class="reply"><p><b>测验结束 · 32 / 50</b>。记下了 1 个漏洞。</p></div>`,
        )}${turnCard(
          "费曼 · 讲清楚以后",
          `${phead("已完成，用时 9 秒")}<div class="rail"><div class="rs"><span class="v">写入</span><span class="o">notes/费曼-Rc-与-Arc.md</span></div><div class="rs ${c("ok")}"><span class="v">补上漏洞</span><span class="dot">·</span><span class="o">Rc 和 Arc 的区别，什么时候要配 RefCell</span><span class="chev">${ic("ArrowRight01", "s12")}</span></div></div>`,
        )}${turnCard(
          "排计划 · 你确认以后",
          `${phead("已完成，用时 6 秒")}<div class="rail"><div class="rs"><span class="v">排了课</span><span class="dot">·</span><span class="o">第 3 级 · 6 节</span><span class="chev">${ic("ArrowRight01", "s12")}</span></div></div>`,
        )}</div>`;
      };
      const P7 = {
        title: "7 · 学习工具在过程轨道上的样子",
        why: "study_report、study_add_gap、study_fix_gap、study_set_steps 四个工具。宿主只给工具名和参数，说法由界面按工具名写。这一处第一阶段没有预设推荐。",
        opts: [
          {
            L: "7A",
            name: "普通工具步骤，不改",
            desc: "同别的扩展工具：“调用 工具名”加参数摘要。不用改过程轨道，但学生看到的是英文工具名和 JSON。",
            w: 520,
            build: P7_A,
          },
          {
            L: "7B",
            name: "一行人话，点开看参数",
            desc: "“记下漏洞 · 文字”“报告 · 测验 32 / 50”“补上漏洞 · 文字”“排了课 · 第 3 级 · 6 节”；节点是普通圆点；点开是详情块（工具名、参数、写到第几级第几步）。",
            w: 520,
            build: () => P7_B(false),
          },
          {
            L: "7C",
            name: "同 B，记漏洞、补漏洞的节点换成主页漏洞的小方块",
            desc: "记下漏洞那一行的节点是 7px 橙色小方块（--attn），补上漏洞是绿色小方块（--ok），和主页漏洞列表的方块一致；别的同 B。",
            w: 520,
            build: () => P7_B(true),
          },
        ],
      };

      /* ---------- 渲染 ---------- */
      const PARTS = [P1, P2, P3, P4, P5, P6, P7];
      document.getElementById("toc").innerHTML = PARTS.map((p, k) => `<a href="#part-${k + 1}">${p.title}</a>`).join(
        "",
      );
      document.getElementById("parts").innerHTML = PARTS.map(
        (p, k) =>
          `<section class="part" id="part-${k + 1}"><h2>${p.title}</h2><p class="why">${p.why}</p>${p.opts
            .map(
              (o) =>
                `<div class="opt" id="opt-${o.L}"><div class="oh"><span class="letter">${o.L}</span><b>${o.name}</b>${o.reco ? `<span class="reco">推荐</span>` : ""}</div><p class="od">${o.desc}</p>${pair(o.build, o.w)}</div>`,
            )
            .join("")}${
            p.shared
              ? `<div class="opt"><div class="oh"><span class="letter" style="background:#6e6e74">共用</span><b>${p.shared.title}</b></div><p class="od">${p.shared.desc}</p>${pair(p.shared.build, p.shared.w)}</div>`
              : ""
          }</section>`,
      ).join("");
    </script>
  </body>
</html>
