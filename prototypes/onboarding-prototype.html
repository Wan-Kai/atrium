<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · 首次启动</title>
<!-- 原型：一次性代码，只用来看首次启动三种情况（没装 pi、没登录模型、没有项目）的样式。logo 是占位，等正式设计。 -->
<script>
  const pref = localStorage.getItem('atrium-proto-theme') || 'system';
  document.documentElement.dataset.theme = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';

<style>
:root, [data-theme="dark"] {
  color-scheme: dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --window: #0d1016; --main: #151517; --surface: #212123; --surface-2: #2c2c2e; --code: #19191b;
  --sidebar-bg: rgba(95, 102, 114, .42);
  --text: #f9fafb; --text-2: #e7e9ec; --text-3: #cfd3d6; --muted: #adb2b8; --dim: #81858c;
  --line: rgba(255, 255, 255, .10); --line-soft: rgba(255, 255, 255, .06); --hover: rgba(255, 255, 255, .05); --selected: rgba(255, 255, 255, .08);
  --accent: #7aaaff; --accent-soft: rgba(122, 170, 255, .14); --on-accent: #fff; --btn-primary: #f2f3f5; --on-primary: #151517;
  --ok: #4ade80; --attn: #f0a24e; --danger: #f25a5a;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px rgba(0,0,0,.35);
}
[data-theme="light"] {
  color-scheme: light;
  --window: #e8ecf2; --main: #ffffff; --surface: #f5f5f7; --surface-2: #ececef; --code: #f6f6f8;
  --sidebar-bg: rgba(246, 247, 250, .58);
  --text: #1d1d1f; --text-2: #2c2c30; --text-3: #48484e; --muted: #6e6e74; --dim: #a1a1a7;
  --line: rgba(0, 0, 0, .08); --line-soft: rgba(0, 0, 0, .05); --hover: rgba(0, 0, 0, .035); --selected: rgba(0, 0, 0, .06);
  --accent: #2f6fed; --accent-soft: rgba(47, 111, 237, .10); --on-accent: #fff; --btn-primary: #1d1d1f; --on-primary: #fff;
  --ok: #1e8e3e; --attn: #c96509; --danger: #e5484d;
  --shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; background: var(--window); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: default; }
.ease { transition: opacity .35s cubic-bezier(.2,.8,.2,1), transform .45s cubic-bezier(.2,.9,.25,1.05); }
.press { transition: transform .18s cubic-bezier(.2,.9,.25,1.2), background .15s; }
.press:active { transform: scale(.97); }

/* 窗口：侧栏 + 主区；前两种情况侧栏收起，只留红绿灯 */
.sidebar { width: 270px; flex: none; position: relative; background: var(--sidebar-bg); backdrop-filter: blur(32px) saturate(1.3); display: flex; flex-direction: column; padding: 12px 12px; transition: width .45s cubic-bezier(.2,.9,.25,1), padding .45s; overflow: hidden; }
body.setup .sidebar { width: 0; padding: 0; }
.lights { position: fixed; top: 18px; left: 20px; display: flex; gap: 8px; z-index: 5; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.new-btn { margin-top: 40px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; background: var(--btn-primary-soft, rgba(255,255,255,.75)); box-shadow: 0 0 0 .5px var(--line), 0 1px 2px rgba(0,0,0,.04); color: var(--text-2); white-space: nowrap; }
[data-theme="dark"] .new-btn { background: rgba(255,255,255,.08); }
.sec { display: flex; align-items: center; height: 34px; margin-top: 14px; padding: 0 4px 0 8px; color: var(--muted); white-space: nowrap; }
.sec .lbl { flex: 1; }
.side-empty { margin: 6px 8px; color: var(--dim); font-size: 12px; white-space: nowrap; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; color: var(--text-2); white-space: nowrap; }

.main { flex: 1; min-width: 0; background: var(--main); display: flex; align-items: center; justify-content: center; position: relative; }
body:not(.setup) .main { border-left: .5px solid var(--line); }
.stage { width: 520px; max-width: calc(100% - 48px); }
.stage.wide { width: 560px; }

/* logo 占位 */
.logo { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 22px; color: var(--dim); font-size: 11px; letter-spacing: .04em;
  background: repeating-linear-gradient(135deg, var(--surface) 0 6px, var(--surface-2) 6px 12px); box-shadow: inset 0 0 0 .5px var(--line); }

/* 步骤点：安装 pi → 登录模型 → 添加项目 */
.steps { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
.steps i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .4s cubic-bezier(.2,.9,.25,1), background .3s; }
.steps i.on { width: 18px; background: var(--text-3); }
.steps i.done { background: var(--dim); }

h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.lead { margin: 8px 0 26px; text-align: center; color: var(--muted); }

/* 命令块 */
.cmd { border-radius: 14px; background: var(--code); box-shadow: inset 0 0 0 .5px var(--line); overflow: hidden; }
.cmd .tabs { display: flex; gap: 2px; padding: 6px 6px 0; }
.cmd .tab { height: 28px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-size: 12.5px; }
.cmd .tab.on { background: var(--selected); color: var(--text); }
.cmd .line { display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 16px; font: 12.5px/1.5 var(--mono); color: var(--text-2); }
.cmd .line code { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-all; }
.cmd .line code .p { color: var(--dim); user-select: none; }
.ibtn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
.ibtn:hover { background: var(--hover); color: var(--text); }

.actions { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 22px; }
.btn { height: 36px; padding: 0 18px; border-radius: 12px; display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.btn.primary { background: var(--btn-primary); color: var(--on-primary); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { color: var(--muted); font-weight: 400; height: 28px; padding: 0 10px; border-radius: 8px; font-size: 13px; }
.btn.ghost:hover { background: var(--hover); color: var(--text-2); }
.note { margin-top: 18px; text-align: center; color: var(--dim); font-size: 12px; }
.note .bad { color: var(--attn); }
.log { margin-top: 16px; height: 96px; overflow: hidden; border-radius: 12px; background: var(--code); box-shadow: inset 0 0 0 .5px var(--line); padding: 10px 14px; font: 11.5px/1.65 var(--mono); color: var(--dim); display: flex; flex-direction: column; justify-content: flex-end; }
.log.tall { height: 150px; }
.log .last { color: var(--text-3); }
.log .err { color: var(--danger); }
.status { display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; color: var(--text-2); font-weight: 500; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--danger); }
.manual { margin-top: 18px; }
.manual summary { list-style: none; display: flex; justify-content: center; color: var(--muted); font-size: 13px; padding: 6px; border-radius: 8px; cursor: default; }
.manual summary::-webkit-details-marker { display: none; }
.manual summary:hover { color: var(--text-2); }
.manual[open] summary { margin-bottom: 10px; }
.manual .row2 { display: flex; justify-content: center; gap: 4px; margin-top: 10px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 1.6px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 登录：订阅列表 */
.list { border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 .5px var(--line-soft); padding: 4px; }
.prov { width: 100%; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px; border-radius: 12px; text-align: left; }
.prov:hover { background: var(--hover); }
.prov .mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; flex: none; }
.prov .nm { flex: 1; min-width: 0; }
.prov .nm b { display: block; font-weight: 500; color: var(--text); }
.prov .nm span { display: block; font-size: 12px; color: var(--dim); }
.prov .go { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.prov.busy .go { color: var(--accent); }
.prov.ok .go { color: var(--ok); }
.prov + .prov { position: relative; }
.prov + .prov::before { content: ''; position: absolute; left: 52px; right: 12px; top: 0; height: .5px; background: var(--line-soft); }
.more { margin-top: 10px; }
.more summary { list-style: none; display: flex; justify-content: center; color: var(--muted); font-size: 13px; cursor: default; padding: 6px; border-radius: 8px; }
.more summary::-webkit-details-marker { display: none; }
.more summary:hover { color: var(--text-2); }
.keyrow { display: flex; gap: 8px; margin-top: 8px; }
.field { height: 36px; border-radius: 10px; border: 0; padding: 0 12px; background: var(--surface); box-shadow: inset 0 0 0 .5px var(--line); color: var(--text); font: 13px var(--font); outline: none; }
.field:focus { box-shadow: inset 0 0 0 .5px var(--accent), 0 0 0 3px var(--accent-soft); }
select.field { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 14px) 16px, calc(100% - 10px) 16px; background-size: 4px 4px; background-repeat: no-repeat; }

/* 没有项目：主区居中的欢迎 */
.hero-actions { display: flex; justify-content: center; gap: 10px; }
.btn.secondary { background: var(--surface); box-shadow: inset 0 0 0 .5px var(--line); color: var(--text-2); }
.btn.secondary:hover { background: var(--surface-2); }
.found { margin-top: 34px; }
.found .hd { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 8px; color: var(--muted); font-size: 13px; }
.found .hd span { color: var(--dim); font-size: 12px; }
.dir { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 8px 0 12px; border-radius: 12px; }
.dir:hover { background: var(--hover); }
.dir .nm { flex: 1; min-width: 0; }
.dir .nm b { display: block; font-weight: 500; }
.dir .nm span { display: block; font-size: 12px; color: var(--dim); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dir .meta { color: var(--dim); font-size: 12px; white-space: nowrap; }
.pill { height: 26px; padding: 0 12px; border-radius: 999px; box-shadow: inset 0 0 0 .5px var(--line); color: var(--text-2); font-size: 12.5px; }
.pill:hover { background: var(--hover); }
.pill.added { color: var(--ok); box-shadow: none; }

/* 原型控制条 */
.bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 14px; background: rgba(28,28,30,.86); backdrop-filter: blur(20px); box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 10; }
.bar button { height: 30px; padding: 0 12px; border-radius: 10px; color: rgba(255,255,255,.7); font-size: 12.5px; white-space: nowrap; }
.bar button.on { background: rgba(255,255,255,.14); color: #fff; }
.bar .sep { width: 1px; margin: 6px 4px; background: rgba(255,255,255,.14); }
.bar .tag { align-self: center; padding: 0 8px; color: #f0a24e; font-size: 11px; font-weight: 600; }
</style>
</head>
<body class="setup">
<div class="lights"><i></i><i></i><i></i></div>
<aside class="sidebar">
  <button class="new-btn press" id="newChat"></button>
  <div class="sec"><span class="lbl">项目</span></div>
  <div class="side-empty">还没有项目</div>
  <div class="side-foot" id="gear"></div>
</aside>
<main class="main"><div class="stage ease" id="stage"></div></main>

<div class="bar" id="bar">
  <span class="tag">原型</span>
  <button data-s="nopi">没装 pi</button><button data-s="fail">安装失败</button><button data-s="nonode">缺 Node.js</button><button data-s="oldpi">pi 太旧</button><button data-s="login">没登录模型</button><button data-s="noproj">没有项目</button>
  <span class="sep"></span>
  <button data-t="light">浅色</button><button data-t="dark">深色</button>
</div>

<script>
const I = {   // Phosphor regular
  copy: '<path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/>',
  check: '<path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"/>',
  arrow: '<path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/>',
  folderPlus: '<path d="M216,72H130.67L102.93,51.2a16.12,16.12,0,0,0-9.6-3.2H40A16,16,0,0,0,24,64V200a16,16,0,0,0,16,16H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72Zm0,128H40V64H93.33L123.2,86.4A8,8,0,0,0,128,88h88Zm-56-56a8,8,0,0,1-8,8H136v16a8,8,0,0,1-16,0V152H104a8,8,0,0,1,0-16h16V120a8,8,0,0,1,16,0v16h16A8,8,0,0,1,160,144Z"/>',
  plusCircle: '<path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z"/>',
  gear: '<path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm109.94-52.79a8,8,0,0,0-3.89-5.4l-29.83-17-.12-33.62a8,8,0,0,0-2.83-6.08,111.91,111.91,0,0,0-36.72-20.67,8,8,0,0,0-6.46.59L128,41.85,97.88,25a8,8,0,0,0-6.47-.6A112.1,112.1,0,0,0,54.73,45.15a8,8,0,0,0-2.83,6.07l-.15,33.65-29.83,17a8,8,0,0,0-3.89,5.4,106.47,106.47,0,0,0,0,41.56,8,8,0,0,0,3.89,5.4l29.83,17,.12,33.62a8,8,0,0,0,2.83,6.08,111.91,111.91,0,0,0,36.72,20.67,8,8,0,0,0,6.46-.59L128,214.15,158.12,231a7.91,7.91,0,0,0,3.9,1,8.09,8.09,0,0,0,2.57-.42,112.1,112.1,0,0,0,36.68-20.73,8,8,0,0,0,2.83-6.07l.15-33.65,29.83-17a8,8,0,0,0,3.89-5.4A106.47,106.47,0,0,0,237.94,107.21Zm-15,34.91-28.57,16.25a8,8,0,0,0-3,3c-.58,1-1.19,2.06-1.81,3.06a7.94,7.94,0,0,0-1.22,4.21l-.15,32.25a95.89,95.89,0,0,1-25.37,14.3L134,199.13a8,8,0,0,0-3.91-1h-.19c-1.21,0-2.43,0-3.64,0a8.08,8.08,0,0,0-4.1,1l-28.84,16.1A96,96,0,0,1,67.88,201l-.11-32.2a8,8,0,0,0-1.22-4.22c-.62-1-1.23-2-1.8-3.06a8.09,8.09,0,0,0-3-3.06l-28.6-16.29a90.49,90.49,0,0,1,0-28.26L61.67,97.63a8,8,0,0,0,3-3c.58-1,1.19-2.06,1.81-3.06a7.94,7.94,0,0,0,1.22-4.21l.15-32.25a95.89,95.89,0,0,1,25.37-14.3L122,56.87a8,8,0,0,0,4.1,1c1.21,0,2.43,0,3.64,0a8.08,8.08,0,0,0,4.1-1l28.84-16.1A96,96,0,0,1,188.12,55l.11,32.2a8,8,0,0,0,1.22,4.22c.62,1,1.23,2,1.8,3.06a8.09,8.09,0,0,0,3,3.06l28.6,16.29A90.49,90.49,0,0,1,222.9,142.12Z"/>',
};
const ic = (k, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 256 256" fill="currentColor">${I[k]}</svg>`;
document.getElementById('newChat').innerHTML = `${ic('plusCircle', 16)}新建对话`;
document.getElementById('gear').innerHTML = `${ic('gear', 17)}设置`;

const steps = n => `<div class="steps">${[0, 1, 2].map(i => `<i class="${i === n ? 'on' : i < n ? 'done' : ''}"></i>`).join('')}</div>`;
const CMDS = { npm: 'npm install -g --ignore-scripts @earendil-works/pi-coding-agent', sh: 'curl -fsSL https://pi.dev/install.sh | sh' };
let cmdTab = 'npm';
const cmdBlock = (tabs) => `<div class="cmd">${tabs ? `<div class="tabs">${Object.keys(CMDS).map(k => `<button class="tab press${k === cmdTab ? ' on' : ''}" data-cmd="${k}">${k === 'npm' ? 'npm' : '安装脚本'}</button>`).join('')}</div>` : ''}
  <div class="line"><code><span class="p">$ </span>${tabs ? CMDS[cmdTab] : 'pi update --self'}</code><button class="ibtn press" data-copy title="复制">${ic('copy', 15)}</button></div></div>`;

const PROV = [
  ['openai-codex', 'OpenAI', 'ChatGPT Plus / Pro', '#10a37f', 'G'],
  ['anthropic', 'Anthropic', 'Claude Pro / Max', '#d97757', 'A'],
  ['github-copilot', 'GitHub Copilot', 'Copilot 订阅', '#6e40c9', 'C'],
  ['kimi', 'Kimi Code', 'Kimi 订阅', '#4b4b55', 'K'],
];
let login = {};
let job = {};   // 一键安装 / 更新：state = run | ok | fail；lines = 输出
const LOGS = {
  pi: ['Checking Node.js 22.19.0+ … ok (v24.11.0)', 'Checking npm … ok (11.6.2)', 'Resolving @earendil-works/pi-coding-agent@latest … 0.99.2', 'Installing into ~/.pi/agent/bin …', 'added 214 packages in 9s', 'Linked pi → ~/.local/bin/pi', 'pi 0.99.2 installed'],
  update: ['Current version: 0.80.1', 'Latest version: 0.99.2', 'Updating @earendil-works/pi-coding-agent …', 'added 12 packages, changed 47 packages in 6s', 'pi 0.99.2 installed'],
  node: ['==> Fetching node 24.11.0', '==> Pouring node--24.11.0.arm64_sequoia.bottle.tar.gz', '==> Summary: /opt/homebrew/Cellar/node/24.11.0', 'node v24.11.0, npm 11.6.2'],
  fail: ['Checking Node.js 22.19.0+ … ok (v24.11.0)', 'Resolving @earendil-works/pi-coding-agent@latest … 0.99.2', 'npm error code ETIMEDOUT', 'npm error network request to https://registry.npmjs.org failed'],
};
const jobView = what => `${job.state === 'run' ? `<div class="status"><span class="spin"></span>正在${job.kind === 'update' ? '更新' : '安装'} ${what}…</div>`
  : job.state === 'ok' ? `<div class="status ok">${ic('check', 16)}${what} 已${job.kind === 'update' ? '更新' : '安装'}</div>`
  : `<div class="status bad">没有装好</div>`}
  <div class="log${job.state === 'fail' ? ' tall' : ''}">${job.lines.map((l, i) => `<div class="${/error/.test(l) ? 'err' : i === job.lines.length - 1 ? 'last' : ''}">${l}</div>`).join('')}</div>
  ${job.state === 'run' ? '<div class="actions"><button class="btn ghost press" data-cancel>取消</button></div>' : ''}
  ${job.state === 'fail' ? `<div class="actions"><button class="btn primary press" data-job="${job.kind}">重试</button></div><div class="note">常见原因：网络不通、npm 的全局目录没有写权限。也可以展开下面的命令自己装</div>` : ''}`;
const setupView = ({ title, lead, btn, hint, manual }) => `${steps(0)}<div class="logo">LOGO</div><h1>${title}</h1><p class="lead">${lead}</p>
  ${job.state ? jobView('pi') : `<div class="actions"><button class="btn primary press" data-job="${manual ? 'pi' : 'update'}">${btn}</button></div><div class="note">${hint}</div>`}
  <details class="manual"${job.state === 'fail' ? ' open' : ''}><summary>${manual ? '手动安装' : '手动更新'}</summary>${cmdBlock(manual)}
    <div class="row2"><button class="btn ghost press" data-recheck>我装好了，重新检测</button>${manual ? '<button class="btn ghost press">手动选择 pi 的位置</button>' : ''}</div></details>`;
async function runJob(kind) {
  const failing = kind === 'pi' && forceFail;
  job = { kind, state: 'run', lines: [] }; show(state, true);
  for (const l of LOGS[failing ? 'fail' : kind]) { await new Promise(r => setTimeout(r, 420)); if (job.state !== 'run') return; job.lines.push(l); show(state, true); }
  job.state = failing ? 'fail' : 'ok'; show(state, true);
  if (failing) return;
  await new Promise(r => setTimeout(r, 900));
  if (kind === 'node') { job = {}; state = 'nopi'; return runJob('pi'); }
  job = {}; show('login');
}
let forceFail = false;   // id → 'busy' | 'ok'

const VIEWS = {
  nopi: () => setupView({ title: '先装好 pi', lead: 'Atrium 用 pi 作为 agent 内核，这台电脑上还没有找到它。', btn: '安装 pi', hint: '运行 pi 官方的安装脚本，过程会显示在这里', manual: true }),
  nonode: () => `${steps(0)}<div class="logo">LOGO</div><h1>还需要 Node.js</h1>
    <p class="lead">pi 运行在 Node.js 22.19 或更高版本上，这台电脑上没有找到。装好后会接着安装 pi。</p>
    ${job.state ? jobView('Node.js') : `<div class="actions"><button class="btn primary press" data-job="node">用 Homebrew 安装 Node.js</button>
      <button class="btn ghost press">去 nodejs.org 下载安装包</button></div>`}`,
  oldpi: () => setupView({ title: 'pi 需要更新', lead: '找到的 pi 是 0.80.1，Atrium 需要 0.99 或更高的版本。', btn: '更新 pi', hint: '运行 pi update --self', manual: false }),
  login: () => `${steps(1)}<div class="logo">LOGO</div><h1>登录一个模型</h1>
    <p class="lead">用已有的订阅登录，凭据保存在 pi 里，终端里的 pi 也能用。</p>
    <div class="list">${PROV.map(([id, org, plan, color, ch]) => `<button class="prov press${login[id] ? ' ' + login[id] : ''}" data-login="${id}">
      <span class="mark" style="background:${color}">${ch}</span><span class="nm"><b>${org}</b><span>${plan}</span></span>
      <span class="go">${login[id] === 'busy' ? '<span class="spin"></span>在浏览器中完成登录' : login[id] === 'ok' ? ic('check', 13) + '已登录' : '登录'}</span></button>`).join('')}</div>
    <details class="more"><summary>使用 API Key</summary>
      <div class="keyrow"><select class="field" style="width:150px"><option>Anthropic</option><option>OpenAI</option><option>OpenRouter</option><option>DeepSeek</option></select>
      <input class="field" style="flex:1" placeholder="粘贴 API Key" type="password"><button class="btn primary press" style="height:36px">保存</button></div></details>
    ${Object.values(login).includes('ok') ? `<div class="actions"><button class="btn primary press" data-go="noproj">继续${ic('arrow', 15)}</button></div>` : ''}`,
  noproj: () => `<div class="logo">LOGO</div><h1>开始第一个项目</h1>
    <p class="lead">添加一个代码目录，agent 在里面读写代码；也可以先新建一个不绑定项目的对话。</p>
    <div class="hero-actions"><button class="btn primary press">${ic('folderPlus', 16)}添加项目</button><button class="btn secondary press">${ic('plusCircle', 15)}新建对话</button></div>
    <div class="found"><div class="hd">在 pi 的历史会话里找到这些目录<span>来自 ~/.pi/agent/sessions</span></div>
      ${[['atrium', '~/Documents/MT/projects/atrium', '23 个会话 · 今天'], ['my-blog', '~/code/my-blog', '6 个会话 · 3 天前'], ['dotfiles', '~/dotfiles', '2 个会话 · 上周']].map(([n, p, m]) => `<div class="dir">
        <span class="nm"><b>${n}</b><span>${p}</span></span><span class="meta">${m}</span><button class="pill press" data-add>添加</button></div>`).join('')}</div>`,
};
let state = 'nopi';
function show(s, instant) {
  if (s === 'fail') { forceFail = true; job = {}; s = 'nopi'; } else if (s !== state) { forceFail = false; job = {}; }
  state = s; document.body.classList.toggle('setup', s !== 'noproj');
  const stage = document.getElementById('stage');
  stage.classList.toggle('wide', s === 'noproj');
  const swap = () => { stage.innerHTML = VIEWS[s](); stage.style.opacity = 1; stage.style.transform = 'none'; };
  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === (forceFail && s === 'nopi' ? 'fail' : s)));
  if (instant) return swap();
  stage.style.opacity = 0; stage.style.transform = 'translateY(8px) scale(.99)'; setTimeout(swap, 180);
}
function setTheme(t) { localStorage.setItem('atrium-proto-theme', t); document.documentElement.dataset.theme = t; document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t)); }
setTheme(document.documentElement.dataset.theme);
show('nopi', true);

document.addEventListener('click', e => {
  const t = e.target;
  const b = t.closest('button, summary'); if (!b) return;
  if (b.dataset.s) return show(b.dataset.s);
  if (b.dataset.t) return setTheme(b.dataset.t);
  if (b.dataset.go) return show(b.dataset.go);
  if (b.dataset.cmd) { cmdTab = b.dataset.cmd; return show(state, true); }
  if ('copy' in b.dataset) { b.innerHTML = ic('check', 15); b.style.color = 'var(--ok)'; setTimeout(() => { b.innerHTML = ic('copy', 15); b.style.color = ''; }, 1200); return; }
  if (b.dataset.job) return runJob(b.dataset.job);
  if ('cancel' in b.dataset) { job = {}; return show(state, true); }
  if ('recheck' in b.dataset) {
    b.innerHTML = '<span class="spin"></span>正在检测';
    setTimeout(() => { if (state === 'nopi') { b.innerHTML = '<span style="color:var(--attn)">还是没找到 pi，装好后可能要重开终端</span>'; setTimeout(() => { b.textContent = '我装好了，重新检测'; }, 2200); } else show('login'); }, 900);
    return;
  }
  if (b.dataset.login) { const id = b.dataset.login; if (login[id]) return; login[id] = 'busy'; show('login', true); setTimeout(() => { login[id] = 'ok'; show('login', true); }, 1600); return; }
  if ('add' in b.dataset) { b.textContent = '已添加'; b.classList.add('added'); }
});
</script>
</body>
</html>
