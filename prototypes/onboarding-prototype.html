<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · 首次启动</title>
<!-- 标题字体：中文汇文明朝体，英文 Syne（SIL OFL）。本地子集，只含标题用字。正文仍用系统字体。 -->
<link rel="stylesheet" href="fonts/onboarding-title.css">
<script>
  const pref = localStorage.getItem('atrium-proto-theme') || 'system';
  document.documentElement.dataset.theme = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
</script>
<style>
:root, [data-theme="dark"] {
  color-scheme: dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  --display: "Syne", "Atrium Title CN", -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;   /* 英文落到 Syne，中文落到汇文明朝体 */
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --bg: #121214; --glow-a: rgba(94, 132, 255, .20); --glow-b: rgba(255, 168, 108, .10); --glow-c: rgba(120, 220, 200, .08);
  --panel: rgba(255, 255, 255, .045); --panel-2: rgba(255, 255, 255, .07); --panel-edge: rgba(255, 255, 255, .09);
  --term: #0c0c0e; --term-edge: rgba(255, 255, 255, .08); --term-text: #d6d9de; --term-dim: #6f747c;
  --text: #f9fafb; --text-2: #e7e9ec; --text-3: #cfd3d6; --muted: #a3a8af; --dim: #74787f;
  --line: rgba(255, 255, 255, .09); --hover: rgba(255, 255, 255, .05); --selected: rgba(255, 255, 255, .09);
  --accent: #7aaaff; --accent-soft: rgba(122, 170, 255, .16);
  --primary: #f4f5f7; --on-primary: #121214; --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .14); --attn: #f0a24e; --danger: #f87171;
  --kbd: rgba(0, 0, 0, .12);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f7f9; --glow-a: rgba(94, 132, 255, .16); --glow-b: rgba(255, 168, 108, .14); --glow-c: rgba(80, 200, 180, .10);
  --panel: rgba(255, 255, 255, .72); --panel-2: rgba(255, 255, 255, .9); --panel-edge: rgba(0, 0, 0, .06);
  --term: #17181b; --term-edge: rgba(0, 0, 0, .1); --term-text: #d6d9de; --term-dim: #70757d;
  --text: #1d1d1f; --text-2: #2c2c30; --text-3: #48484e; --muted: #6e6e74; --dim: #a1a1a7;
  --line: rgba(0, 0, 0, .07); --hover: rgba(0, 0, 0, .035); --selected: rgba(0, 0, 0, .055);
  --accent: #2f6fed; --accent-soft: rgba(47, 111, 237, .10);
  --primary: #1d1d1f; --on-primary: #fff; --ok: #1e8e3e; --ok-soft: rgba(30, 142, 62, .10); --attn: #c96509; --danger: #dc2626;
  --kbd: rgba(255, 255, 255, .16);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: default; padding: 0; }

/* 环境光：很淡的三团光，给窗口一点空气感，不抢内容；随步骤缓慢移动 */
.ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(80px); transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.ambient i:nth-child(1) { width: 620px; height: 620px; left: -160px; top: -220px; background: var(--glow-a); }
.ambient i:nth-child(2) { width: 520px; height: 520px; right: -140px; bottom: -200px; background: var(--glow-b); }
.ambient i:nth-child(3) { width: 420px; height: 420px; right: 18%; top: -180px; background: var(--glow-c); }
body[data-step="1"] .ambient i:nth-child(1) { transform: translate(60px, 40px); }
body[data-step="2"] .ambient i:nth-child(1) { transform: translate(180px, 60px); }
body[data-step="3"] .ambient i:nth-child(1) { transform: translate(320px, 30px); }

/* 窗口骨架：顶部（红绿灯 + 步骤）、中间内容、底部操作条 */
.win { position: relative; height: 100%; display: grid; grid-template-rows: 64px 1fr 72px; }
.top { display: flex; align-items: center; justify-content: center; position: relative; }
.lights { position: absolute; left: 20px; top: 22px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }

/* 步骤条：数字 → 对勾；当前步骤加粗 */
.stepper { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--dim); transition: opacity .3s; }
.stepper .st { display: flex; align-items: center; gap: 7px; white-space: nowrap; transition: color .3s; }
.stepper .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); transition: all .35s cubic-bezier(.2,.9,.25,1.2); }
.stepper .st.cur { color: var(--text); font-weight: 500; }
.stepper .st.cur .n { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.stepper .st.done { color: var(--muted); }
.stepper .st.done .n { background: var(--ok-soft); color: var(--ok); box-shadow: none; }
.stepper .bar { width: 28px; height: 1px; background: var(--line); }
body[data-step="0"] .stepper { opacity: 0; }

.mid { overflow: auto; display: grid; place-items: center; padding: 8px 32px; }
.col { width: 560px; max-width: 100%; }
.screen { animation: in .5s cubic-bezier(.2,.9,.25,1) both; }
.screen.back { animation-name: in-back; }
@keyframes in { from { opacity: 0; transform: translateX(28px); } }
@keyframes in-back { from { opacity: 0; transform: translateX(-28px); } }

.eyebrow { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--dim); margin-bottom: 10px; }
h1 { margin: 0; text-align: center; font: 600 30px/1.2 var(--display); letter-spacing: -.02em; }
.lead { margin: 10px auto 28px; max-width: 480px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.55; }

/* 展示区：每一步一个"主视觉"，承担视觉重量（参考 Raycast 的展示面板） */
.show { border-radius: 20px; background: var(--panel); box-shadow: inset 0 0 0 .5px var(--panel-edge), 0 1px 2px rgba(0,0,0,.03), 0 20px 50px -20px rgba(0,0,0,.18); backdrop-filter: blur(24px) saturate(1.4); padding: 18px; }

/* 欢迎页：透亮的玻璃质感 + 产品预览，适合截图传播 */
body[data-step="0"] .win { grid-template-rows: 64px 1fr 0; }
body[data-step="0"] .foot { display: none; }
body[data-step="0"] .mid { overflow: hidden; place-items: start center; padding-top: clamp(0px, 2vh, 28px); }
body[data-step="0"] .col { width: 980px; }
.welcome { position: relative; text-align: center; }
/* 极光：产品预览后面的一团光，缓慢流动 */
.aurora { position: absolute; left: 50%; top: 300px; width: 1100px; height: 560px; transform: translateX(-50%); pointer-events: none; filter: blur(60px); opacity: var(--aurora-o, .9); }
.aurora i { position: absolute; border-radius: 50%; mix-blend-mode: var(--aurora-blend, multiply); animation: drift 14s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { left: 12%; top: 18%; width: 46%; height: 70%; background: radial-gradient(closest-side, rgba(92,140,255,.7), transparent); }
.aurora i:nth-child(2) { right: 10%; top: 8%; width: 44%; height: 72%; background: radial-gradient(closest-side, rgba(120,214,214,.5), transparent); animation-delay: -5s; }
.aurora i:nth-child(3) { left: 34%; top: 40%; width: 40%; height: 60%; background: radial-gradient(closest-side, rgba(255,170,120,.42), transparent); animation-delay: -9s; }
[data-theme="dark"] .aurora { --aurora-blend: screen; --aurora-o: .75; }
@keyframes drift { to { transform: translate(40px, -24px) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } }

/* 玻璃材质：半透明底 + 背景模糊 + 顶部高光 + 发丝边 */
.glass { background: linear-gradient(180deg, var(--g-top), var(--g-bot)); backdrop-filter: blur(28px) saturate(1.7); -webkit-backdrop-filter: blur(28px) saturate(1.7);
  box-shadow: inset 0 1px 0 var(--g-hi), inset 0 0 0 .5px var(--g-edge), 0 1px 2px rgba(0,0,0,.04), 0 24px 60px -24px var(--g-shadow); }
:root, [data-theme="dark"] { --pv-top: rgba(255,255,255,.08); --pv-bot: rgba(255,255,255,.03); --g-top: rgba(255,255,255,.10); --g-bot: rgba(255,255,255,.04); --g-hi: rgba(255,255,255,.18); --g-edge: rgba(255,255,255,.12); --g-shadow: rgba(0,0,0,.6); }
[data-theme="light"] { --pv-top: rgba(255,255,255,.62); --pv-bot: rgba(255,255,255,.34); --g-top: rgba(255,255,255,.82); --g-bot: rgba(255,255,255,.52); --g-hi: rgba(255,255,255,1); --g-edge: rgba(255,255,255,.9); --g-shadow: rgba(50,80,170,.28); }

/* logo 位：玻璃方块里放一个占位图形（同心圆角方框，暗示"中庭"），等正式 logo */
.gmark { position: relative; width: 68px; height: 68px; margin: 0 auto 18px; border-radius: 22px; display: grid; place-items: center; }
.gmark i { position: absolute; border-radius: 30%; border: 1.5px solid; }
.gmark::before { content: ''; position: absolute; inset: -28px; border-radius: 50%; background: radial-gradient(closest-side, rgba(92,140,255,.28), transparent); z-index: -1; }
.gmark i:nth-child(1) { inset: 16px; border-color: rgba(92,140,255,.85); }
.gmark i:nth-child(2) { inset: 23px; border-color: rgba(120,200,210,.85); background: linear-gradient(135deg, rgba(92,140,255,.35), rgba(255,170,120,.35)); }
.gpill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 7px; border-radius: 999px; margin-bottom: 16px; font-size: 13px; color: var(--muted); text-decoration: none; transition: transform .2s cubic-bezier(.2,.9,.25,1.3); }
.gpill:hover { transform: translateY(-1px); }
.gpill .pimark { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06); }
.gpill .pimark svg { width: 16px; height: 16px; display: block; }
.gpill .by b { font: 700 13.5px/1 "Syne", var(--font); color: var(--text); letter-spacing: .01em; margin: 0 1px; }
.gpill .sep { width: 1px; height: 12px; background: var(--line); }
.gpill .go { display: inline-flex; color: var(--dim); transition: color .2s, transform .2s; }
.gpill:hover .go { color: var(--text-2); transform: translate(1px, -1px); }
h1.hero { font: 700 clamp(40px, 4.4vw, 60px)/1.12 var(--display); letter-spacing: -.01em; margin: 0;
  background: linear-gradient(180deg, var(--text) 35%, color-mix(in srgb, var(--text) 62%, transparent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-sub { margin: 14px auto 22px; max-width: 520px; color: var(--muted); font-size: 16px; line-height: 1.6; }
.hero-cta { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.hero-cta .hint { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12.5px; }
/* 主按钮两个方案（控制条切换）：B 液态玻璃、D 内光。按钮里只放"开始设置 →"，键盘提示放在下方小字 */
.cta-wrap { position: relative; display: grid; place-items: center; }
.cta-wrap::before { content: ''; position: absolute; width: 280px; height: 96px; border-radius: 50%; filter: blur(28px); opacity: var(--bed, 0); transition: opacity .4s;
  background: radial-gradient(closest-side at 35% 50%, rgba(94,132,255,.55), transparent), radial-gradient(closest-side at 70% 50%, rgba(255,170,120,.45), transparent); }
body.ctaB .cta-wrap { --bed: 1; }
.cta { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 32px; border-radius: 999px;
  font-weight: 600; font-size: 16px; line-height: 1; letter-spacing: .01em; transition: transform .25s cubic-bezier(.2,.9,.25,1.3), box-shadow .3s; }
.cta .arr { display: inline-block; transition: transform .35s cubic-bezier(.2,.9,.25,1.3); }
.cta:hover .arr { transform: translateX(3px); }
.cta:active { transform: scale(.98); }
/* B 液态玻璃 */
body.ctaB .cta { color: var(--text); background: var(--b-fill); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: inset 0 1px 1px var(--b-hi), inset 0 -1px 1px var(--b-lo), 0 10px 30px -12px var(--b-sh), 0 1px 2px rgba(0,0,0,.06); }
body.ctaB .cta::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; z-index: -1;
  background: linear-gradient(160deg, var(--b-rim1), transparent 40%, transparent 60%, var(--b-rim2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
body.ctaB .cta::after { content: ''; position: absolute; left: 14%; right: 14%; top: 2px; height: 45%; border-radius: 999px; z-index: -1; background: linear-gradient(180deg, var(--b-spec), transparent); }
body.ctaB .cta:hover { transform: translateY(-1px) scale(1.015); }
:root, [data-theme="dark"] { --b-fill: rgba(255,255,255,.08); --b-hi: rgba(255,255,255,.35); --b-lo: rgba(255,255,255,.06); --b-sh: rgba(0,0,0,.7); --b-rim1: rgba(255,255,255,.55); --b-rim2: rgba(255,255,255,.25); --b-spec: rgba(255,255,255,.14); }
[data-theme="light"] { --b-fill: rgba(255,255,255,.45); --b-hi: rgba(255,255,255,1); --b-lo: rgba(0,0,0,.04); --b-sh: rgba(60,80,160,.35); --b-rim1: rgba(255,255,255,1); --b-rim2: rgba(255,255,255,.7); --b-spec: rgba(255,255,255,.75); }
/* D 内光 */
body.ctaD .cta { overflow: hidden; color: #fff; background: #0f1014; height: 52px; padding: 0 30px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.06), 0 14px 34px -14px rgba(60,90,200,.6); }
body.ctaD .cta::before { content: ''; position: absolute; inset: -60% -20%; z-index: -1; filter: blur(18px); opacity: .55;
  background: radial-gradient(30% 60% at 25% 70%, #5e84ff, transparent 70%), radial-gradient(28% 60% at 60% 30%, #78d6d6, transparent 70%), radial-gradient(26% 55% at 85% 75%, #ffaa78, transparent 70%);
  animation: cta-flow 9s ease-in-out infinite alternate; transition: opacity .4s; }
body.ctaD .cta:hover::before { opacity: .8; }
[data-theme="dark"] body.ctaD .cta { box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 1px rgba(255,255,255,.12), 0 14px 34px -14px rgba(90,130,255,.55); }
@keyframes cta-flow { to { transform: translateX(14%) rotate(8deg); } }
/* 点阵扫光：一道反差色（白）的点阵斜着从左扫到右；平时每 6 秒扫一次，悬停时立刻扫一次并把文字放大一点 */
body.ctaD .cta::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  background-image: radial-gradient(circle, rgba(255,255,255,.95) 1.1px, transparent 1.6px); background-size: 6px 6px;
  -webkit-mask-image: linear-gradient(112deg, transparent 32%, #000 44%, #000 56%, transparent 68%); mask-image: linear-gradient(112deg, transparent 32%, #000 44%, #000 56%, transparent 68%);
  -webkit-mask-size: 250% 100%; mask-size: 250% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: 150% 0; mask-position: 150% 0;
  opacity: .9; animation: dots-idle 6s cubic-bezier(.45,.05,.25,1) 1.2s infinite; }
body.ctaD .cta:hover::after { opacity: 1; animation: dots-sweep .85s cubic-bezier(.3,.6,.2,1) forwards; }
body.ctaD .cta .lbl { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 10px; text-shadow: 0 0 10px rgba(15,16,20,.8); transition: transform .45s cubic-bezier(.2,.9,.25,1.2); }   /* 文字压在点阵上面 */
body.ctaD .cta:hover .lbl { transform: scale(1.05); }
@keyframes dots-idle { 0% { -webkit-mask-position: 150% 0; mask-position: 150% 0; } 22%, 100% { -webkit-mask-position: -50% 0; mask-position: -50% 0; } }
@keyframes dots-sweep { from { -webkit-mask-position: 150% 0; mask-position: 150% 0; } to { -webkit-mask-position: -50% 0; mask-position: -50% 0; } }
@media (prefers-reduced-motion: reduce) { body.ctaD .cta::before, body.ctaD .cta::after { animation: none; } body.ctaD .cta::after { opacity: 0; } }
.hero-cta .hint kbd { font: 600 11px var(--font); padding: 1px 6px; border-radius: 5px; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

/* 产品预览：一扇微微后仰的玻璃窗，下缘淡出 */
.stage3d { position: relative; margin: clamp(24px, 4vh, 40px) auto 0; width: 860px; perspective: 1600px; }
.preview { --g-top: var(--pv-top); --g-bot: var(--pv-bot); position: relative; height: clamp(240px, 38vh, 360px); border-radius: 18px 18px 0 0; overflow: hidden; transform: rotateX(12deg); transform-origin: 50% 0;
  -webkit-mask-image: linear-gradient(#000 45%, transparent 98%); mask-image: linear-gradient(#000 45%, transparent 98%); display: grid; grid-template-columns: 210px 1fr; text-align: left; }
.pv-side { padding: 38px 12px 12px; border-right: .5px solid var(--g-edge); background: var(--g-bot); font-size: 12.5px; }
.pv-dots { position: absolute; top: 14px; left: 16px; display: flex; gap: 6px; }
.pv-dots i { width: 9px; height: 9px; border-radius: 50%; } .pv-dots i:nth-child(1) { background: #ff5f57; } .pv-dots i:nth-child(2) { background: #febc2e; } .pv-dots i:nth-child(3) { background: #28c840; }
.pv-sec { color: var(--dim); font-size: 11px; margin: 10px 8px 4px; }
.pv-row { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; color: var(--text-2); white-space: nowrap; }
.pv-row.sel { background: var(--selected); }
.pv-row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.pv-row .a { color: var(--attn); font-weight: 600; font-size: 11.5px; }
.pv-row .g { color: var(--ok); font-size: 11.5px; }
.pv-row .d { width: 6px; height: 6px; border-radius: 50%; background: var(--attn); }
.pv-main { padding: 40px 34px 0; font-size: 13px; }
.pv-user { margin-left: auto; width: fit-content; max-width: 70%; padding: 9px 14px; border-radius: 16px; background: var(--selected); color: var(--text-2); }
.pv-proc { margin: 18px 0 10px; color: var(--muted); font-size: 12.5px; }
.pv-proc em { font-style: normal; color: var(--text-3); }
.pv-reply { color: var(--text-2); line-height: 1.65; }
.pv-reply code { font: 12px var(--mono); padding: 1px 6px; border-radius: 6px; background: var(--selected); }
.pv-status { display: flex; gap: 18px; justify-content: center; margin-top: 22px; color: var(--dim); font-size: 12px; }
/* 浮在预览上的三枚说明徽章 */
.callout { position: absolute; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px; border-radius: 12px; font-size: 13px; color: var(--text-2); white-space: nowrap; z-index: 2; animation: float 6s ease-in-out infinite alternate; }
.callout svg { color: var(--accent); }
.callout.c1 { left: -150px; top: 110px; } .callout.c2 { right: -170px; top: -14px; animation-delay: -2s; } .callout.c3 { right: -150px; top: 196px; animation-delay: -4s; }
@keyframes float { to { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .callout { animation: none; } }

/* 终端：安装 / 更新的主视觉，安装时直接变成实时日志 */
.term { border-radius: 14px; background: var(--term); box-shadow: inset 0 0 0 .5px var(--term-edge), 0 24px 48px -24px rgba(0,0,0,.5); overflow: hidden; color: var(--term-text); }
.term .tb { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: .5px solid rgba(255,255,255,.06); }
.term .tb i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.14); }
.term .tb span { flex: 1; text-align: center; margin-right: 33px; font-size: 11.5px; color: var(--term-dim); }
.term .body { max-height: 168px; padding: 14px 16px; font: 12px/1.75 var(--mono); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }   /* 高度随内容增长，最多约 7 行，超出时只露出最新的几行 */
.term .body .p { color: var(--term-dim); }
.term .body .ok { color: #4ade80; } .term .body .err { color: #f87171; }
.term .body .cur::after { content: ''; display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: var(--term-text); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.term .prog { height: 2px; background: rgba(255,255,255,.06); }

            <div class="pv-proc">已完成，用时 2 分 13 秒 · <em>读了 3 个文件</em> · <em>改了 2 个文件</em> · 跑了 2 条命令</div>
            <div class="pv-reply">改好了。收件箱是会话列表的派生视图：<code>Inbox.tsx</code> 筛出等你处理的会话，<code>Sidebar.tsx</code> 把它挂在项目列表上方。6 条测试全部通过。</div>
            <div class="pv-status"><span>1 轮 7 步 · 48 tok/s</span><span>1.3M tok · 缓存命中 73%</span><span>上下文 42%</span></div>
          </div>
        </div>
      </div>
    </div>`,
    foot: '',
  }),
  nopi: () => ({
    eyebrow: '第 1 步 · 安装 pi', title: job?.state === 'fail' ? '没有装好' : job?.state === 'ok' ? 'pi 已就绪' : '先装好 pi',
    lead: job?.state === 'fail' ? '多半是网络问题。可以重试，或者复制命令在终端里自己装。' : job?.state === 'ok' ? '装好了，终端里也能直接用 pi。' : 'Atrium 用 pi 作为 agent 内核，这台电脑上还没有找到它。',
    html: `<div class="show">${termView('安装 pi', CMDS[cmdTab])}${manualRow(true)}</div>`,
    foot: footFor('pi', '安装 pi', '我已经装好了', true),
  }),
  oldpi: () => ({
    eyebrow: '第 1 步 · 更新 pi', title: job?.state === 'ok' ? 'pi 已更新' : 'pi 需要更新', lead: '找到的 pi 是 0.80.1，Atrium 需要 0.99 或更高的版本。',
    html: `<div class="show">${termView('更新 pi', 'pi update --self')}${manualRow(false)}</div>`,
    foot: footFor('update', '更新 pi', '我已经更新了', false),
  }),
  nonode: () => ({
    eyebrow: '第 1 步 · 安装 pi', title: '还需要 Node.js', lead: 'pi 运行在 Node.js 上。用 Homebrew 装好后，会接着安装 pi。',
    html: `<div class="need"><span class="miss">Node.js 22.19+ 未找到</span><span>Homebrew 已安装</span></div>
      <div class="show">${termView('安装 Node.js', 'brew install node')}${manualRow(false)}</div>`,
    foot: job?.state === 'run' ? `<button class="btn ghost" data-cancel>取消</button><span class="sp"></span><button class="btn primary" disabled><span class="spin"></span>正在安装</button>`
      : `<button class="btn ghost">去 nodejs.org 下载</button><span class="sp"></span><button class="btn primary" data-job="node">用 Homebrew 安装 ${enter}</button>`,
  }),
  login: () => ({
    eyebrow: '第 2 步 · 登录模型', title: '登录一个模型', lead: '凭据保存在 pi 里，终端里的 pi 也能直接用。',
    html: `<div class="seg"><button class="${loginTab === 'sub' ? 'on' : ''}" data-tab="sub">用订阅登录</button><button class="${loginTab === 'key' ? 'on' : ''}" data-tab="key">使用 API Key</button></div>
      ${loginTab === 'sub' ? `<div class="show group">${PROV.map(([id, nm, plan, src, full]) => `<div class="prow${login[id] ? ' ' + login[id] : ''}">
          <span class="blogo"><img class="${full ? 'full' : ''}" src="${src}" alt="${nm}"></span>
          <span class="nm"><b>${nm}</b><small>${plan}</small></span>
          <span class="act">${login[id] === 'busy' ? `<span class="spin"></span>在浏览器中完成登录<button class="x" data-cancel-login="${id}">取消</button>`
            : login[id] === 'ok' ? ic('check', 14) + '已登录' : `<button class="pill" data-login="${id}">登录</button>`}</span></div>`).join('')}</div>
        <div class="fine">点"登录"会打开浏览器，在官网完成授权后自动回到这里</div>`
      : `<div class="show keybox">
          <label>服务商<select class="field"><option>Anthropic</option><option>OpenAI</option><option>OpenRouter</option><option>DeepSeek</option><option>Google Gemini</option></select></label>
          <label>API Key<span class="row"><input class="field" style="flex:1" type="password" placeholder="粘贴 API Key"><button class="pill" data-savekey>保存</button></span></label>
          <a href="#">去哪里获取 API Key ↗</a></div>
        <div class="fine">Key 写在 <code>~/.pi/agent/auth.json</code>，只保存在这台电脑上</div>`}`,
    foot: `<button class="btn ghost" data-back="nopi">返回</button><span class="sp"></span>
      <button class="btn primary" data-next="project" ${Object.values(login).includes('ok') ? '' : 'disabled'}>继续 ${enter}</button>`,
  }),
  project: () => ({
    eyebrow: '第 3 步 · 添加项目', title: '从一个项目开始', lead: '选一个代码目录，agent 会在里面读写代码。以后随时可以再加。',
    html: `<button class="drop" id="drop">${ic('folder', 26)}<b>把项目文件夹拖到这里</b><span>或者点击选择</span></button>
      <div class="found"><div class="hd">在 pi 的历史会话里找到<span>~/.pi/agent/sessions</span></div>
      ${DIRS.map(([n, p, m]) => `<button class="dir${picked.has(n) ? ' on' : ''}" data-pick="${n}"><span class="cb">${ic('check', 11)}</span><span class="nm"><b>${n}</b><span>${p}</span></span><span class="meta">${m}</span></button>`).join('')}</div>`,
    foot: `<button class="btn ghost" data-back="login">返回</button><button class="btn ghost">先新建一个对话</button><span class="sp"></span>
      <button class="btn primary" ${picked.size ? '' : 'disabled'}>${picked.size ? `添加 ${picked.size} 个项目` : '添加项目'} ${enter}</button>`,
  }),
};
function footFor(kind, label, skip, back) {
  if (job?.state === 'run') return `<button class="btn ghost" data-cancel>取消</button><span class="sp"></span><button class="btn primary" disabled><span class="spin"></span>${kind === 'update' ? '正在更新' : '正在安装'}</button>`;
  if (job?.state === 'ok') return `<span class="sp"></span><button class="btn primary" data-next="login">继续 ${enter}</button>`;
  return `${back ? '<button class="btn ghost" data-back="welcome">返回</button>' : ''}<button class="btn ghost" data-recheck>${skip}</button><span class="sp"></span>
    <button class="btn primary" data-job="${kind}">${job?.state === 'fail' ? '重试' : label} ${enter}</button>`;
}

function render(animate) {
  const step = stepOf(screen);
  document.body.dataset.step = step;
  document.getElementById('stepper').innerHTML = STEPS.map(([t], i) => `${i ? '<span class="bar"></span>' : ''}<span class="st${i + 1 === step ? ' cur' : i + 1 < step ? ' done' : ''}"><span class="n">${i + 1 < step ? ic('check', 10) : i + 1}</span>${t}</span>`).join('');
  const v = SCREENS[screen]();
  const done = Math.max(0, step - 1);
  const rail = `<div class="rail"><div class="hd">${done} / 3 完成</div><div class="pg"><i style="width:${done / 3 * 100}%"></i></div>
    ${STEPS.map(([t, d], i) => `<div class="it${i + 1 === step ? ' cur' : i + 1 < step ? ' done' : ''}"><span class="dot">${ic('check', 11)}</span><span><b>${t}</b><span>${d}</span></span></div>`).join('')}</div>`;
  const head = v.title ? `<div class="eyebrow">${v.eyebrow}</div><h1>${v.title}</h1><p class="lead">${v.lead}</p>` : '';
  document.getElementById('col').innerHTML = `${rail}<div class="screen${dir < 0 ? ' back' : ''}" style="${animate ? '' : 'animation:none'}">${head}${v.html}</div>`;
  document.getElementById('foot').innerHTML = v.foot;
  document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === (forceFail ? 'fail' : screen)));
}
function go(s, d = 1) { if (s !== screen) job = null; dir = d; screen = s; render(true); }

async function runJob(kind) {
  const failing = forceFail && kind === 'pi';
  const lines = LOGS[failing ? 'fail' : kind];
  job = { kind, state: 'run', lines: [], total: lines.length }; render();
  for (const l of lines) { await new Promise(r => setTimeout(r, 450)); if (!job || job.state !== 'run') return; job.lines.push(l); render(); }
  job.state = failing ? 'fail' : 'ok'; render();
  if (!failing && kind === 'node') { await new Promise(r => setTimeout(r, 700)); job = null; screen = 'nopi'; render(true); runJob('pi'); }
}
function setCta(v) { document.body.classList.toggle('ctaB', v === 'B'); document.body.classList.toggle('ctaD', v === 'D'); localStorage.setItem('atrium-proto-cta', v); document.querySelectorAll('[data-cta]').forEach(b => b.classList.toggle('on', b.dataset.cta === v)); }
function setTheme(t) { localStorage.setItem('atrium-proto-theme', t); document.documentElement.dataset.theme = t; document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t)); }
function setVariant(v) { document.body.classList.toggle('vB', v === 'B'); localStorage.setItem('atrium-proto-onb', v); document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
setTheme(document.documentElement.dataset.theme);
setVariant(localStorage.getItem('atrium-proto-onb') || 'A');
setCta('D');   // 定稿：D 内光 + 点阵扫光
render(true);

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.v) return setVariant(d.v);
  if (d.cta) return setCta(d.cta);
  if (d.t) return setTheme(d.t);
  if (d.go) { forceFail = d.go === 'fail'; job = null; return go(forceFail ? 'nopi' : d.go); }
  if (d.next) return go(d.next, 1);
  if (d.back) return go(d.back, -1);
  if (d.job) return runJob(d.job);
  if ('cancel' in d) { job = null; return render(); }
  if (d.cmd) { cmdTab = d.cmd; return render(); }
  if ('copy' in d) { b.innerHTML = ic('check', 12) + '已复制'; setTimeout(() => render(), 1200); return; }
  if ('recheck' in d) { b.innerHTML = '<span class="spin"></span>正在检测'; setTimeout(() => { b.innerHTML = '<span style="color:var(--attn)">还是没找到，可能要重开终端</span>'; setTimeout(render, 2000); }, 900); return; }
  if (d.login) { const id = d.login; if (login[id]) return; login[id] = 'busy'; render(); setTimeout(() => { if (login[id] === 'busy') { login[id] = 'ok'; render(); } }, 2200); return; }
  if (d.tab) { loginTab = d.tab; return render(); }
  if (d.cancelLogin) { delete login[d.cancelLogin]; return render(); }
  if ('savekey' in d) { login.apikey = 'ok'; b.textContent = '已保存'; setTimeout(render, 900); return; }
  if (d.pick) { picked.has(d.pick) ? picked.delete(d.pick) : picked.add(d.pick); return render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && document.activeElement.tagName !== 'INPUT') { const p = document.querySelector('.foot .btn.primary:not([disabled]), .screen .btn.primary:not([disabled]), .screen .cta'); if (p) { e.preventDefault(); p.click(); } } });
const drop = () => document.getElementById('drop');
document.addEventListener('dragover', e => { e.preventDefault(); drop()?.classList.add('over'); });
document.addEventListener('dragleave', () => drop()?.classList.remove('over'));
</script>
</body>
</html>
