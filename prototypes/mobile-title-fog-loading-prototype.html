<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>对话页 · 标题雾和载入提示</title>
    <style>
      :root {
        --page: #f6f2e9;
        --note: #fffcf5;
        --text: #26221c;
        --text2: #4d473d;
        --l2: #8b8477;
        --l3: #b3ab9c;
        --tint: #8a7352;
        --code: #efe9dc;
        --desk: #e4ddcf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--desk);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          "PingFang SC",
          sans-serif;
      }
      header {
        padding: 24px 32px 4px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      h2 {
        margin: 26px 32px 0;
        font-size: 16px;
      }
      header p,
      .hint {
        margin: 0;
        color: var(--l2);
      }
      .hint {
        margin: 4px 32px 0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        padding: 16px 32px 24px;
      }
      figure {
        margin: 0;
        width: 302px;
      }
      figcaption {
        margin-top: 10px;
      }
      figcaption b {
        display: block;
        font-size: 15px;
      }
      figcaption span {
        color: var(--l2);
        font-size: 12.5px;
      }
      /* The phone: 402×874pt drawn at 0.75. */
      .phone {
        width: 302px;
        height: 656px;
        border-radius: 40px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 30px rgba(60, 45, 20, 0.18);
        background: var(--page);
      }
      .screen {
        position: absolute;
        left: 0;
        top: 0;
        width: 402px;
        height: 874px;
        transform: scale(0.75);
        transform-origin: 0 0;
        background: var(--page);
      }
      .scroll {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        padding: 127px 20px 140px;
        scrollbar-width: none;
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }
      .bubble {
        margin: 0 0 6px auto;
        width: fit-content;
        max-width: 80%;
        background: var(--note);
        border-radius: 18px 18px 6px 18px;
        padding: 10px 15px;
        box-shadow: 0 3px 10px rgba(60, 45, 20, 0.08);
        font-size: 16px;
      }
      .time {
        text-align: right;
        color: var(--l2);
        font-size: 12px;
        margin-bottom: 14px;
      }
      .rail {
        color: var(--l2);
        font-size: 14px;
        margin-bottom: 12px;
      }
      .h {
        font:
          700 22px/1.3 "PingFang SC",
          sans-serif;
        margin: 4px 0 10px;
      }
      .p {
        font-size: 16px;
        line-height: 1.75;
        margin: 0 0 12px;
      }
      .code {
        background: var(--code);
        border-radius: 12px;
        padding: 12px 14px;
        font:
          13px/1.6 ui-monospace,
          Menlo,
          monospace;
        color: var(--text2);
        margin: 0 0 22px;
      }
      /* Status bar and title bar, over the fog. */
      .status {
        position: absolute;
        top: 18px;
        left: 40px;
        right: 34px;
        display: flex;
        justify-content: space-between;
        font:
          600 17px/1 -apple-system,
          sans-serif;
        z-index: 5;
      }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        width: 124px;
        height: 36px;
        margin-left: -62px;
        background: #000;
        border-radius: 20px;
        z-index: 6;
      }
      .bar {
        position: absolute;
        top: 59px;
        left: 0;
        right: 0;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
        font:
          600 16px/1 -apple-system,
          "PingFang SC",
          sans-serif;
      }
      .glass {
        position: absolute;
        top: 3px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 252, 245, 0.75);
        box-shadow: 0 4px 14px rgba(60, 45, 20, 0.14);
        display: grid;
        place-items: center;
        font-size: 20px;
        color: var(--text);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }
      .back {
        left: 16px;
      }
      .more {
        right: 16px;
      }
      .fog {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        pointer-events: none;
        z-index: 4;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      /* Fog A: what the phone does now. 128pt, solid to 55%, material + 46% paper. */
      .fogA {
        height: 128px;
        -webkit-backdrop-filter: blur(14px) saturate(0.7);
        backdrop-filter: blur(14px) saturate(0.7);
        background: rgba(246, 242, 233, 0.46);
        -webkit-mask: linear-gradient(#000 0, #000 55%, transparent 100%);
        mask: linear-gradient(#000 0, #000 55%, transparent 100%);
      }
      /* Fog B: starts earlier — solid past the title bar, then fades over 60pt. */
      .fogB {
        height: 172px;
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        background: rgba(246, 242, 233, 0.72);
        -webkit-mask: linear-gradient(#000 0, #000 112px, transparent 172px);
        mask: linear-gradient(#000 0, #000 112px, transparent 172px);
      }
      /* Fog C: progressive blur — stronger toward the top, paper thick behind the title. */
      .fogC {
        height: 190px;
      }
      .fogC .l1 {
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
        -webkit-mask: linear-gradient(#000 0, #000 120px, transparent 190px);
        mask: linear-gradient(#000 0, #000 120px, transparent 190px);
      }
      .fogC .l2 {
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        -webkit-mask: linear-gradient(#000 0, #000 110px, transparent 160px);
        mask: linear-gradient(#000 0, #000 110px, transparent 160px);
      }
      .fogC .l3 {
        -webkit-backdrop-filter: blur(22px);
        backdrop-filter: blur(22px);
        -webkit-mask: linear-gradient(#000 0, #000 100px, transparent 130px);
        mask: linear-gradient(#000 0, #000 100px, transparent 130px);
      }
      .fogC .paper {
        background: linear-gradient(
          rgba(246, 242, 233, 0.82) 0,
          rgba(246, 242, 233, 0.78) 110px,
          rgba(246, 242, 233, 0) 190px
        );
      }
      /* Fog D: like B, with the paper a little thicker right behind the title words. */
      .fogD {
        height: 176px;
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        background: linear-gradient(
          rgba(246, 242, 233, 0.66) 0,
          rgba(246, 242, 233, 0.86) 70px,
          rgba(246, 242, 233, 0.8) 112px,
          rgba(246, 242, 233, 0) 176px
        );
        -webkit-mask: linear-gradient(#000 0, #000 118px, transparent 176px);
        mask: linear-gradient(#000 0, #000 118px, transparent 176px);
      }
      /* Loading rows. */
      .loadA {
        height: 18px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--l3);
        font-size: 12px;
      }
      .spin {
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--l3);
        border-top-color: transparent;
        border-radius: 50%;
        animation: rot 0.8s linear infinite;
      }
      @keyframes rot {
        to {
          transform: rotate(360deg);
        }
      }
      .pill {
        position: absolute;
        top: 116px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 13px;
        border-radius: 999px;
        background: var(--note);
        box-shadow: 0 4px 14px rgba(60, 45, 20, 0.12);
        font-size: 13px;
        color: var(--text2);
      }
      .rule {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--l2);
        font-size: 12.5px;
        margin: -40px 0 18px;
      }
      .rule::before,
      .rule::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(70, 55, 30, 0.12);
      }
      .skel {
        margin: -36px 0 20px;
      }
      .skel i {
        display: block;
        height: 12px;
        border-radius: 6px;
        margin: 0 0 9px;
        background: linear-gradient(90deg, #ebe5d8 0, #f3eee4 40%, #ebe5d8 80%);
        background-size: 300px 100%;
        animation: shimmer 1.2s linear infinite;
      }
      .skel .b {
        width: 52%;
        height: 38px;
        border-radius: 18px 18px 6px 18px;
        margin: 0 0 14px auto;
      }
      .skel .cap {
        color: var(--l3);
        font-size: 12px;
        text-align: center;
        margin-top: 4px;
      }
      @keyframes shimmer {
        from {
          background-position: -300px 0;
        }
        to {
          background-position: 300px 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>对话页：标题下的雾 · 载入更早的提示</h1>
      <p>
        每个手机都能上下滑。第一组看标题：内容滑到标题下面时，标题是否清楚、雾从哪里开始。第二组看停在顶上、正在载入时的样子。
      </p>
    </header>
    <h2>一、标题下的雾</h2>
    <p class="hint">往下滑一点，让正文的大标题、代码块经过标题栏。</p>
    <div class="row" id="fog"></div>
    <h2>二、正在载入更早的</h2>
    <p class="hint">停在会话最顶上，等更早的内容时（雾统一用 B）。</p>
    <div class="row" id="load"></div>
    <script>
      const turn = (n) => `
        <div class="bubble">第 ${n} 个问题：缓存为什么会过期？</div>
        <div class="time">10:${String(20 + n).padStart(2, "0")}</div>
        <div class="rail">› 用时 31 秒 · 读了 1 个文件</div>
        <div class="h">已修好缓存过期</div>
        <p class="p">原因是 <code>expiresAt</code> 存的是秒，比较时却用了毫秒。现在统一单位。</p>
        <p class="p">• 保留中文与 Latin 混排<br />• 读了 3 个文件，增加了 3 个测试</p>
        <div class="code">export function isFresh(entry: Entry) {<br />&nbsp;&nbsp;return entry.expiresAt * 1000 &gt; Date.now();<br />}</div>`;
      const chrome = `
        <div class="island"></div>
        <div class="status"><span>11:07</span><span>􀙇 ▮▮</span></div>
        <div class="bar"><div class="glass back">‹</div>修一下缓存过期<div class="glass more">⋯</div></div>`;
      const fogs = [
        ["A", "A 现在", "128pt 高、上 55% 实，系统薄材质 + 46% 纸色；标题正处在渐隐段，背后的字会透上来"],
        ["B", "B 提前起雾", "雾一直实到标题栏下沿再往下 3pt，然后 60pt 渐隐；纸色 72%，标题后面隐约有字但不抢"],
        ["C", "C 渐进模糊", "三层模糊叠出来，越往上越糊；纸色 82% 在标题后面，往下渐淡；最接近系统 iOS 26 的观感"],
        ["D", "D 标题处更厚", "同 B 的范围，但标题文字那一条纸色加到 86%，上下略薄；标题最清楚，背景字更隐"],
      ];
      const fogRow = document.getElementById("fog");
      for (const [id, title, note] of fogs) {
        const layers =
          id === "C"
            ? `<div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div><div class="layer paper"></div>`
            : "";
        fogRow.insertAdjacentHTML(
          "beforeend",
          `<figure><div class="phone"><div class="screen">
            <div class="scroll">${[0, 1, 2, 3].map(turn).join("")}</div>
            <div class="fog fog${id}">${layers}</div>${chrome}
          </div></div><figcaption><b>${title}</b><span>${note}</span></figcaption></figure>`,
        );
      }
      const loads = [
        ["A", "A 现在", "标题栏和第一轮之间空一大块，小转圈孤零零在中间"],
        ["B", "B 贴着标题的纸片", "一张小纸片浮在标题栏下面，内容不用让位；载入完就收起"],
        ["C", "C 细线分隔", "第一轮上方一行「—— 正在载入更早的 ——」，往上收紧，不留大空白"],
        ["D", "D 骨架占位", "在更早那一轮会出现的位置画两三条淡色骨架，告诉你内容马上来"],
      ];
      const loadRow = document.getElementById("load");
      for (const [id, title, note] of loads) {
        const top =
          id === "A"
            ? `<div class="loadA"><span class="spin"></span>正在载入更早的</div>`
            : id === "C"
              ? `<div class="rule"><span class="spin"></span>正在载入更早的</div>`
              : id === "D"
                ? `<div class="skel"><i class="b"></i><i style="width:40%"></i><i style="width:92%"></i><i style="width:76%"></i><div class="cap">正在载入更早的</div></div>`
                : "";
        const pill = id === "B" ? `<div class="pill"><span class="spin"></span>正在载入更早的</div>` : "";
        loadRow.insertAdjacentHTML(
          "beforeend",
          `<figure><div class="phone"><div class="screen">
            <div class="scroll">${top}${[0, 1].map(turn).join("")}</div>
            <div class="fog fogB"></div>${chrome}${pill}
          </div></div><figcaption><b>${title}</b><span>${note}</span></figcaption></figure>`,
        );
      }
    </script>
  </body>
</html>
