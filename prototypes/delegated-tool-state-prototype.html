<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Atrium · 委托工具状态原型</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f4f1;
      --main: #fffefa;
      --text: #302f2c;
      --muted: #85817a;
      --line: #e8e4dd;
      --soft: #fcf0db;
      --attn: #815b17;
      --tint: #577568;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font:
        14px -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }
    body.dark {
      --bg: #1c1d1b;
      --main: #252623;
      --text: #e9e6df;
      --muted: #aaa79e;
      --line: #42423d;
      --soft: #3d3525;
      --attn: #e8bc78;
      --tint: #a8cbb8;
    }
    header {
      padding: 32px 36px 20px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      font-size: 19px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
    }
    button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--main);
      color: inherit;
      border-radius: 7px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid var(--tint);
      outline-offset: 3px;
    }
    .app {
      display: grid;
      grid-template-columns: 180px 1fr;
      max-width: 960px;
      margin: 0 auto 100px;
      min-height: 560px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .sidebar {
      padding: 26px 18px;
      border-right: 1px solid var(--line);
      color: var(--muted);
      line-height: 2.5;
    }
    .sidebar strong {
      color: var(--text);
      font-weight: 500;
    }
    .main {
      background: var(--main);
      padding: 32px 36px;
      position: relative;
    }
    .tabs {
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 28px;
    }
    .text {
      max-width: 560px;
      font-size: 15px;
      line-height: 1.85;
    }
    .surface {
      margin-top: 35px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 24px #00000009;
    }
    .caption {
      font-size: 11px;
      color: var(--muted);
      padding: 6px 9px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px;
      min-height: 39px;
    }
    .dot {
      font-size: 16px;
      color: var(--attn);
    }
    .name {
      font-size: 13px;
    }
    .tag {
      display: inline-flex;
      white-space: nowrap;
      font-size: 11px;
      padding: 2px 6px;
      line-height: 14px;
      border-radius: 4px;
      background: var(--soft);
      color: var(--attn);
    }
    .quiet {
      font-size: 11px;
      color: var(--muted);
    }
    .time {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
    }
    .sub {
      font-size: 12px;
      padding: 0 9px 8px 34px;
      color: var(--muted);
    }
    .bar {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      font-size: 12px;
    }
    .capsule {
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--muted);
    }
    .composer {
      height: 90px;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
    }
    .note {
      margin-top: 18px;
      font-size: 12px;
    }
    .switcher {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--main);
      box-shadow: 0 4px 20px #0002;
    }
    #variant-label {
      min-width: 185px;
      text-align: center;
      font-size: 12px;
    }
    .policy {
      margin-left: auto;
      text-align: right;
      color: var(--attn);
      font-size: 12px;
    }
    .details {
      border-top: 1px solid var(--line);
      margin: 3px 9px 8px;
      padding-top: 9px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }
    .hidden {
      display: none;
    }
    @media (max-width: 700px) {
      header {
        padding: 20px;
      }
      .app {
        margin: 0 12px 100px;
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .main {
        padding: 22px 18px;
      }
    }
  </style>
  <header>
    <div>
      <h1>委托工具权限：怎样避免继续误标“只读”？</h1>
      <p>一次性原型 · 只改已有子对话行，不新增审批面板。浅色／深色都可切换。</p>
    </div>
    <button id="theme">切换深浅色</button>
  </header>
  <section class="app">
    <aside class="sidebar">
      <strong>Atrium</strong><br />项目<br />◌ 示例项目<br />　主工作区<br />　　父子代理协作
    </aside>
    <main class="main">
      <div class="tabs">父子代理协作　 ×</div>
      <div class="text">
        已让两个子代理分别检查接口和运行测试。测试代理申请了 bash，当前任务只允许执行已批准的验证命令。
      </div>
      <section class="surface">
        <div class="caption">子对话　　　　　　　　　　　　　　　　　最近更新的在前</div>
        <div id="rows"></div>
      </section>
      <div class="bar"><span class="capsule">子对话 3 · ? 1 · ◌ 1　⌃</span><span class="capsule">排队 1　⌃</span></div>
      <div class="composer">继续交代下一步…</div>
      <p id="explain" class="note"></p>
    </main>
  </section>
  <nav class="switcher" aria-label="原型方案">
    <button id="prev" aria-label="上一个方案">←</button><span id="variant-label"></span
    ><button id="next" aria-label="下一个方案">→</button>
  </nav>
  <script>
    const names = ["A · 原位置模式标签（推荐）", "B · 第二行显示执行范围", "C · 右侧权限状态与说明"];
    const query = new URLSearchParams(location.search);
    let variant = Math.max(0, ["A", "B", "C"].indexOf(query.get("variant") || "A"));
    if (query.get("theme") === "dark") document.body.classList.add("dark");
    function draw() {
      const el = document.getElementById("rows");
      document.getElementById("variant-label").textContent = names[variant];
      if (variant === 0) {
        el.innerHTML =
          '<div class="row"><span class="dot">◌</span><span class="name">test-runner</span><span class="tag" title="当前任务：bash。通过父代理等待窗口执行，不保证只读；用户审批仍有效。">受限直用</span><span class="time">刚刚　···</span></div><div class="sub">正在运行获批的验证命令</div><div class="row"><span class="dot">?</span><span class="name">api-audit</span><span class="tag" title="每次工具调用需父代理审查，批准后执行。">逐次审查</span><span class="time">1 分钟　···</span></div><div class="sub">在申请工具：需要检查接口兼容性</div><div class="row"><span class="dot">·</span><span class="name">docs-reader</span><span class="quiet">只读</span><span class="time">2 分钟　···</span></div>';
        document.getElementById("explain").textContent =
          "A：在已有角色标记的位置展示受限直用／逐次审查；悬停说明工具名、当前任务范围及“不保证只读”。没有委托权限时保持原标签。";
      }
      if (variant === 1) {
        el.innerHTML =
          '<div class="row"><span class="dot">◌</span><span class="name">test-runner</span><span class="time">刚刚　···</span></div><div class="sub">工具 bash · 受限直用 · 不保证只读</div><div class="row"><span class="dot">?</span><span class="name">api-audit</span><span class="time">1 分钟　···</span></div><div class="sub">工具 bash · 逐次审查 · 正在等父代理</div><div class="row"><span class="dot">·</span><span class="name">docs-reader</span><span class="quiet">只读</span><span class="time">2 分钟　···</span></div>';
        document.getElementById("explain").textContent =
          "B：将工具与模式放在第二行，信息始终可见；相应进度文字让位给权限说明。";
      }
      if (variant === 2) {
        el.innerHTML =
          '<div class="row"><span class="dot">◌</span><span class="name">test-runner</span><span class="policy">受限直用　⌄</span></div><div class="details">本任务允许 bash，通过父代理等待窗口执行。<br>不保证只读；参数超出规则仍要重新申请。</div><div class="row"><span class="dot">?</span><span class="name">api-audit</span><span class="policy">逐次审查　⌄</span></div><div class="details">每次调用交父代理审查。用户审批不能由父代理代答。</div><div class="row"><span class="dot">·</span><span class="name">docs-reader</span><span class="quiet">只读</span><span class="time">2 分钟　···</span></div>';
        document.getElementById("explain").textContent =
          "C：右侧展示权限模式，下方固定展开解释；信息最完整，但子对话列表明显更高。";
      }
      const url = new URL(location);
      url.searchParams.set("variant", ["A", "B", "C"][variant]);
      url.searchParams.set("theme", document.body.classList.contains("dark") ? "dark" : "light");
      history.replaceState({}, "", url);
    }
    document.getElementById("prev").onclick = () => {
      variant = (variant + 2) % 3;
      draw();
    };
    document.getElementById("next").onclick = () => {
      variant = (variant + 1) % 3;
      draw();
    };
    document.getElementById("theme").onclick = () => {
      document.body.classList.toggle("dark");
      draw();
    };
    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input,textarea,[contenteditable]")) return;
      if (event.key === "ArrowRight") {
        variant = (variant + 1) % 3;
        draw();
      }
      if (event.key === "ArrowLeft") {
        variant = (variant + 2) % 3;
        draw();
      }
    });
    draw();
  </script>
</html>
