<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>原型：一轮中间的自动压缩</title>
    <!--
  原型（PROTOTYPE，用完即弃）：自动压缩做成过程轨道里的一步，在发生的位置；轨道在这一步"断开"，
  表示上面的原文模型已经看不到（只剩摘要）。比较三种断口画法，和折叠后标题行上的两种写法。
  打开：双击；右上角切深色。
-->
    <style>
      :root {
        --main: #fff;
        --surface-2: #f2f2f4;
        --text: #1d1d1f;
        --text-2: #2c2c30;
        --text-muted: #6e6e74;
        --text-dim: #a1a1a7;
        --line: rgba(0, 0, 0, 0.08);
        --hover: rgba(0, 0, 0, 0.035);
        --tint: #2f6fed;
        --ok: #1a7f37;
        --danger: #d1242f;
        --rail: rgba(0, 0, 0, 0.15);
        --node: #c4c4c9;
        --page: #eef1f6;
      }
      :root[data-theme="dark"] {
        --main: #151517;
        --surface-2: #2c2c2e;
        --text: #f9fafb;
        --text-2: #e7e9ec;
        --text-muted: #adb2b8;
        --text-dim: #81858c;
        --line: rgba(255, 255, 255, 0.1);
        --hover: rgba(255, 255, 255, 0.05);
        --tint: #7aaaff;
        --ok: #4ac26b;
        --danger: #ff7b72;
        --rail: rgba(255, 255, 255, 0.15);
        --node: #5d6067;
        --page: #0c0c0e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 24px 40px 60px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p.lead {
        margin: 0 0 18px;
        color: var(--text-muted);
        font-size: 13px;
        max-width: 980px;
      }
      .tools {
        position: fixed;
        top: 14px;
        right: 18px;
      }
      .tools button {
        font: inherit;
        font-size: 12px;
        border: 0.5px solid var(--line);
        background: var(--main);
        color: var(--text-2);
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .card {
        background: var(--main);
        border-radius: 16px;
        padding: 18px 20px 20px;
        box-shadow: 0 0 0 0.5px var(--line);
      }
      .card h2 {
        font-size: 14px;
        margin: 0 0 2px;
      }
      .card .why {
        font-size: 12px;
        color: var(--text-muted);
        margin: 0 0 14px;
        min-height: 36px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-2);
        font-weight: 600;
        margin-bottom: 6px;
      }
      .head .caret {
        width: 12px;
        color: var(--text-dim);
      }
      .head .meta {
        font-weight: 400;
        color: var(--text-dim);
      }
      .rail {
        position: relative;
        padding-left: 30px;
      }
      .row {
        position: relative;
        margin-left: -30px;
        padding-left: 30px;
        min-height: 32px;
        display: flex;
        align-items: center;
        font-size: 13px;
        color: var(--text-muted);
        gap: 6px;
      }
      .row b {
        font-weight: 400;
        color: var(--text-2);
      }
      .row::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--rail);
      }
      .row:first-child::before {
        top: 50%;
      }
      .row:last-child::before {
        bottom: 50%;
      }
      .row .dot {
        position: absolute;
        left: 8.5px;
        top: 50%;
        width: 4px;
        height: 4px;
        margin-top: -2px;
        border-radius: 50%;
        background: var(--node);
      }
      .row .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0 7px;
        height: 22px;
        border-radius: 999px;
        background: var(--surface-2);
        font-size: 12px;
        color: var(--text-2);
      }
      .row .chip i {
        font-style: normal;
        color: var(--ok);
      }
      .row .chip u {
        text-decoration: none;
        color: var(--danger);
      }
      .comp {
        color: var(--text-muted);
      }
      .comp .num {
        font-variant-numeric: tabular-nums;
      }
      .comp .more {
        color: var(--text-dim);
        margin-left: 2px;
      }
      /* A：断口 + 收拢图标 */
      .vA .row.c::before {
        display: none;
      }
      .vA .row.c .cut1,
      .vA .row.c .cut2 {
        position: absolute;
        left: 10px;
        width: 1px;
        background: var(--rail);
      }
      .vA .row.c .cut1 {
        top: 0;
        height: calc(50% - 10px);
      }
      .vA .row.c .cut2 {
        bottom: 0;
        height: calc(50% - 10px);
      }
      .vA .row.c .ico {
        position: absolute;
        left: 4.5px;
        top: 50%;
        margin-top: -6px;
        width: 12px;
        height: 12px;
        color: var(--text-dim);
      }
      /* B：上方的轨道变虚线（被摘要替代），节点是收拢图标 */
      .vB .row.before::before {
        background: none;
        border-left: 1px dashed var(--rail);
        width: 0;
      }
      .vB .row.c::before {
        background: linear-gradient(var(--rail), var(--rail)) 0 50% / 1px 50% no-repeat;
      }
      .vB .row.c .ico {
        position: absolute;
        left: 4.5px;
        top: 50%;
        margin-top: -6px;
        width: 12px;
        height: 12px;
        color: var(--text-dim);
        background: var(--main);
      }
      /* C：横贯的刻痕 */
      .vC .row.c .tick {
        position: absolute;
        left: 4px;
        top: 50%;
        width: 13px;
        height: 1.5px;
        margin-top: -0.75px;
        border-radius: 1px;
        background: var(--text-dim);
      }
      .vC .row.c .tick2 {
        position: absolute;
        left: 4px;
        top: 50%;
        width: 13px;
        height: 1.5px;
        margin-top: 2.25px;
        border-radius: 1px;
        background: var(--text-dim);
      }
      .detail {
        margin: 2px 0 6px 30px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface-2);
        font-size: 12.5px;
        color: var(--text-2);
      }
      .detail .k {
        color: var(--text-dim);
        font-size: 12px;
        margin-bottom: 6px;
      }
      h3 {
        font-size: 15px;
        margin: 28px 0 10px;
      }
      .folds {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .fold .head {
        margin: 0;
      }
      .fold .comp-chip {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        color: var(--text-dim);
        font-weight: 400;
      }
      .fold .comp-chip svg {
        width: 12px;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <div class="tools"><button id="theme">深色</button></div>
    <h1>一轮中间的自动压缩：轨道里的一步，轨道在这里"断开"</h1>
    <p class="lead">
      压缩发生在第 5 步之后；它上面的步骤原文模型已经看不到，只剩一段摘要。文字统一为"压缩了上下文 · 152K →
      41K"，点开看前后 token
      数和摘要（第一张卡片展开了）。上下文溢出引起的写成"上下文超出窗口，压缩后重试"。三种断口画法都只改这一步的节点和它附近的竖线，不拆这一轮。
    </p>
    <div class="grid" id="grid"></div>
    <h3>折叠后的标题行</h3>
    <div class="folds" id="folds"></div>
    <script>
      const SHRINK =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.2297 17.9947C14.2192 17.2447 13.704 14.7612 14.2305 14.2347C14.7571 13.7083 17.2398 14.2247 17.9895 14.2355M20.9995 20.9981L14.6147 14.6146"/><path d="M9.76961 17.9944C9.78011 17.2445 10.2953 14.761 9.76881 14.2344C9.24228 13.708 6.75956 14.2245 6.00985 14.2352M2.99981 20.9978L9.38459 14.6144"/><path d="M6.00746 9.76133C6.7572 9.7709 9.24073 10.2832 9.76644 9.75585C10.2921 9.22853 9.77265 6.74581 9.76097 5.99592M9.37696 9.36743L3.00176 3.00244"/><path d="M17.9916 9.76133C17.2419 9.7709 14.7584 10.2832 14.2326 9.75585C13.707 9.22853 14.2264 6.74581 14.2381 5.99592M14.6221 9.36743L20.9973 3.00244"/></svg>';
      const BEFORE = [
        "<b>思考了 3 秒</b> · 先把天气接口和缓存都读一遍…",
        '<b>读了</b> <span class="chip">api.ts</span>',
        '<b>读了</b> <span class="chip">cache.ts</span>',
        "<b>运行了</b> <code>pnpm test</code>",
        '<b>编辑了</b> <span class="chip">cache.ts <i>+15</i> <u>−6</u></span>',
      ];
      const AFTER = [
        "<b>思考了 1 秒</b> · 测试过了，再看页面怎么用缓存…",
        '<b>读了</b> <span class="chip">Home.tsx</span>',
        '<b>编辑了</b> <span class="chip">Home.tsx <i>+8</i> <u>−2</u></span>',
      ];
      const VARIANTS = [
        ["A", "A 断口加收拢图标", "主线在节点上下断开一小段，节点换成 12px 的收拢图标（Hugeicons arrow-shrink）。"],
        ["B", "B 上方变虚线", "从这一轮开头到压缩处的主线变成虚线（只剩摘要），节点是收拢图标，下面照常实线。"],
        ["C", "C 横贯的刻痕", "主线不断，节点是两道横贯的短刻痕，像一道分界，最安静。"],
      ];
      function comp(v, open) {
        const mark =
          v === "A"
            ? `<span class="cut1"></span><span class="cut2"></span><span class="ico">${SHRINK}</span>`
            : v === "B"
              ? `<span class="ico">${SHRINK}</span>`
              : `<span class="tick"></span><span class="tick2"></span>`;
        return (
          `<div class="row c">${mark}<span class="comp">压缩了上下文 · <span class="num">152K → 41K</span><span class="more">${open ? "⌄" : "›"}</span></span></div>` +
          (open
            ? `</div><div class="detail"><div class="k">压缩前 152K tokens · 压缩后 41K · 保留了最近的原文</div>目标：给首页加逐小时预报，并检查缓存过期。已读 api.ts、cache.ts，缓存 30 分钟过期已加上，测试通过……</div><div class="rail">`
            : "")
        );
      }
      document.getElementById("grid").innerHTML = VARIANTS.map(
        ([v, t, why], i) => `<div class="card v${v}"><h2>${t}</h2><p class="why">${why}</p>
  <div class="head"><span class="caret">⌄</span>已完成，用时 2 分 11 秒</div>
  <div class="rail">${BEFORE.map((s) => `<div class="row before"><span class="dot"></span>${s}</div>`).join("")}${comp(v, i === 0)}${AFTER.map((s) => `<div class="row"><span class="dot"></span>${s}</div>`).join("")}</div></div>`,
      ).join("");
      document.getElementById("folds").innerHTML = `
  <div class="card fold"><h2>甲 文字一段</h2><p class="why">和"改了 N 个文件"并列，最后一段。</p>
    <div class="head"><span class="caret">›</span>已完成，用时 2 分 11 秒<span class="meta">· 读了 3 个文件 · 跑了 1 条命令 · 改了 2 个文件 · 压缩了 2 次上下文</span></div></div>
  <div class="card fold"><h2>乙 图标加次数</h2><p class="why">末尾一个收拢图标加次数，和轨道上的节点同形；悬停说"压缩了 2 次上下文"。</p>
    <div class="head"><span class="caret">›</span>已完成，用时 2 分 11 秒<span class="meta">· 读了 3 个文件 · 跑了 1 条命令 · 改了 2 个文件 ·</span><span class="comp-chip" title="压缩了 2 次上下文">${SHRINK}2</span></div></div>`;
      document.getElementById("theme").onclick = (e) => {
        const d = document.documentElement.dataset.theme === "dark";
        document.documentElement.dataset.theme = d ? "" : "dark";
        e.target.textContent = d ? "深色" : "浅色";
      };
      if (new URLSearchParams(location.search).get("theme") === "dark") document.documentElement.dataset.theme = "dark";
    </script>
  </body>
</html>
