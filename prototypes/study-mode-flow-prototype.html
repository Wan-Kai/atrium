<!doctype html>
<!--
  PROTOTYPE — 设计稿，不接入生产构建。学习模式的完整流程（入口用 study-mode-prototype.html 的丁"入口行 + 学习首页"）。

  已定（2026-11-04 / 05 用户）：
  · 侧栏最上面一行"学习"，点开主区是学习首页；侧栏不列方向。
  · 方向目录固定在 ~/Atrium/Learning/<目录名>/，带 .atrium-study.json；练习代码在 lab/（git）。
  · 一件事一个会话，进度靠档案文件衔接；测验是从上课会话开的、带上下文的子对话。
  · 学习会话就是普通 pi 会话，只是工作目录在方向目录、索引里多一条"用途 + 第几级第几步"。
  · 第一版不和项目打通；手机端不做；不做间隔复习。
  · 新建方向直接进对话（同新建工作区页）：第一条消息发出后才起名、建目录、开讨论；没有对话框和配置页，讨论中 agent 可以改显示名。
  · 阶梯每个方向都有，而且每次按人排：级数、每级的名字、内容、过关标志都由讨论定。讨论写出 ladder.md 才算结束。
  · 不单独设计过关清单：每一级是一串同样结构的步骤，课之后接着速查表、过关项目、综合测验、升级。

  步骤条三种做法（顶上切换 A / B / C），2026-11-05 用户选了 C：
  · A 主页竖排：步骤列在阶梯当前一级里面，会话里用学习胶囊。
  · B 主页横条：主页顶上一条横的步骤条 + 当前步骤卡，下面是做过的；会话里用学习胶囊。
  · C 常驻横条：横条放在标签栏下面，主页和每个学习会话都有，带下一步按钮，代替学习胶囊。

  图标：界面图标是 Hugeicons 免费版 stroke-rounded（4.3.5，路径照抄），文件类型图标是 material-icon-theme 5.39.0 的原图。
-->

        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 32px;
        padding: 0 10px;
        font-size: var(--fs-meta);
        color: var(--text-3);
      }
      .lesson .no {
        width: 18px;
        color: var(--text-dim);
        font-size: var(--fs-sm);
        flex: 0 0 auto;
      }
      .lesson .ok {
        color: var(--ok-text);
        display: inline-flex;
      }
      .lesson .t {
        flex: 1;
        min-width: 0;
      }
      .lesson .m {
        color: var(--text-dim);
        font-size: var(--fs-sm);
        white-space: nowrap;
      }
      .lesson.next {
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
      }
      .lesson.next .lh {
        color: var(--text);
      }
      .lesson.next .no {
        color: var(--tint);
        font-weight: 600;
      }
      .lesson.todo .lh {
        color: var(--text-dim);
      }
      .sess {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 10px 8px 38px;
      }
      .schip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        font-size: var(--fs-sm);
        color: var(--text-2);
        white-space: nowrap;
      }
      .schip .i {
        color: var(--text-muted);
      }
      .schip .s {
        color: var(--text-dim);
      }
      .schip.child {
        margin-left: -1px;
      }
      .side-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .frow {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 8px;
        border-radius: var(--r);
        font: var(--fs-mono) var(--font-mono);
        color: var(--text-2);
      }
      .frow .m {
        margin-left: auto;
        color: var(--text-dim);
        font: var(--fs-sm) var(--font-sans);
        white-space: nowrap;
      }
      .frow.new {
        background: color-mix(in srgb, var(--ok) 9%, transparent);
      }
      .gap-row {
        display: flex;
        gap: 10px;
        padding: 9px 12px;
        font-size: var(--fs-meta);
        color: var(--text-2);
        line-height: 1.5;
      }
      .gap-row + .gap-row {
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .gap-row .src {
        display: block;
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }
      .gap-row .mk {
        margin-top: 5px;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: 0 0 auto;
        background: var(--attn);
      }
      .gap-row.fixed .mk {
        background: var(--ok);
      }
      .gap-row.fixed .tx {
        color: var(--text-dim);
      }
      .mini-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 6px 14px;
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .check + .check {
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .check .box {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        box-shadow: inset 0 0 0 1.5px var(--rail);
      }
      .check .box.on {
        background: var(--ok);
        box-shadow: none;
        color: #fff;
      }
      .check .t {
        flex: 1;
      }
      .check .t small {
        display: block;
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }

      /* 对话 */
      .conv {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .bubble {
        align-self: flex-end;
        max-width: 80%;
        padding: 9px 14px;
        border-radius: var(--r-bubble);
        background: var(--surface-2);
        color: var(--text);
        font-size: var(--fs-reply);
        line-height: 1.55;
      }
      .bubble .cmd {
        color: var(--tint);
        font-weight: 500;
      }
      .reply {
        font-size: var(--fs-reply);
        line-height: 1.55;
        color: var(--text);
      }
      .reply p {
        margin: 0 0 10px;
      }
      .reply p:last-child {
        margin-bottom: 0;
      }
      .reply ul,
      .reply ol {
        margin: 0 0 10px;
        padding-left: 20px;
      }
      .reply li {
        margin: 2px 0;
      }
      .reply h4 {
        margin: 0 0 6px;
        font-size: var(--fs-reply);
      }
      .reply table {
        border-collapse: collapse;
        font-size: var(--fs-meta);
        margin: 0 0 10px;
      }
      .reply td,
      .reply th {
        padding: 5px 12px 5px 0;
        text-align: left;
        box-shadow: inset 0 -0.5px 0 var(--line);
      }
      .reply th {
        color: var(--text-muted);
        font-weight: 500;
      }
      .reply pre {
        margin: 0 0 10px;
        padding: 10px 12px;
        border-radius: var(--r-md);
        background: var(--code);
        font: var(--fs-mono) / 1.5 var(--font-mono);
        color: var(--text-3);
        overflow: auto;
      }
      .proc {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-meta);
        color: var(--text-dim);
      }
      .proc .arr {
        color: var(--text-dim);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .filechip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        font: var(--fs-sm) var(--font-mono);
        color: var(--text-2);
      }
      .filechip .plus {
        color: var(--ok-text);
      }
      .filechip .minus {
        color: var(--danger);
      }
      .childhead {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 12px;
        background: var(--code);
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }
      .childhead b {
        color: var(--text-2);
        font-weight: 500;
      }
      .childhead .sp {
        flex: 1;
      }

      /* 输入区 */
      .composer-wrap {
        padding: 0 24px 16px;
        position: relative;
      }
      .composer-wrap::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -40px;
        height: 40px;
        background: linear-gradient(transparent, var(--main));
        pointer-events: none;
      }
      .capbar {
        display: flex;
        gap: 8px;
        max-width: 672px;
        margin: 0 auto 8px;
        align-items: center;
      }
      .capbar .sp {
        flex: 1;
      }
      .capsule {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--surface-1);
        box-shadow:
          var(--chip-shadow),
          0 2px 8px rgba(0, 0, 0, 0.04);
        font-size: var(--fs-sm);
        color: var(--text-2);
        white-space: nowrap;
      }
      .capsule .i {
        color: var(--text-muted);
      }
      .study-cap {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 672px;
        margin: 0 auto 8px;
        height: 40px;
        padding: 0 6px 0 12px;
        border-radius: 14px;
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .study-cap .ic {
        color: var(--tint);
        display: inline-flex;
      }
      .study-cap .sp {
        flex: 1;
      }
      .study-cap .m {
        color: var(--text-dim);
        font-size: var(--fs-sm);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .study-cap .btn {
        height: 28px;
        border-radius: 10px;
      }
      .composer {
        max-width: 672px;
        margin: 0 auto;
        min-height: 88px;
        padding: 14px;
        border-radius: var(--r-bubble);
        background: var(--surface-2);
        box-shadow: inset 0 0 0 0.5px var(--line);
        color: var(--text-dim);
        font-size: var(--fs);
        display: flex;
        flex-direction: column;
      }
      .composer .bar {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }
      .composer .send {
        margin-left: auto;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--text);
        color: var(--main);
        display: grid;
        place-items: center;
      }
      .composer .send.stop i {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--main);
      }

      /* 提问卡片（SPEC-0003 的样子） */
      .qcard {
        max-width: 672px;
        margin: 0 auto 8px;
        padding: 12px 14px;
        border-radius: var(--r-card);
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
      }
      :root[data-theme="dark"] .qcard {
        background: var(--surface-2);
      }
      .qcard .qh {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-meta);
      }
      .qcard .qh .agent {
        font-weight: 700;
        color: var(--attn-text);
        letter-spacing: 0.01em;
      }
      .qcard .qh .who {
        font-weight: 500;
        color: var(--text);
      }
      .qcard .qh .cnt {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .qcard .qh .sp {
        flex: 1;
      }
      .qpill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 9px;
        border-radius: 999px;
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .qpill.on {
        background: var(--selected);
        color: var(--text);
        font-weight: 500;
      }
      .qpill .o {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px var(--text-dim);
      }
      .qpill .ok {
        color: var(--ok-text);
        display: inline-flex;
      }
      .qcard .qt {
        margin: 10px 0 8px;
        font-size: var(--fs);
        font-weight: 500;
        color: var(--text);
      }
      .qcard .qt .kind {
        margin-left: 8px;
        display: inline-flex;
        height: 18px;
        align-items: center;
        padding: 0 6px;
        border-radius: var(--r-sm);
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: var(--fs-xs);
        font-weight: 400;
        vertical-align: 1px;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 8px 10px;
        margin-bottom: 2px;
        border-radius: var(--r-md);
      }
      .opt.on {
        background: var(--linked);
      }
      .opt .k {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: var(--fs-sm);
        font-weight: 600;
      }
      :root[data-theme="dark"] .opt .k {
        background: var(--surface-3);
      }
      .opt.on .k,
      :root[data-theme="dark"] .opt.on .k {
        background: var(--tint);
        color: var(--on-tint);
      }
      .opt .ot {
        font-size: var(--fs-meta);
        font-weight: 500;
        color: var(--text);
        line-height: 20px;
      }
      .opt .od {
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .qfoot {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
      }
      .qfoot .kb {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .qfoot .sp {
        flex: 1;
      }

      /* 对话框 */
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        backdrop-filter: blur(8px);
        display: grid;
        place-items: center;
        z-index: 5;
      }
      .dialog {
        width: 400px;
        padding: 20px;
        border-radius: var(--r-card);
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
      }
      .dialog h3 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }
      .dialog p {
        margin: 0 0 14px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
        line-height: 1.55;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .field label {
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .input {
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-radius: var(--r-md);
        background: var(--main);
        box-shadow:
          inset 0 0 0 1px var(--tint),
          0 0 0 3px color-mix(in srgb, var(--tint) 16%, transparent);
        font-size: var(--fs);
        color: var(--text);
      }
      .input .caret {
        display: inline-block;
        width: 1.5px;
        height: 1.1em;
        margin-left: 1px;
        background: var(--tint);
        animation: blink 1.06s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .pathline {
        display: flex;
        align-items: center;
        gap: 6px;
        font: var(--fs-sm) var(--font-mono);
        color: var(--text-muted);
      }
      .dialog .foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      .dialog .opt-line {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: var(--fs-meta);
        color: var(--text-2);
        padding: 6px 0;
      }
      .dialog .cb {
        width: 16px;
        height: 16px;
        border-radius: 5px;
        background: var(--tint);
        color: var(--on-tint);
        display: grid;
        place-items: center;
      }
      .hidden {
        display: none !important;
      }

      /* 步骤条 */
      .subd {
        display: inline-flex;
        gap: 2px;
        flex: 0 0 auto;
      }
      .subd i {
        width: 5px;
        height: 5px;
        border-radius: 1.4px;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .subd i.d {
        background: var(--text-muted);
        box-shadow: none;
      }
      .subd i.g {
        background: var(--attn);
        box-shadow: none;
      }
      .lesson .no.kd {
        display: inline-flex;
        color: var(--text-dim);
      }
      .lesson.next .no.kd {
        color: var(--tint);
      }
      .lvd {
        margin: 2px 0 0;
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .lv.done .lvd {
        display: none;
      }
      .trackhead {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: var(--fs-meta);
        color: var(--text-2);
        font-weight: 500;
      }
      .trackhead .m {
        margin-left: auto;
        font-size: var(--fs-sm);
        color: var(--text-dim);
        font-weight: 400;
      }
      .trackb {
        display: flex;
        gap: 4px;
        margin-top: 12px;
      }
      .trackb .cell {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--text-dim);
        font-size: var(--fs-xs);
      }
      .trackb .seg {
        width: 100%;
        height: 6px;
        border-radius: 2px;
        background: var(--line-strong);
      }
      .trackb .done .seg {
        background: var(--text-muted);
      }
      .trackb .cur .seg {
        background: var(--tint);
      }
      .trackb .cur {
        color: var(--tint);
        font-weight: 600;
      }
      .trackb .lb {
        height: 14px;
        display: inline-flex;
        align-items: center;
      }
      .hero.inner {
        padding: 14px 0 0;
        margin-top: 14px;
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .strip {
        height: 40px;
        flex: 0 0 40px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 16px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        font-size: var(--fs-sm);
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .strip .lvl {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--text-2);
        font-weight: 500;
      }
      .strip .trk {
        display: inline-flex;
        gap: 3px;
      }
      .strip .trk i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--line-strong);
      }
      .strip .trk i.done {
        background: var(--text-muted);
      }
      .strip .trk i.cur {
        background: var(--tint);
      }
      .strip .trk i.x {
        border-radius: 50%;
      }
      .strip .now {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .strip .now b {
        color: var(--text);
        font-weight: 500;
      }
      .strip .sp {
        flex: 1;
      }
      .btn.sm {
        height: 26px;
        padding: 0 10px;
        border-radius: 9px;
      }
      .subpills {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        font-size: var(--fs-sm);
      }
      .subpill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--text-muted);
      }
      .subpill.on {
        background: var(--linked);
        color: var(--tint);
        font-weight: 500;
      }
      .lvc {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 4px;
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .lvc .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lvc .m {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .lvc.cur .node i {
        width: 12px;
        height: 12px;
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--tint);
      }
      .lvc.lock .node i {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--rail);
      }
      .lvc.lock {
        color: var(--text-dim);
      }
      .drow {
        padding: 8px 12px;
      }
      .drow + .drow {
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .drow .dt {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .drow .dt .ok {
        color: var(--ok-text);
        display: inline-flex;
      }
      .drow .sess {
        padding: 6px 0 0 22px;
      }
      .drow.more {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }

      /* 新方向：只有输入框的页 */
      .newdir {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 0 24px 40px;
      }
      .newdir .nd-in {
        width: 100%;
        max-width: 672px;
      }
      .newdir .say {
        font-size: 22px;
        font-weight: 600;
        color: var(--text);
        text-align: center;
      }
      .newdir .sub {
        margin: 6px auto 20px;
        max-width: 460px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
        text-align: center;
        line-height: 1.6;
      }
      .composer.typed {
        color: var(--text);
      }
      .hostline {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .hostline b {
        color: var(--text-3);
        font-weight: 500;
      }
      .reply td.skip {
        color: var(--text-dim);
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>学习模式 · 完整流程（丁方案，以"后端"为例）</h1>
      <span style="flex: 1"></span>

      const FT = {

      /* ---------- 阶梯和步骤的数据（这个人的后端阶梯：4 级，名字按内容起） ---------- */
      const LADDER = [
        { n: "能跑的 API", m: "HTTP、REST、增删改查", pass: "一个增删改查服务" },
        { n: "数据和登录", m: "建模、索引、事务、认证、测试", pass: "带登录的 API，有测试" },

        { n: "扛得住", m: "慢查询、并发、缓存、限流", pass: "压测找出并修好一个瓶颈" },

      const STEPS2 = [

      const KNAME = { lesson: "上课", sheet: "速查表", project: "过关项目", quiz: "综合测验", up: "升级" };
      const BTN = { lesson: "开始上课", sheet: "生成速查表", project: "开始项目", quiz: "开始测验", up: "升级" };
      const META = { lesson: "约 2 小时", sheet: "一页", project: "按过关标志验收", quiz: "10 题", up: "" };
      const DESC = {

      const SCORES = ["42", "36", "31", "32", "40", "39", "37", "42", "40"];
      const stepsAt = (cur) =>

          ...s,

          sub: s.sub || (i < cur ? "ddd" : ""),
          sess:

            (i < cur
              ? i === 3

        s.k === "lesson" ? `<span class="no">${s.i + 1}</span>` : `<span class="no kd">${ic(KIND[s.k], "s14")}</span>`;

      /* 竖排的步骤列表：A 放在阶梯当前一级里，C 放在主页左栏 */
      function stepList(cur, chips) {
        return `<div class="lessons">${stepsAt(cur)

      /* 方向主页，按步骤条做法分三种 */
      function homePage(cur, { chips = true, gaps = [] } = {}) {
