<!doctype html>
<!--
  PROTOTYPE · 用完即弃，不要当成正式代码。
  回答的问题：桌面端设置里新增的"手机"分类（远程访问、relay 配置、配对手机、已配对设备）长什么样。
  四个方向，顶部切换（不刷新）：
    A  分组表单：一页到底，同现有设置页的"小标题 + 说明 + 行"。
    B  设备为主：设备卡片占主位，relay 配置折进"高级"。

  配对流程（2026-10-24 调整）：手机扫码完成握手后，再发一条加密的确认消息，宿主验证通过后桌面才显示"请求配对 · 校验码"；

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Atrium 设置 · 手机 · 原型</title>
<style>
/* ══ 1. 设计变量（照 packages/ui/src/design/tokens.css）══════════════════ */
:root, [data-theme="light"] {
  color-scheme: light;
  --window: #e8ecf2; --blob-1: #cfdcf7; --blob-2: #d7eee6; --blob-3: #f6e3d6;
  --main: #ffffff; --surface-1: #ffffff; --surface-2: #f2f2f4; --surface-3: #e9e9ec; --code: #f6f6f8;
  --text: #1d1d1f; --text-2: #2c2c30; --text-3: #48484e; --text-muted: #6e6e74; --text-dim: #a1a1a7;
  --line: rgba(0,0,0,.08); --line-soft: rgba(0,0,0,.05); --line-strong: rgba(0,0,0,.14);
  --hover: rgba(0,0,0,.035); --selected: rgba(0,0,0,.06);
  --focus-ring: 0 0 0 3px rgba(47,111,237,.16); --linked: rgba(47,111,237,.10);
  --scrim: rgba(30,38,56,.30); --nav-bg: rgba(0,0,0,.022);
  --tint: #2f6fed; --on-tint: #ffffff;
  --attn: #dd8629; --attn-text: #c96509; --attn-soft: rgba(221,134,41,.12);
  --danger: #e5484d; --danger-soft: rgba(229,72,77,.10);
  --ok: #16a34a; --ok-text: #1e8e3e; --ok-soft: rgba(22,163,74,.10);
  --float-shadow: 0 0 0 .5px var(--line-strong), 0 12px 32px rgba(0,0,0,.14);
  --card-shadow: 0 0 0 .5px var(--line), 0 8px 24px rgba(41,70,122,.08);
  --win-shadow: 0 0 0 .5px var(--line-strong), 0 30px 80px -12px rgba(30,40,80,.30);
  --qr-ink: #1d1d1f; --qr-bg: #ffffff;
}
[data-theme="dark"] {
  color-scheme: dark;
  --window: #0d1016; --blob-1: #1f3765; --blob-2: #172b3f; --blob-3: #2a2433;
  --main: #151517; --surface-1: #212123; --surface-2: #2c2c2e; --surface-3: #353638; --code: #19191b;
  --text: #f9fafb; --text-2: #e7e9ec; --text-3: #cfd3d6; --text-muted: #adb2b8; --text-dim: #81858c;
  --line: rgba(255,255,255,.10); --line-soft: rgba(255,255,255,.06); --line-strong: rgba(255,255,255,.16);
  --hover: rgba(255,255,255,.05); --selected: rgba(255,255,255,.08);
  --focus-ring: 0 0 0 3px rgba(122,170,255,.22); --linked: rgba(122,170,255,.14);
  --scrim: rgba(6,8,12,.42); --nav-bg: rgba(255,255,255,.025);
  --tint: #7aaaff; --on-tint: #0d1016;
  --attn: #dd8629; --attn-text: #f0a24e; --attn-soft: rgba(221,134,41,.16);
  --danger: #f25a5a; --danger-soft: rgba(242,90,90,.14);
  --ok: #22c55e; --ok-text: #4ade80; --ok-soft: rgba(34,197,94,.14);
  --float-shadow: 0 0 0 .5px var(--line-strong), 0 16px 40px rgba(0,0,0,.45);
  --card-shadow: 0 0 0 .5px var(--line), 0 9px 27px rgba(41,70,122,.20);
  --win-shadow: 0 0 0 .5px var(--line-strong), 0 30px 80px -10px rgba(0,0,0,.55);
  /* 二维码在深色下也是白底黑点，手机才扫得出 */
  --qr-ink: #1d1d1f; --qr-bg: #f9fafb;
}
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --fs: 14px; --fs-meta: 13px; --fs-sm: 12px; --fs-xs: 11px; --fs-mono: 12.5px;
  --r-sm: 6px; --r: 8px; --r-md: 10px; --r-btn: 12px; --r-card: 16px; --r-pill: 999px;
  /* 弹簧曲线的近似：snappy 0.30s bounce .15，smooth 0.42s bounce 0 */
  --snappy: cubic-bezier(.2,.9,.3,1.06); --smooth: cubic-bezier(.25,.8,.25,1);
}

/* ══ 2. 基础与原型外壳 ═══════════════════════════════════════════════════ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--window); color: var(--text); font: var(--fs)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex: none; display: block; }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }

.proto-bar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 20px; background: color-mix(in srgb, var(--main) 86%, transparent); backdrop-filter: blur(20px);
  box-shadow: inset 0 -.5px 0 var(--line); font-size: var(--fs-sm); }
.proto-bar .t { font-weight: 600; font-size: var(--fs-meta); }
.proto-bar .lb { color: var(--text-dim); }
.proto-bar .sp { flex: 1; }
.pseg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--selected); }
.pseg button { height: 24px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--text-muted); font-size: var(--fs-sm); }
.pseg button.on { background: var(--surface-1); color: var(--text); box-shadow: 0 0 0 .5px var(--line), 0 1px 3px rgba(0,0,0,.1); }
[data-theme="dark"] .pseg button.on { background: var(--surface-3); }

.stage { position: relative; height: 740px; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(50% 45% at 0% 0%, var(--blob-1), transparent 70%), radial-gradient(45% 50% at 5% 100%, var(--blob-2), transparent 70%),
    radial-gradient(40% 40% at 30% 55%, var(--blob-3), transparent 70%), var(--window); }
/* 背后工作台的示意：几条模糊的块，再盖一层 scrim */
.stage .wb { position: absolute; inset: 0; display: grid; grid-template-columns: 270px 1fr; }
.stage .wb i { display: block; }
.stage .wb .sb { background: color-mix(in srgb, var(--main) 35%, transparent); }
.stage .wb .mn { background: var(--main); }
.stage .scrim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(8px) saturate(1.1); }

.notes { max-width: 900px; margin: 0 auto; padding: 22px 0 60px; font-size: var(--fs-meta); color: var(--text-2); }
.notes h3 { margin: 0 0 8px; font-size: 15px; }
.notes ul { margin: 0; padding-left: 18px; line-height: 1.7; }
.notes li b { color: var(--text); font-weight: 600; }
.notes .flow { margin-top: 14px; color: var(--text-muted); font-size: var(--fs-sm); line-height: 1.7; }

/* 原型调试入口（不属于设计）*/
.dbg { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px dashed #f59e0b; border-radius: 6px;
  background: rgba(245,158,11,.08); color: #d97706; font: 500 11px var(--font); cursor: pointer; }
.dbg select { border: 0; background: none; color: inherit; font: inherit; outline: none; cursor: pointer; }

/* ══ 3. 设置窗口（照 settings-panel.tsx）══════════════════════════════════ */
.win { position: relative; width: 900px; height: 640px; display: grid; grid-template-columns: 212px 1fr; grid-template-rows: minmax(0,1fr);
  border-radius: 14px; overflow: hidden; background: var(--main); box-shadow: var(--win-shadow); }
.nav { display: flex; flex-direction: column; background: var(--nav-bg); box-shadow: inset -.5px 0 0 var(--line); padding: 0 10px 12px; }
.nav .tb { height: 50px; display: flex; align-items: center; gap: 8px; padding-left: 8px; }
.nav .tb i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
.nav .tb i:nth-child(1) { background: #ff6058; } .nav .tb i:nth-child(2) { background: #ffbd2e; } .nav .tb i:nth-child(3) { background: #28c840; }
.nrow { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; margin: 1px 0; padding: 0 10px; border: 0; border-radius: var(--r);
  background: none; color: var(--text-2); font-size: var(--fs-meta); text-align: left; }
.nrow:hover { background: var(--hover); }
.nrow.on { background: var(--selected); color: var(--text); }
.nrow .ic { color: var(--text-muted); display: inline-flex; }
.nrow.on .ic { color: var(--text-2); }
.nrow .grow { flex: 1; }
/* 分类上的状态记号：连不上时一个红色感叹号，等你确认配对时一个橙点 */
.nrow .nmark { display: inline-flex; }
.ct { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.ch { height: 50px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 32px; }
.ch b { flex: 1; font-size: 15px; font-weight: 600; }
.ch .esc { color: var(--text-dim); font-size: var(--fs-xs); }
.ibtn { width: 28px; height: 28px; border: 0; border-radius: var(--r); background: none; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; }
.ibtn:hover { background: var(--hover); color: var(--text-2); }
.ibtn.sm { width: 24px; height: 24px; }
.sbody { flex: 1; overflow-y: auto; padding: 6px 32px 40px; }
.lead { margin: -4px 0 22px; color: var(--text-muted); font-size: var(--fs-sm); }

/* ══ 4. 通用件（照 parts.tsx）════════════════════════════════════════════ */
.grp { margin: 0 0 30px; }
.grp > h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; font-size: var(--fs-meta); font-weight: 600; }
.grp > h4 .sp { flex: 1; }
.grp > .gd { margin: 0 0 10px; color: var(--text-muted); font-size: var(--fs-sm); line-height: 1.55; }
.grp > .gf { margin: 10px 0 0; color: var(--text-dim); font-size: var(--fs-sm); line-height: 1.55; }
.gl { margin: 0 -12px; }
.it { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 12px; border-radius: var(--r-md); }
.it + .it::before, .it + .itx::before, .itx + .it::before { content: ''; position: absolute; left: 12px; right: 12px; top: 0; height: .5px; background: var(--line); }
.it.kv { min-height: 40px; padding-top: 8px; padding-bottom: 8px; }
.it .lab { flex: 1; min-width: 0; }
.it .lab b { display: block; font-weight: 500; font-size: var(--fs); }
.it.kv .lab b { font-weight: 400; color: var(--text-2); font-size: var(--fs-meta); }
.it .lab small { display: block; margin-top: 1px; color: var(--text-muted); font-size: var(--fs-sm); line-height: 1.5; }
.it .ctl { display: flex; align-items: center; gap: 8px; flex: none; font-size: var(--fs-sm); color: var(--text-muted); }
.it .val { color: var(--text-2); font-size: var(--fs-meta); }
.it.busy { background: var(--linked); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tint) 60%, transparent); }
.it.busy::before, .it.busy + .it::before { opacity: 0; }
.it.warn { background: var(--danger-soft); }
.it.warn::before, .it.warn + .it::before { opacity: 0; }
/* 行下面展开的一块（行内确认、输入框）*/
.itx { position: relative; padding: 0 12px 12px; margin-top: -4px; }
.it.busy + .itx, .it.warn + .itx { margin-top: 0; padding-top: 10px; }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: var(--r-pill); background: none;
  box-shadow: inset 0 0 0 .5px var(--line-strong); color: var(--text-2); font-size: var(--fs-meta); white-space: nowrap;
  transition: transform .3s var(--snappy), background-color .14s; }
.btn:hover { background: var(--selected); color: var(--text); }
.btn:active { transform: scale(.95); transition: transform 80ms; }
.btn.primary { background: var(--text); color: var(--main); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 500; }
.btn.primary:hover { opacity: .9; }
.btn.danger { background: var(--danger); color: #fff; box-shadow: none; font-weight: 500; }
.btn.danger-soft { background: var(--danger-soft); color: var(--danger); box-shadow: none; font-weight: 500; }
.btn.ghost { height: 24px; padding: 0 8px; box-shadow: none; color: var(--text-muted); font-size: var(--fs-sm); }
.btn.ghost:hover { background: var(--hover); color: var(--text-2); }
.btn.sm { height: 24px; padding: 0 10px; font-size: var(--fs-sm); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.lnk { border: 0; background: none; padding: 0; color: var(--tint); font-size: var(--fs-sm); }
.lnk:hover { text-decoration: underline; }
.lnk.red { color: var(--danger); }
.field { height: 30px; min-width: 0; border: 0; border-radius: var(--r); padding: 0 10px; background: var(--hover); box-shadow: inset 0 0 0 .5px var(--line-strong);
  color: var(--text); font-size: var(--fs-meta); outline: none; }
.field:focus { box-shadow: inset 0 0 0 .5px var(--line-strong), var(--focus-ring); }
.field::placeholder { color: var(--text-dim); }
.field.mono { font-size: var(--fs-sm); }
.field.bad { box-shadow: inset 0 0 0 1px var(--danger); }
.masked { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r); background: var(--hover);
  box-shadow: inset 0 0 0 .5px var(--line); font: var(--fs-sm) var(--font-mono); color: var(--text-3); letter-spacing: .02em; }
.switch { position: relative; width: 34px; height: 20px; flex: none; border: 0; border-radius: 999px; background: var(--line-strong); transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .3s var(--snappy); }
.switch.on { background: var(--tint); }
.switch.on::after { transform: translateX(14px); }
.spin { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 状态：靠形状区分（勾圆圈 / 转圈 / 感叹号圆圈 / 空心点），不只靠颜色 */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-meta); white-space: nowrap; }
.st.ok { color: var(--ok-text); } .st.busy { color: var(--tint); } .st.err { color: var(--danger); } .st.off { color: var(--text-dim); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 2.5px var(--ok-soft); }
.dot.offl { box-shadow: inset 0 0 0 1.5px var(--text-dim); }
.kbd-fp { font: var(--fs-sm) var(--font-mono); color: var(--text-2); letter-spacing: .04em; }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font-size: var(--fs-xs); background: var(--surface-2); color: var(--text-muted); }
[data-theme="dark"] .tag { background: var(--surface-3); }
.tag.tint { background: var(--linked); color: var(--tint); }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--text-2); }
.confirm .sp { flex: 1; }
.confirm.red { color: var(--danger); }
.hint { font-size: var(--fs-sm); color: var(--text-dim); line-height: 1.55; }
.err-line { font-size: var(--fs-sm); color: var(--danger); line-height: 1.55; }

/* ══ 5. 配对（二维码、校验码、弹层）════════════════════════════════════════ */
/* 盖在设置窗口上的弹层：同归档确认框（380–420px、--r-card、--card-shadow），只盖内容区不盖分类 */
.sheet-ov { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: color-mix(in srgb, var(--main) 55%, transparent); backdrop-filter: blur(6px); animation: fade .2s ease; }
.sheet { width: 420px; padding: 20px; border-radius: var(--r-card); background: var(--surface-1); box-shadow: var(--card-shadow), 0 24px 60px -20px rgba(0,0,0,.35);
  animation: pop .3s var(--snappy); }
[data-theme="dark"] .sheet { background: var(--surface-2); }
.sheet h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sheet h3 .sp { flex: 1; }
.sheet .sd { margin: 0 0 16px; font-size: var(--fs-meta); color: var(--text-2); line-height: 1.55; }
.sheet .foot { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
.sheet .foot .sp { flex: 1; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.rise { animation: rise .42s var(--smooth) both; }

.steps { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-dim); margin-bottom: 14px; }
.steps span { display: inline-flex; align-items: center; gap: 5px; }
.steps span.on { color: var(--text-2); font-weight: 500; }
.steps span.done { color: var(--ok-text); }
.steps i { width: 14px; height: .5px; background: var(--line-strong); }

.qrbox { position: relative; display: grid; place-items: center; width: 200px; height: 200px; margin: 0 auto; padding: 12px; border-radius: var(--r-btn);
  background: var(--qr-bg); box-shadow: 0 0 0 .5px rgba(0,0,0,.10), 0 6px 18px -8px rgba(0,0,0,.25); }
.qrbox.sm { width: 156px; height: 156px; padding: 10px; }
.qrbox > svg { width: 100%; height: 100%; }
.qrbox.expired > svg { filter: blur(5px); opacity: .35; }
.qrbox .over { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; color: #48484e; font-size: var(--fs-meta); }
.qrbox .over .btn { background: #1d1d1f; color: #fff; box-shadow: none; }
.qrbox.wait > svg { opacity: .14; }
.timer { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; font-size: var(--fs-sm); color: var(--text-muted); }
.timer b { font-weight: 500; color: var(--text-2); }
.timer.low b { color: var(--attn-text); }
.ring { width: 14px; height: 14px; }

.code { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
.code span { width: 34px; height: 44px; display: grid; place-items: center; border-radius: var(--r); background: var(--surface-2);
  font: 600 22px var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
[data-theme="dark"] .code span { background: var(--surface-3); }
.code .gap { width: 8px; background: none !important; }
.req { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-md); background: var(--attn-soft); margin-bottom: 14px; }
.req .ph { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-1); color: var(--attn-text); }
[data-theme="dark"] .req .ph { background: var(--surface-3); }
.req b { display: block; font-weight: 500; }
.req small { display: block; color: var(--text-muted); font-size: var(--fs-sm); }
.rejected { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: var(--fs-sm); color: var(--text-muted); }
.rejected svg { color: var(--text-dim); }
.done-mark { width: 44px; height: 44px; margin: 4px auto 12px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok-text); animation: pop .4s cubic-bezier(.2,.9,.3,1.3); }
.kv2 { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; font-size: var(--fs-sm); }
.kv2 dt { color: var(--text-dim); } .kv2 dd { margin: 0; color: var(--text-2); }

/* 等待验证：三个点依次亮 */
.wait-dots { display: inline-flex; gap: 4px; } .wait-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--tint); animation: blink 1.2s infinite; }
.wait-dots i:nth-child(2) { animation-delay: .2s; } .wait-dots i:nth-child(3) { animation-delay: .4s; }

  if (S.conn === 'err') return `<span class="st err">${ic('alert', 14)}${short ? '连不上' : ERRORS[S.err].title}</span>`;
  return `<span class="st ok">${ic('ok', 14)}已连接</span>`;
}
function connDetail() {
  if (!S.enabled) return '关着时宿主不连 relay，手机连不上这台 Mac';
  if (S.conn === 'busy') return `正在连 ${RELAY.slice(6)} · 上次连上 今天 09:42`;
  if (S.conn === 'err') return `${ERRORS[S.err].detail} · 上次连上 今天 09:42`;
  return `${RELAY.slice(6)} · 连上了 3 小时 12 分`;
}

/* ══ 假二维码：25×25，三个定位方块加伪随机的点，刷新就换种子 ══ */
function qrSvg(seed) {
  const n = 25; let x = seed * 9301 + 49297; const rnd = () => ((x = (x * 9301 + 49297) % 233280) / 233280);
  const finder = (r, c) => [[0, 0], [0, n - 7], [n - 7, 0]].some(([fr, fc]) => r >= fr && r < fr + 7 && c >= fc && c < fc + 7);
  let out = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!finder(r, c) && !(r === 7 || c === 7 || r === n - 8 || c === n - 8) && rnd() > .52)
    out += `<rect x="${c}" y="${r}" width="1" height="1" rx=".25"/>`;
  for (const [fr, fc] of [[0, 0], [0, n - 7], [n - 7, 0]])
    out += `<rect x="${fc + .5}" y="${fr + .5}" width="6" height="6" rx="1.6" fill="none" stroke="var(--qr-ink)" stroke-width="1"/><rect x="${fc + 2}" y="${fr + 2}" width="3" height="3" rx=".8"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" fill="var(--qr-ink)">${out}</svg>`;
}

/* ══ 配对的三步（四个方向共用内容，各自套外壳）══ */
const STEP_OF = { qr: 0, verify: 1, confirm: 1, fail: 1, done: 2 };
function pairSteps() {
  const i = STEP_OF[S.pair];
  return `<div class="steps">${['扫码', '核对校验码', '完成'].map((t, k) =>
    `<span class="${k === i ? 'on' : k < i ? 'done' : ''}">${k < i ? ic('ok', 12, 2) : `${k + 1}.`} ${t}</span>`).join('<i></i>')}</div>`;
}
function timerHtml() {
  if (S.secs <= 0) return `<div class="timer" id="timer">二维码已过期</div>`;
  const f = S.secs / 300, a = 2 * Math.PI * 5.5;
  return `<div class="timer tnum ${S.secs <= 60 ? 'low' : ''}" id="timer"><svg class="ring" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/>
    <circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="${a * f} ${a}" transform="rotate(-90 7 7)" stroke-linecap="round"/></svg>
    <b>${mmss(S.secs)}</b> 后过期</div>`;
}
/** 当前一步的标题、说明、主体和底部按钮。size 是二维码的尺寸（'' 或 'sm'）。 */
function pairParts(size = '') {
  const expired = S.secs <= 0;
  if (S.pair === 'qr') return {
    title: '配对新设备',
    desc: '用 Atrium 手机 App 扫这个码。码里有 relay 地址、这台 Mac 的公钥和一次性的配对密钥，5 分钟内有效，只能用一次。',
    body: `<div class="qrbox ${size} ${expired ? 'expired' : ''}">${qrSvg(S.qrSeed)}${expired ? `<div class="over">已过期${btn(`${ic('refresh', 13)}刷新`, 'refresh', 'sm')}</div>` : ''}</div>
      ${timerHtml()}<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px">${expired ? '' : dbg('模拟：手机扫码', 'scan') + dbg('快进到过期', 'expire')}</div>`,
    foot: btn('取消', 'pairCancel') + `<span class="sp"></span><span class="hint">别把这个码发给别人或截图分享</span>`,
  };
  if (S.pair === 'verify') return {
    title: '正在确认手机',
    desc: '手机已扫码、完成握手，正在等它发来加密的确认消息。验证通过后请你核对校验码。',
    body: `<div class="qrbox ${size} wait">${qrSvg(S.qrSeed)}<div class="over"><span class="wait-dots"><i></i><i></i><i></i></span>等手机确认</div></div>
      <p class="hint" style="text-align:center;margin:12px 0 0">这个码已被一台手机占用，别的手机再扫会被拒绝</p>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px">${dbg('模拟：验证通过', 'verified')}${dbg('模拟：验证失败', 'vfail')}</div>`,
    foot: btn('取消', 'pairCancel'),
  };
  if (S.pair === 'confirm') return {
    title: '核对校验码',
    desc: '',
    body: `<div class="req"><span class="ph">${ic('phone', 18)}</span><div><b>iPhone 15 Pro 请求配对</b><small>确认消息已验证 · 刚刚</small></div></div>
      <p class="hint" style="color:var(--text-2);margin:0 0 10px">手机上也显示了一串数字。和下面一致再确认，不一致就拒绝。</p>
      <div class="code tnum">${CODE.slice(0, 3).split('').map((d) => `<span>${d}</span>`).join('')}<span class="gap"></span>${CODE.slice(3).split('').map((d) => `<span>${d}</span>`).join('')}</div>
      ${S.other ? `<div class="rejected rise">${ic('x', 13, 2)}另一台设备也扫了这个码，已拒绝。同一时刻只接受一台</div>` : `<div style="margin-top:10px">${dbg('模拟：另一台手机也扫了', 'other')}</div>`}`,
    foot: btn('拒绝', 'pairReject') + '<span class="sp"></span>' + btn('确认配对', 'pairOk', 'primary'),
  };
  if (S.pair === 'fail') return {
    title: '没能配对',
    desc: '',
    body: `<div class="req" style="background:var(--danger-soft)"><span class="ph" style="color:var(--danger)">${ic('alert', 18)}</span><div><b>手机发来的确认消息没通过验证</b><small>已断开这台手机，这个码也作废了</small></div></div>
      <p class="hint">可能是手机 App 版本太旧，或者二维码被别人拿去用了。重新生成一个码再扫。</p>`,
    foot: btn('取消', 'pairCancel') + '<span class="sp"></span>' + btn(`${ic('refresh', 13)}重新生成二维码`, 'refresh', 'primary'),
  };
  return {
    title: '已配对',
    desc: 'iPhone 15 Pro 现在可以经 relay 连回这台 Mac。以后在这里随时撤销。',
    body: `<div class="done-mark">${ic('ok', 24, 2)}</div>
      <label class="hint" style="display:block;margin-bottom:6px;color:var(--text-2)">设备名称</label>
      <input class="field" style="width:100%" value="iPhone 15 Pro" id="newName">
      <dl class="kv2" style="margin:14px 0 0"><dt>设备公钥指纹</dt><dd class="kbd-fp">C4E1 0B7A 92F3 6D18</dd><dt>配对时间</dt><dd>今天 14:06</dd></dl>`,
    foot: '<span class="sp"></span>' + btn('完成', 'pairDone', 'primary'),
  };
}
/** A、D 用的弹层：盖在内容区上。 */
function pairSheet() {
  const p = pairParts();

function bPair() {
  const p = pairParts('sm'), qrStep = S.pair === 'qr' || S.pair === 'verify';
  const left = qrStep ? `<div>${p.body}</div>` : `<div style="display:grid;place-items:center;border-radius:var(--r-btn);background:var(--code);min-height:160px;color:${S.pair === 'fail' ? 'var(--danger)' : S.pair === 'done' ? 'var(--ok-text)' : 'var(--attn-text)'}">${ic(S.pair === 'fail' ? 'alert' : S.pair === 'done' ? 'ok' : 'phone', 40, 1.5)}</div>`;
  const right = qrStep ? '' : (S.pair === 'done' ? p.body.replace(/<div class="done-mark">.*?<\/div>/s, '') : p.body);
  return `<div class="bpair">${left}<div>${pairSteps()}<h3>${p.title}<span class="sp"></span><button class="ibtn sm" data-act="pairCancel" aria-label="关闭">${ic('x', 14)}</button></h3>
    ${p.desc ? `<p class="sd">${p.desc}</p>` : ''}${right}<div class="foot">${p.foot.replace('<span class="sp"></span>', '')}</div></div></div>`;
}
function renderB() {
  if (!S.configured) {
    return `<div class="bpair" style="grid-template-columns:120px 1fr"><div style="display:grid;place-items:center;border-radius:var(--r-btn);background:var(--code);color:var(--text-muted)">${ic('cloud', 40, 1.5)}</div>
      <div><h3>先接上你的 relay</h3><p class="sd">手机经你自己 VPS 上的 relay 连回来。填上 relay 的地址和部署时生成的宿主密钥。<button class="lnk">怎么部署</button></p>
      <div style="display:grid;gap:8px"><input class="field mono" placeholder="wss://relay.example.com"><input class="field mono" type="password" placeholder="宿主密钥"></div>
      <div class="foot">${btn('连接', 'setupSave', 'primary')}${btn('测试连接', 'test')}${S.testing ? '<span class="st busy"><i class="spin"></i></span>' : S.tested ? '<span class="st ok">' + ic('ok', 14) + '连得上</span>' : ''}</div></div></div>
      <h4 style="margin:26px 0 10px;font-size:var(--fs-meta)">设备</h4><div class="bgrid"><button class="dadd" disabled style="opacity:.5;cursor:not-allowed"><span class="pl">${ic('plus')}</span>连上 relay 后配对</button></div>`;
  }
  const add = S.pair ? '' : `<button class="dadd" data-act="pairStart" ${canPair() ? '' : 'disabled style="opacity:.5;cursor:not-allowed"'}><span class="pl">${ic('plus')}</span>${canPair() ? '配对新设备' : '连上 relay 后才能配对'}</button>`;
  const empty = !S.devices.length && !S.pair && canPair() ? `<div class="dcard" style="grid-column:span 2;justify-content:center;box-shadow:none;background:none"><div class="nm" style="margin:0">还没有设备</div><div class="meta">装好 Atrium 手机 App，点左边配对，用手机扫码。</div></div>` : '';
  return bStrip() + `<h4 style="margin:0 0 10px;font-size:var(--fs-meta);display:flex">设备<span class="hint" style="margin-left:8px;font-weight:400">${S.devices.length ? `${S.devices.length} 台` : ''}</span></h4>
    <div class="bgrid">${S.pair ? bPair() : ''}${S.devices.map(bCard).join('')}${add}${empty}</div>
    <div class="adv"><button class="adv-h ${S.adv ? 'open' : ''}" data-act="adv">${ic('chev', 12, 2)}高级：relay 与这台 Mac 的身份</button>
      ${S.adv ? `<div class="adv-b">${grp('relay', '', relayRows(), RELAY_FOOT)}${grp('这台 Mac 的身份', '', identityRows())}</div>` : ''}</div>`;
}

/* ══ C · 向导加总览 ══ */
const WIZ = ['准备 relay', '填地址和密钥', '测试连接', '配对第一台手机'];
function wsteps(names, cur, bad = -1) {
  return `<div class="wsteps">${names.map((t, i) => `<div class="wstep ${i === cur ? 'on' : i < cur ? 'done' : ''} ${i === bad ? 'bad' : ''}"><span class="n">${i < cur ? ic('ok', 11, 2.4) : i + 1}</span>${t}</div>`).join('')}</div>`;
}
function cPairPane(first) {
  const p = pairParts();
  return `<div class="wpane">${pairSteps()}<h3>${first ? '配对第一台手机' : p.title}</h3>${p.desc ? `<p class="sd">${p.desc}</p>` : ''}
    <div style="max-width:360px">${p.body}</div><div class="foot">${p.foot}</div></div>`;
}
function cWizard() {
  const step = S.configured ? 3 : Math.min(S.wiz, 3) - 1;
  let pane;
  if (step === 0) pane = `<div class="wpane rise"><h3>准备一台 relay</h3><p class="sd">手机不直接连这台 Mac，而是经你自己 VPS 上的 relay 转发。relay 只转发加密过的字节，看不到对话内容。在 VPS 上运行：</p>
    <div class="term">npx @atrium/relay init<br><span class="c">→ relay 地址   wss://relay.example.com</span><br><span class="c">→ 宿主密钥   rk_…（只显示这一次）</span></div>
    <p class="hint">需要一个域名和 443 端口，证书由 Caddy 自动申请。<button class="lnk">完整的部署说明</button></p>
    <div class="foot"><span class="sp"></span>${btn(`已经部署好了 ${ic('arrowR', 13)}`, 'wiz', 'primary', '2')}</div></div>`;
  else if (step === 1) pane = `<div class="wpane rise"><h3>填 relay 的地址和密钥</h3><p class="sd">都在 init 的输出里。密钥存进 macOS 钥匙串，之后只显示末尾几位。</p>
    <div class="fld"><label class="fl">relay 地址</label><input class="field mono" style="width:100%" value="${RELAY}"></div>
    <div class="fld"><label class="fl">宿主密钥<small>用来向 relay 证明这台 Mac 是它自己</small></label><input class="field mono" style="width:100%" type="password" value="rk_live_abcdefghij3f9a"></div>
    <div class="foot">${btn('上一步', 'wiz', '', '1')}<span class="sp"></span>${btn(`测试连接 ${ic('arrowR', 13)}`, 'wizTest', 'primary')}</div></div>`;
  else if (step === 2) {
    const items = [['解析 relay.ktoon.dev', '203.0.113.24'], ['建立加密连接（TLS）', ''], ['relay 认可宿主密钥', ''], ['往返延迟', '86 ms']];
    pane = `<div class="wpane rise"><h3>测试连接</h3><p class="sd">用刚才填的地址和密钥连一次 relay。</p>
      <div class="checks">${items.map(([t, r], i) => `<div class="chk">${S.testing && i > 0 ? '<span class="st busy"><i class="spin"></i></span>' : S.testing ? '<span class="st ok">' + ic('ok', 14) + '</span>' : S.tested ? '<span class="st ok">' + ic('ok', 14) + '</span>' : '<i class="dot offl"></i>'}${t}<span class="r tnum">${S.tested || (S.testing && i === 0) ? r : ''}</span></div>`).join('')}</div>
      <div class="foot">${btn('上一步', 'wiz', '', '2')}<span class="sp"></span>${btn(`打开远程访问 ${ic('arrowR', 13)}`, 'setupSave', 'primary' + (S.tested ? '' : '" disabled="'))}</div></div>`;
  } else pane = S.pair ? cPairPane(true) : `<div class="wpane rise"><h3>配对第一台手机</h3><p class="sd">relay 已接上 ${connSt(true)}。在 iPhone 上装好 Atrium，生成一个配对码用它扫。</p>
      <div class="qrbox expired" style="margin:0">${qrSvg(3)}<div class="over">${btn(`${ic('qr', 13)}生成配对码`, 'pairStart', 'sm')}</div></div>
      <div class="foot"><span class="sp"></span>${btn('以后再配', 'wizSkip', 'ghost')}</div></div>`;
  return `<div class="wiz">${wsteps(WIZ, step)}${pane}</div>`;
}
function cHealth() {
  const bad = S.enabled && S.conn === 'err';
  return `<div class="health">
    <div class="hcell"><div class="k">${ic('laptop', 12)}远程访问</div><div class="v">${S.enabled ? '已打开' : '已关闭'}<span style="flex:1"></span>${sw(S.enabled, 'toggle')}</div><div class="s">只连出去，不开端口</div></div>
    <div class="hcell ${bad ? 'bad' : ''}"><div class="k">${ic('cloud', 12)}relay</div><div class="v">${connSt(true)}</div><div class="s">${bad ? '上次连上 今天 09:42' : 'relay.ktoon.dev'}</div></div>
    <div class="hcell"><div class="k">${ic('phone', 12)}设备</div><div class="v tnum">${S.devices.length} 台</div><div class="s">${S.enabled && S.conn === 'ok' ? `${online()} 台在线` : '都连不上'}</div></div></div>`;
}
/** 连不上时的诊断：哪一步断了、怎么修。 */
function cDiagnose() {
  const fail = { network: 0, address: 1, key: 3 }[S.err], e = ERRORS[S.err];
  const items = ['这台 Mac 有网络', '解析 relay.ktoon.dev', '建立加密连接（TLS）', 'relay 认可宿主密钥'];
  return grp(`<span style="color:var(--danger)">${e.title}</span>`, e.detail, `<div>${items.map((t, i) => `<div class="chk" style="${i > fail ? 'color:var(--text-dim)' : ''}">${i < fail ? `<span class="st ok">${ic('ok', 14)}</span>` : i === fail ? `<span class="st err">${ic('alert', 14)}</span>` : '<i class="dot offl" style="margin:0 3.5px"></i>'}${t}<span class="r">${i === fail ? fixBtn() : i > fail ? '没有检查' : ''}</span></div>`).join('')}</div>`);
}
function renderC() {
  if (!S.configured || (!S.devices.length && !S.wizSkip && S.enabled && S.conn !== 'err')) return cWizard();
  if (S.pair) return `<div class="wiz">${wsteps(['扫码', '核对校验码', '完成'], STEP_OF[S.pair], S.pair === 'fail' ? 1 : -1)}${cPairPane(false)}</div>`;
  const bad = S.enabled && S.conn === 'err';
  const devs = S.devices.length ? S.devices.map(devRow).join('') : row('<span style="font-weight:400;color:var(--text-muted)">还没有设备</span>', '');
  return cHealth() + (bad ? cDiagnose() : '')
    + grp('设备', '', devs, '', `<button class="btn sm" data-act="pairStart" ${canPair() ? '' : 'disabled'}>${ic('plus', 13)}配对新设备</button>`)
    + grp('relay', '', relayRows(), RELAY_FOOT, `<button class="lnk" data-act="rewiz">重新走一遍向导</button>`)
    + grp('这台 Mac 的身份', '', identityRows());
}

/* ══ D · 链路图 ══ */
function dTopo() {
  const bad = S.enabled && S.conn === 'err';
  const e1 = !S.configured || !S.enabled ? 'off' : S.conn === 'busy' ? 'busy' : bad ? 'bad' : 'ok';
  const e2 = e1 === 'ok' && online() ? 'ok' : 'idle';
  const l1 = !S.configured ? '还没设置' : !S.enabled ? '已关闭' : S.conn === 'busy' ? '正在连接' : bad ? ERRORS[S.err].title : '只出站 · 3 小时';
  const sel = (k) => (S.node === k ? 'sel' : '');
  const phones = S.devices.map((d) => `<button class="pnode ${sel(d.id)}" data-act="node" data-arg="${d.id}"><i class="dot ${isOn(d) ? 'on' : 'offl'}"></i><span>${esc(d.name)}</span></button>`).join('');
  return `<div class="topo">
    <button class="node ${sel('mac')}" data-act="node" data-arg="mac"><span class="nic">${ic('laptop', 22)}</span>这台 Mac<small class="mono">${FP.slice(0, 9)}</small></button>
    <div class="edge ${e1}"><span class="lb" style="${bad ? 'color:var(--danger)' : ''}">${l1}</span>${e1 === 'ok' ? '<i class="pkt"></i>' : ''}${bad ? `<span class="mid" style="color:var(--danger)">${ic(S.err === 'network' ? 'wifiOff' : S.err === 'key' ? 'key' : 'x', 14, 2)}</span>` : ''}</div>
    <button class="node ${sel('relay')} ${bad ? 'bad' : ''} ${!S.configured || !S.enabled ? 'offn' : ''}" data-act="node" data-arg="relay"><span class="nic">${ic('cloud', 22)}</span>relay<small>${S.configured ? 'relay.ktoon.dev' : '未设置'}</small></button>
    <div class="edge ${e2}"><span class="lb">端到端加密</span></div>
    <div class="phones">${phones}<button class="pnode add ${sel('add')}" data-act="node" data-arg="add" ${canPair() ? '' : 'disabled style="opacity:.45;cursor:not-allowed"'}>${ic('plus', 13)}<span>配对新设备</span></button></div>
  </div>`;
}
function dPanel() {
  if (S.node === 'mac') return `<div class="dpanel">${grp('这台 Mac', '宿主只主动连出去，不开入站端口。', row('允许手机远程访问', S.configured ? connDetail() : '先设置 relay', S.configured ? sw(S.enabled, 'toggle') : '') + identityRows())}</div>`;
  const d = S.devices.find((x) => x.id === S.node);
  if (d) {
    const on = isOn(d), ed = S.rename === d.id;
    return `<div class="dpanel">${grp(ed ? `<input class="field" id="rn" value="${esc(d.name)}" style="width:220px;height:26px">${btn('取消', 'renameCancel', 'ghost')}${btn('保存', 'renameSave', 'sm primary', d.id)}` : `${esc(d.name)}<button class="ibtn sm" data-act="rename" data-arg="${d.id}" title="改名">${ic('pencil', 13)}</button>`, '',
      row('状态', '', on ? '<span class="st ok"><i class="dot on"></i>在线</span>' : `<span class="st off"><i class="dot offl"></i>离线 · 最后在线 ${d.seen}</span>`, 'kv')
      + (on && d.watching ? row('正在看', '', `<span class="val">${d.watching}</span>`, 'kv') : '')
      + row('型号', '', `<span class="val">${d.model}</span>`, 'kv') + row('配对时间', '', `<span class="val">${d.paired}</span>`, 'kv')
      + row('设备公钥指纹', '', '<span class="kbd-fp">C4E1 0B7A 92F3 6D18</span>', 'kv')
      + (S.revoke === d.id ? `<div class="it warn"><div class="lab"><b style="color:var(--danger);font-size:var(--fs-meta)">撤销后${on ? '立刻断开，' : ''}再用要重新扫码配对</b></div><div class="ctl">${btn('取消', 'revokeCancel', 'ghost')}${btn('撤销', 'revokeOk', 'sm danger', d.id)}</div></div>`
        : row('撤销这台设备', '它下次握手会被拒绝', btn('撤销', 'revoke', 'sm danger-soft', d.id))))}</div>`;
  }
  // relay（以及没选到东西时）
  if (!S.configured) return `<div class="dpanel">${grp('接上你的 relay', `手机经你自己 VPS 上的 relay 连回这台 Mac，relay 只转发、看不到内容。<button class="lnk">怎么部署</button>`,
    row('relay 地址', '', `<input class="field mono" style="width:280px" placeholder="wss://relay.example.com">`)
    + row('宿主密钥', '部署 relay 时生成', `<input class="field mono" style="width:280px" type="password" placeholder="粘贴密钥">`)
    + `<div style="display:flex;gap:8px;padding:10px 12px 0">${btn('连接', 'setupSave', 'primary')}${btn('测试连接', 'test')}</div>`)}</div>`;
  const bad = S.enabled && S.conn === 'err';
  return `<div class="dpanel">${grp('relay', '', `<div class="it kv ${bad ? 'warn' : ''}"><div class="lab"><b>连接</b><small>${connDetail()}</small></div><div class="ctl">${connSt()}${bad ? fixBtn() : ''}</div></div>` + relayRows(), RELAY_FOOT)}</div>`;
}
function renderD() { return dTopo() + dPanel(); }

/* ══ 各方向的说明 ══ */
const FLOW = `<p class="flow">配对流程（四个方向相同）：生成二维码（5 分钟倒计时，过期可刷新）→ 手机扫码、完成 IKpsk2 握手 → 手机发来一条加密的确认消息，桌面显示“等手机确认”，这时码已被占用 →
  宿主验证通过后才显示“iPhone 15 Pro 请求配对”和六位校验码，用户确认或拒绝；验证没通过则断开、码作废 → 完成时可改名。
  同一时刻只接受一台：在“核对校验码”里模拟“另一台手机也扫了”，桌面只记一行“已拒绝”，不打断当前配对。拒绝或取消后码作废。用顶部“状态”下拉可以直接跳到每一步。</p>`;
const NOTES = {
  a: `<h3>A · 分组表单</h3><ul>
    <li><b>是什么</b>：和现有的「pi」「模型与账户」一样，一页到底四组：远程访问 → 已配对的设备 → relay → 这台 Mac 的身份；配对是盖在内容区上的弹层，撤销、重新生成的确认都在行里。</li>
    <li><b>适合</b>：要和其他分类一个样子；实现最省，全是现有的 Group / Row / 按钮，只新增二维码弹层。</li>
    <li><b>代价</b>：第一次配置没有引导，用户要自己知道先部署 relay；连不上时只有一行原因加一个修复按钮，看不出断在哪一段。</li></ul>${FLOW}`,
  b: `<h3>B · 设备为主</h3><ul>
    <li><b>是什么</b>：顶上一条状态带（开关、relay 状态、出错原因和修复按钮），下面是设备卡片网格，最后一张虚线卡是“配对新设备”，配对就在网格里展开成一张宽卡；relay 地址、密钥、指纹、撤销全部折进“高级”。</li>
    <li><b>适合</b>：relay 配一次就不动、之后只管设备的情形；在线、正在看哪个会话一眼看到。</li>
    <li><b>代价</b>：卡片网格在设置里是新样式，和其他分类不一致；设备多了（十台以上）不如列表好扫；连不上要去“高级”里改，多一步。</li></ul>${FLOW}`,
  c: `<h3>C · 向导加总览</h3><ul>
    <li><b>是什么</b>：没配好时是四步向导（准备 relay → 填地址和密钥 → 测试连接的逐项检查 → 配对第一台手机）；配好后是三格健康总览加设备列表。连不上时把同一张检查单拿出来，标出断在哪一项。</li>
    <li><b>适合</b>：首次配置有外部前提（VPS、域名、init 输出），一步步走最不容易卡住；诊断清单对排障最有用。</li>
    <li><b>代价</b>：两套界面（向导、总览）要做要测；宿主要报出分步的检查结果（解析、TLS、密钥），协议多几个错误码；向导在设置里少见。</li></ul>${FLOW}`,
  d: `<h3>D · 链路图</h3><ul>
    <li><b>是什么</b>：顶上一张“这台 Mac — relay — 手机”的链路图，每段线的实线 / 虚线 / 红色断口就是状态；点节点，下面显示它的设置（Mac：开关和身份；relay：地址和密钥；手机：详情和撤销）。</li>
    <li><b>适合</b>：把 ADR-0016 的结构直接画给用户看，“relay 只转发”“断在哪一段”一眼就懂；信息最紧凑。</li>
    <li><b>代价</b>：要点节点才看得到设置，可发现性弱于 A；设备多了右侧列容不下（约五台）；比其他分类“花”，和设计语言的克制有些拉扯。</li></ul>${FLOW}`,
};

/* ══ 交互 ══ */
let tick = null, later = null;
function schedule(fn, ms) { clearTimeout(later); later = setTimeout(() => { fn(); render(); }, ms); }
function toast(html, icon) { S.toast = { html, icon }; clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 3000); }
const ACT = {
  dir: (a) => { S.dir = a; }, theme: (a) => { S.theme = a; },
  toggle: () => { S.enabled = !S.enabled; S.conn = S.enabled ? 'busy' : 'off'; if (S.enabled) schedule(() => { S.conn = 'ok'; }, 1400); },
  setupSave: () => { S.configured = true; S.enabled = true; S.conn = 'busy'; S.wiz = 4; schedule(() => { S.conn = 'ok'; }, 1400); },
  test: () => { S.testing = true; S.tested = false; schedule(() => { S.testing = false; S.tested = true; }, 1100); },
  retry: () => { S.conn = 'busy'; schedule(() => { S.conn = 'err'; }, 1200); },
  fix: () => { const f = ERRORS[S.err].fix; if (f === 'addr') S.addrEdit = true; else if (f === 'key') S.keyEdit = true; else ACT.retry(); S.adv = true; S.node = 'relay'; },
  addrEdit: () => { S.addrEdit = !S.addrEdit; }, keyEdit: () => { S.keyEdit = !S.keyEdit; },
  addrSave: () => { S.addrEdit = false; S.conn = 'busy'; schedule(() => { S.conn = 'ok'; S.devices.forEach((d, i) => { d.online = i === 0; }); }, 1400); },
  keySave: () => { ACT.addrSave(); S.keyEdit = false; },
  pairStart: () => { S.pair = 'qr'; S.secs = 300; S.qrSeed++; S.other = false; },
  refresh: () => { S.pair = 'qr'; S.secs = 300; S.qrSeed++; S.other = false; },
  expire: () => { S.secs = 0; },
  scan: () => { S.pair = 'verify'; schedule(() => { if (S.pair === 'verify') S.pair = 'confirm'; }, 2200); },
  verified: () => { S.pair = 'confirm'; }, vfail: () => { S.pair = 'fail'; },
  other: () => { S.other = true; },
  pairCancel: () => { S.pair = null; if (S.dir === 'd') S.node = 'relay'; },
  pairReject: () => { S.pair = null; toast('已拒绝 <b>iPhone 15 Pro</b>，这个码已作废', 'x'); },
  pairOk: () => { S.pair = 'done'; },
  pairDone: () => {
    const name = document.getElementById('newName')?.value || 'iPhone 15 Pro';
    S.devices = [{ id: 'n' + Date.now(), name, model: 'iPhone 15 Pro', kind: 'phone', online: true, paired: '今天 14:06', seen: '现在', watching: null }, ...S.devices];
    S.pair = null; S.wiz = 5; S.node = S.devices[0].id; toast(`已配对 <b>${esc(name)}</b>`);
  },
  rename: (a) => { S.rename = a; S.revoke = null; }, renameCancel: () => { S.rename = null; },
  renameSave: (a) => { const v = document.getElementById('rn')?.value.trim(); const d = S.devices.find((x) => x.id === a); if (d && v) d.name = v; S.rename = null; },
  revoke: (a) => { S.revoke = a; S.rename = null; }, revokeCancel: () => { S.revoke = null; },
  revokeOk: (a) => { const d = S.devices.find((x) => x.id === a); S.devices = S.devices.filter((x) => x.id !== a); S.revoke = null; S.node = 'relay'; toast(`已撤销 <b>${esc(d.name)}</b>`); },
  nuke: () => { S.nuke = true; }, nukeCancel: () => { S.nuke = false; },
  nukeOk: () => { S.devices = []; S.nuke = false; S.node = 'mac'; toast('已撤销全部设备，宿主密钥已重新生成'); },
  adv: () => { S.adv = !S.adv; }, node: (a) => { S.node = a; if (a === 'add') ACT.pairStart(); else S.pair = null; S.revoke = null; S.rename = null; },
  wiz: (a) => { S.wiz = +a; S.tested = false; },
  wizTest: () => { S.wiz = 3; ACT.test(); },
  wizSkip: () => { S.wizSkip = true; },
  rewiz: () => { S.configured = false; S.wiz = 1; S.wizSkip = false; },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  ACT[el.dataset.act]?.(el.dataset.arg);
  render();
});
document.getElementById('stateSel').addEventListener('change', (e) => { preset(e.target.value); render(); });
// 二维码倒计时：只刷新计时那一行，到 0 时整体重画成过期
setInterval(() => {
  if (S.pair !== 'qr' || S.secs <= 0) return;
  S.secs--;
  if (S.secs === 0) return render();
  const t = document.getElementById('timer'); if (t) t.outerHTML = timerHtml();
}, 1000);
preset('devices');
render();
</script>
</body>
</html>
