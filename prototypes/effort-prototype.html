<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PROTOTYPE · 推理强度的表示</title>
    <!-- 原型：一次性代码，只用来挑模型按钮里"推理强度"的表示方式，以及面板里对应的切换控件。 -->
    <style>
      :root,
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #151517;
        --card: #212123;
        --text: #f9fafb;
        --text-2: #e7e9ec;
        --text-3: #cfd3d6;
        --muted: #adb2b8;
        --dim: #81858c;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.18);
        --hover: rgba(255, 255, 255, 0.06);
        --sel: rgba(255, 255, 255, 0.1);
        --accent: #7aaaff;
        --seg-on: #353638;
      }
      [data-theme="light"] {
        color-scheme: light;
        --bg: #f5f5f7;
        --card: #fff;
        --text: #1d1d1f;
        --text-2: #2c2c30;
        --text-3: #48484e;
        --muted: #6e6e74;
        --dim: #a1a1a7;
        --line: rgba(0, 0, 0, 0.08);
        --line-strong: rgba(0, 0, 0, 0.14);
        --hover: rgba(0, 0, 0, 0.04);
        --sel: rgba(0, 0, 0, 0.06);
        --accent: #2f6fed;
        --seg-on: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 30px 40px 60px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        padding: 0;
        cursor: default;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
      }
      .lead {
        margin: 0 0 22px;
        color: var(--muted);
      }
      .tog {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
        background: rgba(28, 28, 30, 0.86);
      }
      .tog button {
        height: 26px;
        padding: 0 10px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 12px;
      }
      .tog button.on {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
        gap: 16px;
      }
      .cell {
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 0 0 0.5px var(--line);
        padding: 18px 20px;
      }
      .cell h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .cell h2 b {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        display: inline-grid;
        place-items: center;
        background: var(--text);
        color: var(--bg);
        font-size: 12px;
      }
      .cell p {
        margin: 4px 0 14px;
        color: var(--muted);
        font-size: 12.5px;
      }
      /* 输入框底栏的复刻 */
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 16px;
        box-shadow: inset 0 0 0 0.5px var(--line);
      }
      .bar .sp {
        flex: 1;
      }
      .plus {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--hover);
        display: grid;
        place-items: center;
        color: var(--text-3);
      }
      .send {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--text);
        color: var(--bg);
        display: grid;
        place-items: center;
      }
      .mp {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px 0 6px;
        border-radius: 999px;
        color: var(--text-2);
        font-size: 13px;
      }
      .mp:hover {
        background: var(--hover);
      }
      .mp .logo {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 0 0 0.5px var(--line);
      }
      .mp .logo img {
        width: 20px;
        height: 20px;
        display: block;
      }
      .mp .nm {
        font-weight: 500;
      }
      .mp .chev {
        color: var(--dim);
        display: inline-flex;
      }
      .levels {
        display: flex;
        gap: 6px;
        margin-top: 12px;
      }
      .levels span {
        color: var(--dim);
        font-size: 12px;
        align-self: center;
        margin-right: 4px;
      }
      .levels button {
        height: 26px;
        padding: 0 10px;
        border-radius: 8px;
        font-size: 12px;
        color: var(--muted);
        box-shadow: inset 0 0 0 0.5px var(--line);
      }
      .levels button.on {
        background: var(--sel);
        color: var(--text);
      }
      /* 面板里对应的控件 */
      .panel {
        margin-top: 12px;
        padding: 10px;
        border-radius: 14px;
        box-shadow: inset 0 0 0 0.5px var(--line);
      }
      .panel .hd {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font-size: 11px;
        padding: 0 2px 8px;
      }

      /* A 文字档位：模型名后面跟一个灰色的档位字 */
      .ea {
        color: var(--muted);
        font-size: 12.5px;
      }
      .ea::before {
        content: "·";
        margin-right: 6px;
        color: var(--dim);
      }
      .segA {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
        background: var(--hover);
      }
      .segA button {
        height: 30px;
        border-radius: 8px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .segA button.on {
        background: var(--seg-on);
        color: var(--text);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 0 0 0.5px var(--line);
      }

      /* B 圆点：四个小圆点，亮几个就是第几档 */
      .eb {
        display: inline-flex;
        gap: 3px;
      }
      .eb i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--line-strong);
        transition:
          background 0.2s,
          transform 0.3s cubic-bezier(0.2, 0.9, 0.25, 1.4);
      }
      .eb i.f {
        background: var(--text-3);
      }
      .segB {
        display: flex;
        align-items: center;
        gap: 0;
        justify-content: space-between;
        position: relative;
        padding: 8px 10px 4px;
      }
      .segB::before {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        top: 15px;
        height: 2px;
        border-radius: 2px;
        background: var(--line);
      }
      .segB button {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .segB button i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--card);
        box-shadow: inset 0 0 0 2px var(--line-strong);
        transition: all 0.3s cubic-bezier(0.2, 0.9, 0.25, 1.4);
      }
      .segB button.done i {
        box-shadow: inset 0 0 0 6px var(--text-3);
      }
      .segB button.on i {
        box-shadow: inset 0 0 0 6px var(--text);
        transform: scale(1.25);
      }
      .segB button.on {
        color: var(--text);
      }

      /* C 细进度条：一根小胶囊，按档位填充 */
      .ec {
        width: 26px;
        height: 4px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      .ec i {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: var(--text-3);
        transition: width 0.4s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .segC {
        position: relative;
        height: 34px;
        margin: 4px 2px 0;
      }
      .segC .track {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 9px;
        height: 6px;
        border-radius: 6px;
        background: var(--hover);
        box-shadow: inset 0 0 0 0.5px var(--line);
      }
      .segC .fill {
        position: absolute;
        left: 8px;
        top: 9px;
        height: 6px;
        border-radius: 6px;
        background: var(--text-3);
        transition: width 0.4s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .segC .knob {
        position: absolute;
        top: 3px;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 1px 4px rgba(0, 0, 0, 0.3),
          0 0 0 0.5px rgba(0, 0, 0, 0.1);
        transition: left 0.4s cubic-bezier(0.2, 0.9, 0.25, 1.2);
      }
      .segC .stops {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 22px;
        display: flex;
        justify-content: space-between;
      }
      .segC .stops button {
        font-size: 11.5px;
        color: var(--dim);
        white-space: nowrap;
        transform: translateX(-50%);
      }
      .segC .stops button:last-child {
        transform: translateX(-50%);
      }
      .segC .stops button.on {
        color: var(--text);
      }

      /* D 仪表：一个小半圆表盘，指针随档位转 */
      .ed {
        width: 18px;
        height: 12px;
      }
      .ed .arc {
        fill: none;
        stroke: var(--line-strong);
        stroke-width: 2;
        stroke-linecap: round;
      }
      .ed .val {
        fill: none;
        stroke: var(--text-3);
        stroke-width: 2;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.4s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .segD {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .segD button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 0 8px;
        border-radius: 10px;
        font-size: 12px;
        color: var(--muted);
        box-shadow: inset 0 0 0 0.5px var(--line);
      }
      .segD button.on {
        background: var(--sel);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .segD .ed {
        width: 26px;
        height: 16px;
      }

      /* E 字母徽标：一个小方块里写 L / M / H / X */
      .ee {
        display: inline-grid;
        place-items: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 5px;
        font:
          600 10.5px/1 "SF Mono",
          ui-monospace,
          monospace;
        color: var(--text-3);
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .segE {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
        background: var(--hover);
      }
      .segE button {
        height: 34px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .segE button.on {
        background: var(--seg-on);
        color: var(--text);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 0 0 0.5px var(--line);
      }
      .segE button .ee {
        color: inherit;
      }

      /* 公共：面板里的分段，每段里放"该档位的图形 + 文字" */
      .segX {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
        background: var(--hover);
      }
      .segX button {
        height: 36px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .segX button.on {
        background: var(--seg-on);
        color: var(--text);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 0 0 0.5px var(--line);
      }
      :root,
      [data-theme="dark"] {
        --off: rgba(255, 255, 255, 0.16);
        --on: #e7e9ec;
        --on2: #7aaaff;
      }
      [data-theme="light"] {
        --off: rgba(0, 0, 0, 0.12);
        --on: #2c2c30;
        --on2: #2f6fed;
      }
      .segX button:not(.on) {
        --on: currentColor;
      }

      /* 0 现状：信号格（对照） */
      .i0 {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
      }
      .i0 i {
        width: 3px;
        border-radius: 1px;
        background: var(--off);
      }
      .i0 i:nth-child(1) {
        height: 5px;
      }
      .i0 i:nth-child(2) {
        height: 7px;
      }
      .i0 i:nth-child(3) {
        height: 9px;
      }
      .i0 i:nth-child(4) {
        height: 11px;
      }
      .i0 i.f {
        background: var(--on);
      }

      /* F 电池：圆角外框 + 四格电量 + 小正极 */
      .iF {
        position: relative;
        display: inline-flex;
        gap: 1.5px;
        padding: 2px;
        width: 24px;
        height: 12px;
        border-radius: 3.5px;
        box-shadow: inset 0 0 0 1.2px var(--off);
      }
      .iF::after {
        content: "";
        position: absolute;
        right: -3px;
        top: 4px;
        width: 2px;
        height: 4px;
        border-radius: 0 1.5px 1.5px 0;
        background: var(--off);
      }
      .iF i {
        flex: 1;
        border-radius: 1.5px;
        background: transparent;
        transition: background 0.25s;
      }
      .iF i.f {
        background: var(--on);
      }
      .iF.full {
        box-shadow: inset 0 0 0 1.2px var(--on);
      }
      .iF.full::after {
        background: var(--on);
      }

      /* G 分段胶囊：四段等高的小胶囊连成一条 */
      .iG {
        display: inline-flex;
        gap: 2px;
      }
      .iG i {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: var(--off);
        transition: background 0.25s;
      }
      .iG i:first-child {
        border-radius: 3px 2px 2px 3px;
      }
      .iG i:last-child {
        border-radius: 2px 3px 3px 2px;
      }
      .iG i.f {
        background: var(--on);
      }

      /* H 精修信号格：更宽的圆顶柱、更舒展的比例，满格时最后一格带强调色 */
      .iH {
        display: inline-flex;
        align-items: flex-end;
        gap: 2.5px;
        height: 13px;
      }
      .iH i {
        width: 3.5px;
        border-radius: 2px 2px 1px 1px;
        background: var(--off);
        transition:
          background 0.25s,
          height 0.3s cubic-bezier(0.2, 0.9, 0.25, 1.3);
      }
      .iH i:nth-child(1) {
        height: 4px;
      }
      .iH i:nth-child(2) {
        height: 7px;
      }
      .iH i:nth-child(3) {
        height: 10px;
      }
      .iH i:nth-child(4) {
        height: 13px;
      }
      .iH i.f {
        background: var(--on);
      }
      .iH.full i.f {
        background: var(--on2);
      }

      /* I 分段圆环：一个小圆环切成四段，满格就是完整的环 */
      .iI {
        width: 15px;
        height: 15px;
      }
      .iI circle {
        fill: none;
        stroke-width: 2.4;
        stroke-linecap: round;
        transition: stroke 0.25s;
      }

      /* J 2×2 方点：和"开始设置"按钮的点阵呼应，按左上→右上→左下→右下点亮 */
      .iJ {
        display: inline-grid;
        grid-template-columns: 5px 5px;
        grid-template-rows: 5px 5px;
        gap: 2px;
      }
      .iJ i {
        border-radius: 1.5px;
        background: var(--off);
        transition:
          background 0.25s,
          transform 0.3s cubic-bezier(0.2, 0.9, 0.25, 1.4);
      }
      .iJ i.f {
        background: var(--on);
      }

      /* K 液位胶囊：竖着的小胶囊，液面随档位升高 */
      .iK {
        position: relative;
        width: 8px;
        height: 14px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1.2px var(--off);
        overflow: hidden;
      }
      .iK i {
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: 2px;
        border-radius: 2px;
        background: var(--on);
        transition: height 0.35s cubic-bezier(0.2, 0.9, 0.25, 1.2);
      }
    </style>
  </head>
  <body>
    <div class="tog"><button data-t="light">浅色</button><button data-t="dark">深色</button></div>
    <h1>推理强度的表示 · 第二批</h1>
    <p class="lead">
      都能看出"满没满格"。上面是输入框底栏里的模型按钮，下面是面板里的切换（每段带对应档位的图形）。点"切换档位"看变化，试试切到"极高"看满格的样子。
    </p>
    <div class="grid" id="grid"></div>
    <script>
      const EF = [
        ["low", "低", "L"],
        ["medium", "中", "M"],
        ["high", "高", "H"],
        ["xhigh", "极高", "X"],
      ];
      let lv = 3;
      const up =
        '<svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M208.49,120.49a12,12,0,0,1-17,0L140,69V216a12,12,0,0,1-24,0V69L64.49,120.49a12,12,0,0,1-17-17l72-72a12,12,0,0,1,17,0l72,72A12,12,0,0,1,208.49,120.49Z"/></svg>';
      const plus =
        '<svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>';
      const chev =
        '<svg width="10" height="10" viewBox="0 0 256 256" fill="currentColor"><path d="M216.49,104.49l-80,80a12,12,0,0,1-17,0l-80-80a12,12,0,0,1,17-17L128,159l71.51-71.52a12,12,0,0,1,17,17Z"/></svg>';
      const gauge = (i, cls = "ed") => {
        const c = Math.PI * 7,
          off = c * (1 - (i + 1) / 4);
        return `<svg class="${cls}" viewBox="0 0 18 12"><path class="arc" d="M2,10 A7,7 0 0 1 16,10"/><path class="val" d="M2,10 A7,7 0 0 1 16,10" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/></svg>`;
      };
      const n4 = (cls, i, extra = "") =>
        `<span class="${cls}${i === 3 ? " full" : ""}" ${extra}>${[0, 1, 2, 3].map((k) => `<i class="${k <= i ? "f" : ""}"></i>`).join("")}</span>`;
      const ring4 = (i) => {
        const r = 5.6,
          c = 2 * Math.PI * r,
          seg = c / 4,
          gap = 1.6;
        return `<svg class="iI" viewBox="0 0 15 15">${[0, 1, 2, 3].map((k) => `<circle cx="7.5" cy="7.5" r="${r}" stroke="${k <= i ? "var(--on)" : "var(--off)"}" stroke-dasharray="${(seg - gap).toFixed(2)} ${(c - seg + gap).toFixed(2)}" stroke-dashoffset="${(-k * seg + c / 4 - gap / 2).toFixed(2)}"/>`).join("")}</svg>`;
      };
      const ICONS = {
        0: (i) => n4("i0", i),
        F: (i) => n4("iF", i),
        G: (i) => n4("iG", i),
        H: (i) => n4("iH", i),
        I: ring4,
        J: (i) => n4("iJ", i),
        K: (i) => `<span class="iK"><i style="height:${[3, 5, 7.5, 10][i]}px"></i></span>`,
      };
      const V = [
        ["0", "现状：信号格（对照）", "直观，但细柱太密、比例生硬。"],
        ["F", "电池", '圆角外框里四格电量，满格时外框也变实；"满不满"一眼就知道，最贴近生活经验。'],
        ["G", "分段胶囊", "四段等高的小方块连成一条胶囊，像 iOS 的存储条，安静、规整。"],
        ["H", "精修信号格", "保留信号格的形状，柱子更宽、圆顶、比例更舒展；满格时最后一格带强调色。"],
        ["I", "分段圆环", "小圆环切成四段，满格时是完整的环，像 Apple Watch 的圆环。"],
        ["J", "2×2 方点", '四个圆角方点按顺序点亮，和"开始设置"按钮的点阵呼应，品牌感最强。'],
        ["K", "液位胶囊", "竖着的小胶囊，液面随档位升高，满格时几乎装满。"],
      ];
      function render() {
        document.getElementById("grid").innerHTML = V.map(
          ([k, name, desc]) => `<div class="cell"><h2><b>${k}</b>${name}</h2><p>${desc}</p>
    <div class="bar"><span class="plus">${plus}</span><span class="sp"></span><span class="mp"><span class="logo"><img src="brand/openai.svg" alt=""></span><span class="nm">gpt-6-sol</span>${ICONS[k](lv)}<span class="chev">${chev}</span></span><span class="send">${up}</span></div>
    <div class="panel"><div class="hd"><span>推理强度</span><span>⌘⇧E</span></div><div class="segX">${EF.map(([key, l], i) => `<button class="${i === lv ? "on" : ""}" data-lv="${i}">${ICONS[k](i)}${l}</button>`).join("")}</div></div>
    <div class="levels"><span>切换档位</span>${EF.map(([key, l], i) => `<button class="${i === lv ? "on" : ""}" data-lv="${i}">${l}</button>`).join("")}</div></div>`,
        ).join("");
      }
      function setTheme(t) {
        document.documentElement.dataset.theme = t;
        document.querySelectorAll("[data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
      }
      setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      render();
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-t]");
        if (t) return setTheme(t.dataset.t);
        const b = e.target.closest("[data-lv]");
        if (b) {
          lv = +b.dataset.lv;
          render();
        }
      });
    </script>
  </body>
</html>
