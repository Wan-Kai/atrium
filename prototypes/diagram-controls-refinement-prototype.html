<!doctype html>
<!-- THROWAWAY PROTOTYPE: three bounded refinements of Atrium's existing reply surface.
     A: unboxed sequence + floating controls; B: neutral nodes + quiet header controls;
     C: blue-tinted nodes + expandable zoom. Source, app shell and existing flat surfaces stay fixed.
     SVG samples below are produced by pinned local PlantUML/Mermaid, not a drawing mock.
     No app session, filesystem reader, network renderer, persistence, or production code is used. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atrium · 图表与缩放原型</title>
    <style>
      :root {
        color-scheme: light;
        --main: #fff;
        --side: #f4f4f6;
        --code: #f6f6f8;
        --text: #25262a;
        --muted: #6d7078;
        --line: #e8e9ec;
        --hover: #e9eaf0;
        --blue: #2f6fed;
      }
      :root.dark {
        color-scheme: dark;
        --main: #151517;
        --side: #1c1c1f;
        --code: #1d1e22;
        --text: #e9e9ec;
        --muted: #a2a5ae;
        --line: #303136;
        --hover: #303138;
        --blue: #8db1ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--main);
        color: var(--text);
        font:
          14px/1.55 -apple-system,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        background: var(--hover);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      svg.icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .side {
        position: fixed;
        inset: 0 auto 0 0;
        width: 212px;
        background: var(--side);
        padding: 78px 16px 20px;
        color: var(--muted);
      }
      .side p {
        font-size: 12px;
        margin: 28px 10px 8px;
      }
      .side .row {
        padding: 8px 10px;
        border-radius: 6px;
      }
      .side .active {
        color: var(--text);
        background: var(--hover);
      }
      .traffic {
        display: flex;
        gap: 8px;
        position: absolute;
        left: 18px;
        top: 18px;
      }
      .traffic i {
        display: block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .traffic i:nth-child(1) {
        background: #ff5f57;
      }
      .traffic i:nth-child(2) {
        background: #febc2e;
      }
      .traffic i:nth-child(3) {
        background: #28c840;
      }
      .top {
        position: fixed;
        inset: 0 0 auto 212px;
        height: 49px;
        border-bottom: 1px solid var(--line);
        background: var(--main);
        display: flex;
        align-items: center;
        padding: 0 18px;
        z-index: 2;
      }
      .tab {
        font-size: 13px;
        background: var(--side);
        padding: 6px 14px;
        border-radius: 8px;
      }
      .top button {
        height: 28px;
        padding: 3px 9px;
        border-radius: 5px;
        margin-left: auto;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .main {
        margin-left: 212px;
        padding: 76px 28px 108px;
      }
      .reply {
        max-width: 800px;
        margin: auto;
      }
      .question {
        margin: 0 0 22px auto;
        max-width: 410px;
        background: var(--side);
        padding: 10px 14px;
        border-radius: 14px;
        color: var(--text);
      }
      h2 {
        font-size: 17px;
        line-height: 1.4;
        font-weight: 600;
        margin: 23px 0 12px;
        letter-spacing: -0.015em;
      }
      .intro {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 12px;
      }
      .diagram {
        position: relative;
        background: var(--code);
        border-radius: 12px;
        min-width: 0;
        overflow: hidden;
      }
      .diagram-head {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        color: var(--muted);
      }
      .lang {
        font:
          11px/1.4 ui-monospace,
          "SF Mono",
          monospace;
      }
      .head-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .action {
        width: 26px;
        height: 26px;
        border-radius: 5px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        color: var(--muted);
      }
      .group {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        background: var(--code);
        border-radius: 7px;
      }
      .group .action {
        color: var(--muted);
      }
      .group output {
        font:
          11px/1.4 ui-monospace,
          "SF Mono",
          monospace;
        min-width: 42px;
        text-align: center;
        color: var(--text);
      }
      .group .fit {
        font-size: 12px;
        padding: 4px 7px;
        height: 26px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .sequence {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 30px 30px;
        min-height: 250px;
      }
      .sequence img {
        display: block;
        height: 228px;
        width: auto;
        max-width: 100%;
      }
      .flow-viewport {
        height: 231px;
        overflow: auto;
        display: flex;
        align-items: flex-start;
        padding: 20px 24px 28px;
        scrollbar-width: thin;
      }
      .flow-content {
        margin: auto;
        flex: none;
      }
      .flow-content img {
        display: block;
        max-width: none;
      }
      .subnote {
        font-size: 12px;
        color: var(--muted);
        margin: 9px 0 0;
      }
      .footer-action {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .footer-action button {
        border-radius: 6px;
        padding: 6px 9px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .description {
        font-size: 12px;
        color: var(--muted);
      }
      .variant-A .flow-head {
        position: absolute;
        inset: 8px 0 auto;
        height: 28px;
        z-index: 1;
      }
      .variant-A .flow-viewport {
        height: 256px;
        padding-top: 58px;
      }
      .variant-C .flow-head {
        height: 38px;
      }
      .compact-zoom {
        position: relative;
      }
      .zoom-toggle {
        height: 27px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        background: var(--hover);
        border-radius: 6px;
        font:
          11px ui-monospace,
          monospace;
      }
      .zoom-panel {
        display: none;
        position: absolute;
        right: 0;
        top: 34px;
        width: 224px;
        padding: 10px;
        background: var(--main);
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: 0 8px 24px #00000012;
        z-index: 3;
      }
      .zoom-panel[open] {
        display: block;
      }
      .zoom-panel input {
        width: 100%;
        accent-color: var(--blue);
        margin: 10px 0 4px;
      }
      .zoom-panel .hint {
        font-size: 11px;
        color: var(--muted);
      }
      .switcher {
        position: fixed;
        left: calc(50% + 106px);
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 7px;
        background: #24262c;
        color: #f7f7f9;
        border-radius: 12px;
        padding: 7px 8px;
        box-shadow: 0 8px 24px #0002;
        z-index: 5;
      }
      .switcher button {
        color: #f7f7f9;
        width: 30px;
        height: 30px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .switcher button:hover {
        background: #40434c;
      }
      .switcher .current {
        padding: 0 8px;
        font-size: 12px;
        min-width: 145px;
        text-align: center;
        white-space: nowrap;
      }
      .switcher .state {
        font:
          11px ui-monospace,
          monospace;
        color: #b6bdca;
        border-left: 1px solid #4b4e56;
        margin-left: 2px;
        padding: 0 9px;
        white-space: nowrap;
      }
      .preview {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        margin: 0;
        border: 0;
        padding: 0;
        background: #111114;
        color: #f9fafb;
      }
      .preview[open] {
        display: flex;
        flex-direction: column;
      }
      .preview::backdrop {
        background: #111114;
      }
      .preview-head {
        position: relative;
        flex: 0 0 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px 0 120px;
        background: #19191b;
      }
      .preview-head .traffic {
        top: 18px;
      }
      .preview-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }
      .preview-head .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
      }
      .preview button:hover {
        background: #34343a;
      }
      .preview .action {
        color: #f1f2f4;
      }
      .preview-head output {
        font:
          12px ui-monospace,
          monospace;
        min-width: 38px;
        text-align: center;
      }
      .preview-canvas {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 36px;
        overflow: hidden;
      }
      .preview-canvas img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        image-rendering: auto;
      }
      .preview-foot {
        flex: 0 0 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: #19191b;
        color: #adb2b8;
        font-size: 12px;
      }
      .prototype-notice {
        position: fixed;
        left: 16px;
        bottom: 15px;
        font-size: 10px;
        line-height: 1.5;
        color: var(--muted);
        width: 180px;
      }
      @media (max-width: 760px) {
        .side,
        .prototype-notice {
          display: none;
        }
        .top {
          left: 0;
          padding-left: 92px;
        }
        .top:before {
          content: "";
          position: absolute;
          left: 18px;
          top: 18px;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #ff5f57;
          box-shadow:
            20px 0 #febc2e,
            40px 0 #28c840;
        }
        .main {
          margin: 0;
          padding: 70px 16px 104px;
        }
        .switcher {
          left: 50%;
          width: max-content;
          max-width: calc(100vw - 16px);
        }
        .switcher .state {
          display: none;
        }
        .sequence {
          padding-inline: 16px;
        }
        .sequence img {
          height: 210px;
        }
        .preview-head {
          padding-left: 96px;
          gap: 6px;
        }
        .preview-head .right {
          gap: 2px;
        }
        .preview-head .right .fit-label {
          display: none;
        }
        .preview-foot {
          font-size: 11px;
        }
        .description {
          display: none;
        }
        .question {
          font-size: 13px;
        }
        .flow-viewport {
          padding-inline: 16px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="side">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="row">搜索工作区与对话</div>
      <p>项目</p>
      <div class="row">示例项目</div>
      <div class="row active">　图表展示</div>
      <p>对话</p>
      <div class="row">新建对话</div>
      <div class="prototype-notice">交互原型，不是生产界面<br />图表样张来自本地真实引擎</div>
    </aside>
    <header class="top">
      <span class="tab">图表与图片</span><button id="theme" aria-label="切换明暗">切换深色</button>
    </header>
    <main class="main">
      <article class="reply">
        <div class="question">展示请求的交互过程和处理流程。</div>
        <p class="intro" id="intro"></p>
        <h2>PlantUML 时序图</h2>
        <section class="diagram">
          <header class="diagram-head">
            <span class="lang">plantuml</span>
            <div class="head-right"><span class="description" id="style-note"></span></div>
          </header>
          <div class="sequence"><img id="sequence" alt="PlantUML 真实引擎样张：用户、客户端、服务端的请求过程" /></div>
        </section>
        <h2>Mermaid 流程图</h2>
        <section class="diagram" id="flow">
          <header class="diagram-head flow-head">
            <span class="lang">mermaid</span>
            <div class="head-right" id="controls"></div>
          </header>
          <div class="flow-viewport" id="flow-viewport">
            <div class="flow-content"><img id="flow-image" alt="Mermaid 真实引擎样张：校验参数与返回结果" /></div>
          </div>
        </section>
        <p class="subnote">右上控制器可实际操作；放大后在图内滚动，不放大整段对话。</p>
        <div class="footer-action">
          <button id="preview-open">检查图片预览标题</button
          ><span class="description">左上留出原生红绿灯区域，名称从其右侧开始。</span>
        </div>
      </article>
    </main>
    <nav class="switcher" aria-label="原型方案">
      <button id="prev" aria-label="上一个方案"></button><span class="current" id="current"></span
      ><button id="next" aria-label="下一个方案"></button><span class="state" id="state"></span>
    </nav>
    <dialog class="preview" id="preview" aria-label="图片预览修复原型">
      <header class="preview-head">
        <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
        <span class="preview-title">请求流程图 · 名称已避开红绿灯</span>
        <div class="right">
          <button class="action" id="preview-minus" aria-label="预览缩小"></button
          ><output id="preview-percent">100%</output
          ><button class="action" id="preview-plus" aria-label="预览放大"></button
          ><button class="action" id="preview-fit" aria-label="预览适应窗口"></button
          ><button class="action" id="preview-close" aria-label="关闭预览"></button>
        </div>
      </header>
      <div class="preview-canvas"><img id="preview-image" alt="请求流程示例" /></div>
      <footer class="preview-foot"><span>示例图 · 预览布局原型</span><span>红绿灯仅为位置示意 · Esc 返回</span></footer>
    </dialog>

ult\" id=\"flow-dark-flowchart-C-3\" data-look=\"classic\" transform=\"translate(452, 36)\"><rect class=\"basic label-container\" style=\"\" x=\"-64\" y=\"-28\" width=\"128\" height=\"56\"></rect><g class=\"label\" style=\"\" transform=\"translate(-32, -12)\"><rect></rect><foreignObject width=\"64\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel\"><p>执行任务</p></span></div></foreignObject></g></g><g class=\"node default\" id=\"flow-dark-flowchart-D-5\" data-look=\"classic\" transform=\"translate(452, 142)\"><rect class=\"basic label-container\" style=\"\" x=\"-64\" y=\"-28\" width=\"128\" height=\"56\"></rect><g class=\"label\" style=\"\" transform=\"translate(-32, -12)\"><rect></rect><foreignObject width=\"64\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel\"><p>返回错误</p></span></div></foreignObject></g></g><g class=\"node default\" id=\"flow-dark-flowchart-E-7\" data-look=\"classic\" transform=\"translate(630, 36)\"><rect class=\"basic label-container\" style=\"\" x=\"-64\" y=\"-28\" width=\"128\" height=\"56\"></rect><g class=\"label\" style=\"\" transform=\"translate(-32, -12)\"><rect></rect><foreignObject width=\"64\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel\"><p>返回结果</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"flow-dark-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"flow-dark-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"flow-dark-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#555B65\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"hsl(105, 0%, 5.6862745098%)\" stop-opacity=\"1\"></stop></linearGradient></svg>"

    <script>
      const samples = JSON.parse(document.querySelector("#sample-data").textContent);
      const params = new URLSearchParams(location.search);
      const variants = ["A", "B", "C"];
      let variant = variants.includes(params.get("variant")) ? params.get("variant") : "B";
      let dark = params.get("theme") === "dark";
      let scale = 1;
      let fitted = true;
      let previewScale = 1;
      const icons = {
        minus: '<path d="M5 12h14"/>',
        plus: '<path d="M5 12h14M12 5v14"/>',
        fit: '<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>',
        close: '<path d="m6 6 12 12M6 18 18 6"/>',
        left: '<path d="m14 6-6 6 6 6"/>',
        right: '<path d="m10 6 6 6-6 6"/>',
        chevron: '<path d="m7 10 5 5 5-5"/>',
      };
      /** Returns the same small line-icon vocabulary for every variant.
       * @remarks Icons are geometry, never a substitute font glyph.
       * @sideEffects none
       */
      function icon(name) {
        return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + icons[name] + "</svg>";
      }
      /** Makes a data-only image from an already-generated synthetic SVG.
       * @remarks No renderer request occurs while reviewing this standalone prototype.
       * @sideEffects none
       */
      function svgData(svg) {
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      }
      /** Updates only the diagram's original-relative geometry and its explicit state readout.
       * @remarks Fit is responsive; manual actions are bounded to 25–400 percent.
       * @sideEffects Changes the demo image size and control text.
       */
      function paintScale() {
        if (fitted) scale = Math.min(1, (document.querySelector("#flow-viewport").clientWidth - 48) / 702);
        const image = document.querySelector("#flow-image");
        image.style.width = 702 * scale + "px";
        image.style.height = 178 * scale + "px";
        document
          .querySelectorAll("[data-percent]")
          .forEach((node) => (node.textContent = Math.round(scale * 100) + "%"));
        document.querySelectorAll('[data-step="-1"]').forEach((node) => (node.disabled = scale <= 0.25));
        document.querySelectorAll('[data-step="1"]').forEach((node) => (node.disabled = scale >= 4));
        document.querySelector("#state").textContent = (fitted ? "适应 · " : "手动 · ") + Math.round(scale * 100) + "%";
      }
      /** Applies one manual step without turning a below-minimum fit into an accidental zoom-in.
       * @remarks This matches the keyboard boundary being corrected in the application.
       * @sideEffects Updates the diagram.
       */
      function step(delta) {
        if (delta < 0 && scale <= 0.25) return;
        fitted = false;
        scale = Math.min(4, Math.max(0.25, scale + delta * 0.25));
        paintScale();
      }
      /** Rebuilds the small controller while preserving the existing app shell and diagram content.
       * @remarks Each proposal changes the hierarchy, not the product's identity.
       * @sideEffects Updates the prototype DOM and its shareable selection URL.
       */
      function render() {
        const names = { A: "无框线稿", B: "中性轻框", C: "柔蓝强调" };
        const descriptions = {
          A: "名称替代节点框，控件浮在右上。",
          B: "细边、轻底，控件放进顶部独立工具行。",
          C: "轻蓝节点，点击比例展开完整缩放面板。",
        };
        document.documentElement.classList.toggle("dark", dark);
        document.body.className = "variant-" + variant;
        document.querySelector("#theme").textContent = dark ? "切换浅色" : "切换深色";
        document.querySelector("#current").textContent = variant + " · " + names[variant];
        document.querySelector("#intro").textContent = descriptions[variant];
        document.querySelector("#style-note").textContent = "去阴影 · 隐藏底部重复参与者 · 沿用系统字体";
        document.querySelector("#sequence").src = svgData(samples[variant + "-" + (dark ? "dark" : "light")]);
        document.querySelector("#flow-image").src = svgData(samples["flow-" + (dark ? "dark" : "light")]);
        const group =
          '<div class="group"><button class="action" data-step="-1" aria-label="缩小">' +
          icon("minus") +
          '</button><output data-percent></output><button class="action" data-step="1" aria-label="放大">' +
          icon("plus") +
          '</button><button class="fit" data-fit>适应</button></div>';
        document.querySelector("#controls").innerHTML =
          variant === "C"
            ? '<div class="compact-zoom"><button class="zoom-toggle" id="zoom-toggle" aria-expanded="false" aria-label="展开缩放控制"><span data-percent></span>' +
              icon("chevron") +
              '</button><div class="zoom-panel" id="zoom-panel">' +
              group +
              '<input id="zoom-range" aria-label="手动缩放比例" type="range" min="25" max="400" value="100"><span class="hint">25%–400% · 适应后可低于 25%</span></div></div>'
            : group;
        document
          .querySelectorAll("[data-step]")
          .forEach((button) => (button.onclick = () => step(Number(button.dataset.step))));
        document.querySelectorAll("[data-fit]").forEach(
          (button) =>
            (button.onclick = () => {
              fitted = true;
              paintScale();
            }),
        );
        const toggle = document.querySelector("#zoom-toggle");
        if (toggle)
          toggle.onclick = () => {
            const panel = document.querySelector("#zoom-panel");
            panel.toggleAttribute("open");
            toggle.setAttribute("aria-expanded", String(panel.hasAttribute("open")));
          };
        const range = document.querySelector("#zoom-range");
        if (range)
          range.oninput = () => {
            fitted = false;
            scale = Number(range.value) / 100;
            paintScale();
          };
        const query = new URLSearchParams({ variant, theme: dark ? "dark" : "light" });
        history.replaceState(null, "", "?" + query);
        fitted = true;
        paintScale();
      }
      /** Cycles the single retained selection rather than opening more mock pages.
       * @remarks The URL can be shared or reopened.
       * @sideEffects Renders another prototype variant.
       */
      function cycle(delta) {
        variant = variants[(variants.indexOf(variant) + delta + 3) % 3];
        render();
      }
      document.querySelector("#prev").innerHTML = icon("left");
      document.querySelector("#next").innerHTML = icon("right");
      document.querySelector("#prev").onclick = () => cycle(-1);
      document.querySelector("#next").onclick = () => cycle(1);
      document.querySelector("#theme").onclick = () => {
        dark = !dark;
        render();
      };
      document.addEventListener("keydown", (event) => {
        if (document.querySelector("#preview").open || event.target.matches("input,textarea,[contenteditable]")) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      window.addEventListener("resize", () => {
        if (fitted) paintScale();
      });
      for (const [id, name] of [
        ["preview-minus", "minus"],
        ["preview-plus", "plus"],
        ["preview-fit", "fit"],
        ["preview-close", "close"],
      ])
        document.getElementById(id).innerHTML = icon(name);
      document.querySelector("#preview-open").onclick = () => {
        previewScale = 1;
        document.querySelector("#preview-image").src = svgData(samples["flow-dark"]);
        document.querySelector("#preview-image").style.transform = "scale(1)";
        document.querySelector("#preview-percent").textContent = "100%";
        document.querySelector("#preview").showModal();
        document.querySelector("#preview-close").focus();
      };
      document.querySelector("#preview-close").onclick = () => document.querySelector("#preview").close();
      document.querySelector("#preview-plus").onclick = () => {
        previewScale = Math.min(4, previewScale + 0.25);
        document.querySelector("#preview-image").style.transform = "scale(" + previewScale + ")";
        document.querySelector("#preview-percent").textContent = Math.round(previewScale * 100) + "%";
      };
      document.querySelector("#preview-minus").onclick = () => {
        previewScale = Math.max(0.25, previewScale - 0.25);
        document.querySelector("#preview-image").style.transform = "scale(" + previewScale + ")";
        document.querySelector("#preview-percent").textContent = Math.round(previewScale * 100) + "%";
      };
      document.querySelector("#preview-fit").onclick = () => {
        previewScale = 1;
        document.querySelector("#preview-image").style.transform = "scale(1)";
        document.querySelector("#preview-percent").textContent = "100%";
      };
      render();
      window.prototypeReady = true;
    </script>
