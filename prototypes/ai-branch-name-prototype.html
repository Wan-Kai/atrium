<!doctype html>
<!--
  PROTOTYPE — throwaway. 新建 worktree 时让 AI 起分支名（2026-10-14 定"先起名再建"：发出后先起名，再用这个名字建 worktree，
  分支、目录、侧栏名一致；起名失败或 15 秒没结果用随机名接着走）。这里比较页面上怎么表示"会自动起名"、时间轴上怎么表示起名这一步。
  A 单独一步：分支名按钮写"✦ 自动起名"；时间轴最前多一步"起名"，做完后面跟名字。
  B 并入创建：按钮同 A；时间轴还是三步，第一步先写"起名"扫光，起好后换成"创建 worktree atrium/… · 基于 …"。
  C 占位名：按钮写 atrium/ 加一段淡色的"✦ 自动"；时间轴同 A，名字起好时逐字出现，选择排上的按钮同时换成这个名字。
  三版共有：点按钮可以自己写名字，写了就不再起名（时间轴没有起名这一步）；清空恢复自动起名。
  底部浮条：版本（也可 ?variant=A|B|C、← →）、浅色 / 深色、情形（发出前 / 播放成功 / 播放失败兜底 / 自己写了名字）。
  颜色、字号取自 packages/ui/src/design/tokens.css；图标是 Hugeicons 免费版，从 @hugeicons/core-free-icons 直接生成。
-->

0L5.77892 9.40255C5.48903 8.61913 5.34408 8.22741 5.05833 7.94167C4.77259 7.65592 4.38087 7.51097 3.59745 7.22108L3 7L3.59745 6.77892C4.38087 6.48903 4.77259 6.34408 5.05833 6.05833C5.34408 5.77259 5.48903 5.38087 5.77892 4.59745L6 4Z\" stroke=\"currentColor\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/>", "ArrowDown01Icon": "<path d=\"M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/>", "ArrowUp02Icon": "<path d=\"M12 5.5V19\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/><path d=\"M18 11C18 11 13.5811 5.00001 12 5C10.4188 4.99999 6 11 6 11\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/>", "Cancel01Icon": "<path d=\"M18 6L6.00081 17.9992M17.9992 18L6 6.00085\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/>", "ShuffleIcon": "<path d=\"M19.5576 4L20.4551 4.97574C20.8561 5.41165 21.0566 5.62961 20.9861 5.81481C20.9155 6 20.632 6 20.0649 6C18.7956 6 17.2771 5.79493 16.1111 6.4733C15.3903 6.89272 14.8883 7.62517 14.0392 9M3 18H4.58082C6.50873 18 7.47269 18 8.2862 17.5267C9.00708 17.1073 9.50904 16.3748 10.3582 15\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/><path d=\"M19.5576 20L20.4551 19.0243C20.8561 18.5883 21.0566 18.3704 20.9861 18.1852C20.9155 18 20.632 18 20.0649 18C18.7956 18 17.2771 18.2051 16.1111 17.5267C15.2976 17.0534 14.7629 16.1815 13.6935 14.4376L10.7038 9.5624C9.63441 7.81853 9.0997 6.9466 8.2862 6.4733C7.47269 6 6.50873 6 4.58082 6H3\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/>"};
const icon = (n, s = 14, cls = "ic") => `<svg class="${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const ARC = `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="26 40"/></svg>`;
const MESSAGE = "登录接口偶尔超时，帮我查一下原因，顺便把重试加上";
const AI_NAME = "atrium/fix-login-timeout";
const RANDOM = "atrium/brave-badger";
const DESC = {
  A: "A 单独一步：按钮写\"✦ 自动起名\"；时间轴最前多一步\"起名\"，做完后面跟名字。",
  B: "B 并入创建：按钮同 A；时间轴还是三步，第一步先写\"起名\"，起好后换成\"创建 worktree …\"。",
  C: "C 占位名：按钮写 atrium/ 加淡色\"✦ 自动\"；名字起好时逐字出现，按钮同时换成这个名字。",
};
const state = {
  variant: new URLSearchParams(location.search).get("variant") || "A",
  theme: "light", kase: "idle",
  custom: null, editing: false,
  phase: "page", // page | naming | creating | session | sending | done
  named: null, failed: false, typed: 0, timers: [],
};
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function clearTimers() { state.timers.forEach(clearTimeout); state.timers = []; }
function later(ms, f) { state.timers.push(setTimeout(() => { f(); render(); }, ms)); }

function play(fail) {
  clearTimers();
  state.failed = fail; state.named = null; state.typed = 0; state.editing = false;
  if (state.custom !== null) { state.phase = "creating"; state.named = state.custom; }
  else { state.phase = "naming"; }
  render();
  let t = state.custom !== null ? 0 : (fail ? 2600 : 1600);
  if (state.custom === null) {
    later(t, () => {
      state.named = fail ? RANDOM : AI_NAME; state.phase = "creating";
      if (state.variant === "C" && !fail) typeName();
    });
  }
  later(t + 1200, () => { state.phase = "session"; });
  later(t + 2400, () => { state.phase = "sending"; });
  later(t + 3200, () => { state.phase = "done"; });
}
function typeName() {
  state.typed = 0;
  const step = () => { state.typed++; render(); if (state.typed < state.named.length) state.timers.push(setTimeout(step, 28)); };
  state.timers.push(setTimeout(step, 0));
}
function reset() { clearTimers(); state.phase = "page"; state.named = null; state.failed = false; state.editing = false; }

function shownName() {
  if (state.variant === "C" && state.named && state.typed < state.named.length && !state.failed && state.custom === null) return state.named.slice(0, state.typed);
  return state.named;
}

function branchChip() {
  const held = state.phase !== "page";
  if (state.editing) {
    return `<span class="field">${icon("PencilEdit01Icon")}<input id="branchInput" value="${esc(state.custom ?? "")}" placeholder="输入分支名，留空让 AI 起名">
      <span class="hint"><span><kbd>⏎</kbd>保存</span><span><kbd>esc</kbd>取消</span><span>清空恢复自动起名</span></span></span>`;
  }
  const cls = `chip${held ? " held" : ""}`;
  if (state.custom !== null) return `<button class="${cls}" data-act="edit">${icon("PencilEdit01Icon")}<span class="nm">${esc(state.custom)}</span></button>`;
  if (state.named && state.phase !== "naming") {
    const fresh = state.phase === "creating" ? " fresh" : "";
    return `<button class="${cls}">${icon("PencilEdit01Icon")}<span class="nm${fresh}">${esc(shownName())}</span></button>`;
  }
  const tip = `<span class="tip">发出后，AI 按第一条消息起分支名；点这里自己写</span>`;
  if (state.variant === "C") {
    return `<button class="${cls}" data-act="edit">${icon("PencilEdit01Icon")}<span>atrium/</span><span class="auto">${icon("SparklesIcon", 12, "spark")}自动</span>${tip}</button>`;
  }
  return `<button class="${cls}" data-act="edit">${icon("SparklesIcon", 14, "spark")}<span>自动起名</span>${tip}</button>`;
}

function rowHtml() {
  const held = state.phase !== "page" ? " held" : "";
  return `<button class="chip${held}">${icon("Folder01Icon")}atrium${icon("ArrowDown01Icon", 12, "car")}</button>
    <button class="chip${held}">${icon("GitBranchIcon")}新建 worktree${icon("ArrowDown01Icon", 12, "car")}</button>
    <button class="chip${held}">${icon("GitCommitIcon")}基于 origin/main${icon("ArrowDown01Icon", 12, "car")}</button>
    ${branchChip()}`;
}

const ORDER = ["naming", "creating", "session", "sending", "done"];
const at = () => ORDER.indexOf(state.phase);
function node(kind) { return { dot: `<span class="n-dot"></span>`, wait: `<span class="n-wait"></span>`, live: `<span class="n-live"></span>${ARC}` }[kind]; }
function stepLi(kind, verb, det, first, last, why = "") {
  return `<li class="${kind}">${first ? "" : `<span class="rail-up"></span>`}${last ? "" : `<span class="rail-down"></span>`}<span class="node">${node(kind)}</span>
    <div class="ln"><span class="verb${kind === "live" ? " shimmer" : ""}">${verb}</span>${det ? `<span class="det">${det}</span>` : ""}</div>${why ? `<div class="why">${why}</div>` : ""}</li>`;
}
const k = (i) => (at() > i ? "dot" : at() === i ? "live" : "wait");
function timeline() {
  const custom = state.custom !== null;
  const nm = shownName();
  const caret = state.variant === "C" && state.named && state.typed < state.named.length && !state.failed && !custom;
  const nameDet = state.named ? `<span class="mono${caret ? " typing" : ""}">${esc(nm)}</span>` : "";
  const fellBack = state.failed && state.named;
  const steps = [];
  const createDet = state.named ? `${nameDet} · 基于 origin/main` : "";
  if (state.variant === "B" && !custom) {
    if (state.phase === "naming") steps.push(stepLi("live", "起名", "按第一条消息", true, false));
    else steps.push(stepLi(k(1), "创建 worktree", createDet, true, false, fellBack && at() >= 1 ? "没起成名，用了随机名" : ""));
  } else {
    if (!custom) {
      const det = state.phase === "naming" ? "按第一条消息" : fellBack ? `没起成，用随机名 <span class="mono">${RANDOM}</span>` : nameDet;
      steps.push(stepLi(k(0), "起名", det, true, false));
    }
    steps.push(stepLi(k(1), "创建 worktree", at() >= 1 ? (state.variant === "C" || custom || fellBack ? `<span class="mono">${esc(state.named)}</span> · 基于 origin/main` : `基于 origin/main`) : "", custom, false));
  }
  steps.push(stepLi(k(2), "启动会话", "", false, false));
  steps.push(stepLi(k(3), "发出消息", "", false, true));
  const pending = at() < 3 ? `<div class="pending"><div class="bubble">${esc(MESSAGE)}</div></div>` : "";
  return `<div class="timeline"><ol>${steps.join("")}</ol>${pending}</div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById("desc").textContent = DESC[state.variant];
  const body = document.getElementById("body");
  if (state.phase === "page") body.innerHTML = `<div class="hero"><b>新建工作区</b><span>发出第一条消息时，才建 worktree</span></div>`;
  else if (state.phase === "done") body.innerHTML = `<div class="timeline"><div class="pending" style="opacity:1"><div class="bubble">${esc(MESSAGE)}</div></div></div>`;
  else body.innerHTML = timeline();
  document.getElementById("row").innerHTML = state.phase === "done" ? "" : rowHtml();
  document.getElementById("row").style.display = state.phase === "done" ? "none" : "";
  const empty = state.phase !== "page";
  document.getElementById("composer").innerHTML = `<div class="text${empty ? " empty" : ""}">${empty ? "接着说点什么…" : esc(MESSAGE)}</div>
    <div class="foot"><button class="send" data-act="send"${empty && state.phase !== "done" ? " disabled" : ""}>${icon("ArrowUp02Icon", 16, "")}</button></div>`;
  const showWs = at() >= 2;
  document.getElementById("sbnew").innerHTML = showWs ? `<div class="ws new">${esc(state.named)}</div>` : "";
  document.getElementById("note").innerHTML = {
    page: state.custom !== null ? "<b>自己写了名字</b>：按钮回到铅笔 + 名字（同现在），发出后不起名，时间轴从\"创建 worktree\"开始。" : "<b>发出前</b>：悬停按钮 0.4 秒说明它做什么。点开是空的输入框，提示\"输入分支名，留空让 AI 起名\"。",
    naming: "<b>起名中</b>：用设置里\"生成标题用的模型\"，第一条消息从标准输入给；目录、分支都还没建。",
    creating: state.failed ? "<b>兜底</b>：起名失败、给的名字不合规或 15 秒没结果，就用随机名接着走，不打断、不报错。" : "<b>建 worktree</b>：目录 atrium.worktrees/fix-login-timeout，分支 atrium/fix-login-timeout；选择排上的按钮同时换成这个名字。",
    session: "<b>启动会话</b>：侧栏出现新工作区并选中，名字就是 AI 起的分支名。",
    sending: "<b>发出消息</b>。",
    done: "发出后时间轴消失，对话区就是这个会话。浮条上可以重放。",
  }[state.phase];
  const seg = (id, items, cur, key) => document.getElementById(id).innerHTML = items.map(([v, l]) => `<button class="${cur === v ? "on" : ""}" data-${key}="${v}">${l}</button>`).join("");
  seg("variants", [["A", "A 单独一步"], ["B", "B 并入创建"], ["C", "C 占位名"]], state.variant, "variant");
  seg("themes", [["light", "浅色"], ["dark", "深色"]], state.theme, "theme");
  seg("cases", [["idle", "发出前"], ["ok", "播放成功"], ["fail", "播放失败兜底"], ["custom", "自己写了名字"]], state.kase, "kase");
  const input = document.getElementById("branchInput");
  if (input) {
    input.focus(); input.select();
    input.onkeydown = (e) => {
      if (e.key === "Enter") { const v = input.value.trim(); state.custom = v === "" ? null : v; state.editing = false; render(); }
      if (e.key === "Escape") { state.editing = false; render(); }
    };
    input.onblur = () => { if (!state.editing) return; const v = input.value.trim(); state.custom = v === "" ? null : v; state.editing = false; render(); };
  }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.variant) { state.variant = d.variant; if (state.phase !== "page") play(state.failed); }
  else if (d.theme) state.theme = d.theme;
  else if (d.kase) {
    state.kase = d.kase; reset();
    if (d.kase === "custom") state.custom = "fix/login-retry";
    else state.custom = null;
    if (d.kase === "ok") return play(false);
    if (d.kase === "fail") return play(true);
  }
  else if (d.act === "edit" && state.phase === "page") state.editing = true;
  else if (d.act === "send") { if (state.phase === "page") return play(false); if (state.phase === "done") { reset(); } }
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const order = ["A", "B", "C"]; const i = order.indexOf(state.variant);
  if (e.key === "ArrowRight") { state.variant = order[(i + 1) % 3]; render(); }
  if (e.key === "ArrowLeft") { state.variant = order[(i + 2) % 3]; render(); }
});
render();
</script>
</body>
</html>
