  · 四种形式各自适合讲什么：图（Mermaid）、交互演示（HTML）、动手（lab/ 代码）、配图（出图服务）。

        color: var(--text);
      }
      .lesson.next .no {
        color: var(--tint);
        font-weight: 600;
      }
      .lesson.todo .lh {
        color: var(--text-dim);
      }
      .sess {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 10px 8px 38px;
      }
      .schip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        font-size: var(--fs-sm);
        color: var(--text-2);
        white-space: nowrap;
      }
      .schip .i {
        color: var(--text-muted);
      }
      .schip .s {
        color: var(--text-dim);
      }
      .schip.child {
        margin-left: -1px;
      }
      .side-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .frow {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 8px;
        border-radius: var(--r);
        font: var(--fs-mono) var(--font-mono);
        color: var(--text-2);
      }
      .frow .m {
        margin-left: auto;
        color: var(--text-dim);
        font: var(--fs-sm) var(--font-sans);
        white-space: nowrap;
      }
      .frow.new {
        background: color-mix(in srgb, var(--ok) 9%, transparent);
      }
      .gap-row {
        display: flex;
        gap: 10px;
        padding: 9px 12px;
        font-size: var(--fs-meta);
        color: var(--text-2);
        line-height: 1.5;
      }
      .gap-row + .gap-row {
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .gap-row .src {
        display: block;
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }
      .gap-row .mk {
        margin-top: 5px;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: 0 0 auto;
        background: var(--attn);
      }
      .gap-row.fixed .mk {
        background: var(--ok);
      }
      .gap-row.fixed .tx {
        color: var(--text-dim);
      }
      .mini-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 6px 14px;
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .check + .check {
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .check .box {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        box-shadow: inset 0 0 0 1.5px var(--rail);
      }
      .check .box.on {
        background: var(--ok);
        box-shadow: none;
        color: #fff;
      }
      .check .t {
        flex: 1;
      }
      .check .t small {
        display: block;
        color: var(--text-dim);
        font-size: var(--fs-sm);
      }

      /* 对话 */
      .conv {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .bubble {
        align-self: flex-end;
        max-width: 80%;
        padding: 9px 14px;
        border-radius: var(--r-bubble);
        background: var(--surface-2);
        color: var(--text);
        font-size: var(--fs-reply);
        line-height: 1.55;
      }
      .bubble .cmd {
        color: var(--tint);
        font-weight: 500;
      }
      .reply {
        font-size: var(--fs-reply);
        line-height: 1.55;
        color: var(--text);
      }
      .reply p {
        margin: 0 0 10px;
      }
      .reply p:last-child {
        margin-bottom: 0;
      }
      .reply ul,
      .reply ol {
        margin: 0 0 10px;
        padding-left: 20px;
      }
      .reply li {
        margin: 2px 0;
      }
      .reply h4 {
        margin: 0 0 6px;
        font-size: var(--fs-reply);
      }
      .reply table {
        border-collapse: collapse;
        font-size: var(--fs-meta);
        margin: 0 0 10px;
      }
      .reply td,
      .reply th {
        padding: 5px 12px 5px 0;
        text-align: left;
        box-shadow: inset 0 -0.5px 0 var(--line);
      }
      .reply th {
        color: var(--text-muted);
        font-weight: 500;
      }
      .reply pre {
        margin: 0 0 10px;
        padding: 10px 12px;
        border-radius: var(--r-md);
        background: var(--code);
        font: var(--fs-mono) / 1.5 var(--font-mono);
        color: var(--text-3);
        overflow: auto;
      }
      .proc {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-meta);
        color: var(--text-dim);
      }
      .proc .arr {
        color: var(--text-dim);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .filechip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        font: var(--fs-sm) var(--font-mono);
        color: var(--text-2);
      }
      .filechip .plus {
        color: var(--ok-text);
      }
      .filechip .minus {
        color: var(--danger);
      }
      .childhead {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 12px;
        background: var(--code);
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }
      .childhead b {
        color: var(--text-2);
        font-weight: 500;
      }
      .childhead .sp {
        flex: 1;
      }

      /* 输入区 */
      .composer-wrap {
        padding: 0 24px 16px;
        position: relative;
      }
      .composer-wrap::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -40px;
        height: 40px;
        background: linear-gradient(transparent, var(--main));
        pointer-events: none;
      }
      .capbar {
        display: flex;
        gap: 8px;
        max-width: 672px;
        margin: 0 auto 8px;
        align-items: center;
      }
      .capbar .sp {
        flex: 1;
      }
      .capsule {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--surface-1);
        box-shadow:
          var(--chip-shadow),
          0 2px 8px rgba(0, 0, 0, 0.04);
        font-size: var(--fs-sm);
        color: var(--text-2);
        white-space: nowrap;
      }
      .capsule .i {
        color: var(--text-muted);
      }
      .study-cap {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 672px;
        margin: 0 auto 8px;
        height: 40px;
        padding: 0 6px 0 12px;
        border-radius: 14px;
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .study-cap .ic {
        color: var(--tint);
        display: inline-flex;
      }
      .study-cap .sp {
        flex: 1;
      }
      .study-cap .m {
        color: var(--text-dim);
        font-size: var(--fs-sm);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .study-cap .btn {
        height: 28px;
        border-radius: 10px;
      }
      .composer {
        max-width: 672px;
        margin: 0 auto;
        min-height: 88px;
        padding: 14px;
        border-radius: var(--r-bubble);
        background: var(--surface-2);
        box-shadow: inset 0 0 0 0.5px var(--line);
        color: var(--text-dim);
        font-size: var(--fs);
        display: flex;
        flex-direction: column;
      }
      .composer .bar {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }
      .composer .send {
        margin-left: auto;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--text);
        color: var(--main);
        display: grid;
        place-items: center;
      }
      .composer .send.stop i {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--main);
      }

      /* 提问卡片（SPEC-0003 的样子） */
      .qcard {
        max-width: 672px;
        margin: 0 auto 8px;
        padding: 12px 14px;
        border-radius: var(--r-card);
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
      }
      :root[data-theme="dark"] .qcard {
        background: var(--surface-2);
      }
      .qcard .qh {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-meta);
      }
      .qcard .qh .agent {
        font-weight: 700;
        color: var(--attn-text);
        letter-spacing: 0.01em;
      }
      .qcard .qh .who {
        font-weight: 500;
        color: var(--text);
      }
      .qcard .qh .cnt {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .qcard .qh .sp {
        flex: 1;
      }
      .qpill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 9px;
        border-radius: 999px;
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .qpill.on {
        background: var(--selected);
        color: var(--text);
        font-weight: 500;
      }
      .qpill .o {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px var(--text-dim);
      }
      .qpill .ok {
        color: var(--ok-text);
        display: inline-flex;
      }
      .qcard .qt {
        margin: 10px 0 8px;
        font-size: var(--fs);
        font-weight: 500;
        color: var(--text);
      }
      .qcard .qt .kind {
        margin-left: 8px;
        display: inline-flex;
        height: 18px;
        align-items: center;
        padding: 0 6px;
        border-radius: var(--r-sm);
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: var(--fs-xs);
        font-weight: 400;
        vertical-align: 1px;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 8px 10px;
        margin-bottom: 2px;
        border-radius: var(--r-md);
      }
      .opt.on {
        background: var(--linked);
      }
      .opt .k {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: var(--fs-sm);
        font-weight: 600;
      }
      :root[data-theme="dark"] .opt .k {
        background: var(--surface-3);
      }
      .opt.on .k,
      :root[data-theme="dark"] .opt.on .k {
        background: var(--tint);
        color: var(--on-tint);
      }
      .opt .ot {
        font-size: var(--fs-meta);
        font-weight: 500;
        color: var(--text);
        line-height: 20px;
      }
      .opt .od {
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .qfoot {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
      }
      .qfoot .kb {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .qfoot .sp {
        flex: 1;
      }

      /* 对话框 */
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        backdrop-filter: blur(8px);
        display: grid;
        place-items: center;
        z-index: 5;
      }
      .dialog {
        width: 400px;
        padding: 20px;
        border-radius: var(--r-card);
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
      }
      .dialog h3 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }
      .dialog p {
        margin: 0 0 14px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
        line-height: 1.55;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .field label {
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .input {
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-radius: var(--r-md);
        background: var(--main);
        box-shadow:
          inset 0 0 0 1px var(--tint),
          0 0 0 3px color-mix(in srgb, var(--tint) 16%, transparent);
        font-size: var(--fs);
        color: var(--text);
      }
      .input .caret {
        display: inline-block;
        width: 1.5px;
        height: 1.1em;
        margin-left: 1px;
        background: var(--tint);
        animation: blink 1.06s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .pathline {
        display: flex;
        align-items: center;
        gap: 6px;
        font: var(--fs-sm) var(--font-mono);
        color: var(--text-muted);
      }
      .dialog .foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      .dialog .opt-line {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: var(--fs-meta);
        color: var(--text-2);
        padding: 6px 0;
      }
      .dialog .cb {
        width: 16px;
        height: 16px;
        border-radius: 5px;
        background: var(--tint);
        color: var(--on-tint);
        display: grid;
        place-items: center;
      }
      .hidden {
        display: none !important;
      }

      /* 步骤条 */
      .subd {
        display: inline-flex;
        gap: 2px;
        flex: 0 0 auto;
      }
      .subd i {
        width: 5px;
        height: 5px;
        border-radius: 1.4px;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .subd i.d {
        background: var(--text-muted);
        box-shadow: none;
      }
      .subd i.g {
        background: var(--attn);
        box-shadow: none;
      }
      .lesson .no.kd {
        display: inline-flex;
        color: var(--text-dim);
      }
      .lesson.next .no.kd {
        color: var(--tint);
      }
      .lvd {
        margin: 2px 0 0;
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .lv.done .lvd {
        display: none;
      }
      .trackhead {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: var(--fs-meta);
        color: var(--text-2);
        font-weight: 500;
      }
      .trackhead .m {
        margin-left: auto;
        font-size: var(--fs-sm);
        color: var(--text-dim);
        font-weight: 400;
      }
      .trackb {
        display: flex;
        gap: 4px;
        margin-top: 12px;
      }
      .trackb .cell {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--text-dim);
        font-size: var(--fs-xs);
      }
      .trackb .seg {
        width: 100%;
        height: 6px;
        border-radius: 2px;
        background: var(--line-strong);
      }
      .trackb .done .seg {
        background: var(--text-muted);
      }
      .trackb .cur .seg {
        background: var(--tint);
      }
      .trackb .cur {
        color: var(--tint);
        font-weight: 600;
      }
      .trackb .lb {
        height: 14px;
        display: inline-flex;
        align-items: center;
      }
      .hero.inner {
        padding: 14px 0 0;
        margin-top: 14px;
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .strip {
        height: 40px;
        flex: 0 0 40px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 16px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        font-size: var(--fs-sm);
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .strip .lvl {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--text-2);
        font-weight: 500;
      }
      .strip .trk {
        display: inline-flex;
        gap: 3px;
      }
      .strip .trk i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--line-strong);
      }
      .strip .trk i.done {
        background: var(--text-muted);
      }
      .strip .trk i.cur {
        background: var(--tint);
      }
      .strip .trk i.x {
        border-radius: 50%;
      }
      .strip .now {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .strip .now b {
        color: var(--text);
        font-weight: 500;
      }
      .strip .sp {
        flex: 1;
      }
      .btn.sm {
        height: 26px;
        padding: 0 10px;
        border-radius: 9px;
      }
      .subpills {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        font-size: var(--fs-sm);
      }
      .subpill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--text-muted);
      }
      .subpill.on {
        background: var(--linked);
        color: var(--tint);
        font-weight: 500;
      }
      .lvc {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 4px;
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .lvc .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lvc .m {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .lvc.cur .node i {
        width: 12px;
        height: 12px;
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--tint);
      }
      .lvc.lock .node i {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--rail);
      }
      .lvc.lock {
        color: var(--text-dim);
      }
      .drow {
        padding: 8px 12px;
      }
      .drow + .drow {
        box-shadow: inset 0 0.5px 0 var(--line);
      }
      .drow .dt {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--fs-meta);
        color: var(--text-2);
      }
      .drow .dt .ok {
        color: var(--ok-text);
        display: inline-flex;
      }
      .drow .sess {
        padding: 6px 0 0 22px;
      }
      .drow.more {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }

      /* 新方向：只有输入框的页 */
      .newdir {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 0 24px 40px;
      }
      .newdir .nd-in {
        width: 100%;
        max-width: 672px;
      }
      .newdir .say {
        font-size: 22px;
        font-weight: 600;
        color: var(--text);
        text-align: center;
      }
      .newdir .sub {
        margin: 6px auto 20px;
        max-width: 460px;
        font-size: var(--fs-meta);
        color: var(--text-muted);
        text-align: center;
        line-height: 1.6;
      }
      .composer.typed {
        color: var(--text);
      }
      .hostline {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .hostline b {
        color: var(--text-3);
        font-weight: 500;
      }
      .reply td.skip {
        color: var(--text-dim);
        text-decoration: line-through;
      }

      /* 演示框（真做时是沙箱 iframe） */
      .vframe {
        border-radius: 14px;
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
        overflow: hidden;
      }
      .vhead {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 6px 0 12px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        font: var(--fs-sm) var(--font-mono);
        color: var(--text-muted);
      }
      .vhead .i {
        color: var(--tint);
      }
      .vhead .sp {
        flex: 1;
      }
      .vhead .tag {
        font-family: var(--font-sans);
      }
      .vbody {
        padding: 14px 16px 14px;
      }
      .vtitle {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: var(--fs);
        font-weight: 600;
        color: var(--text);
      }
      .vtitle .sp {
        flex: 1;
      }
      .lanes {
        display: grid;
        grid-template-columns: 1fr 124px 1fr;
        gap: 6px 8px;
        margin-top: 12px;
        font-size: var(--fs-meta);
      }
      .lanes .lh {
        font-size: var(--fs-xs);
        color: var(--text-dim);
        text-align: center;
      }
      .lanes .cell {
        min-height: 34px;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--code);
        color: var(--text-2);
        line-height: 1.45;
        transition: opacity 0.2s;
      }
      .lanes .cell.empty {
        background: transparent;
      }
      .lanes .cell.db {
        text-align: center;
        font-weight: 600;
        color: var(--text);
      }
      .lanes .cell.db small {
        display: block;
        font-weight: 400;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .lanes .cell code {
        background: transparent;
        padding: 0;
      }
      .lanes .future {
        opacity: 0.22;
      }
      .lanes .now:not(.empty) {
        box-shadow: inset 0 0 0 1.5px var(--tint);
      }
      .lanes .res {
        display: block;
        margin-top: 2px;
        font-weight: 600;
      }
      .lanes .res.bad {
        color: var(--attn-text);
      }
      .lanes .res.good {
        color: var(--ok-text);
      }
      .lanes .res.q {
        color: var(--tint);
      }
      .vexp {
        margin-top: 12px;
        min-height: 44px;
        font-size: var(--fs-meta);
        color: var(--text-2);
        line-height: 1.6;
      }
      .vctl {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
      }
      .vctl .sp {
        flex: 1;
      }
      .vguess {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--linked);
        font-size: var(--fs-meta);
        color: var(--text);
      }
      .vguess .row2 {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .seg.sm button {
        padding: 3px 9px;
        font-size: var(--fs-sm);
      }
      .bubble .src {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 6px;
        height: 20px;
        padding: 0 7px;
        border-radius: 999px;
        background: var(--surface-1);
        color: var(--tint);
        font-size: var(--fs-xs);
        font-weight: 500;
        vertical-align: 1px;
      }
      .linkchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 10px;
        background: var(--surface-1);
        box-shadow: var(--chip-shadow);
        font-size: var(--fs-sm);
        color: var(--text-2);
      }
      .linkchip .i {
        color: var(--tint);
      }
      .linkchip.on {
        box-shadow: inset 0 0 0 1.5px var(--tint);
      }

      /* 右栏 / 单开标签 */
      .split {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .split .left {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .pane {
        width: 430px;
        flex: 0 0 430px;
        display: flex;
        flex-direction: column;
        box-shadow: inset 0.5px 0 0 var(--line);
        background: var(--main);
      }
      .pane .phead {
        height: 40px;
        flex: 0 0 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 14px;
        box-shadow: inset 0 -0.5px 0 var(--line);
        font: var(--fs-sm) var(--font-mono);
        color: var(--text-2);
      }
      .pane .phead .sp {
        flex: 1;
      }
      .pane .pbody {
        flex: 1;
        overflow: auto;
        padding: 14px;
      }
      .pane .vframe {
        box-shadow: none;
        border-radius: 0;
        background: transparent;
      }
      .pane .vhead {
        display: none;
      }
      .pane .vbody {
        padding: 0;
      }
      .fullvis {
        max-width: 760px;
        margin: 0 auto;
        padding: 22px 24px;
      }

      /* 时序图（Mermaid 渲染出来的样子） */
      .diagram {
        padding: 14px 10px 8px;
        border-radius: var(--r-md);
        background: var(--code);
        margin: 0 0 10px;
      }
      .diagram svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .diagram .ln {
        stroke: var(--rail);
        stroke-width: 1.2;
        stroke-dasharray: 3 3;
      }
      .diagram .box {
        fill: var(--surface-1);
        stroke: var(--line-strong);
      }
      .diagram .ar {
        stroke: var(--text-muted);
        stroke-width: 1.3;
        fill: none;
      }
      .diagram .ah {
        fill: var(--text-muted);
      }
      .diagram text {
        fill: var(--text-2);
        font: 12px var(--font-sans);
      }
      .diagram text.h {
        font-weight: 600;
        fill: var(--text);
      }
      .diagram .note {
        fill: var(--attn-soft);
        stroke: none;
      }
      .diagram text.nt {
        fill: var(--attn-text);
      }

      /* 配图占位 */
      .imgph {
        height: 210px;
        border-radius: var(--r-md);
        margin: 0 0 10px;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(135deg, var(--code) 0 10px, var(--surface-2) 10px 20px);
        box-shadow: inset 0 0 0 1px var(--line);
        color: var(--text-muted);
        font-size: var(--fs-meta);
        text-align: center;
      }
      .imgph b {
        display: block;
        color: var(--text-2);
        font-weight: 500;
        margin-bottom: 2px;
      }

      /* Markdown 预览 */
      .md {
        max-width: 700px;
        margin: 0 auto;
        padding: 22px 28px;
        font-size: var(--fs-reply);
        line-height: 1.65;
        color: var(--text);
      }
      .md h2 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      .md p {
        margin: 0 0 10px;
        color: var(--text-2);
      }
      .md ul {
        margin: 0 0 12px;
        padding-left: 20px;
        color: var(--text-2);
      }
      .md li {
        margin: 4px 0;
      }
      .md .hl {
        background: var(--linked);
        border-radius: 8px;
        padding: 2px 0;
      }

      /* 复习：演示列表 */
      .vtiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .vtile {
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .vtile .ti {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--text);
        font-weight: 500;
        font-size: var(--fs);
        margin-bottom: 3px;
      }
      .vtile .ti .i {
        color: var(--tint);
      }
      .vtile .fn {
        margin-top: 8px;
        font: var(--fs-xs) var(--font-mono);
        color: var(--text-dim);
      }
    </style>
  </head>

        history.replaceState(null, "", `#${cur + 1}`);

        cur = Math.min(Math.max(k, 0), SCREENS.length - 1);
        VS = { step: 0, lvl: "rc", guess: null, ask: false, ...SCREENS[cur].vs };
        render();
      };

        const b = e.target.closest("[data-act]");
        if (!b) return;
        const a = b.dataset.act;
        if (a === "next") VS.step = Math.min(4, VS.step + 1);
        if (a === "prev") VS.step = Math.max(0, VS.step - 1);
        if (a === "replay") ((VS.step = 0), (VS.guess = null));
        if (a.startsWith("lvl-")) VS.lvl = a.slice(4);
        if (a.startsWith("guess-")) VS.guess = a.slice(6);
        render();
      });

        const b = e.target.closest("button");
        if (b) go(+b.dataset.k);
      });
      document.getElementById("prev").onclick = () => go(cur - 1);
      document.getElementById("next").onclick = () => go(cur + 1);

        if (e.key === "ArrowRight") go(cur + 1);
        if (e.key === "ArrowLeft") go(cur - 1);
      });

        const el = document.getElementById(id);

          el.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
