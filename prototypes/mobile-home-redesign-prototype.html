<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手机首页重做</title>
    <style>
      :root {
        --page: #ecebe8;
        --page-text: #2a2a2c;
        --page-dim: #77767a;
        --page-line: #d6d5d1;
      }
      :root[data-theme="dark"] {
        --page: #0f0f11;
        --page-text: #ececee;
        --page-dim: #8c8c92;
        --page-line: #2a2a2e;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--page);
        color: var(--page-text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 28px 16px 64px;
      }
      header.page {
        max-width: 1760px;
        margin: 0 auto 28px;
        display: flex;
        gap: 24px;
        align-items: flex-end;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      header.page h1 {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      header.page p {
        color: var(--page-dim);
        font-size: 13.5px;
        max-width: 70ch;
        margin-top: 4px;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .seg {
        display: inline-flex;
        background: var(--page-line);
        border-radius: 10px;
        padding: 3px;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--page-text);
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--page);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        font-weight: 600;
      }
      .grid {
        max-width: 1760px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(390px, 1fr));
        gap: 36px 24px;
        justify-items: center;
      }
      figure {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 390px;
        max-width: 100%;
      }
      figcaption {
        width: 100%;
      }
      figcaption h2 {
        font-size: 16px;
        font-weight: 650;
      }
      figcaption h2 span {
        color: var(--page-dim);
        font-weight: 500;
        margin-left: 6px;
      }
      figcaption p {
        font-size: 13px;
        color: var(--page-dim);
        margin-top: 3px;
      }
      .swatches {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .swatches i {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
      }

      /* phone shell */
      .phone {
        width: 390px;
        height: 844px;
        border-radius: 54px;
        position: relative;
        overflow: hidden;
        flex: none;
        box-shadow:
          0 0 0 10px #1b1b1d,
          0 0 0 11px #3a3a3d,
          0 30px 60px -20px rgba(0, 0, 0, 0.45);
        isolation: isolate;
      }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        translate: -50% 0;
        width: 124px;
        height: 36px;
        background: #000;
        border-radius: 20px;
        z-index: 30;
      }
      .status {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 34px 0 46px;
        font:
          600 16px/1 -apple-system,
          "SF Pro Text";
        z-index: 25;
      }
      .status .icons {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .status svg {
        display: block;
      }
      .home-ind {
        position: absolute;
        bottom: 8px;
        left: 50%;
        translate: -50% 0;
        width: 136px;
        height: 5px;
        border-radius: 3px;
        z-index: 30;
      }
      .scroll {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .tab-nums {
        font-variant-numeric: tabular-nums;
      }
      .mono {
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
      }
      .glass-btn {
        position: absolute;
        width: 44px;
        height: 44px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        z-index: 20;
        backdrop-filter: blur(18px) saturate(1.6);
        -webkit-backdrop-filter: blur(18px) saturate(1.6);
      }
      .fab {
        width: 58px;
        height: 58px;
        border-radius: 29px;
        right: 20px;
        bottom: 34px;
      }
      /* Floating controls get a band of the page color under them, so rows never sit beneath the + button. */
      .phone::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 120px;
        z-index: 15;
        pointer-events: none;
        background: linear-gradient(to bottom, transparent, var(--bg) 62%);
      }
      @keyframes spin {
        to {
          rotate: 360deg;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes sweep {
        from {
          translate: -100% 0;
        }
        to {
          translate: 260% 0;
        }
      }
      .state-sync .when-ready {
        display: none !important;
      }
      .state-ready .when-sync {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }

      /* ============ A · 中庭天窗 ============ */
      .A {
        --bg: #f7f9fa;
        --sky1: #d9f1f3;
        --sky2: #eef7f8;
        --text: #14232a;
        --text2: #3a4a51;
        --l2: #6b7a80;
        --l3: #c9d4d7;
        --tint: #0b8a9c;
        --on-tint: #fff;
        --attn: #c8641a;
        --danger: #cc3b33;
        --rule: rgba(20, 35, 42, 0.12);
        --glass: rgba(255, 255, 255, 0.62);
        --ring: rgba(20, 35, 42, 0.1);
        background: var(--bg);
        color: var(--text);
      }
      :root[data-theme="dark"] .A {
        --bg: #0e1416;
        --sky1: #12343a;
        --sky2: #10211f00;
        --text: #e8f1f2;
        --text2: #c3d0d2;
        --l2: #8a9a9e;
        --l3: #33433f;
        --tint: #4fd0d8;
        --on-tint: #062226;
        --attn: #f0a050;
        --danger: #f06a5f;
        --rule: rgba(232, 241, 242, 0.1);
        --glass: rgba(30, 42, 45, 0.55);
        --ring: rgba(232, 241, 242, 0.1);
      }
      .A .home-ind {
        background: var(--text);
      }
      .A .well {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 360px;
        background: radial-gradient(120% 90% at 50% -10%, var(--sky1) 0%, var(--sky2) 62%, transparent 100%);
      }
      .A .well::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, transparent 0 77px, var(--ring) 77px 78px);
        mask: linear-gradient(#000 0 30%, transparent 70%);
        opacity: 0.7;
      }
      .A .glass-btn {
        background: var(--glass);
        box-shadow:
          inset 0 0 0 0.5px var(--ring),
          0 6px 16px -8px rgba(0, 0, 0, 0.25);
        color: var(--text);
      }
      .A .menu {
        top: 58px;
        left: 18px;
      }
      .A .fab {
        background: var(--tint);
        color: var(--on-tint);
        box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.35);
        backdrop-filter: none;
      }
      .A .content {
        position: absolute;
        inset: 0;
        padding: 116px 22px 120px;
      }
      .A h3.title {
        font:
          700 40px/1 -apple-system,
          "SF Pro Display";
        letter-spacing: -0.03em;
      }
      .A .conn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 10px;
        font-size: 14px;
        color: var(--text2);
      }
      .A .conn .dot {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: var(--tint);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--tint) 22%, transparent);
      }
      .A .light {
        margin-top: 26px;
      }
      .A .light .row {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 16px;
        margin-bottom: 8px;
        background: var(--glass);
        box-shadow: inset 0 0 0 0.5px var(--ring);
        backdrop-filter: blur(10px);
      }
      .A .ico {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 17px;
        color: #fff;
      }
      .A .ico.ask {
        background: var(--attn);
      }
      .A .ico.err {
        background: var(--danger);
      }
      .A .row b {
        display: block;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.3;
      }
      .A .row small {
        font-size: 13px;
        color: var(--l2);
      }
      .A .row small em {
        font-style: normal;
        font-weight: 600;
      }
      .A .row small em.ask {
        color: var(--attn);
      }
      .A .row small em.err {
        color: var(--danger);
      }
      .A .chev {
        color: var(--l3);
        font-size: 18px;
      }
      .A .floor {
        margin-top: 26px;
      }
      .A .room {
        border-top: 1px solid var(--rule);
        padding-top: 12px;
        margin-bottom: 18px;
      }
      .A .room-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .A .room-head h4 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .A .room-head span {
        font-size: 13px;
        color: var(--tint);
        font-weight: 600;
      }
      .A .door {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0 2px;
        font-size: 13px;
        color: var(--l2);
      }
      .A .door .br {
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 12.5px;
        color: var(--text2);
      }
      .A .tag {
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 5px;
        background: color-mix(in srgb, var(--attn) 14%, transparent);
        color: var(--attn);
      }
      .A .tag.ok {
        background: color-mix(in srgb, #2f8a46 14%, transparent);
        color: #2f8a46;
      }
      .A .sess {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 8px;
        align-items: center;
        height: 52px;
      }
      .A .sess b {
        font-size: 15.5px;
        font-weight: 500;
      }
      .A .sess small {
        font-size: 12.5px;
        color: var(--l2);
      }
      .A .sess .t {
        font-size: 12.5px;
        color: var(--l2);
      }
      .A .run {
        width: 14px;
        height: 14px;
        border-radius: 7px;
        border: 2px solid color-mix(in srgb, var(--tint) 25%, transparent);
        border-top-color: var(--tint);
        animation: spin 1s linear infinite;
      }
      .A .unread {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: var(--tint);
        margin-left: 3px;
      }
      .A .syncbar {
        margin-top: 26px;
        height: 3px;
        border-radius: 2px;
        background: color-mix(in srgb, var(--tint) 18%, transparent);
        overflow: hidden;
        position: relative;
      }
      .A .syncbar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: var(--tint);
        border-radius: 2px;
        animation: sweep 1.3s cubic-bezier(0.3, 0, 0.2, 1) infinite;
      }
      .A .ghost {
        height: 52px;
        border-radius: 14px;
        margin-top: 10px;
        background: linear-gradient(90deg, var(--rule), transparent);
        animation: pulse 1.6s ease-in-out infinite;
      }

      /* ============ B · 登机口告示板 ============ */
      .B {
        --bg: #f4f4f2;
        --panel: #ffffff;
        --text: #111;
        --text2: #333;
        --l2: #6d6d6d;
        --l3: #c4c4c4;
        --rule: #e3e3e0;
        --tint: #f5a300;
        --tint-ink: #8a5a00;
        --on-tint: #111;
        --danger: #e23b2e;
        --glass: rgba(255, 255, 255, 0.7);
        --ring: rgba(0, 0, 0, 0.08);
        background: var(--bg);
        color: var(--text);
      }
      :root[data-theme="dark"] .B {
        --bg: #050505;
        --panel: #141414;
        --text: #f3f3f3;
        --text2: #d4d4d4;
        --l2: #8e8e8e;
        --l3: #3b3b3b;
        --rule: #222;
        --tint: #ffb31a;
        --tint-ink: #ffcc66;
        --on-tint: #111;
        --danger: #ff5a4a;
        --glass: rgba(30, 30, 30, 0.7);
        --ring: rgba(255, 255, 255, 0.08);
      }
      .B .home-ind {
        background: var(--text);
      }
      .B .content {
        position: absolute;
        inset: 0;
        padding: 104px 16px 120px;
      }
      .B .glass-btn {
        background: var(--glass);
        box-shadow: inset 0 0 0 0.5px var(--ring);
        color: var(--text);
      }
      .B .menu {
        top: 58px;
        left: 16px;
      }
      .B .fab {
        background: var(--tint);
        color: var(--on-tint);
        backdrop-filter: none;
        border-radius: 18px;
        box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.5);
      }
      .B .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 4px;
      }
      .B .top h3 {
        font:
          800 30px/1 -apple-system,
          "SF Pro Display";
        letter-spacing: -0.02em;
      }
      .B .top .clock {
        font:
          600 13px/1 "SF Mono",
          ui-monospace,
          monospace;
        color: var(--l2);
        text-align: right;
      }
      .B .top .clock b {
        display: block;
        color: var(--text);
        font-size: 15px;
        margin-top: 3px;
      }
      .B .pass {
        margin-top: 16px;
        background: var(--tint);
        color: var(--on-tint);
        border-radius: 18px;
        overflow: hidden;
        position: relative;
      }
      .B .pass .seg-main {
        padding: 14px 16px 12px;
      }
      .B .pass .lab {
        font-size: 11px;
        font-weight: 700;
        opacity: 0.7;
      }
      .B .pass .what {
        font-size: 19px;
        font-weight: 750;
        line-height: 1.25;
        margin-top: 2px;
      }
      .B .pass .fields {
        display: grid;
        grid-template-columns: 1.2fr 1.4fr 0.8fr;
        border-top: 1.5px dashed rgba(0, 0, 0, 0.35);
      }
      .B .pass .fields div {
        padding: 9px 16px 12px;
      }
      .B .pass .fields div + div {
        border-left: 1px solid rgba(0, 0, 0, 0.18);
        padding-left: 12px;
      }
      .B .pass .fields b {
        display: block;
        font:
          700 14px/1.2 "SF Mono",
          ui-monospace,
          monospace;
        margin-top: 2px;
      }
      .B .pass .notch {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 9px;
        background: var(--bg);
        top: calc(100% - 64px);
      }
      .B .pass .notch.l {
        left: -9px;
      }
      .B .pass .notch.r {
        right: -9px;
      }
      .B .board {
        margin-top: 18px;
        background: var(--panel);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 0 0 0.5px var(--ring);
      }
      .B .board-head,
      .B .flight {
        display: grid;
        grid-template-columns: 64px 1fr 58px;
        gap: 10px;
        padding: 0 14px;
        align-items: center;
      }
      .B .board-head {
        height: 32px;
        font-size: 11px;
        font-weight: 700;
        color: var(--l2);
        border-bottom: 1px solid var(--rule);
      }
      .B .flight {
        min-height: 58px;
        border-bottom: 1px solid var(--rule);
      }
      .B .flight:last-child {
        border-bottom: 0;
      }
      .B .st {
        font:
          700 11.5px/1 "SF Mono",
          ui-monospace,
          monospace;
        padding: 5px 0;
        text-align: center;
        border-radius: 6px;
      }
      .B .st.ask {
        background: var(--tint);
        color: var(--on-tint);
      }
      .B .st.err {
        background: var(--danger);
        color: #fff;
      }
      .B .st.run {
        color: var(--tint-ink);
        box-shadow: inset 0 0 0 1.5px var(--tint);
      }
      .B .st.new {
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--l3);
      }
      .B .st.idle {
        color: var(--l2);
      }
      .B .flight b {
        display: block;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
      }
      .B .flight small {
        font:
          500 12px/1.3 "SF Mono",
          ui-monospace,
          monospace;
        color: var(--l2);
      }
      .B .flight .tm {
        font:
          600 13px/1 "SF Mono",
          ui-monospace,
          monospace;
        text-align: right;
        color: var(--text2);
      }
      .B .flight.hot {
        background: color-mix(in srgb, var(--tint) 10%, transparent);
      }
      .B .sync {
        margin-top: 18px;
        background: var(--panel);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 0 0 0.5px var(--ring);
      }
      .B .flap {
        display: flex;
        gap: 3px;
        margin-top: 8px;
      }
      .B .flap i {
        width: 22px;
        height: 30px;
        border-radius: 4px;
        background: #161616;
        box-shadow: inset 0 -15px 0 -14px #000;
        color: var(--tint);
        font:
          700 17px/30px "SF Mono",
          monospace;
        text-align: center;
        font-style: normal;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .B .flap i:nth-child(2) {
        animation-delay: 0.1s;
      }
      .B .flap i:nth-child(3) {
        animation-delay: 0.2s;
      }
      .B .flap i:nth-child(4) {
        animation-delay: 0.3s;
      }
      .B .flap i:nth-child(5) {
        animation-delay: 0.4s;
      }
      .B .flap i:nth-child(6) {
        animation-delay: 0.5s;
      }

      /* ============ C · 黄色指路牌 ============ */
      .C {
        --bg: #ffffff;
        --band: #ffcc00;
        --band-ink: #111;
        --text: #111;
        --text2: #2c2c2c;
        --l2: #6f6f6f;
        --l3: #d0d0d0;
        --rule: #ececec;
        --tint: #ffcc00;
        --ink: #111;
        --danger: #e0352b;
        --glass: rgba(255, 255, 255, 0.72);
        --ring: rgba(0, 0, 0, 0.08);
        background: var(--bg);
        color: var(--text);
      }
      :root[data-theme="dark"] .C {
        --bg: #111111;
        --band: #ffcc00;
        --band-ink: #111;
        --text: #f5f5f5;
        --text2: #dadada;
        --l2: #9a9a9a;
        --l3: #3a3a3a;
        --rule: #222;
        --tint: #ffd21f;
        --ink: #111;
        --danger: #ff5a4e;
        --glass: rgba(34, 34, 34, 0.72);
        --ring: rgba(255, 255, 255, 0.1);
      }
      .C .home-ind {
        background: var(--text);
      }
      .C .content {
        position: absolute;
        inset: 0;
        padding: 104px 0 120px;
      }
      .C .glass-btn {
        background: var(--glass);
        box-shadow: inset 0 0 0 0.5px var(--ring);
        color: var(--text);
      }
      .C .menu {
        top: 58px;
        left: 16px;
      }
      .C .fab {
        background: var(--band);
        color: var(--ink);
        backdrop-filter: none;
        border-radius: 16px;
        box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.45);
      }
      .C .head {
        padding: 0 20px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .C .head h3 {
        font:
          700 32px/1 -apple-system,
          "SF Pro Display";
        letter-spacing: -0.02em;
      }
      .C .head span {
        font-size: 13px;
        color: var(--l2);
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .C .head span i {
        width: 8px;

FORM: 四个方向并排比较，浅色深色、正常和同步中两种状态都可切换。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md

    <script>
      const root = document.documentElement,
        grid = document.getElementById("grid");
      function press(attr, value) {
        document
          .querySelectorAll(`[${attr}]`)
          .forEach((b) => b.setAttribute("aria-pressed", String(b.getAttribute(attr) === value)));
      }
      document.querySelectorAll("[data-theme-set]").forEach((b) =>
        b.addEventListener("click", () => {
          root.dataset.theme = b.dataset.themeSet;
          press("data-theme-set", b.dataset.themeSet);
        }),
      );
      document.querySelectorAll("[data-state-set]").forEach((b) =>
        b.addEventListener("click", () => {
          grid.className = `grid state-${b.dataset.stateSet}`;
          press("data-state-set", b.dataset.stateSet);
        }),
      );
