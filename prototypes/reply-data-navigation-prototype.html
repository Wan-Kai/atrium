     inside Atrium's existing conversation: A inline result, B source-first, C side-by-side.
     File references always open the existing file tab. All examples are synthetic.
     No filesystem access, network, clipboard writes, storage, patch application or execution.
     THESIS: add navigable results without turning the conversation into a dashboard.
     OWN-WORLD: inherit Atrium's flat code surfaces, 14.5px replies and system typography.
     STORY: locate a file, inspect data, understand a proposed patch, return to the conversation.
     FIRST VIEWPORT: existing sidebar, tabs, a reply with a file reference and the selected example.
     FORM: three local extensions in the established visual world; no identity redesign.
     FINISH: prototype only; user selection precedes production implementation. -->

  <body>
    <header>
      <h1>文件定位与结构化回复</h1>
      <p>
        比较 JSON、CSV、Diff
        在消息里怎么读。文件引用都接已有文件标签。仅合成数据与交互示意，不读文件、不复制到系统剪贴板、不应用补丁。
      </p>

        <div class="side-row">接口设计</div>
      </aside>
      <main class="main">
        <nav class="tabs" aria-label="查看标签">
          <button class="tab active" id="conversation-tab">回复展示增强</button
          ><button class="tab" id="file-tab" hidden>auth.ts <span class="dim">×</span></button
          ><span class="dim" id="new-label">新建</span>
        </nav>
        <section class="thread" id="thread">
          <div class="column">
            <div class="bubble" id="question"></div>
            <div class="reply" id="reply"></div>
            <div class="demo-message" id="demo-message" role="status" aria-live="polite"></div>
            <div class="footer" id="footer"></div>
          </div>
        </section>
        <section class="fileview" id="fileview" hidden>
          <div class="file-toolbar">
            <strong>src/auth.ts</strong><span id="range-label"></span><span style="flex: 1"></span
            ><span class="dim">只读 · 合成代码</span><button id="back">返回对话</button>
          </div>
          <div class="file-scroll" id="file-scroll" tabindex="0" aria-label="示例文件内容"></div>
        </section>
        <div class="composer" id="composer">发消息或描述任务，@ 引用文件，/ 使用命令<small>示例模型 · 高</small></div>

      <button class="arrow" id="previous" aria-label="上一方案"></button><button data-variant="A">A 就地看结果</button
      ><button data-variant="B">B 源码优先</button><button data-variant="C">C 并排核对</button
      ><button class="arrow" id="next" aria-label="下一方案"></button><span class="separator"></span>
      <select id="sample" aria-label="展示内容">
        <option value="json">JSON</option>
        <option value="csv">CSV</option>
        <option value="diff">Diff</option>
        <option value="file">文件定位</option></select
      ><select id="condition" aria-label="内容状态">
        <option value="ready">完整内容</option>
        <option value="streaming">正在输出</option>
        <option value="invalid">数据无效</option></select
      ><button id="theme">深色</button>

    <script>
      const $ = (id) => document.getElementById(id);
      const paths = {
        copy: "M9 9h11v12H9zM5 16H3V3h12v3",
        code: "m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16",
        file: "M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5",
        left: "m14 6-6 6 6 6",
        right: "m10 6 6 6-6 6",
        check: "m5 12 4 4 10-10",
      };
      /** Draws one fixed prototype icon. */
      function icon(name) {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]}"/></svg>`;
      }
      /** Escapes synthetic source so no source is interpreted as page markup. */
      function escaped(text) {
        return text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
      }
      const query = new URLSearchParams(location.search);
      const state = {
        variant: ["A", "B", "C"].includes(query.get("variant")) ? query.get("variant") : "A",
        sample: ["json", "csv", "diff", "file"].includes(query.get("sample")) ? query.get("sample") : "json",
        dark: query.get("theme") === "dark",
        condition: "ready",
        source: false,
        expanded: false,
        file: false,
        range: [42, 45],
      };
      const jsonSource = `{
  "service": "profile-api",
  "enabled": true,
  "timeoutMs": 8000,
  "requestId": 9223372036854775807,
  "retry": { "count": 3, "delayMs": 200 },
  "routes": [
    { "path": "/profile", "method": "GET" },
    { "path": "/settings", "method": "PATCH" }
  ]
}`;
      const csvSource = `endpoint,平均耗时(ms),成功率,备注
/profile,82,99.8%,"正常, 已缓存"
/settings,146,99.2%,"待检查\n高峰时段"
/health,12,100%,正常`;
      const diffLines = [
        "diff --git a/src/auth.ts b/src/auth.ts",
        "--- a/src/auth.ts",
        "+++ b/src/auth.ts",
        "@@ -38,4 +38,8 @@ export async function fetchProfile() {",
        "   const token = await getToken();",
        '-  const response = await request("/profile");',
        '+  const response = await request("/profile", {',
        "+    token,",
        "+    timeout: 8000,",
        "+    retries: 3,",
        "+  });",
        "   return response.json();",
        " }",
        "@@ -58,6 +62,6 @@ export function retryPolicy() {",
        "-  return { count: 0 };",
        "+  return { count: 3, delayMs: 200 };",
        " }",
        " ",
        " export function isSessionValid(session) {",
        "-  return Boolean(session);",
        "+  return Boolean(session?.token);",
        " }",
      ];
      const descriptions = {
        A: "<strong>A · 就地看结果（建议）</strong>　JSON 默认折叠树、CSV 默认表格、Diff 默认精简增删行；源码随时可切回。结果就在回复里，延续已有平铺块，不新增查看区域。",
        B: "<strong>B · 源码优先</strong>　默认保留今天的代码块阅读方式；主动点「查看数据／查看补丁」才替换为结果。适合经常核对原始输出，但结构化能力多一次点击。",
        C: "<strong>C · 并排核对</strong>　原文与结果一直并排，方便逐项对照；同一块内容会出现两遍，消息更宽更密。窄窗自动改成上下两段。",
      };
      /** The common, synthetic file reference. */
      function fileReference() {
        return `<button class="file-link" data-file="42-45" title="在文件标签中定位第 42–45 行">${icon("file")}src/auth.ts:42–45</button>`;
      }
      /** The structured tree deliberately keeps the exact large numeric spelling. */
      function tree() {
        return `<div class="body"><details open><summary><span>{</span><span class="type">对象 · 6 个属性</span></summary><div class="leaf"><span class="key">service:</span> <span class="value">"profile-api"</span></div><div class="leaf"><span class="key">enabled:</span> <span class="number">true</span></div><div class="leaf"><span class="key">timeoutMs:</span> <span class="number">8000</span></div><div class="leaf"><span class="key">requestId:</span> <span class="number">9223372036854775807</span></div><details><summary><span>retry</span><span class="muted">{…}</span><span class="type">2 个属性</span></summary><div class="leaf">count: <span class="number">3</span></div><div class="leaf">delayMs: <span class="number">200</span></div></details><details><summary><span>routes</span><span class="muted">[…]</span><span class="type">2 项</span></summary><details><summary><span>0</span><span class="muted">{…}</span></summary><div class="leaf">path: <span class="value">"/profile"</span></div><div class="leaf">method: <span class="value">"GET"</span></div></details><details><summary><span>1</span><span class="muted">{…}</span></summary><div class="leaf">path: <span class="value">"/settings"</span></div><div class="leaf">method: <span class="value">"PATCH"</span></div></details></details><div class="muted">}</div></details></div>`;
      }
      /** Shows fixed CSV cells without sorting, evaluation or HTML interpretation. */
      function table() {
        const rows = [
          ["/profile", "82", "99.8%", "正常, 已缓存"],
          ["/settings", "146", "99.2%", "待检查\n高峰时段"],
          ["/health", "12", "100%", "正常"],
        ];
        return `<div class="table-scroll"><table><thead><tr>${["endpoint", "平均耗时(ms)", "成功率", "备注"].map((x) => `<th scope="col">${escaped(x)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((x, i) => `<td class="${i === 1 ? "numeric" : ""}">${escaped(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      }
      /** Preserves diff headers and context, colouring only content additions and deletions. */
      function diff() {
        const shown = state.expanded ? diffLines : diffLines.slice(0, 12);
        return `<div class="diff">${shown
          .map((line) => {
            const kind = line.startsWith("@@")
              ? "hunk"
              : line.startsWith("+++") || line.startsWith("---") || line.startsWith("diff ")
                ? "meta"
                : line.startsWith("+")
                  ? "add"
                  : line.startsWith("-")
                    ? "del"
                    : "";
            const sign = kind === "add" ? "+" : kind === "del" ? "-" : "";
            return `<div class="diff-line ${kind}">${sign ? `<span class="sign">${sign}</span>${escaped(line.slice(1))}` : escaped(line)}</div>`;
          })
          .join("")}</div>`;
      }
      /** Displays unchanged source as plain code. */
      function sourceView(source) {
        return `<div class="source"><pre>${escaped(source)}</pre></div>`;
      }
      /** Provides small, consistent block controls. */
      function blockHeader(language, source) {
        const toggle =
          state.variant === "C"
            ? ""
            : `<button id="toggle-source" aria-pressed="${!source}">${source ? (state.sample === "diff" ? "查看补丁" : "查看数据") : "源码"}</button>`;
        return `<div class="block-head"><span class="language">${language}</span>${toggle}<button id="copy" aria-label="复制原文（原型仅演示反馈）">${icon("copy")}复制原文</button></div>`;
      }
      /** Builds the chosen result layout, or retains source during streaming/invalid data. */
      function content() {
        const lang = state.sample,
          raw = lang === "json" ? jsonSource : lang === "csv" ? csvSource : diffLines.join("\n");
        const incomplete = state.condition === "streaming";
        const invalid = state.condition === "invalid" && (lang === "json" || lang === "csv");
        const rawShown = incomplete
          ? raw.slice(0, Math.floor(raw.length * 0.65))
          : invalid
            ? lang === "json"
              ? '{\n  "service": "profile-api",\n  "timeoutMs":\n}'
              : 'endpoint,备注\n/profile,"尚未结束'
            : raw;
        const plain = incomplete || invalid || state.source;
        let view;
        if (incomplete || invalid) {
          view = `<div class="notice ${invalid ? "error" : ""}">${invalid ? "数据无法解析，保留原文。" : "代码块还在输出，完成后可查看结构。"}</div>${sourceView(rawShown)}`;
        } else if (state.variant === "C") {
          const result = lang === "json" ? tree() : lang === "csv" ? table() : diff();
          view = `<div class="split"><div><div class="pane-label">原文</div>${sourceView(raw)}</div><div><div class="pane-label">${lang === "diff" ? "只读补丁" : "结构化视图"}</div>${result}</div></div>`;
        } else {
          view = plain ? sourceView(raw) : lang === "json" ? tree() : lang === "csv" ? table() : diff();
        }
        let foot = "";
        if (!plain && lang === "diff") {
          foot = `<div class="diff-foot"><span>提议补丁 · 未应用到文件</span><button id="expand-diff">${state.expanded ? "收起为前 12 行" : `展开剩余 ${diffLines.length - 12} 行`}</button></div>`;
        } else if (!plain && lang === "csv") {
          foot = '<div class="block-foot">3 行数据 · 4 列 · 首行作为表头 · 原始顺序</div>';
        } else if (!plain && lang === "json") {
          foot = '<div class="block-foot">对象和数组可折叠 · 数字按原文显示</div>';
        }
        return `<section class="block" aria-label="${lang} 示例">${blockHeader(lang, plain)}${view}${foot}</section>`;
      }
      /** Creates the reply, with content rather than controls leading each example. */
      function reply() {
        if (state.sample === "file")
          return `<p>重试逻辑在 ${fileReference()}。点击会打开已有文件标签，定位并高亮这几行。</p><div class="file-examples"><button class="file-link" data-file="42">${icon("file")}src/auth.ts:42</button><p>单行引用 → 定位第 42 行。</p><button class="file-link" data-file="42-45">${icon("file")}请求重试配置 · 第 42–45 行</button><p>Markdown 链接 → 同一个文件标签，不重复开标签。</p><span><code class="inline">pnpm test</code> 是命令，仍只是文字。</span><button class="inline-action" id="outside">演示工作区外的引用</button></div><p class="scope-note">只读、点击后才读取；不打开任意本地路径。示例只模拟文件标签，不访问真实文件。</p>`;
        const lead =
          state.sample === "json"
            ? `重试配置见 ${fileReference()}。下面是接口返回的数据，可以展开嵌套字段。`
            : state.sample === "csv"
              ? `下面是三条接口的统计数据。包含带逗号和换行的单元格，按原始顺序展示。`
              : `建议给 ${fileReference()} 加上超时和重试。下面只是提议的补丁，尚未修改文件。`;
        return `<p>${lead}</p>${content()}<p>${state.sample === "json" ? "其中 requestId 保留原始数字，不转成近似值。" : state.sample === "csv" ? "这些都是合成示例值，表格不会执行单元格里的内容。" : "文件头、hunk 头和上下文保持原样；这里没有「应用补丁」按钮。"}</p>`;
      }
      /** Updates the synthetic app and exposes the complete interaction state. */
      function render() {
        document.documentElement.dataset.theme = state.dark ? "dark" : "light";
        $("theme").textContent = state.dark ? "浅色" : "深色";
        $("description").innerHTML = descriptions[state.variant];
        $("state-readout").textContent =
          `原型状态：${state.variant} · ${state.sample.toUpperCase()} · ${state.condition} · ${state.file ? "文件标签" : "对话"} · ${state.source ? "原文" : "结果"} · ${state.expanded ? "完整补丁" : "精简补丁"}`;
        document
          .querySelectorAll("[data-variant]")
          .forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.variant === state.variant)));
        $("sample").value = state.sample;
        $("condition").value = state.condition;
        $("condition").disabled = state.sample === "file";
        $("condition").querySelector("[value=invalid]").disabled = state.sample === "diff";
        $("thread").hidden = state.file;
        $("fileview").hidden = !state.file;
        $("composer").hidden = state.file;
        $("conversation-tab").classList.toggle("active", !state.file);
        $("file-tab").hidden = !state.file;
        $("file-tab").classList.toggle("active", state.file);
        $("new-label").hidden = state.file;
        $("question").textContent = {
          json: "看看返回的数据，指出重试配置在哪里。",
          csv: "把接口统计整理成容易看的表格。",
          diff: "给请求加上超时与重试，先给我看补丁。",
          file: "带我看一下具体修改位置。",
        }[state.sample];
        $("reply").innerHTML = reply();
        $("footer").innerHTML = `${icon("copy")}复制回复 <span>·</span> 已完成`;
        const toggle = $("toggle-source");
        if (toggle) {
          toggle.disabled = state.condition !== "ready";
          toggle.onclick = () => {
            state.source = !state.source;
            render();
          };
        }
        const copy = $("copy");
        if (copy)
          copy.onclick = () => {
            copy.innerHTML = icon("check") + "已复制（演示）";
            $("demo-message").textContent = "原型只演示反馈，不写入系统剪贴板；正式实现复制完整原文。";
          };
        const expand = $("expand-diff");
        if (expand)
          expand.onclick = () => {
            state.expanded = !state.expanded;
            render();
          };
        document
          .querySelectorAll("[data-file]")
          .forEach((button) => (button.onclick = () => openFile(button.dataset.file)));
        if ($("outside"))
          $("outside").onclick = () => {
            $("demo-message").textContent = "不能在此打开：引用不在当前工作区内。";
          };
        history.replaceState(
          null,
          "",
          "?" +
            new URLSearchParams({ variant: state.variant, sample: state.sample, theme: state.dark ? "dark" : "light" }),
        );
      }
      /** Resets only local reading state on a prototype variant/content switch. */
      function change() {
        state.source = state.variant === "B";
        state.expanded = false;
        state.file = false;
        if (state.sample === "diff" && state.condition === "invalid") state.condition = "ready";
        $("demo-message").textContent = "";
        render();
        $("thread").scrollTop = 0;
      }
      /** Opens a fake file tab and targets its exact example rows. */
      function openFile(range) {
        state.range = range.split("-").map(Number);
        if (state.range.length === 1) state.range.push(state.range[0]);
        state.file = true;
        const lines = Array.from({ length: 80 }, (_, index) => (index < 35 ? "" : `// 示例代码 ${index + 1}`));
        Object.assign(lines, {
          37: "export async function fetchProfile() {",
          38: "  const token = await getToken();",
          39: "",
          40: "  // 显式的超时与重试配置",
          41: '  const response = await request("/profile", {',
          42: "    timeout: 8000,",
          43: "    retries: 3,",
          44: "  });",
          45: "  return response.json();",
          46: "}",
        });
        $("range-label").textContent =
          state.range[0] === state.range[1] ? `第 ${state.range[0]} 行` : `第 ${state.range[0]}–${state.range[1]} 行`;
        $("file-scroll").innerHTML = lines
          .map(
            (text, index) =>
              `<div class="file-line ${index + 1 >= state.range[0] && index + 1 <= state.range[1] ? "target" : ""}" id="line-${index + 1}"><span>${index + 1}</span><code>${escaped(text)}</code></div>`,
          )
          .join("");
        render();
        requestAnimationFrame(() => {
          $("file-scroll").scrollTop = (state.range[0] - 1) * 22 - 100;
          $("file-scroll").focus({ preventScroll: true });
        });
      }
      /** Cycles the three reading structures without touching source data. */
      function cycle(step) {
        const keys = ["A", "B", "C"];
        state.variant = keys[(keys.indexOf(state.variant) + step + 3) % 3];
        change();
      }
      $("previous").innerHTML = icon("left");
      $("next").innerHTML = icon("right");
      $("previous").onclick = () => cycle(-1);
      $("next").onclick = () => cycle(1);
      document.querySelectorAll("[data-variant]").forEach(
        (button) =>
          (button.onclick = () => {
            state.variant = button.dataset.variant;
            change();
          }),
      );
      $("sample").onchange = (event) => {
        state.sample = event.target.value;
        change();
      };
      $("condition").onchange = (event) => {
        state.condition = event.target.value;
        render();
      };
      $("theme").onclick = () => {
        state.dark = !state.dark;
        render();
      };
      $("back").onclick = $("conversation-tab").onclick = () => {
        state.file = false;
        render();
      };
      $("file-tab").onclick = () => {
        state.file = false;
        render();
      };
      document.addEventListener("keydown", (event) => {
        if (event.target.closest("input,textarea,select,summary,[contenteditable]")) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
        if (event.key === "Escape" && state.file) {
          state.file = false;
          render();
        }
      });
      change();
    </script>
  </body>
</html>
