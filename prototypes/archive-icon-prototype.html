<!doctype html>
<!--
  PROTOTYPE — throwaway. 侧栏行悬停时的归档图标换哪个。
  问题：现在的 Archive02（叠起来的抽屉）看不出是"归档"。候选 A–D 都取自 Hugeicons 免费版 stroke-rounded，
  和 packages/ui/src/design/icons.tsx 一样线宽 1.75、14px、--text-dim。底部切换，或看第 2 节并排对比。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 · 归档图标</title>
<style>
:root {
  --sidebar-bg: rgba(246,247,250,.9); --main: #fff; --surface-1: #fff; --surface-2: #f2f2f4; --popover: #fff;
  --text: #1d1d1f; --text-2: #2c2c30; --text-muted: #6e6e74; --text-dim: #a1a1a7;
  --line: rgba(0,0,0,.08); --line-strong: rgba(0,0,0,.14);
  --hover: rgba(0,0,0,.035); --selected: rgba(0,0,0,.06);
  --tint: #2f6fed; --attn: #dd8629; --ok-text: #1e8e3e;
  --card-shadow: 0 0 0 .5px var(--line), 0 8px 24px rgba(41,70,122,.08);
  --font-sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  --fs: 14px; --fs-meta: 13px; --fs-sm: 12px; --fs-xs: 11px; --r: 8px; --r-card: 16px; --r-pill: 999px;
}
* { box-sizing: border-box; }
body { margin: 0; background: #eef1f6; font: var(--fs)/1.5 var(--font-sans); color: var(--text); -webkit-font-smoothing: antialiased; }
header.page { padding: 28px 40px 4px; }
header.page h1 { font-size: 20px; margin: 0 0 6px; }
header.page p, p.note { margin: 0 0 4px; color: var(--text-muted); font-size: var(--fs-meta); max-width: 900px; }
section.block { padding: 18px 40px 8px; }
section.block > h2 { font-size: 15px; margin: 0 0 4px; }
.row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin-top: 12px; }
.side { width: 280px; background: var(--sidebar-bg); border-radius: var(--r-card); box-shadow: var(--card-shadow); padding: 10px 8px; }
.side h4 { margin: 4px 8px 2px; font-size: var(--fs-xs); color: var(--text-dim); font-weight: 500; }
.r { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; margin: 2px 0; padding: 0 8px; border-radius: var(--r); color: var(--text-2); font-size: var(--fs); cursor: default; }
.r.ws { padding-left: 36px; }
.r:hover, .r.hov { background: var(--hover); }
.r.sel { background: var(--selected); color: var(--text); }
.r .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r .lbl { font-size: var(--fs-sm); color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px; }
.r .lbl .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--attn); }
.r .acts { display: none; align-items: center; }
.r:hover .acts, .r.hov .acts { display: inline-flex; }
.r:hover .lbl, .r.hov .lbl { display: none; }
.r .proj-ico { width: 16px; height: 16px; color: var(--text-muted); }
.b { all: unset; display: inline-grid; place-items: center; padding: 4px; border-radius: var(--r); color: var(--text-dim); }
.b:hover { background: var(--hover); color: var(--text-muted); }
.b.off { opacity: .4; }
.tip { position: absolute; right: 30px; top: -26px; font-size: var(--fs-xs); background: rgba(29,29,31,.92); color: #fff; padding: 2px 7px; border-radius: 6px; white-space: nowrap; display: none; }
.b:hover + .tip { display: block; }
.col { display: flex; flex-direction: column; gap: 8px; }
.col h3 { margin: 0; font-size: 13px; color: var(--text-2); }
.col .why { margin: 0; font-size: var(--fs-sm); color: var(--text-muted); width: 280px; min-height: 36px; }
.big { display: flex; gap: 18px; align-items: center; color: var(--text-2); }
.switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 4px; background: rgba(29,29,31,.92); color: #fff; padding: 5px; border-radius: var(--r-pill); font-size: var(--fs-sm); box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 20; }
.switcher button { all: unset; padding: 4px 12px; border-radius: var(--r-pill); cursor: pointer; color: rgba(255,255,255,.7); }
.switcher button.on { background: #fff; color: #1d1d1f; }
.switcher span { padding: 4px 6px 4px 10px; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<header class="page">
  <h1>归档图标 · 候选（原型，审完即弃）</h1>
  <p>侧栏里 worktree 工作区和对话的行，悬停时行尾出现"归档图标 + ···"。现在用的是叠起来的抽屉，看不出意思。下面四个候选都来自同一套图标库（Hugeicons 免费版），线宽、大小、颜色和现在一样。</p>
</header>

<section class="block">
  <h2>1. 放在侧栏里看（底部切换候选）</h2>
  <p class="note">选中的工作区和第一个对话固定显示悬停状态，别的行鼠标移上去也会出现。有未提交改动的工作区，图标变淡、悬停说明原因。</p>
  <div class="row"><div class="side" id="live"></div></div>
</section>

<section class="block" style="padding-bottom: 90px">
  <h2>2. 并排对比</h2>
  <p class="note">每列上面是放大的图标，下面是同样的两行在悬停时的样子。</p>
  <div class="row" id="grid"></div>
</section>

<div class="switcher" id="switcher"><span>归档图标</span></div>

<script>
const SVG = {"Archive02Icon": "<path d=\"M7 21H16.9999C19.3569 21 20.5354 21 21.2677 20.2678C21.9999 19.5355 21.9999 18.357 21.9999 16C21.9999 13.643 21.9999 12.4645 21.2677 11.7322C20.5354 11 19.3569 11 16.9999 11H7C4.64302 11 3.46453 11 2.7323 11.7322C2.00007 12.4644 2.00005 13.6429 2 15.9999C1.99995 18.357 1.99993 19.5355 2.73217 20.2677C3.4644 21 4.64294 21 7 21Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M4 11C4.00005 9.59977 4.00008 8.89966 4.27263 8.36485C4.5123 7.89455 4.89469 7.51218 5.365 7.27253C5.89981 7 6.59993 7 8.00015 7H16C17.4001 7 18.1002 7 18.635 7.27248C19.1054 7.51217 19.4878 7.89462 19.7275 8.36502C20 8.8998 20 9.59987 20 11\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M6 7C6.00004 5.5998 6.00006 4.89969 6.27259 4.3649C6.51227 3.89457 6.89467 3.51218 7.36501 3.27252C7.89981 3 8.59991 3 10.0001 3H14C15.4001 3 16.1002 3 16.635 3.27248C17.1054 3.51217 17.4878 3.89462 17.7275 4.36502C18 4.8998 18 5.59987 18 7\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M16 15L15.7 15.4C15.1111 16.1851 14.8167 16.5777 14.3944 16.7889C13.9721 17 13.4814 17 12.5 17H11.5C10.5186 17 10.0279 17 9.60557 16.7889C9.18328 16.5777 8.88885 16.1851 8.3 15.4L8 15\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "Archive03Icon": "<path d=\"M21 7H3V13C3 16.7712 3 18.6569 4.17157 19.8284C5.34315 21 7.22876 21 11 21H13C16.7712 21 18.6569 21 19.8284 19.8284C21 18.6569 21 16.7712 21 13V7Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M21 7H3L4.2 5.4C5.08328 4.22229 5.52492 3.63344 6.15836 3.31672C6.7918 3 7.52786 3 9 3H15C16.4721 3 17.2082 3 17.8416 3.31672C18.4751 3.63344 18.9167 4.22229 19.8 5.4L21 7Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M12 17L12 10.5M9 14.5C9.58984 15.1068 11.1597 17.5 12 17.5C12.8403 17.5 14.4102 15.1068 15 14.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "Package01Icon": "<path d=\"M2.5 7.5V13.5C2.5 17.2712 2.5 19.1569 3.67157 20.3284C4.84315 21.5 6.72876 21.5 10.5 21.5H13.5C17.2712 21.5 19.1569 21.5 20.3284 20.3284C21.5 19.1569 21.5 17.2712 21.5 13.5V7.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M3.86909 5.31461L2.5 7.5H21.5L20.2478 5.41303C19.3941 3.99021 18.9673 3.2788 18.2795 2.8894C17.5918 2.5 16.7621 2.5 15.1029 2.5H8.95371C7.32998 2.5 6.51812 2.5 5.84013 2.8753C5.16215 3.2506 4.73113 3.93861 3.86909 5.31461Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M12 7.5V2.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M10 10.5H14\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "ArchiveArrowDownIcon": "<path d=\"M8 3C7.28543 3.05475 6.78159 3.18135 6.34921 3.47408C5.58736 3.98988 5.22202 4.90323 4.49134 6.72994L2.42914 11.9271C2.21522 12.4619 2.10826 12.7293 2.05413 13.0104C2 13.2915 2 13.5795 2 14.1555V15C2 17.8284 2 19.2426 2.87868 20.1213C3.75736 21 5.17157 21 8 21H16C18.8284 21 20.2426 21 21.1213 20.1213C22 19.2426 22 17.8284 22 15V14.1555C22 13.5795 22 13.2915 21.9459 13.0104C21.8917 12.7293 21.7848 12.4619 21.5709 11.9271L19.5087 6.72994C18.778 4.90323 18.4126 3.98988 17.6508 3.47408C17.2184 3.18135 16.7146 3.05475 16 3\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M2.5 13H5.58579C6.16263 13 6.45105 13 6.71982 13.0766C6.86747 13.1187 7.00978 13.1776 7.14394 13.2523C7.38816 13.3882 7.59211 13.5921 8 14C8.40789 14.4079 8.61184 14.6118 8.85606 14.7477C8.99022 14.8224 9.13253 14.8813 9.28018 14.9234C9.54895 15 9.83737 15 10.4142 15H13.5858C14.1626 15 14.4511 15 14.7198 14.9234C14.8675 14.8813 15.0098 14.8224 15.1439 14.7477C15.3882 14.6118 15.5921 14.4079 16 14C16.4079 13.5921 16.6118 13.3882 16.8561 13.2523C16.9902 13.1776 17.1325 13.1187 17.2802 13.0766C17.5489 13 17.8374 13 18.4142 13H21.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M15 7.00002C15 7.00002 12.7905 9.99999 12 10C11.2094 10 9 7 9 7\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M12 3V9.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "ArchiveIcon": "<path d=\"M13 2H11C7.22876 2 5.34315 2 4.17157 3.17157C3 4.34315 3 6.22876 3 10V14C3 17.7712 3 19.6569 4.17157 20.8284C5.34315 22 7.22876 22 11 22H13C16.7712 22 18.6569 22 19.8284 20.8284C21 19.6569 21 17.7712 21 14V10C21 6.22876 21 4.34315 19.8284 3.17157C18.6569 2 16.7712 2 13 2Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.75\"/><path d=\"M21 12H3\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.75\"/><path d=\"M15 7H9\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.75\"/><path d=\"M15 17H9\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.75\"/>", "MoreHorizontalIcon": "<path d=\"M6.00449 12.5V12M18.0045 12.5V12M12.0045 12.5V12M7.00449 12.5C7.00449 11.9477 6.55677 11.5 6.00449 11.5C5.4522 11.5 5.00449 11.9477 5.00449 12.5C5.00449 13.0523 5.4522 13.5 6.00449 13.5C6.55677 13.5 7.00449 13.0523 7.00449 12.5ZM19.0045 12.5C19.0045 11.9477 18.5568 11.5 18.0045 11.5C17.4522 11.5 17.0045 11.9477 17.0045 12.5C17.0045 13.0523 17.4522 13.5 18.0045 13.5C18.5568 13.5 19.0045 13.0523 19.0045 12.5ZM13.0045 12.5C13.0045 11.9477 12.5568 11.5 12.0045 11.5C11.4522 11.5 11.0045 11.9477 11.0045 12.5C11.0045 13.0523 11.4522 13.5 12.0045 13.5C12.5568 13.5 13.0045 13.0523 13.0045 12.5Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>"};
const svg = (k, s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none">${SVG[k]}</svg>`;
const V = {
  now: ["现在 · 叠起来的抽屉", "Archive02Icon", "像文件柜的抽屉，14px 时看着像一个托盘，不知道点了会怎样。"],
  a: ["A · 盒子里一个向下的箭头（推荐）", "Archive03Icon", "Gmail、Outlook、macOS 邮件的归档都是这个意思：把东西放进盒子收起来。箭头说明了动作。"],
  b: ["B · 带盖的箱子", "Package01Icon", "纸箱、收纳箱，最像实物的\"归档箱\"；没有箭头，是名词不是动作。"],
  c: ["C · 托盘加向下箭头", "ArchiveArrowDownIcon", "收件箱托盘加箭头，也有\"放进去\"的意思，但更像\"下载\"或\"收件箱\"。"],
  d: ["D · 档案柜", "ArchiveIcon", "两格的档案柜。线条最少、最安静；小尺寸时不太容易认出是柜子。"],
};
let variant = new URLSearchParams(location.search).get("v") || "a";
const dots = svg("MoreHorizontalIcon", 14).replace(/stroke-width="1.75"/g, 'stroke-width="2.5"');
const projIco = '<svg class="proj-ico" viewBox="0 0 16 16" fill="none"><path d="M2 4.5c0-.8.7-1.5 1.5-1.5h3l1.5 1.5h4.5c.8 0 1.5.7 1.5 1.5v5.5c0 .8-.7 1.5-1.5 1.5h-9c-.8 0-1.5-.7-1.5-1.5z" stroke="currentColor" stroke-width="1.3"/></svg>';
function row(cls, name, label, icon, hov, dirty, archive = true) {
  return `<div class="r ${cls}${hov ? " hov" : ""}"><span class="nm">${name}</span>${label ? `<span class="lbl">${label}</span>` : ""}
    <span class="acts">${archive ? `<button class="b${dirty ? " off" : ""}" title="${dirty ? "有未提交的改动，先提交或丢弃" : "归档"}">${svg(icon, 14)}</button><span class="tip">${dirty ? "有未提交的改动，先提交或丢弃" : "归档"}</span>` : ""}<button class="b" title="更多">${dots}</button></span></div>`;
}
function side(icon, full) {
  if (!full) return row("ws", "slash-commands", '<span class="dot"></span>未提交', icon, true, false) + row("", "调研 pi RPC 的命令", "", icon, true, false);
  return `<h4>项目</h4>
    <div class="r">${projIco}<span class="nm">atrium</span></div>
    ${row("ws", "main", "", icon, false, false, false)}
    ${row("ws sel", "slash-commands", "", icon, true, false)}
    ${row("ws", "archive-icon", '<span class="dot"></span>未提交', icon, false, true)}
    ${row("ws", "sidebar-inbox", '<span style="color:var(--ok-text)">已合并</span>', icon, false, false)}
    <h4 style="margin-top:12px">对话</h4>
    ${row("", "调研 pi RPC 的命令", "", icon, true, false)}
    ${row("", "周报草稿", "", icon, false, false)}
    ${row("", "看一下这个报错", "", icon, false, false)}`;
}
function paint() {
  document.getElementById("live").innerHTML = side(V[variant][1], true);
  document.getElementById("grid").innerHTML = Object.entries(V).map(([k, [t, icon, why]]) =>
    `<div class="col"><h3>${t}</h3><p class="why">${why}</p><div class="big">${svg(icon, 40)}${svg(icon, 20)}${svg(icon, 14)}</div><div class="side">${side(icon, false)}</div></div>`).join("");
  sw.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === variant));
}
const sw = document.getElementById("switcher");
for (const [k, [t]] of Object.entries(V)) {
  const b = document.createElement("button"); b.textContent = t.split(" · ")[0] === "现在" ? "现在" : t.split(" · ")[0]; b.dataset.v = k;
  b.onclick = () => { variant = k; history.replaceState(null, "", `?v=${k}`); paint(); };
  sw.appendChild(b);
}
paint();
</script>
</body>
</html>
