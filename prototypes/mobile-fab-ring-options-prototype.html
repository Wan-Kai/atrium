<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>首页 + 圆环方案</title>
    <style>
      :root {
        --page: #f6f2e9;
        --note: #fffcf5;
        --text: #26221c;
        --l2: #8b8477;
        --l3: #d3cbbb;
        --tint: #8a7352;
        --rule: rgba(70, 55, 30, 0.11);
        --glass: rgba(255, 252, 245, 0.62);
        --glass-strong: rgba(255, 252, 245, 0.8);
        --edge: rgba(255, 255, 255, 0.85);
        --edge-dark: rgba(70, 55, 30, 0.12);
        --shadow: rgba(60, 45, 20, 0.14);
        --scrim: rgba(246, 242, 233, 0.32);
        --desk: #e4ddcf;
      }
      :root[data-theme="dark"] {
        --page: #1c1a16;
        --note: #25221d;
        --text: #eee9df;
        --l2: #8f887b;
        --l3: #4a453c;
        --tint: #c9b28c;
        --rule: rgba(255, 240, 220, 0.08);
        --glass: rgba(52, 49, 44, 0.58);
        --glass-strong: rgba(58, 55, 50, 0.8);
        --edge: rgba(255, 255, 255, 0.14);
        --edge-dark: rgba(0, 0, 0, 0.3);
        --shadow: rgba(0, 0, 0, 0.45);
        --scrim: rgba(28, 26, 22, 0.4);
        --desk: #121110;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--desk);
        color: var(--text);
        font:
          15px/1.45 -apple-system,
          "PingFang SC",
          sans-serif;
      }
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 16px 8px;
      }
      header h1 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      header p {
        margin: 0 0 12px;
        color: var(--l2);
        max-width: 820px;
      }
      header button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 0.5px solid var(--l3);
        background: var(--note);
        color: var(--text);
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 16px 48px;
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
      }
      .option h2 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .option .note {
        color: var(--l2);
        font-size: 12.5px;
        margin: 0 0 10px;
        max-width: 360px;
        min-height: 54px;
      }
      .phone {
        position: relative;
        width: 360px;
        height: 700px;
        border-radius: 42px;
        background: var(--page);
        overflow: hidden;
        box-shadow: 0 10px 30px var(--shadow);
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .content {
        padding: 58px 20px 0;
      }
      .brand {
        font:
          italic 560 34px/1 "Fraunces",
          Georgia,
          serif;
      }
      .host {
        margin-top: 6px;
        font-size: 12px;
        color: var(--l2);
      }
      .proj {
        margin-top: 22px;
        font:
          600 17px/1.2 "New York",
          Georgia,
          serif;
      }
      .row {
        height: 46px;
        border-bottom: 0.5px solid var(--rule);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .row b {
        font:
          500 12.5px ui-monospace,
          Menlo,
          monospace;
      }
      .row span {
        color: var(--l2);
        font-size: 12px;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .open .scrim {
        opacity: 1;
      }
      .layer {
        position: absolute;
        left: 313px;
        top: 643px;
        width: 0;
        height: 0;
        z-index: 2;
      }
      .piece {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }
      .glass {
        background: var(--glass);
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        border: 0.5px solid var(--edge);
        box-shadow:
          inset 0 0.5px 0 var(--edge),
          0 0 0 0.5px var(--edge-dark),
          0 6px 16px var(--shadow);
      }
      .chat-ink {
        background: var(--text) !important;
        color: var(--page);
        border-color: transparent !important;
      }
      .chat-ink .meta {
        color: var(--l3) !important;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--tint);
        margin-right: 4px;
        vertical-align: 1px;
      }

      /* A: compact glass chips, two to a row along the ring, edge to edge. */
      .a .chip {
        position: absolute;
        left: -60px;
        top: -21px;
        width: 120px;
        height: 42px;
        border-radius: 13px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .a .chip .name {
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .a .chip .meta {
        font-size: 10.5px;
        color: var(--l2);
        white-space: nowrap;
      }

      /* B: a segmented glass dial; every segment touches the next. */
      .layer svg {
        position: absolute;
        overflow: visible;
        pointer-events: none;
      }
      .seg-label {
        position: absolute;
        width: 86px;
        left: -43px;
        top: -17px;
        text-align: center;
        pointer-events: none;
      }
      .seg-label .name {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .seg-label .meta {
        font-size: 10.5px;
        color: var(--l2);
        white-space: nowrap;
      }
      .seg-label.ink {
        color: var(--page);
      }
      .seg-label.ink .meta {
        color: var(--l3);
      }

      /* C: two rings of round glass keys; the inner one holds 新对话 and the latest three. */
      .c .key {
        position: absolute;
        left: -26px;
        top: -26px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font:
          600 19px "New York",
          Georgia,
          serif;
        color: var(--tint);
        cursor: pointer;
      }
      .c .key.chat-ink {
        font:
          300 26px -apple-system,
          sans-serif;
      }
      .c .key i {
        position: absolute;
        right: 1px;
        top: 1px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--tint);
        border: 2px solid var(--page);
      }
      .c .label {
        position: absolute;
        top: 29px;
        left: 0;
        transform: translateX(-50%);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        max-width: 72px;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
        text-shadow: 0 0 6px var(--page);
      }

      .fab {
        position: absolute;
        right: 18px;
        bottom: 28px;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        z-index: 5;
        background: var(--glass-strong);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 0.5px solid var(--edge);
        box-shadow: 0 8px 22px var(--shadow);
      }
      .fab svg {
        transition: transform 0.4s cubic-bezier(0.3, 1.4, 0.5, 1);
      }
      .open .fab svg {
        transform: rotate(45deg);
      }
      .toast {
        position: absolute;
        left: 50%;
        top: 120px;
        transform: translate(-50%, -8px);
        background: var(--text);
        color: var(--page);
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 18px;
        opacity: 0;
        transition:
          opacity 0.2s,
          transform 0.2s;
        z-index: 6;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>首页右下 + · 圆环方案（更紧凑、玻璃底）</h1>
      <p>
        三个方案都以 + 为圆心、圆环从屏幕右边进、从底边出；在屏幕任意处绕 +
        拖，就沿圆环转，松手带惯性、吸到最近一格。"新对话"每次展开都在同一个位置。点 + 试，点空白收起。示例里有 12
        个项目。
      </p>
      <button id="theme">切到深色</button>
    </header>
    <main id="main"></main>
    <script>
      const projects = [
        ["atrium", "2 在跑 · 刚刚", true],
        ["radar-map", "1 在跑 · 6 分钟", true],
        ["blog", "1 小时前"],
        ["weather-app", "昨天"],
        ["dotfiles", "周一"],
        ["notes", "10月20日"],
        ["pi-bridge", "10月12日"],
        ["design-sys", "10月9日"],
        ["infra", "10月2日"],
        ["ios-kit", "9月28日"],
        ["sandbox", "9月20日"],
        ["papers", "9月11日"],
      ].map(([name, meta, running]) => ({ name, meta, running: Boolean(running) }));
      const chat = { name: "新对话", meta: "不绑定项目", chat: true };
      const cx = 313;
      const cy = 643;
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const rad = (deg) => (deg * Math.PI) / 180;
      const polar = (deg, r) => [r * Math.cos(rad(deg)), r * Math.sin(rad(deg))];

      /**
       * Each option lists rings; a ring has a radius, a step in degrees, where its first slot is,
       * its items, whether it turns, and how to draw one item.
       */
      const options = [
        {
          id: "a",
          title: "A · 双层分段转盘",
          note: "两道玻璃环，都切成一格一格贴在一起。内环固定：新对话 + 最近 3 个项目，伸手就点到；外环是其余项目，绕着转。最密，一屏 10 格左右。",
          bands: [
            { inner: 92, outer: 196, step: 30, home: -78, take: (all) => all.slice(0, 4), turns: 0 },
            { inner: 200, outer: 330, step: 19, home: -74, take: (all) => all.slice(4), turns: 1 },
          ],
        },
        {
          id: "b",
          title: "B · 分段玻璃转盘",
          note: "一整道玻璃环切成一格一格，格子之间只有一条细缝，铺满右下角；每格写名字和时间。最像一个能拧的转盘，最整齐、最紧密。新对话是最上面那格墨色。",
          bands: [{ inner: 132, outer: 318, step: 21, home: -84, take: (all) => all, turns: 1 }],
        },
        {
          id: "c",
          title: "C · 内外两圈圆钮",
          note: "内圈固定：新对话 + 最近 3 个项目，一伸手就点到；外圈是全部项目，绕着转。圆钮是玻璃底、首字母、在跑的右上深米点，名字写在下面。按得最准，信息最少。",
          rings: [
            { radius: 132, step: 36, home: -96, take: (all) => all.slice(0, 4), turns: 0 },
            { radius: 248, step: 20, home: -86, take: (all) => all.slice(4), turns: 1 },
          ],
          draw(item) {
            const glyph = item.chat ? "+" : item.name[0].toUpperCase();
            return `<div class="key glass ${item.chat ? "chat-ink" : ""}">${glyph}${item.running ? "<i></i>" : ""}</div><div class="label">${item.name}</div>`;
          },
          lean: 0,
        },
      ];

      const plus = `<svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 4v14M4 11h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
      const page = `<div class="content"><div class="brand">Atrium</div><div class="host">● MacBook Pro</div>
        <div class="proj">atrium</div>
        <div class="row"><b>feat/mobile-redesign</b><span>首页空状态换成纸</span></div>
        <div class="row"><b>main</b><span>夜间变异测试结果</span></div>
        <div class="proj">radar-map</div>
        <div class="row"><b>feat/radar-map</b><span>雷达图缩放</span></div>
        <div class="row"><b>fix/legend</b><span>图例错位</span></div>
        <div class="proj">blog</div>
        <div class="row"><b>main</b><span>写一篇 Noise 的笔记</span></div></div>`;
      const main = document.getElementById("main");
      main.innerHTML = options
        .map(
          (option) => `<section class="option"><h2>${option.title}</h2><p class="note">${option.note}</p>
          <div class="phone ${option.id}" data-id="${option.id}">${page}<div class="scrim"></div><div class="layer"></div><div class="fab">${plus}</div><div class="toast"></div></div></section>`,
        )
        .join("");

      /** Wires one phone: builds its pieces, lays them out, and handles turning and picking. */
      function setUp(option, phone) {
        const layer = phone.querySelector(".layer");
        const toast = phone.querySelector(".toast");
        const all = [chat, ...projects];
        let scroll = 0; // in slots
        let opened = 0;
        let velocity = 0;
        let animation = 0;
        let pieces = [];
        let maxScroll = 0;
        let degPerSlot = 20;

        if (option.bands) {
          const size = Math.max(...option.bands.map((band) => band.outer));
          degPerSlot = option.bands[option.bands.length - 1].step;
          layer.innerHTML = `<svg width="${size * 2}" height="${size * 2}" style="left:${-size}px;top:${-size}px"></svg>`;
          const svg = layer.querySelector("svg");
          const blurs = option.bands
            .map(
              ({
                inner,
                outer,
              }) => `<div class="bandblur" style="position:absolute;left:${-outer}px;top:${-outer}px;width:${outer * 2}px;height:${outer * 2}px;border-radius:50%;
              backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
              mask:radial-gradient(circle, transparent ${inner}px, #000 ${inner + 0.5}px, #000 ${outer}px, transparent ${outer + 0.5}px);
              -webkit-mask:radial-gradient(circle, transparent ${inner}px, #000 ${inner + 0.5}px, #000 ${outer}px, transparent ${outer + 0.5}px);"></div>`,
            )
            .join("");
          layer.insertAdjacentHTML("afterbegin", blurs);
          option.bands.forEach((band) => {
            const items = band.take(all);
            items.forEach((item, index) => {
              const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
              path.setAttribute("fill", item.chat ? "var(--text)" : "var(--glass-strong)");
              path.setAttribute("stroke", "var(--edge)");
              path.setAttribute("stroke-width", "1");
              svg.appendChild(path);
              const label = document.createElement("div");
              label.className = "piece";
              label.innerHTML = `<div class="seg-label ${item.chat ? "ink" : ""}"><div class="name">${item.name}</div><div class="meta">${item.running ? '<span class="dot"></span>' : ""}${item.meta}</div></div>`;
              layer.appendChild(label);
              pieces.push({ item, index, path, label, band, size });
            });
            if (band.turns) maxScroll = Math.max(maxScroll, items.length - 5);
          });
        } else {
          degPerSlot = option.rings[option.rings.length - 1].step;
          option.rings.forEach((ring) => {
            const items = ring.take(all);
            items.forEach((item, index) => {
              const node = document.createElement("div");
              node.className = "piece";
              node.innerHTML = option.draw(item);
              layer.appendChild(node);
              pieces.push({ item, index, node, ring });
            });
            if (ring.turns) maxScroll = Math.max(maxScroll, items.length - 4);
          });
        }

        /** Places every piece for the current scroll and opening progress. */
        function layout() {
          pieces.forEach((piece, order) => {
            const delay = Math.min(0.45, order * 0.035);
            const local = Math.min(1, Math.max(0, (opened - delay) / (1 - delay)));
            const ease = 1 - Math.pow(1 - local, 3);
            if (option.bands) {
              const { index, band, size, path, label } = piece;
              const { home, step, inner, outer, turns } = band;
              const start = home - index * step + scroll * turns * step - 0.6;
              const end = start - step + 1.2;
              const spin = (1 - ease) * 40;
              const r0 = inner * (0.4 + 0.6 * ease);
              const r1 = outer * (0.4 + 0.6 * ease);
              const [ax, ay] = polar(start + spin, r1);
              const [bx, by] = polar(end + spin, r1);
              const [dx, dy] = polar(end + spin, r0);
              const [ex, ey] = polar(start + spin, r0);
              path.setAttribute(
                "d",
                `M${size + ax} ${size + ay} A${r1} ${r1} 0 0 0 ${size + bx} ${size + by} L${size + dx} ${size + dy} A${r0} ${r0} 0 0 1 ${size + ex} ${size + ey} Z`,
              );
              path.setAttribute("opacity", ease.toFixed(3));
              const [lx, ly] = polar((start + end) / 2 + spin, (r0 + r1) / 2);
              label.style.transform = `translate(${lx}px, ${ly}px)`;
              label.style.opacity = ease.toFixed(3);
              piece.center = (start + end) / 2;
              return;
            }
            const { ring, index, node } = piece;
            const deg = ring.home - index * ring.step + scroll * ring.turns * ring.step + (1 - ease) * 30;
            const [x, y] = polar(deg, ring.radius * (0.3 + 0.7 * ease));
            const lean = (deg + 90) * option.lean;
            node.style.transform = `translate(${x}px, ${y}px) rotate(${lean}deg) scale(${0.7 + 0.3 * ease})`;
            node.style.opacity = ease.toFixed(3);
          });
          layer.querySelectorAll(".bandblur").forEach((blur) => (blur.style.opacity = opened.toFixed(3)));
        }

        const bounded = (value) =>
          value < 0 ? value * 0.35 : value > maxScroll ? maxScroll + (value - maxScroll) * 0.35 : value;

        /** Springs to the nearest slot, carrying the release velocity. */
        function settle() {
          cancelAnimationFrame(animation);
          const target = Math.min(maxScroll, Math.max(0, Math.round(scroll + (reduce ? 0 : velocity * 9))));
          if (reduce) {
            scroll = target;
            layout();
            return;
          }
          let speed = velocity;
          const tick = () => {
            speed = (speed + (target - scroll) * 0.11) * 0.75;
            scroll += speed;
            layout();
            if (Math.abs(target - scroll) > 0.002 || Math.abs(speed) > 0.002) animation = requestAnimationFrame(tick);
            else {
              scroll = target;
              layout();
            }
          };
          animation = requestAnimationFrame(tick);
        }

        const angleOf = (event) => {
          const rect = phone.getBoundingClientRect();
          return (Math.atan2(event.clientY - rect.top - cy, event.clientX - rect.left - cx) * 180) / Math.PI;
        };

        /** Which item sits under a point, for a tap. */
        function itemAt(event) {
          const hit = event.target.closest(".piece");
          if (hit) return pieces.find((piece) => piece.node === hit || piece.label === hit)?.item;
          if (!option.bands) return null;
          const rect = phone.getBoundingClientRect();
          const x = event.clientX - rect.left - cx;
          const y = event.clientY - rect.top - cy;
          const distance = Math.hypot(x, y);
          const deg = (Math.atan2(y, x) * 180) / Math.PI;
          const norm = (value) => (((value % 360) + 540) % 360) - 180;
          return pieces.find(
            (piece) =>
              distance >= piece.band.inner &&
              distance <= piece.band.outer &&
              Math.abs(norm(deg - piece.center)) < piece.band.step / 2,
          )?.item;
        }

        let drag = null;
        phone.addEventListener("pointerdown", (event) => {
          if (!phone.classList.contains("open") || event.target.closest(".fab")) return;
          cancelAnimationFrame(animation);
          drag = { last: angleOf(event), moved: 0, raw: scroll, start: event };
          phone.setPointerCapture(event.pointerId);
          velocity = 0;
        });
        phone.addEventListener("pointermove", (event) => {
          if (!drag) return;
          const now = angleOf(event);
          let delta = now - drag.last;
          if (delta > 180) delta -= 360;
          if (delta < -180) delta += 360;
          drag.last = now;
          drag.moved += Math.abs(delta);
          drag.raw += delta / degPerSlot;
          const next = bounded(drag.raw);
          velocity = next - scroll;
          scroll = next;
          layout();
        });
        phone.addEventListener("pointerup", () => {
          if (!drag) return;
          const { moved, start } = drag;
          drag = null;
          if (moved <= 2) {
            const item = itemAt(start);
            if (item) pick(item);
            else setOpen(false);
            return;
          }
          settle();
        });
        phone.addEventListener(
          "wheel",
          (event) => {
            if (!phone.classList.contains("open")) return;
            event.preventDefault();
            cancelAnimationFrame(animation);
            scroll = Math.min(maxScroll, Math.max(0, scroll + event.deltaY * 0.006));
            velocity = 0;
            layout();
            clearTimeout(phone.wheelTimer);
            phone.wheelTimer = setTimeout(settle, 120);
          },
          { passive: false },
        );

        /** Picks an item: says where the new session goes, then closes. */
        function pick(item) {
          toast.textContent = item.chat ? "新对话（不绑定项目）" : `在 ${item.name} 里新建`;
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 1200);
          setOpen(false);
        }

        /** Opens or closes; opening always puts 新对话 back in its place. */
        function setOpen(open) {
          if (open) {
            cancelAnimationFrame(animation);
            scroll = 0;
          }
          phone.classList.toggle("open", open);
          const from = opened;
          const target = open ? 1 : 0;
          const startTime = performance.now();
          const duration = reduce ? 1 : open ? 520 : 240;
          const run = (now) => {
            const t = Math.min(1, (now - startTime) / duration);
            opened = from + (target - from) * t;
            layout();
            if (t < 1) requestAnimationFrame(run);
          };
          requestAnimationFrame(run);
        }
        phone.querySelector(".fab").addEventListener("click", () => setOpen(!phone.classList.contains("open")));
        layout();
        return {
          show(turn) {
            phone.classList.add("open");
            opened = 1;
            scroll = Math.min(maxScroll, turn);
            layout();
          },
        };
      }

      const controllers = options.map((option) => setUp(option, document.querySelector(`.phone.${option.id}`)));
      // "#open" opens all on load, "#open=N" also turns N slots, "-dark" goes dark; for screenshots.
      const match = location.hash.match(/^#open(?:=(\d+))?/);
      if (match) controllers.forEach((controller) => controller.show(Number(match[1] || 0)));
      const theme = document.getElementById("theme");
      theme.addEventListener("click", () => {
        const dark = document.documentElement.dataset.theme === "dark";
        document.documentElement.dataset.theme = dark ? "light" : "dark";
        theme.textContent = dark ? "切到深色" : "切到浅色";
      });
      if (location.hash.includes("dark")) theme.click();
    </script>
  </body>
</html>
