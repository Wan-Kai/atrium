<!doctype html>
<!--
  PROTOTYPE — throwaway. 对话回复里的代码块、表格、Mermaid 图怎么展示。
  起因：Streamdown 用 shadcn 的颜色名（border-border、bg-muted、bg-sidebar），styles.css 的 @theme 没映射，Tailwind v4 的边框落回 currentColor，于是全是黑框。
  三版：A 只补上颜色映射，保留 Streamdown 自带的结构（外卡片 + 内框、按钮浮在右上）；B 平铺：一块 --code 底、不描边，语言名和按钮只在悬停时出现；
  C 卡片：细边框 + 标题栏（语言 / 表格 / 图表，按钮常显），Mermaid 在标题栏切换"图 / 源码"。
  底部浮条切换版本（也可 ?variant=A|B|C、键盘 ← →）、浅色 / 深色、"按钮常显"（模拟悬停）。
  颜色、字号取自 packages/ui/src/design/tokens.css；高亮色是 Shiki 的 github-light / github-dark；图标是 Hugeicons 免费版。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 · 回复里的代码块、表格、Mermaid</title>
<style>
:root {
  --main: #fff; --surface-1: #fff; --surface-2: #f2f2f4; --surface-3: #e9e9ec; --code: #f6f6f8; --sidebar-bg: rgba(246,247,250,.9);
  --text: #1d1d1f; --text-2: #2c2c30; --text-3: #48484e; --text-muted: #6e6e74; --text-dim: #a1a1a7;
  --line: rgba(0,0,0,.08); --line-soft: rgba(0,0,0,.05); --line-strong: rgba(0,0,0,.14); --hover: rgba(0,0,0,.035); --selected: rgba(0,0,0,.06);
  --tint: #2f6fed; --ok-text: #1e8e3e; --danger: #e5484d;
  --diff-add-bg: rgba(22,163,74,.09); --diff-del-bg: rgba(229,72,77,.08);
  --card-shadow: 0 0 0 .5px var(--line), 0 8px 24px rgba(41,70,122,.08);
  --chip-shadow: 0 0 0 .5px rgba(0,0,0,.09), 0 1px 2px rgba(0,0,0,.05);
  --page: #eef1f6; --bar: rgba(255,255,255,.92);
  --font-sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --fs: 14px; --fs-reply: 14.5px; --lh-reply: 1.55; --fs-meta: 13px; --fs-sm: 12px; --fs-xs: 11px; --fs-mono: 12.5px;
  --r-sm: 6px; --r: 8px; --r-md: 10px; --r-btn: 12px; --r-card: 16px; --r-bubble: 22px; --r-pill: 999px;
  /* github-light */
  --hl-k: #d73a49; --hl-s: #032f62; --hl-f: #6f42c1; --hl-c: #6a737d; --hl-n: #005cc5; --hl-t: #24292e;
}
:root[data-theme=dark] {
  --main: #151517; --surface-1: #212123; --surface-2: #2c2c2e; --surface-3: #3a3a3c; --code: #19191b; --sidebar-bg: rgba(30,30,32,.9);
  --text: #f9fafb; --text-2: #e7e9ec; --text-3: #cfd3d6; --text-muted: #adb2b8; --text-dim: #81858c;
  --line: rgba(255,255,255,.1); --line-soft: rgba(255,255,255,.06); --line-strong: rgba(255,255,255,.16); --hover: rgba(255,255,255,.05); --selected: rgba(255,255,255,.08);
  --tint: #7aaaff; --ok-text: #4ade80; --danger: #f25a5a;
  --diff-add-bg: rgba(74,222,128,.1); --diff-del-bg: rgba(242,90,90,.1);
  --card-shadow: 0 0 0 .5px var(--line), 0 9px 27px rgba(41,70,122,.2);
  --chip-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.3);
  --page: #0c0c0e; --bar: rgba(40,40,42,.92);
  /* github-dark */
  --hl-k: #f97583; --hl-s: #9ecbff; --hl-f: #b392f0; --hl-c: #6a737d; --hl-n: #79b8ff; --hl-t: #e1e4e8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); font: var(--fs)/1.5 var(--font-sans); color: var(--text); -webkit-font-smoothing: antialiased; padding-bottom: 110px; }
header.page { padding: 24px 40px 4px; max-width: 1040px; }
header.page h1 { font-size: 20px; margin: 0 0 6px; }
header.page p { margin: 0 0 4px; color: var(--text-muted); font-size: var(--fs-meta); }
.stage { padding: 14px 40px; }
.win { width: 1040px; height: 760px; background: var(--main); border-radius: var(--r-card); box-shadow: var(--card-shadow); overflow: hidden; display: flex; }
.sb { width: 180px; background: var(--sidebar-bg); border-right: .5px solid var(--line); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabs { height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: .5px solid var(--line); flex: none; }
.tab { height: 28px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: var(--r); font-size: var(--fs-meta); background: var(--selected); }
.thread { flex: 1; overflow-y: auto; padding: 24px 0 8px; }
.col { max-width: 720px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; }
.bubble { align-self: flex-end; max-width: 80%; background: var(--surface-2); border-radius: var(--r-bubble); padding: 8px 16px; }
.umeta { align-self: flex-end; display: flex; align-items: center; gap: 4px; font-size: var(--fs-sm); color: var(--text-dim); margin: 4px 0 12px; }
.foot { margin: 6px 0 22px -4px; display: flex; align-items: center; gap: 2px; font-size: var(--fs-sm); color: var(--text-dim); font-variant-numeric: tabular-nums; }
.foot .ib { display: inline-grid; place-items: center; padding: 4px; }
.foot .use { margin-left: 10px; display: inline-flex; align-items: center; gap: 4px; }
.foot .time { margin-left: 12px; }
.composer { margin: 0 auto 16px; width: calc(100% - 40px); max-width: 760px; background: var(--surface-2); border-radius: var(--r-bubble); padding: 14px 20px; color: var(--text-dim); font-size: var(--fs-meta); height: 76px; flex: none; }

/* 回复正文 */
.md { font-size: var(--fs-reply); line-height: var(--lh-reply); color: var(--text); display: flex; flex-direction: column; gap: 12px; }
.md p { margin: 0; }
.md :not(pre) > code.ic { font: .88em/1 var(--font-mono); background: var(--surface-2); border-radius: var(--r-sm); padding: 2px 5px; }
pre { margin: 0; }
.code { font: var(--fs-mono)/1.6 var(--font-mono); color: var(--hl-t); white-space: pre; }
.k { color: var(--hl-k); } .s { color: var(--hl-s); } .f { color: var(--hl-f); } .c { color: var(--hl-c); } .n { color: var(--hl-n); }
.ln { display: inline-block; width: 2ch; margin-right: 16px; text-align: right; color: var(--text-dim); user-select: none; }
.dl { display: block; margin: 0 -14px; padding: 0 14px; }
.dl.add { background: var(--diff-add-bg); } .dl.del { background: var(--diff-del-bg); }
.ib { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: var(--r-sm); color: var(--text-dim); }
.ib:hover { background: var(--hover); color: var(--text-2); }
.ib.done { color: var(--ok-text); }
svg { display: block; flex: none; }
.diagram svg text { font: 13px var(--font-sans); fill: var(--text-2); }

/* ---------- A：Streamdown 自带的结构，补上颜色 ---------- */
.vA .blk { position: relative; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.vA .blk-head { height: 32px; display: flex; align-items: center; padding-left: 4px; font: var(--fs-sm) var(--font-mono); color: var(--text-muted); }
.vA .acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; padding: 2px 4px; border-radius: var(--r-sm); background: var(--surface-2); }
.vA .body { border: 1px solid var(--line); background: var(--main); border-radius: 6px; padding: 14px 16px; overflow-x: auto; }
.vA .tbl-wrap { position: relative; display: flex; flex-direction: column; gap: 8px; }
.vA .tbl-wrap .acts { position: static; align-self: flex-end; background: none; }
.vA table { border: 1px solid var(--line); }
.vA thead { background: var(--surface-2); }
.vA th, .vA td { padding: 8px 16px; text-align: left; font-size: 14px; }
.vA th { font-weight: 600; white-space: nowrap; }
.vA tbody tr { border-top: 1px solid var(--line); }

/* ---------- B：平铺，一块 --code 底，悬停出按钮 ---------- */
.vB .blk { position: relative; background: var(--code); border-radius: var(--r-md); }
.vB .body { padding: 12px 14px; overflow-x: auto; }
.vB .lang { position: absolute; top: 6px; right: 8px; padding: 1px 4px; border-radius: var(--r-sm); background: var(--code); font: var(--fs-xs)/18px var(--font-mono); color: var(--text-dim); transition: opacity .15s; pointer-events: none; }
.vB .acts { position: absolute; top: 5px; right: 6px; display: flex; gap: 1px; padding: 1px; border-radius: var(--r); background: var(--code); opacity: 0; transition: opacity .15s; }
.vB .blk:hover .acts, .force .vB .acts { opacity: 1; }
.vB .blk:hover .lang, .force .vB .lang { opacity: 0; }
.vB .tbl { position: relative; }
.vB .tbl .acts { top: -2px; right: 0; background: var(--main); }
.vB table { width: 100%; font-size: 14px; }
.vB th { font-size: var(--fs-meta); font-weight: 600; color: var(--text-muted); text-align: left; padding: 6px 20px 8px 0; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.vB td { padding: 8px 20px 8px 0; border-bottom: 1px solid var(--line-soft); }
.vB tr:last-child td { border-bottom: 0; }
.vB .diagram { padding: 20px 14px; display: grid; place-items: center; }

/* ---------- C：细边框卡片 + 标题栏 ---------- */
.vC .blk { border-radius: var(--r-md); box-shadow: inset 0 0 0 .5px var(--line-strong); overflow: hidden; background: var(--main); }
.vC .head { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; background: var(--code); border-bottom: .5px solid var(--line); font-size: var(--fs-sm); color: var(--text-muted); }
.vC .head .name { font-family: var(--font-mono); }
.vC .head .meta { color: var(--text-dim); }
.vC .head .sp { flex: 1; }
.vC .tb { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px; border-radius: var(--r-sm); color: var(--text-muted); font-size: var(--fs-sm); }
.vC .tb:hover { background: var(--hover); color: var(--text-2); }
.vC .tb.done { color: var(--ok-text); }
.vC .seg { display: inline-flex; background: var(--hover); border-radius: 7px; padding: 2px; margin-right: 4px; }
.vC .seg button { all: unset; cursor: pointer; padding: 0 8px; line-height: 20px; border-radius: 5px; color: var(--text-muted); font-size: var(--fs-xs); }
.vC .seg button[aria-pressed=true] { background: var(--surface-1); color: var(--text); box-shadow: var(--chip-shadow); }
.vC .body { padding: 12px 14px; overflow-x: auto; }
.vC table { width: 100%; font-size: 14px; }
.vC th { font-size: var(--fs-meta); font-weight: 600; color: var(--text-muted); text-align: left; padding: 8px 14px; white-space: nowrap; border-bottom: .5px solid var(--line); }
.vC td { padding: 8px 14px; border-bottom: .5px solid var(--line-soft); }
.vC tr:last-child td { border-bottom: 0; }
.vC tbody tr:hover td { background: var(--hover); }
.vC .diagram { padding: 20px 14px; display: grid; place-items: center; }

table { border-collapse: collapse; border-spacing: 0; }
.tbl-scroll { overflow-x: auto; }

/* 浮条 */
.bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--bar); backdrop-filter: blur(12px); box-shadow: 0 0 0 .5px var(--line-strong), 0 12px 32px rgba(0,0,0,.18); border-radius: 14px; padding: 8px 10px; display: flex; gap: 14px; align-items: center; font-size: var(--fs-sm); color: var(--text-muted); white-space: nowrap; z-index: 9; }
.bar .seg { display: inline-flex; background: var(--hover); border-radius: 9px; padding: 2px; }
.bar .seg button { all: unset; cursor: pointer; padding: 3px 10px; border-radius: 7px; color: var(--text-muted); }
.bar .seg button[aria-pressed=true] { background: var(--surface-1); color: var(--text); box-shadow: 0 0 0 .5px var(--line-strong); }
.bar label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.desc { margin: 10px 0 0; font-size: var(--fs-meta); color: var(--text-muted); max-width: 1040px; }
.state { font: var(--fs-xs)/1.4 var(--font-mono); color: var(--text-dim); margin: 6px 40px 0; }
</style>
</head>
<body>
<header class="page">
  <h1>回复里的代码块、表格、Mermaid 图（原型，审完即弃）</h1>
  <p>现在：Streamdown 的边框颜色名没映射，全落成黑色线框，代码块还是"卡片套卡片"。三版比较怎么展示。</p>
  <p>底部浮条切换版本（键盘 ← → 也行）和浅色 / 深色；B 的按钮悬停才出现，勾"按钮常显"可以一直看到。点复制会变成对勾；Mermaid 可以切到源码。</p>
</header>
<div class="stage">
  <div class="win">
    <div class="sb"></div>
    <div class="main">
      <div class="tabs"><span class="tab">介绍</span></div>
      <div class="thread"><div class="col" id="col"></div></div>
      <div class="composer">发消息或描述任务，@ 引用文件，/ 使用命令</div>
    </div>
  </div>
  <p class="desc" id="desc"></p>
</div>
<div class="state" id="state"></div>
<div class="bar">
  <span class="seg" id="variants"></span>
  <span class="seg" id="themes"></span>
  <label><input type="checkbox" id="force">按钮常显（模拟悬停）</label>
</div>

11.9855 16.9199 11.7648 15.7861 11.9855H12.0053M12.0053 15.7001V11.9855\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "DatabaseIcon": "<ellipse cx=\"12\" cy=\"5\" rx=\"8\" ry=\"3\" stroke=\"currentColor\" stroke-width=\"1.75\"/><path d=\"M7 10.842C7.60158 11.0229 8.27434 11.1718 9 11.282\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.75\"/><path d=\"M20 12C20 13.6569 16.4183 15 12 15C7.58172 15 4 13.6569 4 12\" stroke=\"currentColor\" stroke-width=\"1.75\"/><path d=\"M7 17.842C7.60158 18.0229 8.27434 18.1718 9 18.282\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.75\"/><path d=\"M20 5V19C20 20.6569 16.4183 22 12 22C7.58172 22 4 20.6569 4 19V5\" stroke=\"currentColor\" stroke-width=\"1.75\"/>", "Add01Icon": "<path d=\"M12.001 5.00003V19.002\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/><path d=\"M19.002 12.002L4.99998 12.002\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "ArrowDown01Icon": "<path d=\"M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>", "Clock01Icon": "<circle cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" stroke-width=\"1.75\"/><path d=\"M12 8V12L14 14\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.75\"/>"};
const svg = (k, s = 15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none">${SVG[k]}</svg>`;
const VARIANTS = {
  A: ["A · 只补颜色", "只把 Streamdown 用的颜色名（border、muted、sidebar、primary）映射到我们的 token，结构不动：灰底外卡片里套白底内框，语言名一行，按钮浮在右上角常显；表格按钮在表格上方一行；代码带行号。改动最小，但还是两层框，代码块比正文重。"],
  B: ["B · 平铺", "一块 --code 底、圆角 10px、不描边，和过程详情块同一种面：代码块不要标题行，语言名淡淡地在右上角，悬停时换成按钮（复制；Mermaid 多一个源码和放大）。表格不加框：表头 13px 半粗 --text-muted、下面一道 --line-strong，行间 --line-soft；悬停时右上角出现复制、放大。没有行号。最安静，最接近正文。"],
  C: ["C · 卡片带标题栏", "0.5px 细边框、圆角 10px 的卡片，顶上 34px 标题栏（--code 底）：左边语言名或\"表格 · 4 行\"\"图表\"，右边文字按钮常显（复制；表格、图表多一个放大）；Mermaid 在标题栏切换\"图 / 源码\"。正文区白底，代码带淡行号；表格行悬停变底色。结构最清楚，按钮一眼可见，但比 B 重。"],
};
const q = new URLSearchParams(location.search);
const s = { variant: VARIANTS[q.get("variant")] ? q.get("variant") : "A", theme: q.get("theme") === "dark" ? "dark" : "light", force: false, source: false, copied: null };

const PY = [
  `<span class="k">def</span> <span class="f">greet</span>(name: <span class="n">str</span>) -> <span class="n">str</span>:`,
  `    <span class="s">"""返回一句问候。"""</span>`,
  `    <span class="k">return</span> <span class="s">f"你好，</span><span class="n">{name}</span><span class="s">！"</span>`,
  ``,
  `<span class="f">print</span>(greet(<span class="s">"世界"</span>))`,
];
const SH = [`pnpm vitest run --project ui packages/ui/src/chat/markdown.browser.test.tsx -t <span class="s">"renders tables with a header row and keeps long cells on one line"</span>`];
const DIFF = [
  ["", `<span class="k">export function</span> <span class="f">greet</span>(name: <span class="n">string</span>) {`],
  ["del", `-  <span class="k">return</span> <span class="s">"Hello, "</span> + name;`],
  ["add", `+  <span class="k">return</span> <span class="s">\`你好，\${name}！\`</span>;`],
  ["", `}`],
];
const ROWS = [["Python", "数据分析、自动化", `print("你好")`], ["JavaScript", "网页开发", `console.log("你好")`], ["Go", "后端服务", `fmt.Println("你好")`], ["Rust", "系统编程", `println!("你好");`]];
const MERMAID_SRC = `flowchart LR\n  A[你发消息] --> B(宿主)\n  B --> C{pi 在跑?}\n  C -- 是 --> D[排队]\n  C -- 否 --> E[发给 pi]\n  E --> F[流式回复]`;

function diagram() {
  const node = (x, y, w, label, shape = "rect") => shape === "diamond"
    ? `<polygon points="${x + w / 2},${y - 6} ${x + w + 6},${y + 17} ${x + w / 2},${y + 40} ${x - 6},${y + 17}" fill="var(--main)" stroke="var(--line-strong)" stroke-width="1"/><text x="${x + w / 2}" y="${y + 21}" text-anchor="middle">${label}</text>`
    : `<rect x="${x}" y="${y}" width="${w}" height="34" rx="${shape === "round" ? 17 : 7}" fill="var(--main)" stroke="var(--line-strong)" stroke-width="1"/><text x="${x + w / 2}" y="${y + 21}" text-anchor="middle">${label}</text>`;
  const edge = (d, label, lx, ly) => `<path d="${d}" fill="none" stroke="var(--text-dim)" stroke-width="1.2" marker-end="url(#ah)"/>${label ? `<rect x="${lx - 12}" y="${ly - 11}" width="24" height="16" rx="4" fill="var(--code)"/><text x="${lx}" y="${ly + 1}" text-anchor="middle" style="font-size:11.5px;fill:var(--text-muted)">${label}</text>` : ""}`;
  return `<svg width="600" height="150" viewBox="0 0 600 150"><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="var(--text-dim)"/></marker></defs>
    ${node(0, 58, 84, "你发消息")}${edge("M84 75 H118")}${node(120, 58, 70, "宿主", "round")}${edge("M190 75 H226")}
    ${node(232, 58, 96, "pi 在跑?", "diamond")}${edge("M338 75 C380 75 378 24 418 24", "是", 372, 46)}${edge("M338 75 C380 75 378 126 418 126", "否", 372, 108)}
    ${node(420, 7, 70, "排队")}${node(420, 109, 76, "发给 pi")}${edge("M496 126 H520")}${node(522, 109, 78, "流式回复")}</svg>`;
}
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const copyBtn = (id, cls = "ib") => `<button class="${cls}${s.copied === id ? " done" : ""}" data-copy="${id}" title="复制">${svg(s.copied === id ? "Tick02Icon" : "Copy01Icon")}${cls === "tb" ? (s.copied === id ? "已复制" : "复制") : ""}</button>`;
const ib = (k, t, cls = "ib") => `<button class="${cls}" title="${t}">${svg(k)}${cls === "tb" ? t : ""}</button>`;
const lines = (arr, nums) => arr.map((l, i) => nums ? `<span class="ln">${i + 1}</span>${l}` : l).join("\n");
const diffLines = () => DIFF.map(([k, l]) => `<span class="dl ${k}">${l}</span>`).join("");
const table = () => `<table><thead><tr><th>语言</th><th>常见用途</th><th>示例</th></tr></thead><tbody>${ROWS.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td><code class="ic">${esc(c)}</code></td></tr>`).join("")}</tbody></table>`;

function codeBlock(id, lang, inner, nums) {
  const body = `<pre class="code">${inner(nums)}</pre>`;
  if (s.variant === "A") return `<div class="blk"><div class="blk-head">${lang}</div><div class="acts">${ib("Download04Icon", "下载")}${copyBtn(id)}</div><div class="body">${inner === diffLines ? `<pre class="code">${inner()}</pre>` : body}</div></div>`;
  if (s.variant === "B") return `<div class="blk"><span class="lang">${lang}</span><div class="acts">${copyBtn(id)}</div><div class="body">${body}</div></div>`;
  return `<div class="blk"><div class="head"><span class="name">${lang}</span><span class="sp"></span>${copyBtn(id, "tb")}</div><div class="body">${body}</div></div>`;
}
function tableBlock() {
  if (s.variant === "A") return `<div class="tbl-wrap"><div class="acts">${copyBtn("t")}${ib("Download04Icon", "下载")}${ib("ArrowExpandIcon", "放大")}</div><div class="tbl-scroll">${table().replace("<table>", '<table style="width:100%">')}</div></div>`;
  if (s.variant === "B") return `<div class="blk tbl" style="background:none"><div class="acts" style="top:2px">${copyBtn("t")}${ib("ArrowExpandIcon", "放大")}</div><div class="tbl-scroll">${table()}</div></div>`;
  return `<div class="blk"><div class="head"><span>表格</span><span class="meta">· ${ROWS.length} 行</span><span class="sp"></span>${copyBtn("t", "tb")}${ib("ArrowExpandIcon", "放大", "tb")}</div><div class="tbl-scroll">${table()}</div></div>`;
}
function mermaidBlock() {
  const content = s.source ? `<div class="body"><pre class="code">${esc(MERMAID_SRC)}</pre></div>` : `<div class="diagram">${diagram()}</div>`;
  if (s.variant === "A") return `<div class="blk"><div class="blk-head">mermaid</div><div class="acts">${ib("Download04Icon", "下载")}${copyBtn("m")}${ib("ArrowExpandIcon", "放大")}</div><div class="body" style="display:grid;place-items:center">${s.source ? `<pre class="code">${esc(MERMAID_SRC)}</pre>` : diagram()}</div></div>`;
  if (s.variant === "B") return `<div class="blk"><span class="lang">mermaid</span><div class="acts"><button class="ib" data-src title="${s.source ? "看图" : "看源码"}">${svg(s.source ? "FlowchartIcon" : "SourceCodeIcon")}</button>${copyBtn("m")}${ib("ArrowExpandIcon", "放大")}</div>${content}</div>`;
  return `<div class="blk"><div class="head"><span>图表</span><span class="sp"></span><span class="seg"><button data-view="0" aria-pressed="${!s.source}">图</button><button data-view="1" aria-pressed="${s.source}">源码</button></span>${copyBtn("m", "tb")}${ib("ArrowExpandIcon", "放大", "tb")}</div>${content}</div>`;
}
const foot = (use, time) => `<div class="foot"><span class="ib">${svg("Copy01Icon", 14)}</span><span class="ib">${svg("GitForkIcon", 14)}</span><span class="use">${svg("DatabaseIcon", 13)}用量 ${use} tok</span><span class="time">${time}</span></div>`;
const ask = (t, time) => `<div class="bubble">${t}</div><div class="umeta">${time} ${svg("Copy01Icon", 14)}</div>`;

function paint() {
  document.documentElement.dataset.theme = s.theme;
  document.body.classList.toggle("force", s.force);
  const nums = s.variant !== "B";
  document.getElementById("col").innerHTML = `<div class="v${s.variant}" style="display:flex;flex-direction:column">
    ${ask("用 Python 写个问候函数", "10:37")}
    <div class="md"><p>可以这样写，<code class="ic">greet</code> 收一个名字，返回问候语：</p>${codeBlock("py", "python", (n) => lines(PY, n), nums)}<p>运行它会打印 <code class="ic">你好，世界！</code>。测试可以这样单独跑：</p>${codeBlock("sh", "bash", (n) => lines(SH, false), false)}<p>如果是 TypeScript，改动是这样的：</p>${codeBlock("diff", "diff", diffLines, false)}</div>
    ${foot("10K", "10:38")}
    ${ask("输出一段表格", "10:38")}
    <div class="md"><p>几种语言的常见用途：</p>${tableBlock()}</div>
    ${foot("343", "10:38")}
    ${ask("输出一个 mermaid 图表", "10:39")}
    <div class="md"><p>一条消息从发出到回复的路径：</p>${mermaidBlock()}</div>
    ${foot("512", "10:39")}</div>`;
  document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => { s.copied = b.dataset.copy; paint(); setTimeout(() => { s.copied = null; paint(); }, 1500); });
  document.querySelectorAll("[data-src]").forEach((b) => b.onclick = () => { s.source = !s.source; paint(); });
  document.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => { s.source = b.dataset.view === "1"; paint(); });
  seg("variants", Object.fromEntries(Object.entries(VARIANTS).map(([k, [l]]) => [k, l])), "variant");
  seg("themes", { light: "浅色", dark: "深色" }, "theme");
  document.getElementById("force").checked = s.force;
  document.getElementById("desc").textContent = VARIANTS[s.variant][1];
  document.getElementById("state").textContent = JSON.stringify({ variant: s.variant, theme: s.theme, buttonsShown: s.force || s.variant !== "B", mermaid: s.source ? "源码" : "图", lineNumbers: nums });
  history.replaceState(null, "", `?variant=${s.variant}&theme=${s.theme}`);
}
function seg(id, options, key) {
  const el = document.getElementById(id);
  el.innerHTML = Object.entries(options).map(([k, l]) => `<button data-k="${k}" aria-pressed="${s[key] === k}">${l}</button>`).join("");
  el.querySelectorAll("button").forEach((b) => b.onclick = () => { s[key] = b.dataset.k; paint(); });
}
document.getElementById("force").onchange = (e) => { s.force = e.target.checked; paint(); };
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const keys = Object.keys(VARIANTS), i = keys.indexOf(s.variant);
  if (e.key === "ArrowRight") { s.variant = keys[(i + 1) % keys.length]; paint(); }
  if (e.key === "ArrowLeft") { s.variant = keys[(i + keys.length - 1) % keys.length]; paint(); }
});
paint();
</script>
</body>
</html>
