<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>原型：模型面板里"走套餐"的标记</title>
    <!--
  原型（PROTOTYPE，用完即弃）：模型面板左列服务商图标上"走套餐"的标记。
  问题：claude-bridge（Claude Max 套餐）和 anthropic（按量 / Extra Usage）都用 Claude 的图标，
  列表里要分得清哪些模型走套餐。标记放在图标右下角（右上角已经是"当前模型"的小点）。
  第一轮 A 圆环、B 票券、C 实心票券没选；这轮 D 折角、E 底部短条、F 文字签、G 皇冠。DeepSeek 换成官网的鲸鱼图标。
  打开：直接双击本文件；?variant=D|E|F|G 只看一种。
-->
    <style>
      .light {
        --main: #fff;
        --surface-1: #fff;
        --surface-2: #f2f2f4;
        --surface-3: #e9e9ec;
        --text: #1d1d1f;
        --text-2: #2c2c30;
        --text-muted: #6e6e74;
        --text-dim: #a1a1a7;
        --line: rgba(0, 0, 0, 0.08);
        --line-strong: rgba(0, 0, 0, 0.14);
        --hover: rgba(0, 0, 0, 0.035);
        --selected: rgba(0, 0, 0, 0.06);
        --tint: #2f6fed;
        --popover: #fff;
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 12px 32px rgba(0, 0, 0, 0.14);
        --page: #eef1f6;
      }
      .dark {
        --main: #151517;
        --surface-1: #212123;
        --surface-2: #2c2c2e;
        --surface-3: #353638;
        --text: #f9fafb;
        --text-2: #e7e9ec;
        --text-muted: #adb2b8;
        --text-dim: #81858c;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.16);
        --hover: rgba(255, 255, 255, 0.05);
        --selected: rgba(255, 255, 255, 0.08);
        --tint: #7aaaff;
        --popover: #212123;
        --float-shadow: 0 0 0 0.5px var(--line-strong), 0 16px 40px rgba(0, 0, 0, 0.45);
        --page: #0c0c0e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e4e7ec;
        font:
          14px/1.5 -apple-system,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 24px 40px 60px;
        color: #1d1d1f;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p.lead {
        margin: 0 0 18px;
        color: #6e6e74;
        font-size: 13px;
        max-width: 900px;
      }
      .row {
        display: grid;
        grid-template-columns: 120px 1fr 1fr;
        gap: 18px;
        align-items: start;
        margin-bottom: 22px;
      }
      .row h2 {
        font-size: 15px;
        margin: 8px 0 0;
      }
      .row h2 small {
        display: block;
        font-weight: 400;
        color: #6e6e74;
        font-size: 12px;
        margin-top: 4px;
      }
      .stage {
        background: var(--page);
        border-radius: 14px;
        padding: 18px;
        color: var(--text);
      }
      .panel {
        width: 420px;
        background: var(--popover);
        border-radius: 14px;
        box-shadow: var(--float-shadow);
        display: flex;
        height: 300px;
        overflow: hidden;
      }
      .col {
        width: 52px;
        flex: none;
        padding: 6px 4px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-right: 0.5px solid var(--line);
      }
      .pbtn {
        position: relative;
        width: 44px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pbtn[aria-selected="true"] {
        background: var(--selected);
      }
      .tile {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 0 0 0.5px var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .tile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .tile.pad img {
        width: 76%;
        height: 76%;
      }
      .cur {
        position: absolute;
        top: 6px;
        right: 7px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--tint);
        box-shadow: 0 0 0 1.5px var(--popover);
      }
      .badge {
        position: absolute;
        right: 5px;
        bottom: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* A: 小圆环，同状态栏"套餐"的圆环 */
      .vA .badge {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--popover);
      }
      /* B: 票券线性图标，白底圆 */
      .vB .badge {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--popover);
        box-shadow: 0 0 0 0.5px var(--line-strong);
        color: var(--tint);
      }
      /* C: 实心底的票券 */
      .vC .badge {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--tint);
        box-shadow: 0 0 0 1.5px var(--popover);
        color: var(--popover);
      }
      /* D: 图标右下角的折角（三角） */
      .vD .badge {
        right: 11px;
        bottom: 9px;
        width: 9px;
        height: 9px;
        background: var(--tint);
        clip-path: polygon(100% 0, 100% 100%, 0 100%);
        border-bottom-right-radius: 6px;
      }
      .vD .chip .badge {
        right: 0;
        bottom: 0;
        border-bottom-right-radius: 5px;
      }
      /* E: 图标下面一条短横 */
      .vE .badge {
        right: auto;
        left: 50%;
        bottom: 3px;
        width: 12px;
        height: 2.5px;
        margin-left: -6px;
        border-radius: 2px;
        background: var(--tint);
      }
      .vE .chip .badge {
        bottom: -4px;
      }
      /* F: 图标右下角的小文字签"套餐" */
      .vF .badge {
        right: 1px;
        bottom: 3px;
        height: 12px;
        padding: 0 2.5px;
        border-radius: 4px;
        background: var(--tint);
        color: var(--popover);
        font-size: 8px;
        font-weight: 600;
        line-height: 12px;
        letter-spacing: -0.2px;
        box-shadow: 0 0 0 1.5px var(--popover);
      }
      .vF .chip .badge {
        right: -8px;
        bottom: -4px;
      }
      /* G: 皇冠，白底圆 */
      .vG .badge {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--popover);
        box-shadow: 0 0 0 0.5px var(--line-strong);
        color: var(--tint);
      }
      .models {
        flex: 1;
        min-width: 0;
        padding: 4px 10px;
        font-size: 13px;
      }
      .mhead {
        display: flex;
        align-items: baseline;
        gap: 6px;
        color: var(--text-dim);
        font-size: 11px;
        padding: 2px 0 6px;
      }
      .mhead b {
        color: var(--text-2);
        font-size: 12px;
        font-weight: 500;
      }
      .mhead .tag {
        margin-left: 2px;
        color: var(--tint);
        font-size: 11px;
      }
      .m {
        padding: 6px 8px;
        border-radius: 8px;
        color: var(--text-2);
        display: flex;
        justify-content: space-between;
      }
      .m small {
        color: var(--text-dim);
        font-size: 11px;
      }
      .m.on {
        background: var(--hover);
      }
      .chiprow {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
        width: 420px;
      }
      .chip {
        height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px 0 6px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--text-2);
        box-shadow: inset 0 0 0 1px var(--line);
        background: var(--surface-1);
        position: relative;
      }
      .chip .wrap {
        position: relative;
        width: 20px;
        height: 20px;
      }
      .chip .wrap .tile {
        width: 20px;
        height: 20px;
      }
      .chip .badge {
        right: -3px;
        bottom: -3px;
      }
      .name {
        position: absolute;
        left: 60px;
        top: 0;
      }
      .note {
        font-size: 12px;
        color: #6e6e74;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>模型面板：哪些服务商走套餐</h1>
    <p class="lead">
      左列每个服务商图标的右下角固定一个标记，表示这家的模型走订阅套餐（不按量计费）；右上角的蓝点仍是"当前模型"。Claude
      订阅（claude-bridge）和 Anthropic（按量，pi 自己的 Claude 登录走 Extra Usage）都是 Claude
      图标，靠这个标记分开。右栏顶上服务商名后面写"套餐"。输入框里的模型按钮也带同样的标记。DeepSeek
      用官网的鲸鱼图标（fe-static.deepseek.com/chat/favicon.svg）。
    </p>
    <div id="rows"></div>
    <script>
      const PROVIDERS = [
        {
          id: "claude-bridge",
          name: "Claude 订阅",
          logo: "brand/claude.svg",
          plan: true,
          models: ["Claude Opus 5.5", "Claude Sonnet 5.5", "Claude Haiku 4.5"],
        },
        {
          id: "anthropic",
          name: "Anthropic",
          logo: "brand/claude.svg",
          plan: false,
          models: ["Claude Opus 5.5", "Claude Sonnet 5.5"],
        },
        {
          id: "openai-codex",
          name: "ChatGPT 订阅",
          logo: "brand/openai.svg",
          plan: true,
          models: ["GPT-6 Astra", "GPT-5.6 Sol"],
        },
        {
          id: "github-copilot",
          name: "GitHub Copilot",
          logo: "brand/copilot.svg",
          plan: true,
          pad: true,
          models: ["GPT-5.5"],
        },
        { id: "xai", name: "xAI", logo: "brand/xai.png", plan: true, models: ["Grok 4.7"] },
        {
          id: "deepseek",
          name: "DeepSeek",
          logo: "brand/deepseek.svg",
          plan: false,
          pad: true,
          models: ["DeepSeek V4", "DeepSeek R2"],
        },
        { id: "openrouter", name: "OpenRouter", logo: "brand/openrouter.svg", plan: false, pad: true, models: ["…"] },
      ];
      const RING = `<svg width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><path d="M6 2 A4 4 0 1 1 2.2 7.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
      const TICKET = (s) =>
        `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"><path d="M2.46433 9.34375C2.21579 9.34375 1.98899 9.14229 2.00041 8.87895C2.06733 7.33687 2.25481 6.33298 2.78008 5.53884C3.08228 5.08196 3.45765 4.68459 3.88923 4.36468C5.05575 3.5 6.70139 3.5 9.99266 3.5H14.0074C17.2986 3.5 18.9443 3.5 20.1108 4.36468C20.5424 4.68459 20.9177 5.08196 21.2199 5.53884C21.7452 6.33289 21.9327 7.33665 21.9996 8.87843C22.011 9.14208 21.7839 9.34375 21.5351 9.34375C20.1493 9.34375 19.0259 10.533 19.0259 12C19.0259 13.467 20.1493 14.6562 21.5351 14.6562C21.7839 14.6562 22.011 14.8579 21.9996 15.1216C21.9327 16.6634 21.7452 17.6671 21.2199 18.4612C20.9177 18.918 20.5424 19.3154 20.1108 19.6353C18.9443 20.5 17.2986 20.5 14.0074 20.5H9.99266C6.70139 20.5 5.05575 20.5 3.88923 19.6353C3.45765 19.3154 3.08228 18.918 2.78008 18.4612C2.25481 17.667 2.06733 16.6631 2.00041 15.1211C1.98899 14.8577 2.21579 14.6562 2.46433 14.6562C3.85012 14.6562 4.97352 13.467 4.97352 12C4.97352 10.533 3.85012 9.34375 2.46433 9.34375Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 3.5L9 20.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
      const CROWN = (n) =>
        `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none"><path d="M14.9152 7.61089L13.8078 5.38179C13.019 3.79393 12.6246 3 12 3C11.3754 3 10.981 3.79393 10.1922 5.38179L9.08483 7.61089C8.58107 8.62494 8.32919 9.13197 7.87976 9.24608C7.32682 9.3357 6.89919 8.96678 6.04393 8.22895C4.0124 6.47635 2.99663 5.60004 2.38034 5.94899C1.70197 6.45439 2.09541 7.74136 2.88229 10.3153L4.04783 14.1279C4.47098 15.5121 4.68255 16.2042 5.21787 16.6021C5.75318 17 6.47261 17 7.91147 17L16.0886 16.9999C17.5274 16.9999 18.2468 16.9999 18.7821 16.602C19.3175 16.2041 19.529 15.512 19.9522 14.1279L21.1177 10.3153C21.9046 7.74137 22.298 6.4544 21.7344 6.02468C21.0034 5.60006 19.9876 6.47636 17.9561 8.22896C17.1008 8.96679 16.6732 9.3357 16.215 9.26533C15.6708 9.13197 15.4189 8.62494 14.9152 7.61089Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M5 21H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
      const BADGE = {
        D: () => `<span class="badge"></span>`,
        E: () => `<span class="badge"></span>`,
        F: () => `<span class="badge">套餐</span>`,
        G: () => `<span class="badge">${CROWN(10)}</span>`,
      };
      const DESC = {
        D: ["D 折角", "图标右下角折起一个蓝色小三角，像书签的角"],
        E: ["E 底部短条", "图标正下方一条蓝色短横，像选中的下划线"],
        F: ["F 文字签", '右下角一个蓝底小签写"套餐"，不用猜'],
        G: ["G 皇冠", "Hugeicons 的 crown，白底圆、细边"],
      };
      function tile(p, size) {
        return `<span class="tile${p.pad ? " pad" : ""}" style="width:${size}px;height:${size}px"><img src="${p.logo}" alt=""></span>`;
      }
      function panel(v, theme) {
        const active = PROVIDERS[0];
        const col = PROVIDERS.map(
          (p, i) =>
            `<div class="pbtn" aria-selected="${i === 0}" title="${p.name}">${tile(p, 22)}${i === 0 ? '<span class="cur"></span>' : ""}${p.plan ? BADGE[v]() : ""}</div>`,
        ).join("");
        const models = active.models
          .map((m, i) => `<div class="m${i === 0 ? " on" : ""}">${m}<small>200K · 64K</small></div>`)
          .join("");
        return `<div class="stage ${theme} v${v}">
    <div class="panel"><div class="col">${col}</div><div class="models"><div class="mhead"><b>${active.name}</b><span class="tag">套餐</span>${active.models.length} 个模型</div>${models}</div></div>
    <div class="chiprow"><span class="chip"><span class="wrap">${tile(active, 20)}${BADGE[v]()}</span>Claude Opus 5.5 · 高</span></div>
  </div>`;
      }
      const only = new URLSearchParams(location.search).get("variant");
      document.getElementById("rows").innerHTML = ["D", "E", "F", "G"]
        .filter((v) => !only || v === only)
        .map(
          (v) =>
            `<div class="row"><h2>${DESC[v][0]}<small>${DESC[v][1]}</small></h2>${panel(v, "light")}${panel(v, "dark")}</div>`,
        )
        .join("");
    </script>
  </body>
</html>
