<style>
/* ══ 1. 设计变量 · 深色（DeepSeek Harness 实测值）════════════════════════════ */
:root, [data-theme="dark"] {

  --window: #0d1016;
  --blob-1: #1f3765; --blob-2: #172b3f; --blob-3: #2a2433;
  --sidebar-bg: rgba(95, 102, 114, .42);
  --sidebar-blur: blur(32px) saturate(1.25);
  --sidebar-edge: rgba(255, 255, 255, .10);

  /* 层级 */

  /* 文字（实测五级） */

  /* 细线 */

  /* 交互态 */
  --hover: rgba(255, 255, 255, .05); --selected: rgba(255, 255, 255, .08); --btn: rgba(255, 255, 255, .08);
  --linked: rgba(122, 170, 255, .14); --focus: 0 0 0 3px rgba(122, 170, 255, .22);

  /* 语义色 */
  --accent: #7aaaff; --send: #5f8fe8; --send-off: rgba(122, 170, 255, .40); --on-send: #fff;
  --attn: #dd8629; --attn-text: #f0a24e; --attn-soft: rgba(221, 134, 41, .16);
  --danger: #f25a5a; --danger-soft: rgba(242, 90, 90, .14);
  --ok: #22c55e; --ok-soft: rgba(34, 197, 94, .14);
  --wt-1: #a78bfa; --wt-2: #38bdf8; --wt-3: #34d399; --wt-4: #fb7185; --wt-5: #fbbf24; --wt-6: #94a3b8; --wt-done: #5f636b;
  --diff-add-bg: rgba(34, 197, 94, .12); --diff-del-bg: rgba(242, 90, 90, .12);

  --card-shadow: 0 0 0 .5px var(--line), 0 9px 27px rgba(41, 70, 122, .20);
  --composer-shadow: 0 0 0 .5px rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .25);
  --float-shadow: 0 0 0 .5px var(--line-strong), 0 16px 40px rgba(0, 0, 0, .45);

  /* 圆角（实测：行 8、按钮 12、卡片 16、气泡与输入框 22） */
  --r-sm: 6px; --r: 8px; --r-md: 10px; --r-btn: 12px; --r-card: 16px; --r-bubble: 22px; --r-pill: 999px;

  --sidebar-w: 270px; --row-h: 34px; --header-h: 48px; --content-w: 720px;

  --ease-snappy: cubic-bezier(.2, .9, .3, 1.04); --dur-snappy: 380ms;

}

/* ══ 2. 设计变量 · 浅色（按深色的层级关系推导）══════════════════════════════ */

  --code: #f6f6f8;
  --text: #1d1d1f; --text-2: #2c2c30; --text-3: #48484e; --muted: #6e6e74; --dim: #a1a1a7;

  --linked: rgba(47, 111, 237, .10); --focus: 0 0 0 3px rgba(47, 111, 237, .16);
  --accent: #2f6fed; --send: #2f6fed; --send-off: rgba(47, 111, 237, .32); --on-send: #fff;

  --danger: #e5484d; --danger-soft: rgba(229, 72, 77, .10);
  --ok: #16a34a; --ok-soft: rgba(22, 163, 74, .10);
  --wt-1: #8b5cf6; --wt-2: #0ea5e9; --wt-3: #10b981; --wt-4: #f43f5e; --wt-5: #d97706; --wt-6: #64748b; --wt-done: #b4b8bf;

/* ══ 3. 基础 ══════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; overflow: hidden; background: var(--window); color: var(--text); font: var(--fs)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code, pre, .mono { font-family: var(--font-mono); font-size: var(--fs-mono); }
.tnum { font-variant-numeric: tabular-nums; }
svg { flex: none; display: block; }
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(50% 45% at 0% 0%, var(--blob-1), transparent 70%), radial-gradient(45% 50% at 5% 100%, var(--blob-2), transparent 70%),
    radial-gradient(40% 40% at 30% 55%, var(--blob-3), transparent 70%), var(--window); }

/* 按下的实体感：按下 80ms 内缩小，松开用弹簧回弹 */
.press { transition: transform var(--dur-snappy) var(--ease-snappy), background-color .14s ease, color .14s ease, box-shadow .2s ease, opacity .2s ease; }
.press:active { transform: scale(var(--press, .95)); transition: transform 80ms cubic-bezier(.2, 0, .2, 1), background-color 60ms; }
.ibtn { --press: .9; width: 28px; height: 28px; border: 0; background: none; border-radius: var(--r); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.ibtn:hover { background: var(--hover); color: var(--text-2); }
.ibtn.sm { width: 24px; height: 24px; }

/* ══ 4. 侧栏 ══════════════════════════════════════════════════════════════ */
.sidebar { position: relative; z-index: 1; width: var(--sidebar-w); flex: none; display: flex; flex-direction: column;
  background: var(--sidebar-bg); backdrop-filter: var(--sidebar-blur); -webkit-backdrop-filter: var(--sidebar-blur); box-shadow: inset -.5px 0 0 var(--sidebar-edge); }
.titlebar { height: 50px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 18px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .08); }
.lights i:nth-child(1) { background: #ff6058; } .lights i:nth-child(2) { background: #ffbd2e; } .lights i:nth-child(3) { background: #28c840; }
.titlebar .sp { flex: 1; }
.new-btn { --press: .97; margin: 2px 12px 8px; height: 36px; border: 0; border-radius: var(--r-btn); background: var(--btn); box-shadow: inset 0 0 0 .5px var(--line);
  display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); font-size: var(--fs); }
.new-btn:hover { background: var(--selected); }
.side-scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.side-footer { flex: none; padding: 8px 12px 12px; display: flex; align-items: center; gap: 4px; }

.sec { display: flex; align-items: center; height: 34px; padding: 0 4px 0 8px; margin-top: 6px; color: var(--muted); font-size: var(--fs); }
.sec .lbl { flex: 1; }
.sec .count { color: var(--dim); font-size: var(--fs-sm); margin-right: 4px; }
.search { position: relative; margin: 2px 0 6px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); }
.search input { width: 100%; height: 32px; border: 0; border-radius: var(--r-md); padding: 0 10px 0 32px; outline: none; background: var(--hover); box-shadow: inset 0 0 0 .5px var(--line); font-size: var(--fs-meta); transition: box-shadow .2s ease; }
.search input:focus { box-shadow: inset 0 0 0 .5px var(--line-strong), var(--focus); }
.search input::placeholder { color: var(--dim); }

.row { --press: .985; position: relative; display: flex; align-items: center; gap: 8px; height: var(--row-h); padding: 0 8px; border-radius: var(--r); color: var(--text-2); user-select: none; cursor: default; }
.row:hover { background: var(--hover); }
.row.selected { background: var(--selected); color: var(--text); }
.row.linked:not(.selected) { background: var(--linked); }
.row .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .time { color: var(--dim); font-size: var(--fs-sm); flex: none; }
.row .more { display: none; }
.row:hover .more { display: inline-flex; }
.row:hover .time.hov { display: none; }
.row.session { padding-left: 36px; }                           /* 缩进 28（实测）+ 8 */
.row.session .git { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); }
.row.two { height: auto; padding-top: 7px; padding-bottom: 7px; align-items: flex-start; }
.row.two .sub { font-size: var(--fs-sm); color: var(--dim); display: flex; align-items: center; gap: 4px; margin-top: 1px; }
.row.two .end { display: flex; align-items: center; gap: 6px; margin-top: 1px; }
.icon { display: inline-flex; color: var(--muted); }
.project .icon.open { color: var(--accent); }
.project .add { display: none; }
.project:hover .add { display: inline-flex; }
.wt-btn { --press: .92; display: inline-flex; align-items: center; gap: 4px; height: 22px; border: 0; border-radius: var(--r-pill); padding: 0 8px; font-size: var(--fs-sm); color: var(--muted); background: transparent; flex: none; }
.wt-btn:hover { background: var(--selected); color: var(--text-2); }
.wt-btn.warn { color: var(--attn-text); background: var(--attn-soft); }
.wt-btn.on { box-shadow: inset 0 0 0 .5px currentColor; }
.wt-list { margin: 2px 0 6px 10px; padding: 4px; border-radius: var(--r-md); box-shadow: inset 0 0 0 .5px var(--line); }
.wtrow { height: 30px; padding: 0 6px; gap: 7px; font-size: var(--fs-meta); }
.wtrow .branch { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wtrow.done .branch { color: var(--dim); }
.wtrow .acts { display: none; gap: 4px; }
.wtrow:hover .acts { display: flex; }
.wtrow:hover .badges { display: none !important; }
.filter { --press: .95; display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 4px 36px; height: 24px; padding: 0 10px; border: 0; border-radius: var(--r-pill); background: var(--linked); color: var(--accent); font-size: var(--fs-sm); }
.link-row { margin-left: 28px; padding: 4px 8px; border-radius: var(--r); color: var(--dim); font-size: var(--fs-meta); }
.link-row.press:hover { background: var(--hover); color: var(--text-2); }

.badge { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: var(--r-sm); font-size: var(--fs-xs); white-space: nowrap; flex: none; }
.b-warn { color: var(--attn-text); background: var(--attn-soft); }
.b-ok { color: var(--ok); background: var(--ok-soft); }
.b-gray { color: var(--muted); background: var(--hover); }
.b-ext { color: var(--muted); box-shadow: inset 0 0 0 .5px var(--line-strong); }
.pill { --press: .94; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 11px; border: 0; border-radius: var(--r-pill); background: transparent; box-shadow: inset 0 0 0 .5px var(--line-strong); color: var(--text-2); font-size: var(--fs-sm); white-space: nowrap; }
.pill:hover { background: var(--hover); color: var(--text); }
.pill[disabled] { color: var(--dim); cursor: not-allowed; }
.pill.accent { color: var(--accent); }
.pill.sm { height: 20px; padding: 0 8px; font-size: var(--fs-xs); }

/* 工作区行（项目下缩进；本地用房子图标，worktree 用分支图标） */
.row.ws { padding-left: 26px; }
.row.ws .kind { color: var(--dim); font-size: var(--fs-sm); flex: none; }
.row.ws .badges { display: flex; gap: 4px; }
.row.ws .acts { display: none; gap: 4px; }
.row.ws:hover .acts { display: flex; }
.row.ws:hover .badges { display: none; }
.row.ws.done .icon, .row.ws.done .title { opacity: .5; }
.pend { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--r-pill); color: var(--attn-text); background: var(--attn-soft); font-size: var(--fs-sm); flex: none; }
/* 会话标签页（对话区顶部，只显示打开着的会话） */
.tabs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab { --press: .97; display: inline-flex; align-items: center; gap: 6px; flex: none; height: 30px; max-width: 200px; padding: 0 4px 0 10px; border-radius: var(--r); color: var(--muted); font-size: var(--fs-meta); cursor: default; }
.tab:hover { background: var(--hover); color: var(--text-2); }
.tab.on { background: var(--selected); color: var(--text); }
.tab .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .st { width: 14px; height: 14px; }
.tab .x { opacity: 0; width: 20px; height: 20px; }
.tab:hover .x, .tab.on .x { opacity: 1; }
.pop.wide { width: 300px; }
.pop .item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .item[disabled] { color: var(--dim); cursor: not-allowed; }

/* 状态图标：纯线性图标，只给图标上色（与 DeepSeek Harness 一致，不加圆底） */
.st { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.st.attn { color: var(--attn); }
.st.err { color: var(--danger); }
.st.run { color: var(--accent); }
.st.run svg { animation: spin .9s linear infinite; }
.st.unread::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ══ 5. 主区 ══════════════════════════════════════════════════════════════ */
.main { position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--main); }
.header { height: var(--header-h); flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px; box-shadow: inset 0 -.5px 0 var(--line); }
.header .t { font-size: var(--fs); font-weight: 500; color: var(--text-3); white-space: nowrap; }
.header .loc { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); font-size: var(--fs-meta); white-space: nowrap; }
.header .sp { flex: 1; }
.chip { --press: .95; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 0; border-radius: var(--r); background: none; color: var(--text-3); font-size: var(--fs-meta); }
.chip:hover { background: var(--hover); color: var(--text); }
.chip .dim { color: var(--dim); }

.stream { flex: 1; overflow-y: auto; padding: 24px 0 28px; }
.col { max-width: var(--content-w); margin: 0 auto; padding: 0 32px; }
.empty { text-align: center; margin-top: 26vh; color: var(--muted); font-size: var(--fs-meta); }
.empty .big { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 6px; }

.turn { margin-bottom: 6px; }
.user { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin: 20px 0 14px; position: relative; }
.bubble { background: var(--surface-2); border-radius: var(--r-bubble); padding: 10px 16px; max-width: 80%; white-space: pre-wrap; line-height: 1.5; }
.reply { position: relative; margin: 8px 0 4px; font-size: var(--fs-reply); line-height: 1.68; color: var(--text); }
.reply p { margin: 6px 0 10px; }
.reply ul { margin: 6px 0 10px; padding-left: 20px; }
.reply li { margin: 4px 0; }
.reply strong, .reply b { font-weight: 600; }
.reply code { font-size: .86em; background: var(--surface-2); border-radius: var(--r-sm); padding: 1px 5px; }
.reply pre { background: var(--code); border-radius: var(--r-md); padding: 12px 14px; overflow-x: auto; }
.cursor::after { content: ''; display: inline-block; width: 7px; height: 1.05em; margin-left: 2px; vertical-align: -2px; border-radius: 2px; background: var(--muted); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.umeta { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.rfoot { display: flex; align-items: center; gap: 2px; margin: 6px 0 0 -4px; color: var(--dim); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.rfoot .ibtn { color: var(--dim); }
.rfoot .ibtn:hover { color: var(--text-2); }
.rfoot .use { display: inline-flex; align-items: center; gap: 5px; margin-left: 10px; }
.rfoot .tm { margin-left: 12px; }

/* 文件卡片（实测：圆角 16、0.5px 细边、36px 图标块、标题 500、副标题灰色） */
.fcard { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: var(--r-card); background: var(--surface-1); box-shadow: var(--card-shadow); max-width: 260px; }
.fcard .tile { width: 36px; height: 36px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 .5px var(--line-soft); color: var(--accent); }
.fcard .name { font-size: var(--fs-meta); font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcard .kind { font-size: var(--fs-xs); color: var(--muted); }
.fcard .x { margin-left: 2px; }

/* 过程（实测：标题行 13px 灰色 + chevron，下有 0.5px 分隔线；步骤是单行列表） */
.proc-head { --press: .98; display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 0; border: 0; background: none; color: var(--muted); font-size: var(--fs-meta); text-align: left; }
.proc-head:hover { color: var(--text-2); }
.proc-head .bad { color: var(--danger); }
.proc-head.open { box-shadow: inset 0 -.5px 0 var(--line); margin-bottom: 4px; }
.proc-head .chev { display: inline-flex; transition: transform var(--dur-snappy) var(--ease-snappy); }
.proc-head.open .chev { transform: rotate(180deg); }
.shimmer { background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 40%, var(--text) 50%, var(--muted) 60%, var(--muted) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }

.steps { padding: 2px 0 8px; }

.step:hover { background: var(--hover); }

/* ══ 7. 状态栏（参考 DeepSeek Harness：输入框正下方居中、按语义分组、悬停弹出详情卡片）══ */

.sgroup { --press: .96; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: var(--r); background: none; color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }

<script>
// ══ 1. 弹簧：按 Apple 的 duration + bounce 参数化生成 CSS linear() 曲线 ══════════
function spring(duration, bounce) {
  const w = 2 * Math.PI / duration, z = bounce >= 0 ? 1 - bounce : 1 / (1 + bounce);
  const x = t => {
    if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
    if (z === 1) return 1 - Math.exp(-w * t) * (1 + w * t);
    const s = Math.sqrt(z * z - 1), r1 = -w * (z - s), r2 = -w * (z + s);
    return 1 + (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r1 - r2);
  };
  let T = duration * 3;
  for (let t = duration * 3; t > 0; t -= 0.005) { if (Math.abs(1 - x(t)) > 0.001) { T = t + 0.005; break; } }
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++) pts.push(+x(T * i / n).toFixed(4));
  pts[n] = 1;
  return { easing: `linear(${pts.join(', ')})`, ms: Math.round(T * 1000) };
}
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const linearOK = typeof CSS !== 'undefined' && CSS.supports('transition-timing-function', 'linear(0, 1)');
const SPR = { smooth: spring(0.42, 0), snappy: spring(0.30, 0.15), bouncy: spring(0.40, 0.26) };
if (!linearOK) for (const k in SPR) SPR[k] = { easing: 'cubic-bezier(.2,.9,.3,1.04)', ms: 450 };
else for (const [k, v] of Object.entries(SPR)) {
  document.documentElement.style.setProperty(`--ease-${k}`, v.easing);
  document.documentElement.style.setProperty(`--dur-${k}`, v.ms + 'ms');
}

// ══ 2. 动效工具 ═════════════════════════════════════════════════════════════
function enter(el, kind, delay = 0) {
  if (REDUCE || !el.animate) return;
  if (kind === 'expand') {
    const h = el.scrollHeight;
    el.style.overflow = 'hidden';
    el.animate([{ height: '0px' }, { height: h + 'px' }], { duration: SPR.smooth.ms, easing: SPR.smooth.easing }).onfinish = () => { el.style.overflow = ''; };
    [...el.children].forEach((c, i) => c.animate([{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }],
      { duration: SPR.snappy.ms, easing: SPR.snappy.easing, delay: 30 + i * 20, fill: 'backwards' }));
    return;
  }
  const from = kind === 'pop' ? 'scale(.95)' : 'translateY(8px)';
  el.animate([{ transform: from }, { transform: 'none' }], { duration: SPR.snappy.ms, easing: SPR.snappy.easing, delay, fill: 'backwards' });
  el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'cubic-bezier(.2,0,.2,1)', delay, fill: 'backwards' });
}
function collapseThen(el, after) {
  if (!el || REDUCE || !el.animate) return after();
  el.style.overflow = 'hidden';
  el.animate([{ height: el.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 190, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).onfinish = after;
}
const flipCapture = root => { const m = new Map(); root.querySelectorAll('[data-flip]').forEach(el => m.set(el.id, el.getBoundingClientRect().top)); return m; };
function flipPlay(root, before) {
  if (REDUCE) return;
  root.querySelectorAll('[data-flip]').forEach(el => {
    if (!before.has(el.id)) return;
    const dy = before.get(el.id) - el.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: SPR.smooth.ms, easing: SPR.smooth.easing });
  });
}
let firstPaint = true, quiet = false;
function patch(el, html) {
  if (typeof morphdom === 'undefined') { el.innerHTML = html; return; }
  const added = [];
  morphdom(el, `<div>${html}</div>`, {
    childrenOnly: true,
    onNodeAdded: n => { if (n.nodeType === 1) added.push(n); return n; },
    onBeforeElUpdated: from => !(from === document.activeElement && from.tagName === 'INPUT'),
  });
  if (firstPaint || quiet) return;
  const set = new Set(added); let k = 0;
  for (const n of added) {
    if (!n.dataset || !n.dataset.enter) continue;
    let a = n.parentElement, skip = false;
    while (a && a !== el) { if (set.has(a) && a.dataset && a.dataset.enter) { skip = true; break; } a = a.parentElement; }
    if (!skip) enter(n, n.dataset.enter, n.dataset.enter === 'up' ? Math.min(k++ * 18, 90) : 0);
  }
}

// ══ 4. 工具 ═════════════════════════════════════════════════════════════════
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);
const fmtDur = s => s >= 60 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${s} 秒`;
const safe = s => String(s).replace(/[^\w-]/g, '_');
function md(t) {
  return t.split(/```/).map((p, i) => {
    if (i % 2) return `<pre><code>${esc(p.replace(/^\w*\n/, ''))}</code></pre>`;
    const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return p.trim().split(/\n{2,}/).map(b => {
      const lines = b.split('\n');
      if (lines.every(l => l.startsWith('- '))) return '<ul>' + lines.map(l => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>';
      return b ? `<p>${inline(b).replace(/\n/g, '<br>')}</p>` : '';
    }).join('');
  }).join('');
}
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  if (!REDUCE) t.animate([{ transform: 'translate(-50%, 12px) scale(.92)', opacity: 0 }, { transform: 'translate(-50%, 0) scale(1)', opacity: 1 }], { duration: SPR.bouncy.ms, easing: SPR.bouncy.easing, fill: 'both' });
  setTimeout(() => {
    if (!t.isConnected) return; if (REDUCE) return t.remove();
    t.animate([{ opacity: 1 }, { opacity: 0, transform: 'translate(-50%, 6px)' }], { duration: 180, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).onfinish = () => t.remove();
  }, 1600);
}

// ══ 5. 外观：跟随系统 / 浅色 / 深色 ═════════════════════════════════════════
const THEMES = [['system', '跟随系统', 'monitor'], ['light', '浅色', 'sun'], ['dark', '深色', 'moon']];
let themePref = localStorage.getItem('atrium-theme') || 'system';
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const resolved = () => themePref === 'system' ? (sysDark.matches ? 'dark' : 'light') : themePref;
function applyTheme(animate) {
  const next = resolved();
  const go = () => { document.documentElement.dataset.theme = next; renderThemeBtn(); renderState(); };
  if (animate && document.documentElement.dataset.theme !== next && document.startViewTransition && !REDUCE) document.startViewTransition(go); else go();
}
function setThemePref(p) { themePref = p; localStorage.setItem('atrium-theme', p); applyTheme(true); }
sysDark.addEventListener('change', () => { if (themePref === 'system') applyTheme(true); });
function renderThemeBtn() {
  const t = THEMES.find(x => x[0] === themePref);
  const b = document.getElementById('themeBtn'); b.innerHTML = ph(t[2], 16); b.title = `外观：${t[1]}`;
}

// ══ 8. 侧栏 ═════════════════════════════════════════════════════════════════
function allRows() { const out = []; for (const p of P) for (const w of p.workspaces) for (const s of w.sessions) out.push({ s, p, w }); return out; }
const findRow = id => allRows().find(x => x.s.id === id);
function findWs(id) { for (const p of P) for (const w of p.workspaces) if (w.id === id) return { p, w }; }
const curWs = () => findWs(selWs);
const isPending = w => w.kind === 'worktree' && !w.removed && !w.merged && (w.ahead > 0 || w.dirty);
const isDone = w => w.kind === 'worktree' && !isPending(w);
const wsAgo = w => w.sessions.length ? Math.min(...w.sessions.map(s => s.ago)) : (w.lastAgo ?? 99999);
function sortedWs(p) {   // 本地工作区在最前；未合并的按最近活动排；已收尾的变淡、排最后

// ══ 12. 状态栏：分组注册表（参考 DeepSeek Harness）════════════════════════════
// 每组 = 图标 + 一行摘要 + 悬停弹出的详情卡片。以后加指标：给某组的卡片加一行，或注册新的一组。

// ══ 15. 模拟一次运行 ════════════════════════════════════════════════════════
async function run(sid, text, image) {
  const c = conv(sid);
  const now = new Date(), hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const t = { type: 'turn', id: sid + 't' + seq++, status: 'running', dur: 0, expanded: false, time: hhmm, tok: 0, user: { text, image }, steps: [], reply: null };
  c.stream = c.stream.filter(x => x.type !== 'alert');
  c.stream.push(t); running = { sid, turn: t }; c.queuePaused = false;
  setStatus(sid, 'running', true);
  const started = Date.now();
  const alive = () => t.status === 'running';
  const deliver = () => { while (c.pendingSteers.length) t.steps.push({ kind: 'steer', text: c.pendingSteers.shift() }); };
  const typeInto = async (obj, key, full, ms) => { obj[key] = ''; for (const ch of full) { if (!alive()) return; obj[key] += ch; render(); await sleep(ms); } };
  render();
  const th = { kind: 'thinking', secs: 0, text: '' }; t.steps.push(th);
  await typeInto(th, 'text', `用户想要：${text.slice(0, 24)}。先找到相关文件，确认现在的实现。`, 22); th.secs = 3;
  if (!alive()) return finish(sid, t, started);
  const ex = { kind: 'explore', items: [] }; t.steps.push(ex);
  for (const it of [['read', 'src/sidebar/Inbox.tsx'], ['grep', '"isWaiting" in src'], ['read', 'src/store/sessions.ts']]) { if (!alive()) break; await sleep(450); ex.items.push(it); render(); }
  if (!alive()) return finish(sid, t, started);
  deliver();
  const b = { kind: 'bash', cmd: 'pnpm test --filter sidebar', exit: null, out: [] }; t.steps.push(b); render();
  for (const l of ['RUN  v3.2.0', ' ✓ Inbox.test.tsx (6)', ' ✓ ProjectList.test.tsx (9)', 'Tests: 15 passed']) { if (!alive()) break; await sleep(380); b.out.push(l); render(); }
  if (!alive()) return finish(sid, t, started);
  b.exit = 0; deliver(); render();
  await sleep(500); if (!alive()) return finish(sid, t, started);
  t.steps.push({ kind: 'edit', path: 'src/sidebar/Inbox.tsx', diff: ['   const waiting = sessions.filter(isWaiting)', '-  if (!waiting.length) return null', '+  if (!waiting.length && !showEmpty) return null', '+  if (!waiting.length) return <Empty />'] }); deliver(); render();
  await sleep(500); if (!alive()) return finish(sid, t, started);
  t.replying = true;
  const steered = t.steps.filter(s => s.kind === 'steer').map(s => s.text);
  await typeInto(t, 'reply', `处理好了。${steered.length ? `也按你插话的要求（${steered.join('；')}）做了调整。` : ''}\n\n- 在 \`Inbox.tsx\` 里加了 \`showEmpty\` 开关和空状态\n- 现有 15 条测试全部通过`, 16);
  t.replying = false;
  if (alive()) {
    const m = c.m, out = 900 + Math.round(Math.random() * 400);
    m.output += out; m.reasoning += 200; m.input += 4000; m.cacheRead += 38000; m.cacheWrite += 1500;
    m.turns += 1; m.steps += t.steps.length; m.modelMs += Math.round((Date.now() - started) * 0.6);
    m.ttftMs = Math.round((m.ttftMs * (m.turns - 1) + 900 + Math.random() * 800) / m.turns);
    m.lastSpeed = 40 + Math.round(Math.random() * 20); m.ctxUsed = (m.ctxUsed ?? 30000) + 6000; m.cost += 0.03;
    if (!m.ctxSys) { m.ctxSys = 3200; m.ctxTools = 5400; }   // 第一次请求后，会话记录里有了系统消息
    t.tok = 4000 + 38000 + 1500 + out;
  }
  finish(sid, t, started, true);
}
function finish(sid, t, started, ok) {
  const c = conv(sid);
  if (t.status === 'running') t.status = ok ? 'done' : 'stopped';
  t.replying = false; t.dur = Math.max(1, Math.round((Date.now() - started) / 1000));
  running = null; c.pendingSteers = [];
  const row = findRow(sid);
  if (row && row.s.status === 'running') setStatus(sid, sid === selected ? 'idle' : 'unread', true);
  const next = () => {
    render();
    if (t.status === 'done' && c.queue.length && !c.queuePaused) { const q = c.queue.shift(); setTimeout(() => run(sid, q.text), 500); }
    else if (t.status === 'stopped' && c.queue.length) { c.queuePaused = true; render(); }
  };
  // 跑完：过程先收起，标题行再换成摘要
  collapseThen(sid === selected && mode !== 'detailed' && !t.expanded ? document.getElementById('proc-' + safe(t.id)) : null, next);
}
function stopRunning() { if (running) { running.turn.status = 'stopped'; render(); } }

// ══ 16. 交互 ════════════════════════════════════════════════════════════════
const input = document.getElementById('input');
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; }
function submit(steer) {
  const text = input.value.trim(); if (!text && !cur().attachments.length) return;
  if (!selected) { const atts = EMPTY.attachments.splice(0); newSession(); conv(selected).attachments.push(...atts); }
  const c = cur();
  const image = c.attachments[0]; c.attachments = []; input.value = ''; autosize();
  if (!(running && running.sid === selected)) {
    if (running) { toast('MVP 1 同一时间只跑一个会话：先停止正在运行的会话'); return; }
    run(selected, text || '（图片）', image); return;
  }
  if (steer) { c.pendingSteers.push(text); toast('插话：将在 agent 下一步之前送达'); } else c.queue.push({ id: 'q' + seq++, text });
  render();
}
// 离开正在运行的会话：MVP 1 同一时间只跑一个会话，需要确认后中断
const leaveRunning = () => !(running && running.sid === selected) || (confirm('当前会话正在运行。离开会中断它（MVP 1 同一时间只跑一个会话），继续吗？') && (stopRunning(), true));

  if (!REDUCE) document.getElementById('col').animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: SPR.smooth.ms, easing: SPR.smooth.easing });
  input.focus();
}
function select(id) {
  const row = findRow(id); if (!row || id === selected) return;
  if (!leaveRunning()) return;
  const w = row.w; if (!w.tabs.includes(id)) w.tabs.push(id);
  selWs = w.id; w.active = id; selected = id;

  swapIn();
}
function selectWs(wsId) {
  if (wsId === selWs) return;
  if (!leaveRunning()) return;
  const { w } = findWs(wsId); selWs = wsId;
  selected = w.active && w.tabs.includes(w.active) ? w.active : (w.tabs[0] ?? null);
  const r = selected && findRow(selected); if (r && r.s.status === 'unread') r.s.status = 'idle';
  swapIn();
}
function closeTab(id) {
  const { w } = findRow(id);
  if (running && running.sid === id && !(confirm('这个会话正在运行，关闭标签页会中断它，继续吗？') && (stopRunning(), true))) return;
  const go = () => { const i = w.tabs.indexOf(id); w.tabs.splice(i, 1);
    if (selected === id) { selected = w.tabs[i] ?? w.tabs[i - 1] ?? null; w.active = selected; swapIn(); } else { renderHeader(); renderState(); } };
  const el = document.getElementById('tab-' + id);
  if (el && !REDUCE) el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.9)' }], { duration: 140, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).onfinish = go; else go();
}
function newSession(w = curWs().w) {
  if (!leaveRunning()) return;
  const s = S_('n' + seq++, '新会话', '刚刚', -(seq++), 'idle');
  w.sessions.unshift(s); w.tabs.push(s.id); selWs = w.id; w.active = s.id; selected = s.id; swapIn();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(e.metaKey || e.ctrlKey); } });
input.addEventListener('input', () => { autosize(); renderComposer(cur()); });
input.addEventListener('paste', e => { if ([...e.clipboardData.items].some(i => i.type.startsWith('image/'))) { e.preventDefault(); cur().attachments.push('粘贴的图片.png'); renderComposer(cur()); } });
document.getElementById('send').onclick = () => running && running.sid === selected ? stopRunning() : submit(false);
document.getElementById('attach').onclick = () => { const c = cur(); c.attachments.push('截图 ' + (c.attachments.length + 1) + '.png'); renderComposer(c); };
document.getElementById('modelPick').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); openModelPop(r.left, r.top); };
document.getElementById('themeBtn').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); openThemePop(r.left - 10, r.top); };
document.getElementById('statusbar').addEventListener('contextmenu', e => { e.preventDefault(); openMetricsPop(e.clientX - 150, e.clientY); });
document.getElementById('protoBtn').onclick = () => { const p = document.getElementById('protoPanel'); p.hidden = !p.hidden; };
document.getElementById('newBtn').onclick = () => newSession();
document.getElementById('sideToggle').onclick = () => toast('原型：收起侧栏');
document.getElementById('settingsBtn').onclick = () => toast('原型：设置');
document.getElementById('permChip').onclick = () => toast('MVP 1 没有审批，工具调用直接执行；MVP 2 加入审批模式');
document.addEventListener('input', e => { if (e.target.id === 'q') { query = e.target.value.trim(); renderSidebar(); } });

document.addEventListener('click', e => {
  const el = e.target;
  if (!el.closest('.pop') && !el.closest('#modelPick,#modeBtn,#moreBtn,#themeBtn,[data-customize],[data-action="history"],[data-action="ws-menu"],[data-action="new-ws"]')) closePops();
  if (el.closest('#gear')) { const r = el.closest('#gear').getBoundingClientRect(); openMetricsPop(r.right - 200, r.top); return; }
  if (el.closest('#modeBtn')) { const r = el.closest('#modeBtn').getBoundingClientRect(); openModePop(r.left, r.bottom); return; }
  if (el.closest('#moreBtn')) { if (!selected) return; const r = el.closest('#moreBtn').getBoundingClientRect(); openSessionMenu(selected, r.right - 160, r.bottom); return; }
  if (el.closest('[data-customize]')) { const r = document.getElementById('statusbar').getBoundingClientRect(); openMetricsPop(r.left + r.width / 2 - 100, r.top); return; }
  if (el.closest('[data-group]')) return;

  const act = el.closest('[data-action]');
  if (act) {
    const a = act.dataset.action, p = P.find(q => q.id === act.dataset.pid), r = act.getBoundingClientRect();
    if (a === 'select') return select(act.dataset.id);
    if (a === 'select-ws') return selectWs(act.dataset.ws);
    if (a === 'ws-menu') { e.stopPropagation(); return openWsMenu(act.dataset.ws, r.right - 200, r.bottom); }
    if (a === 'new-ws') { e.stopPropagation(); return openNewWsMenu(act.dataset.pid, r.right - 220, r.bottom); }
    if (a === 'tab') return select(act.dataset.id);
    if (a === 'close-tab') { e.stopPropagation(); return closeTab(act.dataset.id); }
    if (a === 'new-tab') return newSession();
    if (a === 'history') return openHistoryPop(r.left, r.bottom);
    if (a === 'search') { if (searchOpen) return collapseThen(document.getElementById('searchBox'), () => { searchOpen = false; query = ''; renderSidebar(); }); searchOpen = true; renderSidebar(); document.getElementById('q')?.focus(); return; }
    if (a === 'toggle') { if (p.open) return collapseThen(document.getElementById('pb-' + p.id), () => { p.open = false; renderSidebar(); }); p.open = true; }
    if (a === 'add-project') { toast('原型：这里会打开文件夹选择器'); return; }
    renderSidebar(); renderState(); return;
  }
  const tog = el.closest('[data-tog]');
  if (tog) {
    const k = tog.dataset.tog; const tid = k.slice(0, k.lastIndexOf(':')), i = +k.slice(k.lastIndexOf(':') + 1);
    const t = cur().stream.find(x => x.id === tid);
    const cur = stepOpen(t, t.steps[i], i) || (t.status === 'running' && t.steps[i].kind === 'edit' && !opened.has('!' + k));
    const flip = () => { opened.delete(k); opened.delete('!' + k); opened.add(cur ? '!' + k : k); render(); };
    return cur ? collapseThen(document.getElementById(`dt-${safe(tid)}-${i}`), flip) : flip();
  }
  const ex = el.closest('[data-expand]');
  if (ex) {
    const t = cur().stream.find(x => x.id === ex.dataset.expand);
    if (t.status === 'running' || mode === 'detailed') return;
    if (t.expanded) return collapseThen(document.getElementById('proc-' + safe(t.id)), () => { t.expanded = false; render(); });
    t.expanded = true; render(); return;
  }
  const ans = el.closest('[data-answer]');
  if (ans) {
    const k = ans.dataset.answer; const tid = k.slice(0, k.lastIndexOf(':')), i = +k.slice(k.lastIndexOf(':') + 1);
    const s = cur().stream.find(x => x.id === tid).steps[i]; s.answer = ans.dataset.v; clearInterval(s.timer);
    const row = findRow(selected); if (row && row.s.status === 'answer') setStatus(selected, running && running.sid === selected ? 'running' : 'idle', true);
    render(); return;
  }
  const cp = el.closest('[data-copy]'); if (cp) { toast('已复制' + cp.dataset.copy); return; }
  const un = el.closest('[data-unattach]'); if (un) { const c = cur(); c.attachments.splice(+un.dataset.unattach, 1); renderComposer(c); return; }
  const q = el.closest('[data-q]');
  if (q) {
    const c = cur(); const [a, id] = q.dataset.q.split(':'); const item = c.queue.find(x => x.id === id);
    if (a === 'resume') { c.queuePaused = false; if (!running && c.queue.length) { const n = c.queue.shift(); run(selected, n.text); } else render(); }
    if (a === 'steer') {
      const node = document.getElementById('q-' + id);
      const go = () => { c.queue.splice(c.queue.indexOf(item), 1); c.pendingSteers.push(item.text); toast('插话：将在 agent 下一步之前送达'); render(); };
      if (node && !REDUCE) node.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(-14px) scale(.98)', opacity: 0 }], { duration: 200, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).onfinish = go; else go();
    }
    if (a === 'edit') { if (item.editing) item.text = document.querySelector(`[data-qedit="${id}"]`).value.trim() || item.text; item.editing = !item.editing; render(); document.querySelector(`[data-qedit="${id}"]`)?.focus(); }
    if (a === 'del') collapseThen(document.getElementById('q-' + id), () => { c.queue.splice(c.queue.indexOf(item), 1); render(); });
    return;
  }
  const cc = el.closest('[data-c]');
  if (cc) {
    const k = cc.dataset.c, c = cur();
    if (k === 'reset') { resetAll(); opened.clear(); firstPaint = true; }
    if (k === 'reopen' || k === 'retry') { const card = el.closest('.icard'); return collapseThen(card, () => { c.stream = c.stream.filter(x => x.type !== 'alert'); setStatus(selected, 'idle'); toast(k === 'reopen' ? '已重新打开会话（原型）' : '已重试（原型）'); render(); }); }
    if (!selected && (k === 'compact' || k === 'dialog')) { toast('先打开或新建一个会话'); return; }
    if (k === 'compact') { c.stream.push({ type: 'notice', id: 'n' + seq++, text: `上下文已自动压缩 · 压缩前 ${fmtK(c.m.ctxUsed ?? 160000)} tokens` }); c.m.ctxUsed = null; }
    if (k === 'dialog') {
      const t = [...c.stream].reverse().find(x => x.type === 'turn'); if (!t) { toast('先发一条消息'); return; }
      const d = { kind: 'dialog', title: '用哪个测试框架？', options: ['vitest', 'jest', '跳过'], answer: null, left: 60 };
      t.steps.push(d); setStatus(selected, 'answer', true);
      const sid = selected;
      d.timer = setInterval(() => { d.left--; if (d.left <= 0) { d.answer = '（超时，未作答）'; clearInterval(d.timer); const r = findRow(sid); if (r && r.s.status === 'answer') setStatus(sid, 'idle'); } render(); }, 1000);
    }
    render();
  }
});
let linkKey = null;
document.addEventListener('mouseover', e => {
  const k = e.target.closest('[data-wt]')?.dataset.wt ?? null;
  if (k === linkKey) return; linkKey = k;
  document.querySelectorAll('.row.linked').forEach(r => r.classList.remove('linked'));
  if (k) document.querySelectorAll('[data-wt]').forEach(r => { if (r.dataset.wt === k) r.classList.add('linked'); });
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'o') { e.preventDefault(); const i = MODES.findIndex(m => m[0] === mode); mode = MODES[(i + 1) % 3][0]; opened.clear(); render(); toast('显示模式：' + MODES.find(m => m[0] === mode)[1]); }
  if (e.metaKey && e.key.toLowerCase() === 'n') { e.preventDefault(); document.getElementById('newBtn').click(); }
  if (e.key === 'Escape') { closePops(); if (searchOpen && document.activeElement?.id === 'q') document.querySelector('[data-action="search"]').click(); }
});

// 静态部分
document.getElementById('sideToggle').innerHTML = ph('sidebar', 16);
document.getElementById('newBtn').innerHTML = `${ph('plusCircle', 15)}新建会话`;
document.getElementById('permChip').innerHTML = `${ph('lightning', 14)}直接执行`;
document.getElementById('settingsBtn').innerHTML = `<span class="icon">${ph('gearSix', 15)}</span><span class="title" style="text-align:left">设置</span>`;
document.getElementById('attach').innerHTML = ph('plus', 15);
document.getElementById('send').innerHTML = `<span class="i-send">${ph('up', 15)}</span><span class="i-stop">${ph('stop', 12)}</span>`;
applyTheme(false);
render();
</script>
</body>
