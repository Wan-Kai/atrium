<!doctype html>
<!--
  PROTOTYPE — throwaway. 重命名时输入框的样子。
  同一个输入框用在：侧栏的项目、工作区、对话行；标签栏的会话改名；新建工作区页的分支名。
  现状：24px 高、白底、0.5px 淡描边、圆角 6，聚焦没有反馈，字比原来往右挪 6px。
  A 原地：字不挪位置，框贴着行内（高 26px、圆角 --r-sm），1px --tint 描边加一圈淡蓝光（--focus-ring），文字全选。
  B 原地 + 提示：同 A，框下方浮一行小提示"⏎ 保存 · esc 取消 · 清空恢复默认"（只有能恢复默认的地方写第三项）。
  C 卡片：行不变，下方弹出小卡片：标题"重命名…"、输入框、说明、取消 / 保存按钮。
  会话改名：现状是标签栏右侧多出一个框；A、B 改成在标签上原地改，C 从标签下方弹出卡片。
  底部浮条切换版本（也可 ?variant=now|A|B|C、键盘 ← →）、浅色 / 深色。
  颜色、字号取自 packages/ui/src/design/tokens.css；图标是 Hugeicons 免费版，从 @hugeicons/core-free-icons 直接生成。
-->

        --surface-2: #f2f2f4;

      .sec {

        flex: 1;
        min-width: 0;
        white-space: nowrap;

      .main {

        min-width: 0;

        height: 30px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border-radius: var(--r);
        font-size: var(--fs-meta);
        color: var(--text-muted);
      }
      .tab.on {
        background: var(--selected);
        color: var(--text);
      }
      .tabs .more {
        margin-left: auto;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 40px;
        gap: 8px;
      }
      .choices {
        width: 672px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .chip {
        position: relative;
        height: 26px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        border-radius: var(--r-btn);
        font-size: var(--fs-meta);
        color: var(--text-2);
        white-space: nowrap;
      }
      .chip .ic {
        color: var(--text-muted);
      }
      .composer {
        width: 672px;
        background: var(--surface-1);
        box-shadow: var(--card-shadow);
        border-radius: var(--r-bubble);
        padding: 20px;
        color: var(--text-dim);
        font-size: var(--fs-meta);
        height: 100px;
      }
      svg {
        display: block;
        flex: none;
      }
      input {
        font: inherit;
        color: var(--text);
        outline: none;
        border: 0;
        min-width: 0;
      }
      .lbl {
        position: absolute;
        font-size: var(--fs-xs);
        color: var(--tint);
      }

        flex: 1;
        height: 24px;
        border-radius: var(--r-sm);
        background: var(--main);
        padding: 0 6px;
        font-size: var(--fs);
        box-shadow: inset 0 0 0 0.5px var(--line-strong);
      }
      .vnow .tabfield {
        width: 224px;
      }

      .vB .f {
        flex: 1;
        height: 26px;
        margin: 0 -6px;
        padding: 0 5px;
        border-radius: var(--r-sm);
        background: var(--main);
        font-size: inherit;
        box-shadow:

          var(--focus-ring);

      .vA .tab .f,
      .vB .tab .f {
        flex: none;
        width: 160px;
        height: 24px;
        margin: 0 -5px;
      }

      .vB .chip .f {

        width: 200px;

        z-index: 4;
        display: flex;
        gap: 10px;
        align-items: center;
        white-space: nowrap;
        padding: 3px 8px;
        border-radius: var(--r-sm);
        background: var(--float);
        box-shadow: var(--float-shadow);
        font-size: var(--fs-xs);
        color: var(--text-muted);
      }
      .chip .hint {
        top: auto;
        bottom: calc(100% + 4px);
      }
      .kbd {
        font: 11px/15px var(--font-sans);
        padding: 0 4px;
        border-radius: 4px;
        background: var(--surface-2);
        color: var(--text-muted);
        box-shadow: inset 0 0 0 0.5px var(--line);
        margin-right: 3px;
      }
      :root[data-theme="dark"] .kbd {
        background: var(--surface-3);
      }

        left: 0;
        top: calc(100% + 6px);
        z-index: 4;
        width: 280px;
        padding: 14px;
        border-radius: var(--r-btn);
        background: var(--float);
        box-shadow: var(--float-shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
        cursor: default;
      }
      .chip .card {
        top: auto;
        bottom: calc(100% + 6px);
      }

        margin: 0;
        font-size: var(--fs-meta);
        font-weight: 600;
        color: var(--text);
      }
      .card .cf {
        height: 32px;
        border-radius: var(--r);
        background: var(--main);
        padding: 0 10px;
        font-size: var(--fs);
        box-shadow:
          inset 0 0 0 1px var(--tint),
          var(--focus-ring);
      }
      .card .help {
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }
      .card .btns {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .card .btns span {
        height: 28px;
        padding: 0 12px;
        border-radius: var(--r);
        display: inline-flex;
        align-items: center;
        font-size: var(--fs-meta);
      }
      .card .cancel {
        color: var(--text-2);
        box-shadow: inset 0 0 0 0.5px var(--line-strong);
      }
      .card .save {
        color: #fff;
        background: var(--tint);
      }

      .bar {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        background: var(--bar);
        backdrop-filter: blur(20px);
        padding: 8px 12px;
        border-radius: var(--r-pill);
        box-shadow: var(--float-shadow);
        font-size: var(--fs-meta);
        z-index: 20;
      }
      .seg {
        display: flex;
        gap: 2px;
        background: var(--surface-2);
        border-radius: var(--r-pill);
        padding: 2px;
      }
      .seg button {
        all: unset;
        cursor: pointer;
        white-space: nowrap;
        padding: 3px 12px;
        border-radius: var(--r-pill);
        color: var(--text-muted);
      }
      .seg button.on {
        background: var(--surface-1);
        color: var(--text);
        box-shadow: var(--chip-shadow);
      }

          '<path d="M13.7276 3.44418L15.4874 6.99288C15.7274 7.48687 16.3673 7.9607 16.9073 8.05143L20.0969 8.58575C22.1367 8.92853 22.6167 10.4206 21.1468 11.8925L18.6671 14.3927C18.2471 14.8161 18.0172 15.6327 18.1471 16.2175L18.8571 19.3125C19.417 21.7623 18.1271 22.71 15.9774 21.4296L12.9877 19.6452C12.4478 19.3226 11.5579 19.3226 11.0079 19.6452L8.01827 21.4296C5.8785 22.71 4.57865 21.7522 5.13859 19.3125L5.84851 16.2175C5.97849 15.6327 5.74852 14.8161 5.32856 14.3927L2.84884 11.8925C1.389 10.4206 1.85895 8.92853 3.89872 8.58575L7.08837 8.05143C7.61831 7.9607 8.25824 7.48687 8.49821 6.99288L10.258 3.44418C11.2179 1.51861 12.7777 1.51861 13.7276 3.44418Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        FolderLibraryIcon:
          '<path d="M16.2627 10.5H7.73725C5.15571 10.5 3.86494 10.5 3.27143 11.3526C2.67793 12.2052 3.11904 13.4258 4.00126 15.867L5.08545 18.867C5.54545 20.1398 5.77545 20.7763 6.2889 21.1381C6.80235 21.5 7.47538 21.5 8.82143 21.5H15.1786C16.5246 21.5 17.1976 21.5 17.7111 21.1381C18.2245 20.7763 18.4545 20.1398 18.9146 18.867L19.9987 15.867C20.881 13.4258 21.3221 12.2052 20.7286 11.3526C20.1351 10.5 18.8443 10.5 16.2627 10.5Z" stroke="currentColor" stroke-linecap="square" stroke-width="1.5"/><path d="M19 8C19 7.53406 19 7.30109 18.9239 7.11732C18.8224 6.87229 18.6277 6.67761 18.3827 6.57612C18.1989 6.5 17.9659 6.5 17.5 6.5H6.5C6.03406 6.5 5.80109 6.5 5.61732 6.57612C5.37229 6.67761 5.17761 6.87229 5.07612 7.11732C5 7.30109 5 7.53406 5 8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M16.5 4C16.5 3.53406 16.5 3.30109 16.4239 3.11732C16.3224 2.87229 16.1277 2.67761 15.8827 2.57612C15.6989 2.5 15.4659 2.5 15 2.5H9C8.53406 2.5 8.30109 2.5 8.11732 2.57612C7.87229 2.67761 7.67761 2.87229 7.57612 3.11732C7.5 3.30109 7.5 3.53406 7.5 4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        GitPullRequestIcon:
          '<path d="M6 8L6 16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M18 16V12C18 9.17156 18 7.75735 17.1213 6.87867C16.2426 5.99999 14.8284 5.99999 12 5.99999L11 5.99999M11 5.99999C11 5.29976 12.9943 3.99152 13.5 3.49999M11 5.99999C11 6.70022 12.9943 8.00846 13.5 8.49999" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><circle cx="6" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>',
        BubbleChatIcon:
          '<path d="M21.5 12C21.5 17.2467 17.2467 21.5 12 21.5C10.3719 21.5 8.8394 21.0904 7.5 20.3687C5.63177 19.362 4.37462 20.2979 3.26592 20.4658C3.09774 20.4913 2.93024 20.4302 2.80997 20.31C2.62741 20.1274 2.59266 19.8451 2.6935 19.6074C3.12865 18.5818 3.5282 16.6382 2.98341 15C2.6698 14.057 2.5 13.0483 2.5 12C2.5 6.75329 6.75329 2.5 12 2.5C17.2467 2.5 21.5 6.75329 21.5 12Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M12.1257 12H12.0007M8.125 12H8M16.125 12H16M12.2507 12C12.2507 12.1381 12.1388 12.25 12.0007 12.25C11.8627 12.25 11.7507 12.1381 11.7507 12C11.7507 11.8619 11.8627 11.75 12.0007 11.75C12.1388 11.75 12.2507 11.8619 12.2507 12ZM8.25 12C8.25 12.1381 8.13807 12.25 8 12.25C7.86193 12.25 7.75 12.1381 7.75 12C7.75 11.8619 7.86193 11.75 8 11.75C8.13807 11.75 8.25 11.8619 8.25 12ZM16.25 12C16.25 12.1381 16.1381 12.25 16 12.25C15.8619 12.25 15.75 12.1381 15.75 12C15.75 11.8619 15.8619 11.75 16 11.75C16.1381 11.75 16.25 11.8619 16.25 12Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        Clock02Icon:
          '<path d="M5.04798 8.60657L2.53784 8.45376C4.33712 3.70477 9.503 0.999914 14.5396 2.34474C19.904 3.77711 23.0904 9.26107 21.6565 14.5935C20.2227 19.926 14.7116 23.0876 9.3472 21.6553C5.36419 20.5917 2.58192 17.2946 2 13.4844" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M12 8V12L14 14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
        CircleIcon: '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/>',
        MoreHorizontalIcon:
          '<path d="M6.00449 12.5V12M18.0045 12.5V12M12.0045 12.5V12M7.00449 12.5C7.00449 11.9477 6.55677 11.5 6.00449 11.5C5.4522 11.5 5.00449 11.9477 5.00449 12.5C5.00449 13.0523 5.4522 13.5 6.00449 13.5C6.55677 13.5 7.00449 13.0523 7.00449 12.5ZM19.0045 12.5C19.0045 11.9477 18.5568 11.5 18.0045 11.5C17.4522 11.5 17.0045 11.9477 17.0045 12.5C17.0045 13.0523 17.4522 13.5 18.0045 13.5C18.5568 13.5 19.0045 13.0523 19.0045 12.5ZM13.0045 12.5C13.0045 11.9477 12.5568 11.5 12.0045 11.5C11.4522 11.5 11.0045 11.9477 11.0045 12.5C11.0045 13.0523 11.4522 13.5 12.0045 13.5C12.5568 13.5 13.0045 13.0523 13.0045 12.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>',
      };
      const ic = (n, s = 15, cls = "ic") =>
        `<svg class="${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke-width="1.75">${I[n]}</svg>`;
      const state = { variant: new URLSearchParams(location.search).get("variant") || "A", theme: "light" };
      const DESC = {
        now: "现状：24px 高、白底、0.5px 淡描边，聚焦没有反馈；字比原来往右挪 6px；会话改名在标签栏右边另起一个框。",
        A: "A 原地：框贴着原来的字，字不挪位置；1px 蓝色描边加一圈淡蓝光，表示正在编辑；会话就在标签上改。最轻。",
        B: 'B 原地 + 提示：同 A，框下方浮一行小提示（⏎ 保存 · esc 取消 · 能恢复默认名的地方写"清空恢复默认"），不用记规则。',
        C: "C 卡片：行不动，下方弹出小卡片，有标题、输入框、说明和取消 / 保存按钮。最明确，但最重、要多点一下。",
      };
      const DEFAULTS = {
        project: null,
        ws: "清空恢复为分支名",
        chat: "清空恢复为第一个会话的标题",
        session: null,
        branch: null,
      };
      function field(kind, value, title) {
        const v = state.variant;
        if (v === "now") return `<input class="f ${kind === "session" ? "tabfield" : ""}" value="${value}">`;
        if (v === "A") return `<input class="f" value="${value}">`;
        if (v === "B")
          return `<input class="f" value="${value}"><span class="hint"><span><span class="kbd">⏎</span>保存</span><span><span class="kbd">esc</span>取消</span>${DEFAULTS[kind] ? `<span>${DEFAULTS[kind]}</span>` : ""}</span>`;
        return null;
      }
      function card(kind, value, title) {
        return `<div class="card"><h4>${title}</h4><input class="cf" value="${value}"><span class="help">${DEFAULTS[kind] || (kind === "session" ? "名字写进 pi 的会话，终端里的 pi 也看得到" : kind === "branch" ? "建 worktree 时用这个名字新建分支" : "只改在 Atrium 里显示的名字")}</span><div class="btns"><span class="cancel">取消</span><span class="save">保存</span></div></div>`;
      }
      function row(kind, icon, value, title, extra = "", cls = "") {
        const v = state.variant;
        const body =
          v === "C"
            ? `<span class="nm">${value}</span>${extra}${card(kind, value, title)}`
            : `${field(kind, value, title)}`;
        return `<div class="r ${cls}">${icon}${body}</div>`;
      }
      function render() {
        document.documentElement.dataset.theme = state.theme;
        document.body.className = "v" + state.variant;
        document.getElementById("desc").textContent = DESC[state.variant];
        const v = state.variant;
        document.getElementById("sb").innerHTML =
          `<div class="sec">项目</div>` +
          row("project", ic("FolderOpenIcon", 15, "ic open"), "atrium", "重命名项目") +
          `<div class="r ws cur"><span class="nm">本地</span><span class="tm">5 分钟前</span></div>` +
          (v === "C"
            ? `<div class="r ws"><span class="nm">brave-otter</span><span class="tm">昨天</span></div>`
            : row("ws", "", "brave-otter", "重命名工作区", "", "ws")) +
          `<div class="r ws"><span class="nm">files-panel</span><span class="tm">10月9日</span></div>` +
          `<div class="sec" style="margin-top:56px">对话</div>` +
          `<div class="r"><span class="nm">周报整理</span><span class="tm">昨天</span></div>` +
          row("chat", "", "看看 pi 的扩展机制", "重命名对话", `<span class="tm">10月9日</span>`) +
          `<div class="r"><span class="nm">翻译 README</span><span class="tm">10月2日</span></div>`;
        const session =
          v === "now"
            ? `<span class="tab on">${ic("BubbleChatIcon", 14)}<span>重构登录流程</span></span>`
            : v === "C"
              ? `<span class="tab on">${ic("BubbleChatIcon", 14)}<span>重构登录流程</span>${card("session", "重构登录流程", "重命名会话")}</span>`
              : `<span class="tab on" style="position:relative">${ic("BubbleChatIcon", 14)}${field("session", "重构登录流程", "")}</span>`;
        document.getElementById("tabs").innerHTML =
          session +
          `<span class="tab">${ic("BubbleChatIcon", 14)}<span>写测试</span></span>` +
          `<span class="more">${v === "now" ? `<input class="f tabfield" value="重构登录流程">` : ""}${ic("MoreHorizontalIcon", 16)}</span>`;
        const branch =
          v === "C"
            ? `<span class="chip">${ic("PencilEdit01Icon", 14)}<span>atrium/brave-otter</span>${card("branch", "atrium/brave-otter", "分支名")}</span>`
            : `<span class="chip" style="${v === "now" ? "width:240px;padding:0" : ""}">${v === "now" ? "" : ic("PencilEdit01Icon", 14)}${field("branch", "atrium/brave-otter", "")}</span>`;
        document.getElementById("choices").innerHTML =
          `<span class="chip">${ic("Folder01Icon", 14)}<span>atrium</span></span><span class="chip">${ic("GitBranchIcon", 14)}<span>新建 worktree</span></span><span class="chip">${ic("GitCommitIcon", 14)}<span>基于 origin/main</span></span>` +
          branch;
        const seg = (id, items, cur, key) =>
          (document.getElementById(id).innerHTML = items
            .map(([val, l]) => `<button class="${cur === val ? "on" : ""}" data-${key}="${val}">${l}</button>`)
            .join(""));
        seg(
          "variants",
          [
            ["now", "现状"],
            ["A", "A 原地"],
            ["B", "B 原地 + 提示"],
            ["C", "C 卡片"],
          ],
          state.variant,
          "variant",
        );
        seg(
          "themes",
          [
            ["light", "浅色"],
            ["dark", "深色"],
          ],
          state.theme,
          "theme",
        );
      }
      document.addEventListener("click", (e) => {
        const t = e.target.closest("button");
        if (!t) return;
        if (t.dataset.variant) state.variant = t.dataset.variant;
        if (t.dataset.theme) state.theme = t.dataset.theme;
        render();
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        const order = ["now", "A", "B", "C"];
        const i = order.indexOf(state.variant);
        if (e.key === "ArrowRight") {
          state.variant = order[(i + 1) % 4];
          render();
        }
        if (e.key === "ArrowLeft") {
          state.variant = order[(i + 3) % 4];
          render();
        }
      });
      render();
    </script>
  </body>
</html>
