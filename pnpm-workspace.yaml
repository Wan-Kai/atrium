packages:
  - packages/*
  - apps/*
allowBuilds:
  esbuild: true
  lefthook: true
  # Pulled in by @earendil-works/pi-ai, which testkit uses for types only.
  "@google/genai": false
  protobufjs: false
# pi releases are pinned to the version the pi-internals notes were checked against, which can be
# newer than pnpm's minimum release age.
minimumReleaseAgeExclude:
  - "@earendil-works/pi-ai@1.0.2"
  - "@earendil-works/pi-telemetry@1.0.2"
