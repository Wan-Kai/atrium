# Inside the existing `server { listen 127.0.0.1:8080; ... }` that xray falls back to.
# The relay serves under /atrium itself (relay.json "pathPrefix": "/atrium"), so the path is passed
# on unchanged: proxy_pass has no URI part. Everything else in that server stays as it is.
location /atrium/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The relay ignores these unless relay.json trusts the proxy; behind xray they are 127.0.0.1
    # anyway (SPEC-0005, "部署 relay" item 3).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The relay pings each host every 20 s; idle phones may stay quiet longer between heartbeats.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
